<script>
const PI2=Math.PI*2;

// ---------- captions en bloques de 2–3 palabras (v2: nunca una palabra vacía sola en pantalla) ----------
const _corta=w=>w.replace(/[¡!¿?.,:…"]/g,'').length<=3;
function buildChunks(){
  CH=[]; let cur=[];
  const len=c=>c.map(j=>W[j].t).join(' ').length;
  let enPreg=false;
  W.forEach((w,i)=>{ if(w.t.startsWith('¿') && cur.length){ CH.push(cur); cur=[]; } if(w.t.startsWith('¿')) enPreg=!/\?$/.test(w.t);
    if(enPreg && cur.length){ cur.push(i); if(/\?$/.test(w.t)){ enPreg=false; CH.push(cur); cur=[]; } return; }
    if(cur.length>=2 && (cur.map(j=>W[j].t).join(' ')+' '+w.t).length>17){ CH.push(cur); cur=[]; } cur.push(i); const fin=/[.,?!:…]$/.test(w.t);
    if(fin||cur.length>=3||len(cur)>16){
      // no cerrar un bloque con una palabra corta sin puntuación: pasa al siguiente
      if(!fin && cur.length>1 && _corta(w.t)){ cur.pop(); CH.push(cur); cur=[i]; }
      else { CH.push(cur); cur=[]; } } });
  if(cur.length) CH.push(cur);
  { const out=[]; CH.forEach(c=>{ const txt=c.map(j=>W[j].t).join(' '); if(c.length>=4 && txt.length>17){ const h=Math.ceil(c.length/2); out.push(c.slice(0,h)); out.push(c.slice(h)); } else out.push(c); }); CH=out; }
  { const rest=[]; CH.forEach(c=>{ const r=c.filter(j=>j>6); if(r.length) rest.push(r); }); CH=[[0,1,2,3,4,5,6]].concat(rest); }
  // un bloque de una sola palabra corta se une con el siguiente (o con el anterior)
  for(let c=0;c<CH.length;c++){ if(CH[c].length===1 && _corta(W[CH[c][0]].t)){
    if(c+1<CH.length && CH[c+1].length<=3){ CH[c+1]=CH[c].concat(CH[c+1]); CH.splice(c,1); c--; }
    else if(c>0 && CH[c-1].length<=3){ CH[c-1]=CH[c-1].concat(CH[c]); CH.splice(c,1); c--; } } }
}
// Igual que captions() del motor, pero las 2 primeras palabras de cada bloque aparecen juntas.
function captions(t){
  let ci=-1; for(let c=0;c<CH.length;c++){ if(W[CH[c][0]].s-0.05<=t) ci=c; }
  if(ci<0) ci=0; const ch=CH[ci]; const last=W[ch[ch.length-1]];
  if(ci===0){ capGancho(t); return; }
  for(const k in (window.TRANS||{})){ if(TRANS[k]==='bufanda' && SC[k-1] && t>SC[k-1].start-0.2 && t<SC[k-1].start+0.22) return; }
  if(t>last.e+0.6 && (ci+1>=CH.length || t<W[CH[ci+1][0]].s-0.05)) return;
  const KW=window.KEYWORDS||[];
  let size=window.CAPTION_SIZE||80; const words=ch.map(i=>W[i].t==='b,'?'b,':W[i].t.toUpperCase());
  const big=i=>KW.includes(i)?1.22:1;
  const widths=()=>ch.map((i,n)=>{ctx.font=fuente(size*big(i));return ctx.measureText(words[n]).width;});
  ctx.font=fuente(size); let sp=ctx.measureText(' ').width, ws=widths(), total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);
  // bloque largo (pregunta completa): dos renglones en vez de letras diminutas
  let corte=ch.length; if(total>800 && ch.length>=4){ corte=Math.ceil(ch.length/2); }
  const anchoLin=(a,b)=>ws.slice(a,b).reduce((x,y)=>x+y,0)+sp*1.25*(b-a-1);
  let tot1=anchoLin(0,corte), tot2=corte<ch.length?anchoLin(corte,ch.length):0, mx=Math.max(tot1,tot2);
  if(mx>800){size=Math.floor(size*800/mx); ctx.font=fuente(size); sp=ctx.measureText(' ').width; ws=widths(); tot1=anchoLin(0,corte); tot2=corte<ch.length?anchoLin(corte,ch.length):0; mx=Math.max(tot1,tot2);}
  total=mx; const dosLin=corte<ch.length;
  if(CAPPOS[ci]==null){ const nS=scn(W[ch[0]].s+0.02); CAPPOS[ci]=(window.CAPFIX&&CAPFIX[nS])?CAPFIX[nS]:lugarCaption(total,size*1.25*(dosLin?2:1)); }
  const y0=CAPPOS[ci]-(dosLin?size*0.62:0); let y=y0; let x=540-tot1/2; const s0=W[ch[0]].s-0.05;
  ctx.textBaseline='middle'; ctx.textAlign='center'; ctx.lineJoin='round';
  ch.forEach((i,n)=>{const w=words[n], wd=ws[n], kw=KW.includes(i); const ws_=n<2?Math.max(0,s0):W[i].s;
    const k=t<ws_?0:(kw?popIn(t,ws_,0.22):back((t-ws_)/0.16));
    if(k>0){ const sz=size*big(i); ctx.save(); ctx.translate(x+wd/2,y); const sc=lerp(window.CAPTION_POP_MIN??0.6,1,k); ctx.scale(sc,sc); if(kw) ctx.rotate(Math.sin(t*5+i)*0.03);
      ctx.font=fuente(sz); ctx.fillStyle='rgba(20,14,40,0.45)'; ctx.fillText(w,0,sz*0.09);
      ctx.lineWidth=sz*0.19; ctx.strokeStyle='#1E1A2E'; ctx.strokeText(w,0,0);
      ctx.fillStyle=kw?COL.lime:'#FFFFFF'; ctx.fillText(w,0,0); ctx.restore(); }
    x+=wd+sp*1.25; if(n===corte-1 && dosLin){ x=540-tot2/2; y=y0+size*1.24; } });
}

const CAPY0=620;

  ctx.fillStyle='#F3F0FF'; ctx.beginPath(); ctx.moveTo(0,-260); ctx.quadraticCurveTo(110,-120,80,170); ctx.lineTo(-80,170); ctx.quadraticCurveTo(-110,-120,0,-260); ctx.fill();
  ctx.fillStyle='#FF5FA2'; ctx.beginPath(); ctx.moveTo(0,-260); ctx.quadraticCurveTo(60,-190,72,-140); ctx.lineTo(-72,-140); ctx.quadraticCurveTo(-60,-190,0,-260); ctx.fill(); ctx.fillStyle='#7FD8FF'; blob(0,-40,40); ctx.restore(); ocupa(x-130*s,y-260*s,x+130*s,y+200*s,1); }

  ctx.fillStyle='#1E1A2E'; ctx.font=fuente(80); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,0,30); ctx.restore(); }
function confeti(t,t0,n=40){ if(t<t0) return; ctx.save(); for(let i=0;i<n;i++){ const u=t-t0, x=540+(rand(i)-0.5)*1100*Math.min(1,u*2), y=300+(rand(i+50)-0.3)*500+u*u*500; ctx.fillStyle=['#FF4D6D','#D7FF3D','#4CC9F0','#FFE45C','#FF9BDD'][i%5]; ctx.save(); ctx.translate(x,y); ctx.rotate(u*8+i); ctx.fillRect(-12,-6,24,12); ctx.restore(); } ctx.restore(); }

// hielo-caliente-001 — Planetas donde NO quieres vacacionar (Parte 9): Gliese 436 b, el planeta del "hielo caliente" (Space.com 2007; ESA/Hubble 2015).

  lin('¡ESTE HIELO PODRÍA',y-70,74,'#FFFFFF',0); const k=t<0.3?1:1+0.07*Math.max(0,Math.sin((t-0.3)*9))*Math.exp(-(t-0.3)*1.5);
