<script>
// fila-todos-001 — ¿Qué pasaría si TODOS hiciéramos una sola fila? (Parte 22)
// Disfraces: formado (sudadera + gorro, ficha en la mano) → anciano (llega de abuelito) → formado (loop).
const PI2=Math.PI*2;
window.HIDE_CAPTIONS_LAST=false;
window.CAPTION_POP_MIN=0.85;

// ---------- captions en bloques de 2–3 palabras ----------
const _corta=w=>w.replace(/[¡!¿?.,:…"]/g,'').length<=3;
function buildChunks(){
  CH=[]; let cur=[];
  const len=c=>c.map(j=>W[j].t).join(' ').length;
  W.forEach((w,i)=>{ if(cur.length>=2 && (cur.map(j=>W[j].t).join(' ')+' '+w.t).length>17){ CH.push(cur); cur=[]; } cur.push(i); const fin=/[.,?!:…]$/.test(w.t);
    if(fin||cur.length>=3||len(cur)>16){
      if(!fin && cur.length>1 && _corta(w.t)){ cur.pop(); CH.push(cur); cur=[i]; }
      else { CH.push(cur); cur=[]; } } });
  if(cur.length) CH.push(cur);
  CH=[[0,1,2],[3,4],[5,6,7]].concat(CH.map(c=>c.filter(j=>j>=8)).filter(c=>c.length));
  for(let c=0;c<CH.length;c++){ if(CH[c].length===1 && _corta(W[CH[c][0]].t)){
    if(/[.?!…]$/.test(W[CH[c][0]].t) && c>0 && CH[c-1].length<=3){ CH[c-1]=CH[c-1].concat(CH[c]); CH.splice(c,1); c--; }
    else if(c+1<CH.length && CH[c+1].length<=3){ CH[c+1]=CH[c].concat(CH[c+1]); CH.splice(c,1); c--; }
    else if(c>0 && CH[c-1].length<=3){ CH[c-1]=CH[c-1].concat(CH[c]); CH.splice(c,1); c--; } } }
}
function captions(t){
  let ci=-1; for(let c=0;c<CH.length;c++){ if(W[CH[c][0]].s-0.05<=t) ci=c; }
  if(ci<0) ci=0; const ch=CH[ci]; const last=W[ch[ch.length-1]];
  if(t>last.e+0.6 && (ci+1>=CH.length || t<W[CH[ci+1][0]].s-0.05)) return;
  const KW=window.KEYWORDS||[];
  let size=ci<3?96:(window.CAPTION_SIZE||82); const words=ch.map(i=>W[i].t.toUpperCase());
  const big=i=>KW.includes(i)?1.22:1;
  const widths=()=>ch.map((i,n)=>{ctx.font=fuente(size*big(i));return ctx.measureText(words[n]).width;});
  ctx.font=fuente(size); let sp=ctx.measureText(' ').width, ws=widths(), total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);
  if(total>760){size=Math.floor(size*760/total); ctx.font=fuente(size); sp=ctx.measureText(' ').width; ws=widths(); total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);}
  if(CAPPOS[ci]==null){ let sn=0; for(let q=0;q<SC.length;q++) if(W[ch[0]].s>=SC[q].start) sn=q+1; CAPPOS[ci]=(window.CAPY&&CAPY[sn])||lugarCaption(total,size*1.25); }
  const y=CAPPOS[ci]; let x=540-total/2; const s0=W[ch[0]].s-0.05;
  ctx.textBaseline='middle'; ctx.textAlign='center'; ctx.lineJoin='round';
  ch.forEach((i,n)=>{const w=words[n], wd=ws[n], kw=KW.includes(i); const ws_=n<2?Math.max(0,s0):W[i].s;
    const k=(ci===0)?1:(t<ws_?0:(kw?popIn(t,ws_,0.22):back((t-ws_)/0.16)));
    if(k>0){ const sz=size*big(i); ctx.save(); ctx.translate(x+wd/2,y); const sc=lerp(window.CAPTION_POP_MIN??0.6,1,k); ctx.scale(sc,sc); if(kw) ctx.rotate(Math.sin(t*5+i)*0.03);
      ctx.font=fuente(sz); ctx.fillStyle='rgba(20,14,40,0.45)'; ctx.fillText(w,0,sz*0.09);
      ctx.lineWidth=sz*0.19; ctx.strokeStyle='#1E1A2E'; ctx.strokeText(w,0,0);
      ctx.fillStyle=kw?COL.lime:'#FFFFFF'; ctx.fillText(w,0,0); ctx.restore(); }
    x+=wd+sp*1.25;});
}

// ---------- verificador de encuadre (cajas en pantalla) ----------
window.CHECK=[];
const _raro=raro;
raro=function(o){ const s=o.s??1, m=ctx.getTransform(), alto=o.alto||0; const der=(o.brazos==='senala'||o.brazos==='saluda'||o.ficha)?300:215, izq=215;
  let x0=-izq*s, x1=der*s; if(o.espejo){ const a=-x1; x1=-x0; x0=a; }
  const pts=[[o.x+x0,o.y-alto-450*s],[o.x+x1,o.y-alto-450*s],[o.x+x0,o.y-alto],[o.x+x1,o.y-alto]].map(([x,y])=>[m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f]);
  CHECK.push([o.color?'npc':'raro',Math.min(...pts.map(p=>p[0])),Math.min(...pts.map(p=>p[1])),Math.max(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[1]))]);
  return _raro(o); };
function chk(tag,x0,y0,x1,y1){ const m=ctx.getTransform(); const P=[[x0,y0],[x1,y0],[x0,y1],[x1,y1]].map(([x,y])=>[m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f]);
  CHECK.push([tag,Math.min(...P.map(p=>p[0])),Math.min(...P.map(p=>p[1])),Math.max(...P.map(p=>p[0])),Math.max(...P.map(p=>p[1]))]); }

// ---------- utilería general ----------
let CUR=1;
function L(txt,x,y,k,tipo='madera',opts={}){ let tam=opts.tam||72; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.font=fuente(tam); let w=ctx.measureText(txt).width+tam*1.2; const maxW=700;
  if(w>maxW){ tam*=maxW/w; w=maxW; } x=clamp(x,170+w/2,910-w/2); y=clamp(y,390,520);
  letrero(txt,x,y,k,tipo,{sinPalo:!opts.palo,...opts,tam}); if(k>0.5) chk('letrero',x-w/2,y-tam*0.85,x+w/2,y+tam*0.85); ctx.restore(); }
function L2(l1,l2,k,tam1,tam2,col2,y1=370,y2=530){ if(k<=0) return; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ocupa(150,290,930,720,3);
  for(const [txt,tam] of [[l1,tam1],[l2,tam2]]){ if(!txt) continue; ctx.font=fuente(tam); }
  const fit=(txt,tam)=>{ ctx.font=fuente(tam); const w=ctx.measureText(txt).width+tam*1.2; return w>720?tam*720/w:tam; };
  const a=fit(l1,tam1), b=l2?fit(l2,tam2):0;
  letrero(l1,540,y1,k,'panel',{tam:a,sinPalo:true}); if(l2) letrero(l2,540,y2,k,'panel',{tam:b,sinPalo:true,color:col2}); chk('letrero',170,y1-a*0.85,910,(l2?y2+b*0.85:y1+a*0.85)); ctx.restore(); }
const kIn=(t,t0,d=0.22)=>t<t0?0:easeOut(prog(t,t0,d));
const FICHA='8,200,000,000';
function tierra(x,y,r,t,sinGlow){ ctx.save(); if(!sinGlow){ const g=ctx.createRadialGradient(x,y,r*0.9,x,y,r*1.25); g.addColorStop(0,'rgba(127,216,255,0.8)'); g.addColorStop(1,'rgba(127,216,255,0)'); ctx.fillStyle=g; blob(x,y,r*1.25); }
  ctx.fillStyle='#3AB6FF'; blob(x,y,r); ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,PI2); ctx.clip();
  const sp=t*0.05*r; ctx.fillStyle='#5CD67A'; for(let i=0;i<7;i++){ const xx=x-r+(((rand(i)*2.4*r+sp)%(2.4*r))) - 0.2*r, yy=y-r*0.8+rand(i+7)*r*1.6; blob(xx,yy,r*(0.18+rand(i+3)*0.2)); blob(xx+r*0.15,yy+r*0.1,r*0.14); }
  ctx.fillStyle='rgba(255,255,255,0.85)'; for(let i=0;i<6;i++){ const xx=x-r+(((rand(i+20)*2.4*r+sp*1.6)%(2.4*r)))-0.2*r, yy=y-r*0.9+rand(i+27)*r*1.8; ctx.beginPath(); ctx.ellipse(xx,yy,r*0.22,r*0.05,0,0,PI2); ctx.fill(); }
  ctx.fillStyle='rgba(30,26,80,0.25)'; ctx.beginPath(); ctx.arc(x+r*0.35,y+r*0.2,r*1.05,0,PI2); ctx.fill(); ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.ellipse(x-r*0.45,y-r*0.5,r*0.25,r*0.1,-0.6,0,PI2); ctx.fill(); ctx.restore(); }
function luna(x,y,r){ ctx.fillStyle='rgba(255,246,200,0.25)'; blob(x,y,r*1.4); ctx.fillStyle='#FFF4C2'; blob(x,y,r); ctx.fillStyle='#EADFA8'; blob(x+r*0.3,y-r*0.2,r*0.22); blob(x-r*0.35,y+r*0.3,r*0.16); }
// personita mini (frijolito pastel con ojos) — para filas lejanas
function mini(x,y,s,col,t,i){ const b=Math.abs(Math.sin(t*5+i*1.3))*4*s; ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(x,y-20*s-b,16*s,20*s,0,0,PI2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.ellipse(x-5*s,y-30*s-b,5*s,3*s,-0.5,0,PI2); ctx.fill();
  ctx.fillStyle='#1E1A2E'; blob(x-5*s,y-24*s-b,2.6*s); blob(x+5*s,y-24*s-b,2.6*s); }
// anillos de fila alrededor de la Tierra: cada anillo es una elipse inclinada con personitas que avanzan.
// cap(i) devuelve qué fracción del anillo i está dibujada (1 = completo).
function anilloPts(X,Y,R,i){ const a=-0.62+((i*0.37)%1.24), rx=R*(1.1+(i%3)*0.05), ry=R*(0.28+(i%4)*0.04); return {a,rx,ry}; }
function anillos(X,Y,R,n,t,parte,cap=()=>1,dotS=0.95,NN=0){ const N=NN||Math.round(30*R/250);
  for(let i=0;i<n;i++){ const {a,rx,ry}=anilloPts(X,Y,R,i), c=cap(i); if(c<=0) continue; const ca=Math.cos(a), sa=Math.sin(a);
    for(let j=0;j<N*c;j++){ const th=(j/N)*PI2+t*0.6+i; const sn=Math.sin(th); if((parte==='atras')!==(sn<0)) continue;
      const px=rx*Math.cos(th), py=ry*sn; const x=X+px*ca-py*sa, y=Y+px*sa+py*ca; if(parte==='atras'){ ctx.globalAlpha=0.55; } mini(x,y+8*dotS,dotS*R/250,PASTELES[(i+j)%6],t,j+i*7); ctx.globalAlpha=1; } } }
// fila en perspectiva desde (x0,y0) cerca hasta (x1,y1) en el horizonte, con curva
function filaPersp(t,x0,y0,x1,y1,n,s0,s1,curva=0,seed=0){ for(let i=n-1;i>=0;i--){ const u=i/(n-1), e=Math.pow(u,0.55), x=lerp(x0,x1,e)+Math.sin(u*Math.PI)*curva, y=lerp(y0,y1,e), s=lerp(s0,s1,Math.pow(u,0.45));
  if(s>0.16) gomita({x,y,s,t,color:PASTELES[(i+seed)%6],expr:['feliz','sospecha','yavalio'][(i+seed)%3],seed:i+seed,brazos:'idle',espejo:x>540});
  else mini(x,y,s*3.2,PASTELES[(i+seed)%6],t,i); } }
// mar de gente hasta el horizonte (filas de personitas)
function multitud(t,y0,y1,filas=7,s0=0.7,s1=2.2){ for(let r=0;r<filas;r++){ const u=r/(filas-1), y=y0+Math.pow(u,1.25)*(y1-y0), s=s0+u*(s1-s0), dx=44*s, n=Math.ceil(1300/dx);
  for(let i=0;i<n;i++){ const x=-60+i*dx+(r%2)*dx/2+Math.sin(t*2+i)*2; mini(x,y,s,PASTELES[(i+r*2)%6],t,i+r*13); } } }
// ficha de turno grande (objeto del mundo)
function fichaGrande(x,y,s,k,num,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(t*3)*0.05); ctx.scale(s*k,s*k);
  ctx.fillStyle='rgba(30,26,46,0.25)'; rr(-150,-90,310,200,20); ctx.fill(); ctx.fillStyle='#FFFFFF'; rr(-160,-100,320,200,20); ctx.fill(); ctx.fillStyle='#FF4D5E'; rr(-160,-100,320,54,20); ctx.fill(); ctx.fillRect(-160,-66,320,20);
  ctx.fillStyle='#FFFFFF'; ctx.font=fuente(34); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('TURNO',0,-72);
  ctx.fillStyle='#1E1A2E'; ctx.font=fuente(num.length>6?44:80); ctx.fillText(num,0,24); ctx.restore(); chk('obj',x-160*s*k,y-100*s*k,x+160*s*k,y+100*s*k); ocupa(x-170*s,y-110*s,x+170*s,y+110*s,2); }
// regla de medio metro
function regla(x,y,w,k,txt,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,1); ctx.fillStyle='#FFD23F'; rr(-w/2,-34,w,68,14); ctx.fill(); ctx.fillStyle='#E0A800'; rr(-w/2,16,w,18,8); ctx.fill();
  ctx.fillStyle='#1E1A2E'; for(let i=0;i<=10;i++){ const xx=-w/2+20+i*(w-40)/10; rr(xx-3,-34,6,i%5?22:40,3); ctx.fill(); } ctx.restore();
  if(k>0.6){ ctx.save(); ctx.fillStyle='#1E1A2E'; ctx.font=fuente(56); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineWidth=12; ctx.strokeStyle='#FFFFFF'; ctx.strokeText(txt,x,y-80); ctx.fillText(txt,x,y-80); ctx.restore(); }
  chk('obj',x-w/2,y-110,x+w/2,y+34); ocupa(x-w/2,y-120,x+w/2,y+40,2); }
// ventanilla de atención con cajera gomita
function ventanilla(x,y,s,t,o={}){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle='#7A5BC9'; rr(-240,-620,480,640,30); ctx.fill(); ctx.fillStyle='#9B7FE0'; rr(-240,-620,480,70,30); ctx.fill();
  ctx.fillStyle='#FFFFFF'; ctx.font=fuente(50); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(o.letrero||'CAJA 1',0,-585);
  ctx.fillStyle='#BFE9FF'; rr(-180,-520,360,280,24); ctx.fill(); ctx.restore();
  ctx.save(); ctx.beginPath(); rr(x-180*s,y-520*s,360*s,280*s,24*s); ctx.clip(); gomita({x,y:y-150*s,s:0.5*s,t,color:'#FFC9A8',disfraz:'cobrador',expr:o.expr||'feliz',brazos:o.brazos||'saluda',seed:3}); ctx.restore();
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.moveTo(-150,-510); ctx.lineTo(-90,-510); ctx.lineTo(-160,-250); ctx.lineTo(-175,-250); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#5B4B8A'; rr(-260,-250,520,50,16); ctx.fill(); ctx.restore(); chk('obj',x-260*s,y-620*s,x+260*s,y+20*s); }
// reloj de pared
function reloj(x,y,s,t,vel=3){ ocupa(x-120*s,y-120*s,x+120*s,y+120*s,1.5); ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle='#FFFFFF'; blob(0,0,110); ctx.strokeStyle='#FF5FA2'; ctx.lineWidth=16; ctx.beginPath(); ctx.arc(0,0,110,0,PI2); ctx.stroke();
  ctx.fillStyle='#1E1A2E'; for(let i=0;i<12;i++){ ctx.save(); ctx.rotate(i*Math.PI/6); rr(-4,-96,8,18,4); ctx.fill(); ctx.restore(); }
  ctx.save(); ctx.rotate(t*vel); ctx.fillStyle='#E23D5B'; rr(-4,-90,8,96,4); ctx.fill(); ctx.restore(); ctx.save(); ctx.rotate(t*vel/12); ctx.fillStyle='#1E1A2E'; rr(-7,-60,14,66,7); ctx.fill(); ctx.restore(); blob(0,0,12); ctx.restore(); chk('obj',x-120*s,y-120*s,x+120*s,y+120*s); }
// calendario con hojas que vuelan y contador
function calendario(x,y,s,k,t,t0,hasta,d,txt='AÑOS'){ ocupa(x-130*s,y-170*s,x+130*s,y+140*s,1.5); if(k<=0) return; chk('obj',x-130*s,y-160*s,x+130*s,y+140*s); ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle='#FFFFFF'; rr(-130,-140,260,280,22); ctx.fill(); ctx.fillStyle='#FF4D5E'; rr(-130,-140,260,70,22); ctx.fill(); ctx.fillRect(-130,-100,260,30);
  ctx.fillStyle='#8E8AA3'; for(const xx of [-60,60]){ rr(xx-10,-160,20,50,10); ctx.fill(); }
  const fl=((t-t0)*8)%1; if(t>t0 && t<t0+d){ ctx.save(); ctx.transform(1,0,0,1-fl,0,0); ctx.fillStyle='#F3EEFF'; rr(-120,-60,240,190,14); ctx.fill(); ctx.restore(); }
  ctx.fillStyle='#1E1A2E'; const v=contador(t,t0,d,0,hasta); ctx.font=fuente(v.length>4?78:110); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(v,0,30);
  ctx.font=fuente(40); ctx.fillStyle='#FFFFFF'; ctx.fillText(txt,0,-104); ctx.restore();
  if(t>t0 && t<t0+d) for(let i=0;i<5;i++){ const u=((t-t0)*2.2+i/5)%1; ctx.save(); ctx.globalAlpha=1-u; ctx.translate(x+(60+u*260)*(i%2?1:-1)*s,y-u*260*s); ctx.rotate(u*4+i); ctx.fillStyle='#F3EEFF'; rr(-40*s,-30*s,80*s,60*s,8*s); ctx.fill(); ctx.restore(); } }
function sudor(x,y,s,t,n=3){ for(let i=0;i<n;i++){ const a=-2.5+i*0.6; ctx.fillStyle='#7FD8FF'; const xx=x+Math.cos(a)*170*s, yy=y-290*s+Math.sin(a)*150*s+((t*2+i*0.3)%1)*30; ctx.beginPath(); ctx.moveTo(xx,yy-14*s*2); ctx.quadraticCurveTo(xx+10*s*2,yy,xx,yy+6*s*2); ctx.quadraticCurveTo(xx-10*s*2,yy,xx,yy-14*s*2); ctx.fill(); } }
function camino(y,col,col2){ ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(-300,2400); ctx.lineTo(470,y); ctx.lineTo(610,y); ctx.lineTo(1380,2400); ctx.closePath(); ctx.fill();
  ctx.fillStyle=col2; for(let i=0;i<7;i++){ const u=i/7, yy=lerp(y+20,1900,Math.pow(u,1.6)), w=lerp(4,30,u); rr(540-w/2,yy,w,lerp(10,70,u),w/2); ctx.fill(); } }
function letreroBano(x,y,s,k){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); ctx.fillStyle='#5B4B8A'; rr(-12,0,24,300,10); ctx.fill(); ctx.fillStyle='#FFFFFF'; rr(-110,-150,220,160,24); ctx.fill();
  ctx.fillStyle='#4B6BFB'; ctx.font=fuente(84); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('WC',0,-70); ctx.restore(); chk('obj',x-110*s*k,y-150*s*k,x+110*s*k,y+300*s*k); }
function tacheGrande(x,y,s,k){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); ctx.strokeStyle='#FF4D5E'; ctx.lineWidth=26; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-90,-90); ctx.lineTo(90,90); ctx.moveTo(90,-90); ctx.lineTo(-90,90); ctx.stroke(); ctx.restore(); }
function telarana(x,y,s,k){ if(k<=0) return; ctx.save(); ctx.globalAlpha=0.85*k; ctx.translate(x,y); ctx.scale(s,s); ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=4;
  for(let i=0;i<6;i++){ const a=i*Math.PI/10; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*220,Math.sin(a)*220); ctx.stroke(); }
  for(let r=50;r<=210;r+=40){ ctx.beginPath(); for(let i=0;i<6;i++){ const a=i*Math.PI/10; const px=Math.cos(a)*r, py=Math.sin(a)*r; i?ctx.lineTo(px,py):ctx.moveTo(px,py); } ctx.stroke(); } ctx.restore(); }
function banco(x,y,s,t){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle='#E9E4FF'; rr(-330,-560,660,560,20); ctx.fill(); ctx.fillStyle='#B9A8F0'; ctx.beginPath(); ctx.moveTo(-380,-560); ctx.lineTo(0,-760); ctx.lineTo(380,-560); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#FFFFFF'; for(let i=0;i<4;i++){ rr(-270+i*170,-500,60,440,14); ctx.fill(); } ctx.fillStyle='#5B4B8A'; rr(-90,-260,180,260,16); ctx.fill();
