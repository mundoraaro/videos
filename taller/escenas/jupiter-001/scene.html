<script>
// jupiter-001 — ¿Qué pasaría si saltaras a Júpiter? (fórmula "¿qué pasaría si…?", 2ª persona)
// Disfraces: tripulante (polo azul) → astronauta (afuera) → tripulante → piyama + saco → astronauta → tripulante → astronauta (regreso) → tripulante (loop).
// Encuadre: Raro completo dentro de x≈20–940; letreros en y 390–520 (helper L); verificador CHECK en coordenadas de pantalla.
const PI2=Math.PI*2;
window.HIDE_CAPTIONS_LAST=false;
window.CAPTION_POP_MIN=0.85;

// ---------- captions en bloques de 2–3 palabras (v2: nunca una palabra vacía sola en pantalla) ----------
const _corta=w=>w.replace(/[¡!¿?.,:…"]/g,'').length<=3;
function buildChunks(){
  CH=[]; let cur=[];
  const len=c=>c.map(j=>W[j].t).join(' ').length;
  W.forEach((w,i)=>{ if(cur.length>=2 && (cur.map(j=>W[j].t).join(' ')+' '+w.t).length>17){ CH.push(cur); cur=[]; } cur.push(i); const fin=/[.,?!:…]$/.test(w.t);
    if(fin||cur.length>=3||len(cur)>16){
      // no cerrar un bloque con una palabra corta sin puntuación: pasa al siguiente
      if(!fin && cur.length>1 && _corta(w.t)){ cur.pop(); CH.push(cur); cur=[i]; }
      else { CH.push(cur); cur=[]; } } });
  if(cur.length) CH.push(cur);
  // un bloque de una sola palabra corta se une con el siguiente (o con el anterior)
  for(let c=0;c<CH.length;c++){ if(CH[c].length===1 && _corta(W[CH[c][0]].t)){
    if(c+1<CH.length && CH[c+1].length<=3){ CH[c+1]=CH[c].concat(CH[c+1]); CH.splice(c,1); c--; }
    else if(c>0 && CH[c-1].length<=3){ CH[c-1]=CH[c-1].concat(CH[c]); CH.splice(c,1); c--; } } }
}
// Igual que captions() del motor, pero las 2 primeras palabras de cada bloque aparecen juntas.
function captions(t){
  let ci=-1; for(let c=0;c<CH.length;c++){ if(W[CH[c][0]].s-0.05<=t) ci=c; }
  if(ci<0) return; const ch=CH[ci]; const last=W[ch[ch.length-1]];
  if(t>last.e+0.6 && (ci+1>=CH.length || t<W[CH[ci+1][0]].s-0.05)) return;
  const KW=window.KEYWORDS||[];
  let size=window.CAPTION_SIZE||80; const words=ch.map(i=>W[i].t.toUpperCase());
  const big=i=>KW.includes(i)?1.22:1;
  const widths=()=>ch.map((i,n)=>{ctx.font=fuente(size*big(i));return ctx.measureText(words[n]).width;});
  ctx.font=fuente(size); let sp=ctx.measureText(' ').width, ws=widths(), total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);
  if(total>800){size=Math.floor(size*800/total); ctx.font=fuente(size); sp=ctx.measureText(' ').width; ws=widths(); total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);}
  if(CAPPOS[ci]==null) CAPPOS[ci]=lugarCaption(total,size*1.25);
  const y=CAPPOS[ci]; let x=540-total/2; const s0=W[ch[0]].s-0.05;
  ctx.textBaseline='middle'; ctx.textAlign='center'; ctx.lineJoin='round';
  ch.forEach((i,n)=>{const w=words[n], wd=ws[n], kw=KW.includes(i); const ws_=n<2?Math.max(0,s0):W[i].s;
    const k=t<ws_?0:(kw?popIn(t,ws_,0.22):back((t-ws_)/0.16));
    if(k>0){ const sz=size*big(i); ctx.save(); ctx.translate(x+wd/2,y); const sc=lerp(window.CAPTION_POP_MIN??0.6,1,k); ctx.scale(sc,sc); if(kw) ctx.rotate(Math.sin(t*5+i)*0.03);
      ctx.font=fuente(sz); ctx.fillStyle='rgba(20,14,40,0.45)'; ctx.fillText(w,0,sz*0.09);
      ctx.lineWidth=sz*0.19; ctx.strokeStyle='#1E1A2E'; ctx.strokeText(w,0,0);
      ctx.fillStyle=kw?COL.lime:'#FFFFFF'; ctx.fillText(w,0,0); ctx.restore(); }
    x+=wd+sp*1.25;});
}

// ---------- verificador de encuadre (cajas en pantalla) ----------
window.CHECK=[];
function chk(tag,x0,y0,x1,y1){ const m=ctx.getTransform(); const P=[[x0,y0],[x1,y0],[x0,y1],[x1,y1]].map(([x,y])=>[m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f]);
  CHECK.push([tag,Math.min(...P.map(p=>p[0])),Math.min(...P.map(p=>p[1])),Math.max(...P.map(p=>p[0])),Math.max(...P.map(p=>p[1]))]); }
let CUR=1;
// Letrero en coordenadas de PANTALLA, compensando el zoom de la toma (soplar-001-v2).
function L(txt,x,y,k,tipo='madera',opts={}){ const TM=(window.TOMAS||{})[CUR]||{}, Z=Math.max(1,TM.z||1), F=TM.foco||[540,960];
  let tam=(opts.tam||72)/Z; ctx.font=fuente(tam); let w=ctx.measureText(txt).width+tam*1.2; const maxW=680/Z;
  if(w>maxW){ tam*=maxW/w; w=maxW; } const sw=w*Z; x=clamp(x,180+sw/2,900-sw/2); y=clamp(y,390,520);
  const X=F[0]+(x-540)/Z, Y=F[1]+(y-960)/Z;
  letrero(txt,X,Y,k,tipo,{sinPalo:!opts.palo,...opts,tam}); if(k>0.5) chk('letrero',X-w/2,Y-tam*0.85,X+w/2,Y+tam*0.85); }
function tierra(x,y,r,t,sinGlow){ ctx.save(); if(!sinGlow){ const g=ctx.createRadialGradient(x,y,r*0.9,x,y,r*1.25); g.addColorStop(0,'rgba(127,216,255,0.8)'); g.addColorStop(1,'rgba(127,216,255,0)'); ctx.fillStyle=g; blob(x,y,r*1.25); }
  ctx.fillStyle='#3AB6FF'; blob(x,y,r); ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,PI2); ctx.clip();
  const sp=t*0.05*r; ctx.fillStyle='#5CD67A'; for(let i=0;i<7;i++){ const xx=x-r+(((rand(i)*2.4*r+sp)%(2.4*r))) - 0.2*r, yy=y-r*0.8+rand(i+7)*r*1.6; blob(xx,yy,r*(0.18+rand(i+3)*0.2)); blob(xx+r*0.15,yy+r*0.1,r*0.14); }
  ctx.fillStyle='rgba(255,255,255,0.85)'; for(let i=0;i<6;i++){ const xx=x-r+(((rand(i+20)*2.4*r+sp*1.6)%(2.4*r)))-0.2*r, yy=y-r*0.9+rand(i+27)*r*1.8; ctx.beginPath(); ctx.ellipse(xx,yy,r*0.22,r*0.05,0,0,PI2); ctx.fill(); }
  ctx.fillStyle='rgba(30,26,80,0.25)'; ctx.beginPath(); ctx.arc(x+r*0.35,y+r*0.2,r*1.05,0,PI2); ctx.fill(); ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.ellipse(x-r*0.45,y-r*0.5,r*0.25,r*0.1,-0.6,0,PI2); ctx.fill(); ctx.restore(); }
function reloj(x,y,r,t,t0,vel=12,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.fillStyle='#FF4D6D'; blob(0,0,r+16); ctx.fillStyle='#FFFFFF'; blob(0,0,r);
  ctx.fillStyle='#1E1A2E'; for(let i=0;i<12;i++){ ctx.save(); ctx.rotate(i/12*PI2); rr(-4,-r+10,8,18,4); ctx.fill(); ctx.restore(); }
  ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=10; ctx.lineCap='round'; const a=Math.max(0,t-t0)*vel; ctx.save(); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-r*0.75); ctx.stroke(); ctx.restore(); ctx.save(); ctx.rotate(a/12); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-r*0.5); ctx.stroke(); ctx.restore(); blob(0,0,10); ctx.restore(); ocupa(x-r,y-r,x+r,y+r,1.2); chk('obj',x-r-16,y-r-16,x+r+16,y+r+16); }
function solito(x,y,r,t,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.rotate(t); ctx.fillStyle='#FFD23F'; for(let i=0;i<8;i++){ ctx.save(); ctx.rotate(i/8*PI2); ctx.beginPath(); ctx.moveTo(-r*0.25,-r*1.05); ctx.lineTo(0,-r*1.5); ctx.lineTo(r*0.25,-r*1.05); ctx.fill(); ctx.restore(); } ctx.fillStyle='#FFE45C'; blob(0,0,r); ctx.restore(); }
// México simplificado (lon/lat → pantalla)
const MX=[[-117.1,32.5],[-114.7,32.7],[-111,31.3],[-108.2,31.3],[-106.5,31.8],[-104.5,29.6],[-103,29],[-101.4,29.8],[-99.5,27.5],[-97.4,25.9],[-97.7,24],[-97.2,21.5],[-96.1,19.2],[-94.5,18.2],[-92.5,18.6],[-91,19],[-90.4,20.9],[-88,21.5],[-86.8,21.2],[-87.5,19.5],[-88.3,18.5],[-89.1,17.8],[-91.4,17.3],[-92.2,14.6],[-93.9,16],[-96.5,15.7],[-98.6,16.4],[-101.5,17.6],[-103.5,18.3],[-105.5,20.4],[-105.3,21.6],[-106.4,23.2],[-108.9,25.5],[-110.5,27.5],[-112.2,29.5],[-113,31.2],[-114.8,31.6],[-114.5,30.2],[-113.4,28.8],[-112.2,26.8],[-110.6,24.3],[-109.4,23.1],[-110.2,23.6],[-112.1,24.8],[-114.2,27.5],[-115.8,29.8],[-116.7,31.8]];
const MXp=(lon,lat)=>[110+(lon+118)*25, 690+(33-lat)*26.5];
function mapaMX(t,k,col){ if(k<=0) return; ctx.save(); ctx.translate(540,950); ctx.scale(k,k); ctx.translate(-540,-950);
  ctx.fillStyle='rgba(30,26,46,0.18)'; ctx.beginPath(); MX.forEach(([a,b],i)=>{ const [x,y]=MXp(a,b); i?ctx.lineTo(x+10,y+14):ctx.moveTo(x+10,y+14); }); ctx.closePath(); ctx.fill();
  ctx.fillStyle=col; ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=8; ctx.lineJoin='round'; ctx.beginPath(); MX.forEach(([a,b],i)=>{ const [x,y]=MXp(a,b); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  ocupa(110,690,900,1200,1.0); chk('obj',110,690,900,1200); }
function tache(x,y,r,k){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=46; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-r,-r); ctx.lineTo(r,r); ctx.moveTo(r,-r); ctx.lineTo(-r,r); ctx.stroke(); ctx.strokeStyle='#FF4D5E'; ctx.lineWidth=30; ctx.stroke(); ctx.restore(); }

// ====================== jupiter-001: utilería ======================
function scn(t){ let n=1; for(let i=0;i<SC.length;i++) if(t>=SC[i].start) n=i+1; return n; }
const dur=sc=>sc.end-sc.start;
// Raro cayendo: (x,y) es el centro del cuerpo; ang = giro. Sin sombra (no hay suelo).
function cae(o,ang=0){ const s=o.s??1; ctx.save(); ctx.translate(o.x,o.y); ctx.rotate(ang); raro({...o,x:0,y:190*s,piernas:o.piernas||'flota',sinSombra:true}); ctx.restore(); }
// Júpiter de dulce: bandas que corren, Gran Mancha Roja y sombra lateral
const BANDAS=[[-1.0,0.2,'#C9703E'],[-0.8,0.14,'#F2C58A'],[-0.62,0.12,'#B85F33'],[-0.46,0.16,'#FFE3B8'],[-0.26,0.12,'#E08A4C'],[-0.1,0.14,'#FFF0D6'],[0.08,0.12,'#D27443'],[0.24,0.16,'#F6CF98'],[0.44,0.12,'#B85F33'],[0.6,0.16,'#FFE3B8'],[0.78,0.12,'#E08A4C'],[0.92,0.12,'#C9703E']];
function jupiter(x,y,r,t,o={}){ ctx.save();
  const g=ctx.createRadialGradient(x,y,r*0.95,x,y,r*1.18); g.addColorStop(0,'rgba(255,200,140,0.75)'); g.addColorStop(1,'rgba(255,200,140,0)'); ctx.fillStyle=g; blob(x,y,r*1.18);
  ctx.beginPath(); ctx.arc(x,y,r,0,PI2); ctx.clip(); ctx.fillStyle='#F6D3A1'; ctx.fillRect(x-r,y-r,2*r,2*r);
  for(const [a,h,c] of BANDAS){ const y0=y+a*r; ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(x-r,y0);
    for(let xx=-r;xx<=r;xx+=r/14) ctx.lineTo(x+xx,y0+Math.sin(xx/r*7+t*1.2+a*9)*r*0.012);
    for(let xx=r;xx>=-r;xx-=r/14) ctx.lineTo(x+xx,y0+h*r+Math.sin(xx/r*6-t*1.0+a*7)*r*0.014); ctx.closePath(); ctx.fill(); }
  // remolinos en las orillas de las bandas
  ctx.fillStyle='rgba(255,255,255,0.35)'; for(let i=0;i<9;i++){ const xx=x-r+(((rand(i)*2*r+t*r*0.05*(1+rand(i+1)))%(2*r))), yy=y+(rand(i+5)*1.8-0.9)*r; ctx.beginPath(); ctx.ellipse(xx,yy,r*0.06,r*0.018,0,0,PI2); ctx.fill(); }
  const mx=x+r*0.28-((t*r*0.03)%(r*0.2)), my=y+r*0.36; ctx.fillStyle='#D2553A'; ctx.beginPath(); ctx.ellipse(mx,my,r*0.2,r*0.11,0,0,PI2); ctx.fill();
  ctx.fillStyle='#EE7E58'; ctx.beginPath(); ctx.ellipse(mx,my,r*0.13,r*0.065,0,0,PI2); ctx.fill(); ctx.fillStyle='#FF9E7A'; ctx.beginPath(); ctx.ellipse(mx,my,r*0.06,r*0.03,t*2,0,PI2); ctx.fill();
  const sh=ctx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.2,x,y,r*1.05); sh.addColorStop(0,'rgba(255,255,255,0.18)'); sh.addColorStop(0.7,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(60,20,80,0.45)'); ctx.fillStyle=sh; ctx.fillRect(x-r,y-r,2*r,2*r);
  ctx.restore(); }
// nave de dulce con escotilla abierta y repisa lima
function nave(x,y,s,t){ ctx.save(); ctx.translate(x,y+Math.sin(t*1.6)*10); ctx.rotate(Math.sin(t*1.1)*0.03); ctx.scale(s,s);
  for(const k of [-1,1]){ ctx.fillStyle='#FF5FA2'; ctx.beginPath(); ctx.moveTo(-120*k,60); ctx.quadraticCurveTo(-210*k,150,-190*k,230); ctx.lineTo(-80*k,140); ctx.fill(); }
  ctx.fillStyle='#FFB13D'; for(const k of [-1,0,1]){ const f=60+Math.sin(t*30+k)*18; ctx.beginPath(); ctx.moveTo(k*60-28,200); ctx.lineTo(k*60,200+f); ctx.lineTo(k*60+28,200); ctx.fill(); }
  ctx.fillStyle='#8FA0E8'; rr(-140,-260,280,470,140); ctx.fill(); ctx.fillStyle='#B8C6FF'; rr(-150,-270,270,460,135); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.ellipse(-80,-160,26,70,0.2,0,PI2); ctx.fill();
  ctx.fillStyle='#7F8FD8'; blob(-10,-130,62); ctx.fillStyle='#7FD8FF'; blob(-10,-130,46); ctx.fillStyle='rgba(255,255,255,0.7)'; blob(-26,-146,12);
  ctx.fillStyle='#2A2350'; rr(30,-40,95,190,40); ctx.fill(); ctx.fillStyle='#D7FF3D'; rr(20,145,190,26,13); ctx.fill();
  ctx.fillStyle='#FF5FA2'; blob(-10,-290,26); ctx.restore(); ocupa(x-160*s,y-300*s,x+210*s,y+240*s,1.2); }
const NV={x:200,y:790,s:0.8}; const LEDGE=()=>[NV.x+115*NV.s,NV.y+150*NV.s]; // dónde pisa Raro (repisa de la nave)
function rayitos(t,x,y,n=8,c='#FFFFFF',k=1){ ctx.save(); ctx.strokeStyle=c; ctx.lineCap='round'; ctx.globalAlpha=0.75*k; ctx.lineWidth=8;
  for(let i=0;i<n;i++){ const u=((t*2.6+rand(i))%1), xx=x+(rand(i+3)-0.5)*520, yy=y+300-u*900; ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx,yy+90+rand(i)*120); ctx.stroke(); } ctx.restore(); }
function flechaAbajo(x,y,k,c='#D7FF3D'){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI); ctx.scale(k,k); ctx.fillStyle=c; ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(0,-90); ctx.lineTo(60,-20); ctx.lineTo(22,-20); ctx.lineTo(22,60); ctx.lineTo(-22,60); ctx.lineTo(-22,-20); ctx.lineTo(-60,-20); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
function pin(x,y,k,c,txt){ if(k<=0) return; ocupa(x-90,y-160,x+90,y+10,2.5); ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.fillStyle=c; ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(0,-60,30,Math.PI*0.85,Math.PI*0.15); ctx.lineTo(0,0); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.fillStyle='#FFFFFF'; blob(0,-62,11);
  ctx.font=fuente(40); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineWidth=9; ctx.strokeText(txt,0,-118); ctx.fillStyle='#FFFFFF'; ctx.fillText(txt,0,-118); ctx.restore(); }
function bascula(x,y,s,txt,rojo,t){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle='#5E5A7A'; rr(-230,-20,460,70,30); ctx.fill(); ctx.fillStyle='#F3F0FF'; rr(-240,-40,480,70,30); ctx.fill();
  ctx.fillStyle='#1E1A2E'; rr(-110,-30,220,52,14); ctx.fill(); ctx.fillStyle=rojo?'#FF4D5E':'#D7FF3D'; ctx.font=fuente(42); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,0,-3); ctx.restore(); ocupa(x-240*s,y-40*s,x+240*s,y+50*s,1); }
function pesa(x,y,s,k,txt){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); ctx.fillStyle='#3B3557'; ctx.beginPath(); ctx.moveTo(-150,60); ctx.lineTo(150,60); ctx.lineTo(110,-90); ctx.lineTo(-110,-90); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#3B3557'; ctx.lineWidth=34; ctx.beginPath(); ctx.arc(0,-110,60,Math.PI,0); ctx.stroke(); ctx.fillStyle='#5A5280'; rr(-90,-60,60,90,20); ctx.fill();
  ctx.fillStyle='#D7FF3D'; ctx.font=fuente(84); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,10,0); ctx.restore(); }
function cristal(x,y,r,a,c='#E9FBFF'){ ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.strokeStyle=c; ctx.lineWidth=r*0.22; ctx.lineCap='round'; for(let i=0;i<3;i++){ ctx.rotate(Math.PI/3); ctx.beginPath(); ctx.moveTo(-r,0); ctx.lineTo(r,0); ctx.stroke(); ctx.beginPath(); ctx.moveTo(r*0.55,0); ctx.lineTo(r*0.8,-r*0.25); ctx.moveTo(r*0.55,0); ctx.lineTo(r*0.8,r*0.25); ctx.stroke(); } ctx.restore(); }
function sonda(x,y,s,t,o={}){ ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(t*2.2)*0.08*(o.para?1:0.4)); ctx.scale(s,s);
  if(o.para>0){ const k=o.para; ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=4; for(const xx of [-160,-60,60,160]){ ctx.beginPath(); ctx.moveTo(0,-60); ctx.lineTo(xx*k,-330*k); ctx.stroke(); }
    ctx.save(); ctx.translate(0,-330*k); ctx.scale(k,k); for(let i=0;i<4;i++){ ctx.fillStyle=i%2?'#FFFFFF':'#FF5FA2'; ctx.beginPath(); ctx.moveTo(-200+i*100,0); ctx.quadraticCurveTo(-150+i*100,-150+Math.abs(i-1.5)*40,-100+i*100,0); ctx.fill(); } ctx.restore(); }
  ctx.fillStyle=o.quema?mix('#C98A4B','#FF4D2E',o.quema):'#C98A4B'; ctx.beginPath(); ctx.moveTo(-130,40); ctx.quadraticCurveTo(0,140,130,40); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#E8E4F5'; ctx.beginPath(); ctx.moveTo(-120,40); ctx.lineTo(-70,-70); ctx.lineTo(70,-70); ctx.lineTo(120,40); ctx.closePath(); ctx.fill(); ctx.fillStyle='#C9C3DE'; ctx.fillRect(-120,20,240,20);
  ctx.fillStyle='#FFD23F'; rr(-40,-50,80,40,10); ctx.fill(); ctx.strokeStyle='#8E8AA3'; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(40,-70); ctx.lineTo(70,-130); ctx.stroke(); ctx.fillStyle='#FF4D5E'; blob(70,-135,12);
  if(o.senal>0){ ctx.strokeStyle='#D7FF3D'; ctx.lineCap='round'; ctx.lineWidth=10; for(let i=0;i<3;i++){ const u=((t*1.8+i/3)%1); ctx.globalAlpha=(1-u)*o.senal; ctx.beginPath(); ctx.arc(70,-135,30+u*120,-2.4,-0.7); ctx.stroke(); } ctx.globalAlpha=1; }
  ctx.restore(); ocupa(x-130*s,y-140*s,x+130*s,y+110*s,1.2); }
