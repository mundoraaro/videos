<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine.js"></script>
<script src="../../raro.js"></script>
<script>
// estornudo-todos-001 — ¿Qué pasaría si TODOS estornudáramos al mismo tiempo? (serie "¿Qué pasaría si TODOS…?", Parte 24)
// Disfraz: resfriado (gorro tejido con pompón, suéter a rayas, nariz roja y pañuelo) → científico (reflejo y medición) → resfriado.
// Encuadre: Raro y objetos dentro de x≈20–940, y 180–1500; letreros en y 390–520 (helper L / L2); verificador CHECK.
const PI2=Math.PI*2;
window.HIDE_CAPTIONS_LAST=false;
window.CAPTION_POP_MIN=0.85;

// ---------- captions en bloques de 2–3 palabras (igual que correr-todos-001) ----------
const _corta=w=>w.replace(/[¡!¿?.,:…"]/g,'').length<=3;
function buildChunks(){
  CH=[]; let cur=[];
  const len=c=>c.map(j=>W[j].t).join(' ').length;
  W.forEach((w,i)=>{ if(cur.length>=2 && (cur.map(j=>W[j].t).join(' ')+' '+w.t).length>17){ CH.push(cur); cur=[]; } cur.push(i); const fin=/[.,?!:…]$/.test(w.t);
    if(fin||cur.length>=3||len(cur)>16){
      if(!fin && cur.length>1 && _corta(w.t)){ cur.pop(); CH.push(cur); cur=[i]; }
      else { CH.push(cur); cur=[]; } } });
  if(cur.length) CH.push(cur);
  for(let c=0;c<CH.length;c++){ if(CH[c].length===1 && _corta(W[CH[c][0]].t)){
    if(c+1<CH.length && CH[c+1].length<=3){ CH[c+1]=CH[c].concat(CH[c+1]); CH.splice(c,1); c--; }
    else if(c>0 && CH[c-1].length<=3){ CH[c-1]=CH[c-1].concat(CH[c]); CH.splice(c,1); c--; } } }
}
function captions(t){
  let ci=-1; for(let c=0;c<CH.length;c++){ if(W[CH[c][0]].s-0.05<=t) ci=c; }
  if(ci<0) return; const ch=CH[ci]; const last=W[ch[ch.length-1]];
  if(t>last.e+0.6 && (ci+1>=CH.length || t<W[CH[ci+1][0]].s-0.05)) return;
  const KW=window.KEYWORDS||[];
  let size=window.CAPTION_SIZE||80; const words=ch.map(i=>W[i].t.toUpperCase());
  const big=i=>KW.includes(i)?1.22:1;
  const widths=()=>ch.map((i,n)=>{ctx.font=fuente(size*big(i));return ctx.measureText(words[n]).width;});
  ctx.font=fuente(size); let sp=ctx.measureText(' ').width, ws=widths(), total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);
  if(total>800){size=Math.floor(size*800/total); ctx.font=fuente(size); sp=ctx.measureText(' ').width; ws=widths(); total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);}
  if(CAPPOS[ci]==null) CAPPOS[ci]=lugarCaption(total,size*1.25);
  const y=CAPPOS[ci]; let x=540-total/2; const s0=W[ch[0]].s-0.05;
  ctx.textBaseline='middle'; ctx.textAlign='center'; ctx.lineJoin='round';
  ch.forEach((i,n)=>{const w=words[n], wd=ws[n], kw=KW.includes(i); const ws_=n<2?Math.max(0,s0):W[i].s;
    const k=t<ws_?0:(kw?popIn(t,ws_,0.22):back((t-ws_)/0.16));
    if(k>0){ const sz=size*big(i); ctx.save(); ctx.translate(x+wd/2,y); const sc=lerp(window.CAPTION_POP_MIN??0.6,1,k); ctx.scale(sc,sc); if(kw) ctx.rotate(Math.sin(t*5+i)*0.03);
      ctx.font=fuente(sz); ctx.fillStyle='rgba(20,14,40,0.45)'; ctx.fillText(w,0,sz*0.09);
      ctx.lineWidth=sz*0.19; ctx.strokeStyle='#1E1A2E'; ctx.strokeText(w,0,0);
      ctx.fillStyle=kw?COL.lime:'#FFFFFF'; ctx.fillText(w,0,0); ctx.restore(); }
    x+=wd+sp*1.25;});
}

// ---------- verificador de encuadre ----------
window.CHECK=[];
const _raro=raro;
raro=function(o){ const s=o.s??1, m=ctx.getTransform(), alto=o.alto||0; const der=(o.brazos==='senala'||o.brazos==='saluda')?320:215, izq=215;
  let x0=-izq*s, x1=der*s; if(o.espejo){ const a=-x1; x1=-x0; x0=a; }
  const pts=[[o.x+x0,o.y-alto-470*s],[o.x+x1,o.y-alto-470*s],[o.x+x0,o.y-alto],[o.x+x1,o.y-alto]].map(([x,y])=>[m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f]);
  CHECK.push([o.color?'npc':'raro',Math.min(...pts.map(p=>p[0])),Math.min(...pts.map(p=>p[1])),Math.max(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[1]))]);
  return _raro(o); };
function chk(tag,x0,y0,x1,y1){ const m=ctx.getTransform(); const P=[[x0,y0],[x1,y0],[x0,y1],[x1,y1]].map(([x,y])=>[m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f]);
  CHECK.push([tag,Math.min(...P.map(p=>p[0])),Math.min(...P.map(p=>p[1])),Math.max(...P.map(p=>p[0])),Math.max(...P.map(p=>p[1]))]); }

// ---------- utilería general ----------
let CUR=1;
const dur=sc=>sc.end-sc.start;
function L(txt,x,y,k,tipo='madera',opts={}){ let tam=opts.tam||72; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.font=fuente(tam); let w=ctx.measureText(txt).width+tam*1.2; const maxW=700;
  if(w>maxW){ tam*=maxW/w; w=maxW; } x=clamp(x,170+w/2,910-w/2); y=clamp(y,390,520);
  letrero(txt,x,y,k,tipo,{sinPalo:!opts.palo,...opts,tam}); if(k>0.5) chk('letrero',x-w/2,y-tam*0.85,x+w/2,y+tam*0.85); ctx.restore(); }
function L2(a,b,k,y=430,t=0,t0=-1,tipo='panel'){ if(k<=0) return; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.translate(540,y); const sw=wobble(t,t0,0.2); ctx.rotate(sw); ctx.scale(k,k);
  ctx.font=fuente(88); const w1=ctx.measureText(a).width; ctx.font=fuente(62); const w2=ctx.measureText(b).width; let w=Math.max(w1,w2)+90; let sc=1; if(w>740){ sc=740/w; w=740; }
  const h=200*sc; ctx.fillStyle='#1E1A2E'; rr(-w/2+8,-h/2+10,w,h,30); ctx.fill(); ctx.fillStyle=tipo==='panel'?'#2E2A60':'#B97A3E'; rr(-w/2,-h/2,w,h,30); ctx.fill();
  ctx.strokeStyle='#D7FF3D'; ctx.lineWidth=7; rr(-w/2+10,-h/2+10,w-20,h-20,24); ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font=fuente(88*sc); ctx.fillStyle='#FFFFFF'; ctx.fillText(a,0,-40*sc); ctx.font=fuente(62*sc); ctx.fillStyle='#D7FF3D'; ctx.fillText(b,0,48*sc);
  ocupa(-w/2,-h/2,w/2,h/2,3); chk('letrero',-w/2,-h/2,w/2,h/2); ctx.restore(); }
function flecha(x,y,ang,k,c='#D7FF3D'){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.scale(k,k); ctx.fillStyle=c; ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(90,0); ctx.lineTo(20,-60); ctx.lineTo(20,-22); ctx.lineTo(-80,-22); ctx.lineTo(-80,22); ctx.lineTo(20,22); ctx.lineTo(20,60); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
function sudor(x,y,s,t,n=3){ for(let i=0;i<n;i++){ const a=-2.5+i*0.6; ctx.fillStyle='#7FD8FF'; const xx=x+Math.cos(a)*170*s, yy=y-290*s+Math.sin(a)*150*s+((t*2+i*0.3)%1)*30; ctx.beginPath(); ctx.moveTo(xx,yy-28*s); ctx.quadraticCurveTo(xx+20*s,yy,xx,yy+12*s); ctx.quadraticCurveTo(xx-20*s,yy,xx,yy-28*s); ctx.fill(); } }
function tierra(x,y,r,t,sinGlow){ ctx.save(); if(!sinGlow){ const g=ctx.createRadialGradient(x,y,r*0.9,x,y,r*1.25); g.addColorStop(0,'rgba(127,216,255,0.8)'); g.addColorStop(1,'rgba(127,216,255,0)'); ctx.fillStyle=g; blob(x,y,r*1.25); }
  ctx.fillStyle='#3AB6FF'; blob(x,y,r); ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,PI2); ctx.clip();
  const sp=t*0.05*r; ctx.fillStyle='#5CD67A'; for(let i=0;i<7;i++){ const xx=x-r+(((rand(i)*2.4*r+sp)%(2.4*r))) - 0.2*r, yy=y-r*0.8+rand(i+7)*r*1.6; blob(xx,yy,r*(0.18+rand(i+3)*0.2)); blob(xx+r*0.15,yy+r*0.1,r*0.14); }
  ctx.fillStyle='rgba(255,255,255,0.85)'; for(let i=0;i<6;i++){ const xx=x-r+(((rand(i+20)*2.4*r+sp*1.6)%(2.4*r)))-0.2*r, yy=y-r*0.9+rand(i+27)*r*1.8; ctx.beginPath(); ctx.ellipse(xx,yy,r*0.22,r*0.05,0,0,PI2); ctx.fill(); }
  ctx.fillStyle='rgba(30,26,80,0.25)'; ctx.beginPath(); ctx.arc(x+r*0.35,y+r*0.2,r*1.05,0,PI2); ctx.fill(); ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.ellipse(x-r*0.45,y-r*0.5,r*0.25,r*0.1,-0.6,0,PI2); ctx.fill(); ctx.restore(); }
function arcoTierra(t,cy,R,vel=1){ const cx=540; ctx.save(); const g=ctx.createRadialGradient(cx,cy,R*0.98,cx,cy,R*1.08); g.addColorStop(0,'rgba(127,216,255,0.9)'); g.addColorStop(1,'rgba(127,216,255,0)'); ctx.fillStyle=g; blob(cx,cy,R*1.08);
  ctx.fillStyle='#3AB6FF'; blob(cx,cy,R); ctx.beginPath(); ctx.arc(cx,cy,R,0,PI2); ctx.clip(); const rot=-t*0.03*vel;
  for(let i=0;i<16;i++){ const a=rot+i*PI2/16+rand(i)*0.2; const x=cx+Math.sin(a)*R*0.93, y=cy-Math.cos(a)*R*0.93; ctx.fillStyle=i%3?'#5CD67A':'#43B866'; blob(x,y,R*(0.1+rand(i+4)*0.07)); blob(x+R*0.08,y+R*0.03,R*0.08); }
  ctx.fillStyle='rgba(30,26,80,0.22)'; ctx.beginPath(); ctx.arc(cx+R*0.25,cy+R*0.15,R,0,PI2); ctx.fill(); ctx.restore(); }
const yArco=(x,cy,R)=>cy-Math.cos(Math.asin(clamp((x-540)/R,-1,1)))*R;
// velocímetro (de correr-todos-001)
function velo(x,y,s,k,txt,frac,t,sub='KM/H'){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); ctx.fillStyle='#1E1A2E'; ctx.beginPath(); ctx.arc(6,10,170,Math.PI,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.arc(0,0,170,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.strokeStyle='#5B4B8A'; ctx.lineWidth=14; ctx.stroke();
  for(let i=0;i<=10;i++){ ctx.save(); ctx.rotate(-1.35+i*0.27); ctx.fillStyle=i>7?'#E23D5B':'#1E1A2E'; rr(-4,-160,8,26,4); ctx.fill(); ctx.restore(); }
  ctx.save(); ctx.rotate((-1.35+2.7*clamp(frac))+Math.sin(t*40)*0.02); ctx.fillStyle='#E23D5B'; rr(-7,-140,14,140,7); ctx.fill(); ctx.restore(); ctx.fillStyle='#1E1A2E'; blob(0,0,18);
  ctx.fillStyle='#FFFFFF'; rr(-110,-118,220,70,20); ctx.fill(); ctx.fillStyle='#1E1A2E'; ctx.font=fuente(54); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,0,-82); ctx.font=fuente(28); ctx.fillStyle='#5B4B8A'; ctx.fillText(sub,0,-38); ctx.restore();
  chk('obj',x-176*s,y-176*s,x+176*s,y+16*s); ocupa(x-180*s,y-180*s,x+180*s,y+20*s,2); }

// ====================== estornudo ======================
// ráfaga de estornudo: líneas radiales + gotitas que salen disparadas desde (x,y) hacia dir (1 derecha, -1 izquierda)
function achu(t,t0,x,y,dir=1,s=1){ if(t<t0||t>t0+0.9) return; const u=prog(t,t0,0.55); ctx.save(); ctx.translate(x,y); ctx.scale(dir*s,s);
  ctx.strokeStyle='rgba(255,255,255,'+(1-u)+')'; ctx.lineWidth=12; ctx.lineCap='round';
  for(let i=0;i<9;i++){ const a=-0.7+i*0.175; ctx.beginPath(); ctx.moveTo(Math.cos(a)*50,Math.sin(a)*50); ctx.lineTo(Math.cos(a)*(70+u*320),Math.sin(a)*(70+u*320)); ctx.stroke(); }
  const v=prog(t,t0,0.9); for(let i=0;i<16;i++){ const a=-0.6+rand(i+40)*1.2, d=60+v*(220+rand(i)*260); ctx.globalAlpha=1-v; ctx.fillStyle=i%3?'#BFF5FF':'#C8FFB0'; blob(Math.cos(a)*d,Math.sin(a)*d+v*v*60,6+rand(i+9)*8); }
  ctx.restore(); ctx.globalAlpha=1; }
// nube de estornudo (verde menta translúcida con gotitas)
function nubeMocos(x,y,r,k,t,seed=0){ if(k<=0) return; ctx.save(); ctx.globalAlpha=0.55*Math.min(1,k*1.4);
  for(let i=0;i<7;i++){ const a=i/7*PI2+seed, rr_=r*(0.42+rand(i+seed*3)*0.25); ctx.fillStyle=i%2?'#D4FFC8':'#B6F7E0'; blob(x+Math.cos(a)*r*0.45*k+Math.sin(t*2+i)*6,y+Math.sin(a)*r*0.3*k,rr_*k); }
  ctx.globalAlpha=0.9; for(let i=0;i<12;i++){ const xx=x+(rand(i+seed)-0.5)*r*1.6*k, yy=y+(rand(i+7+seed)-0.5)*r*0.9*k+Math.sin(t*3+i)*8; ctx.fillStyle='#FFFFFF'; blob(xx,yy,5); } ctx.restore(); }
// párpados que cierran la pantalla (k 0..1) dejando una rendija al centro
function parpados(k,yc=1000){ if(k<=0) return; ctx.save(); ctx.setTransform(1,0,0,1,0,0); const h=yc*k*0.86, h2=(1920-yc)*k*0.86; ctx.fillStyle='#3A1C6E';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(1080,0); ctx.lineTo(1080,h); ctx.quadraticCurveTo(540,h+120*k,0,h); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0,1920); ctx.lineTo(1080,1920); ctx.lineTo(1080,1920-h2); ctx.quadraticCurveTo(540,1920-h2-120*k,0,1920-h2); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=14; for(let i=0;i<9;i++){ const x=80+i*115; ctx.beginPath(); ctx.moveTo(x,h+60*k*Math.sin(i/8*Math.PI)); ctx.lineTo(x-10+i*2,h+60*k*Math.sin(i/8*Math.PI)+40*k); ctx.stroke(); } ctx.restore(); }

// ====================== disfraces ======================
const RESFRIADO={ // resfriado: suéter turquesa a rayas, gorro tejido magenta con pompón que rebota, nariz roja y pañuelo en la mano derecha (o.panuelo=false lo quita)
  cuerpo(o){ ctx.fillStyle='#17C6B4'; ctx.fillRect(-200,-215,400,220); ctx.fillStyle='#86F2E2'; for(let y=-170;y<0;y+=48) ctx.fillRect(-200,y,400,16);
    ctx.fillStyle='#0B8E89'; ctx.fillRect(-200,-36,400,18); },
  cabeza(o){ const tt=o.t||0, w=o.wob||0; ctx.save(); ctx.beginPath(); ctx.rect(-180,-460,360,124); ctx.clip(); ctx.fillStyle='#F0359B'; cuerpoPath(); ctx.fill(); ctx.restore();
    ctx.fillStyle='#FF9BDD'; ctx.save(); ctx.beginPath(); ctx.rect(-180,-352,360,26); ctx.clip(); cuerpoPath(); ctx.fill(); ctx.restore();
    ctx.strokeStyle='#A9196F'; ctx.lineWidth=5; for(let x=-90;x<=90;x+=30){ ctx.beginPath(); ctx.moveTo(x,-370); ctx.lineTo(x+6,-338); ctx.stroke(); }
    const px=Math.sin(tt*5)*6+w*40, py=-392-Math.abs(Math.sin(tt*4))*4; ctx.fillStyle='#FFD51A'; blob(px,py,30); ctx.fillStyle='#FFF38A'; blob(px-9,py-9,10); },
  frente(o,B){ ctx.fillStyle='#FF5E7A'; blob(0,-262,19); ctx.fillStyle='rgba(255,255,255,0.7)'; blob(-6,-268,5);
    if(o.panuelo===false) return; const h=B[1].h; ctx.save(); ctx.translate(h[0],h[1]); ctx.rotate(Math.sin((o.t||0)*6)*0.15);
    ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.moveTo(-10,0); ctx.quadraticCurveTo(-70,-90,-20,-150); ctx.quadraticCurveTo(30,-110,70,-140); ctx.quadraticCurveTo(80,-60,10,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#B8E6FF'; ctx.beginPath(); ctx.moveTo(-10,0); ctx.quadraticCurveTo(-40,-60,-14,-110); ctx.lineTo(0,-20); ctx.closePath(); ctx.fill(); ctx.restore(); }
};
DISFRACES.resfriado=RESFRIADO; const RF='resfriado', CIENT='cientifico';
const NARIZ_G={ frente(o){ ctx.fillStyle='#FF5E7A'; blob(0,-262,17); } }; // gomitas con nariz roja
// pose de "aaa…" (cabeza para atrás) y de "¡achú!" (se dobla al frente). f: 0 preachu → 1 achú
function poseAchu(t,tA){ if(t<tA){ const u=clamp(1-(tA-t)/1.2); return {expr:'preachu',tilt:-0.16*u+Math.sin(t*9)*0.015*u,manos:{d:[150,-300]}}; }
  const d=t-tA; return {expr:d<0.7?'estornudo':'yavalio',tilt:0.2*Math.exp(-4*d)*Math.cos(d*9),sq:gelatina(t,tA,0.5),manos:{d:[40,-258]}}; }

// ====================== utilería de escena ======================
function coche(x,y,s,t,col='#FF5FA2',mov=1){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); const b=Math.sin(t*20)*3*mov;
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(0,8,300,26,0,0,PI2); ctx.fill();
  ctx.fillStyle=mix(col,'#1E1A2E',0.25); rr(-290,-170+b,580,150,60); ctx.fill(); ctx.fillStyle=col; rr(-290,-180+b,580,145,60); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.45)'; rr(-240,-165+b,300,18,9); ctx.fill();
  ctx.fillStyle='#FFF38A'; blob(270,-120+b,22); ctx.fillStyle='#FF4D5E'; rr(-292,-130+b,16,34,8); ctx.fill();
  for(const wx of [-170,170]){ ctx.save(); ctx.translate(wx,-20); ctx.rotate(t*18*mov); ctx.fillStyle='#2A2440'; blob(0,0,62); ctx.fillStyle='#C9C3D6'; blob(0,0,28); ctx.fillStyle='#2A2440'; ctx.fillRect(-4,-26,8,52); ctx.restore(); }
  ctx.restore(); chk('obj',x-300*s,y-190*s,x+300*s,y+40*s); }
function parabrisas(x,y,s){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle='rgba(191,244,255,0.55)'; ctx.beginPath(); ctx.moveTo(60,-175); ctx.lineTo(120,-330); ctx.lineTo(140,-330); ctx.lineTo(95,-175); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#2A2440'; ctx.lineWidth=12; ctx.beginPath(); ctx.arc(70,-205,40,Math.PI*1.1,Math.PI*1.9); ctx.stroke(); ctx.restore(); }
function cinta(x0,x1,y,k,t,marcas,lab){ if(k<=0) return; const xe=lerp(x0,x1,easeOut(k)); ctx.fillStyle='#1E1A2E'; rr(x0-6,y-6,xe-x0+12,52,14); ctx.fill(); ctx.fillStyle='#FFD51A'; rr(x0,y-10,xe-x0,48,12); ctx.fill();
  ctx.fillStyle='#1E1A2E'; ctx.font=fuente(30); ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=0;i<=marcas;i++){ const xx=lerp(x0,x1,i/marcas); if(xx>xe) break; ctx.fillRect(xx-2,y-10,4,22); if(i%2===0||marcas<=8) ctx.fillText(String(i),xx,y+26); }
  ctx.fillStyle='#E0A800'; blob(x0-20,y+14,44); ctx.fillStyle='#FFD51A'; blob(x0-24,y+10,40); ctx.fillStyle='#1E1A2E'; blob(x0-24,y+10,10); chk('obj',x0-70,y-30,x1+10,y+60); }
function burbuja(x,y,txt,k,t,tam=70,col='#FFFFFF'){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.rotate(Math.sin(t*4)*0.03); ctx.font=fuente(tam); const w=ctx.measureText(txt).width+tam*0.9, h=tam*1.6;
  ctx.fillStyle='#1E1A2E'; rr(-w/2+6,-h/2+8,w,h,h/2); ctx.fill(); ctx.beginPath(); ctx.moveTo(-30,h/2-6); ctx.lineTo(-70,h/2+50); ctx.lineTo(10,h/2-6); ctx.fill();
  ctx.fillStyle=col; rr(-w/2,-h/2,w,h,h/2); ctx.fill(); ctx.beginPath(); ctx.moveTo(-34,h/2-12); ctx.lineTo(-72,h/2+42); ctx.lineTo(6,h/2-12); ctx.fill();

// S1/S25 GANCHO (loop): horizonte curvo de la Tierra con una fila de gomitas con nariz roja; Raro resfriado al frente, cabeza hacia atrás ("aaa…") desde el cuadro 0,
// pañuelo arriba. En "estornudamos" todos estornudan con los ojos apretados (> <), ráfagas y sacudida; quedan con los ojos cerrados. Letrero desde el cuadro 0. Toma: push.
function escenaGancho(t,sc,fin){ const cy=2300, R=1080; arcoTierra(t,cy,R,1);
  const tA=fin?1e9:at(2);
  [110,235,700,835].forEach((gx,i)=>{ const y=yArco(gx,cy,R)+10; const p=poseAchu(t,tA+i*0.03);
    gomita({x:gx,y,s:0.42,t,color:PASTELES[(i+2)%6],disfraz:NARIZ_G,expr:p.expr,tilt:p.tilt*1.2,sq:p.sq,brazos:'cara',seed:i}); if(!fin) achu(t,tA+i*0.03,gx+40,y-110,1,0.45); });
  const rx=420, ry=yArco(rx,cy,R)+12; const p=poseAchu(t,tA);
  const c=fin?caida(t,sc.start+0.02,700):{alto:0,sq:0,wob:0};
  raro({x:rx,y:ry,s:1.15,t,disfraz:RF,expr:p.expr,tilt:p.tilt,sq:(p.sq||0)+c.sq,alto:c.alto,manos:p.manos,brazos:'idle',wob:c.wob});
  if(!fin){ achu(t,tA,rx+70,ry-300,1,1.4); if(t>=tA) ondaChoque(t,tA,rx+70,ry-300,'#FFFFFF'); }
  L2('¡TODOS A LA VEZ!','EL MUNDO CIERRA LOS OJOS',1,430,t,fin?sc.start:-1);
}
function S1(t,sc){ escenaGancho(t,sc,false); }
function S25(t,sc){ escenaGancho(t,sc,true); }
