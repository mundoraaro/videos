<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine.js"></script>
<script src="../../raro.js"></script>
<script>
// atacama-001 — ¿Qué pasaría si vivieras en el lugar más seco del mundo? (fórmula "¿qué pasaría si…?", 2ª persona)
// Disfraces: turista (playero) → científico → anciano → parka → turista → plomero (atrapanieblas) → astronauta → turista → científico → turista (loop).
// Encuadre: Raro siempre completo dentro de x≈20–940; letreros en y 390–520 (helper L); verificador CHECK en coordenadas de pantalla.
const PI2=Math.PI*2;
window.HIDE_CAPTIONS_LAST=false;
window.CAPTION_POP_MIN=0.85;

// ---------- captions en bloques de 2–3 palabras (v2: nunca una palabra vacía sola en pantalla) ----------
const _corta=w=>w.replace(/[¡!¿?.,:…"]/g,'').length<=3;
function buildChunks(){
  CH=[]; let cur=[];
  const len=c=>c.map(j=>W[j].t).join(' ').length;
  W.forEach((w,i)=>{ if(cur.length>=2 && (cur.map(j=>W[j].t).join(' ')+' '+w.t).length>17){ CH.push(cur); cur=[]; } cur.push(i); const fin=/[.,?!:…]$/.test(w.t);
    if(fin||cur.length>=3||len(cur)>16){
      // no cerrar un bloque con una palabra corta sin puntuación: pasa al siguiente
      if(!fin && cur.length>1 && _corta(w.t)){ cur.pop(); CH.push(cur); cur=[i]; }
      else { CH.push(cur); cur=[]; } } });
  if(cur.length) CH.push(cur);
  // un bloque de una sola palabra corta se une con el siguiente (o con el anterior)
  for(let c=0;c<CH.length;c++){ if(CH[c].length===1 && _corta(W[CH[c][0]].t)){
    if(c+1<CH.length && CH[c+1].length<=3){ CH[c+1]=CH[c].concat(CH[c+1]); CH.splice(c,1); c--; }
    else if(c>0 && CH[c-1].length<=3){ CH[c-1]=CH[c-1].concat(CH[c]); CH.splice(c,1); c--; } } }
}
// Igual que captions() del motor, pero las 2 primeras palabras de cada bloque aparecen juntas.
function captions(t){
  let ci=-1; for(let c=0;c<CH.length;c++){ if(W[CH[c][0]].s-0.05<=t) ci=c; }
  if(ci<0) return; const ch=CH[ci]; const last=W[ch[ch.length-1]];
  if(t>last.e+0.6 && (ci+1>=CH.length || t<W[CH[ci+1][0]].s-0.05)) return;
  const KW=window.KEYWORDS||[];
  let size=window.CAPTION_SIZE||80; const words=ch.map(i=>W[i].t.toUpperCase());
  const big=i=>KW.includes(i)?1.22:1;
  const widths=()=>ch.map((i,n)=>{ctx.font=fuente(size*big(i));return ctx.measureText(words[n]).width;});
  ctx.font=fuente(size); let sp=ctx.measureText(' ').width, ws=widths(), total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);
  if(total>800){size=Math.floor(size*800/total); ctx.font=fuente(size); sp=ctx.measureText(' ').width; ws=widths(); total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);}
  if(CAPPOS[ci]==null) CAPPOS[ci]=lugarCaption(total,size*1.25);
  const y=CAPPOS[ci]; let x=540-total/2; const s0=W[ch[0]].s-0.05;
  ctx.textBaseline='middle'; ctx.textAlign='center'; ctx.lineJoin='round';
  ch.forEach((i,n)=>{const w=words[n], wd=ws[n], kw=KW.includes(i); const ws_=n<2?Math.max(0,s0):W[i].s;
    const k=t<ws_?0:(kw?popIn(t,ws_,0.22):back((t-ws_)/0.16));
    if(k>0){ const sz=size*big(i); ctx.save(); ctx.translate(x+wd/2,y); const sc=lerp(window.CAPTION_POP_MIN??0.6,1,k); ctx.scale(sc,sc); if(kw) ctx.rotate(Math.sin(t*5+i)*0.03);
      ctx.font=fuente(sz); ctx.fillStyle='rgba(20,14,40,0.45)'; ctx.fillText(w,0,sz*0.09);
      ctx.lineWidth=sz*0.19; ctx.strokeStyle='#1E1A2E'; ctx.strokeText(w,0,0);
      ctx.fillStyle=kw?COL.lime:'#FFFFFF'; ctx.fillText(w,0,0); ctx.restore(); }
    x+=wd+sp*1.25;});
}

// ---------- verificador de encuadre (cajas en pantalla) ----------
window.CHECK=[];
const _raro=raro;
raro=function(o){ const s=o.s??1, m=ctx.getTransform(), alto=o.alto||0; const der=(o.brazos==='senala'||o.brazos==='saluda')?320:215, izq=215;
  const ex=(o.disfraz==='tardigrado'&&!(o.bolita>0.5))?255:0; let x0=-Math.max(izq,ex)*s, x1=Math.max(der,ex)*s; if(o.espejo){ const a=-x1; x1=-x0; x0=a; }
  const pts=[[o.x+x0,o.y-alto-470*s],[o.x+x1,o.y-alto-470*s],[o.x+x0,o.y-alto],[o.x+x1,o.y-alto]].map(([x,y])=>[m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f]);
  CHECK.push([o.color?'npc':'raro',Math.min(...pts.map(p=>p[0])),Math.min(...pts.map(p=>p[1])),Math.max(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[1]))]);
  return _raro(o); };
function chk(tag,x0,y0,x1,y1){ const m=ctx.getTransform(); const P=[[x0,y0],[x1,y0],[x0,y1],[x1,y1]].map(([x,y])=>[m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f]);
  CHECK.push([tag,Math.min(...P.map(p=>p[0])),Math.min(...P.map(p=>p[1])),Math.max(...P.map(p=>p[0])),Math.max(...P.map(p=>p[1]))]); }

// ---------- utilería ----------
let CUR=1;
// Letrero en coordenadas de PANTALLA, compensando el zoom de la toma (soplar-001-v2).
function L(txt,x,y,k,tipo='madera',opts={}){ const TM=(window.TOMAS||{})[CUR]||{}, Z=Math.max(1,TM.z||1), F=TM.foco||[540,960];
  let tam=(opts.tam||72)/Z; ctx.font=fuente(tam); let w=ctx.measureText(txt).width+tam*1.2; const maxW=680/Z;
  if(w>maxW){ tam*=maxW/w; w=maxW; } const sw=w*Z; x=clamp(x,180+sw/2,900-sw/2); y=clamp(y,390,520);
  const X=F[0]+(x-540)/Z, Y=F[1]+(y-960)/Z;
  letrero(txt,X,Y,k,tipo,{sinPalo:!opts.palo,...opts,tam}); if(k>0.5) chk('letrero',X-w/2,Y-tam*0.85,X+w/2,Y+tam*0.85); }
function calendario(x,y,s,k,t,t0,hasta,d,txt='DÍAS'){ if(k<=0) return; ocupa(x-120*s,y-150*s,x+120*s,y+140*s,1.1); chk('obj',x-120*s,y-160*s,x+120*s,y+140*s); ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle='#FFFFFF'; rr(-120,-140,240,280,22); ctx.fill(); ctx.fillStyle='#FF4D5E'; rr(-120,-140,240,70,22); ctx.fill(); ctx.fillRect(-120,-100,240,30);
  ctx.fillStyle='#8E8AA3'; for(const xx of [-60,60]){ rr(xx-10,-160,20,50,10); ctx.fill(); }
  const fl=((t-t0)*8)%1; if(t>t0 && t<t0+d){ ctx.save(); ctx.transform(1,0,0,1-fl,0,0); ctx.fillStyle='#F3EEFF'; rr(-110,-60,220,190,14); ctx.fill(); ctx.restore(); }
  ctx.fillStyle='#1E1A2E'; ctx.font=fuente(110); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(contador(t,t0,d,0,hasta),0,30);
  ctx.font=fuente(40); ctx.fillStyle='#FFFFFF'; ctx.fillText(txt,0,-104); ctx.restore(); }
function gotas(t,t0,x,y,n=12,dir=1){ if(t<t0) return; ctx.save(); for(let i=0;i<n;i++){ const u=((t-t0)*1.5+rand(i))%1, a=-Math.PI/2+(rand(i+2)-0.5)*2.4; const d=u*260;
  const xx=x+Math.cos(a)*d*dir, yy=y+Math.sin(a)*d+u*u*240; ctx.globalAlpha=1-u; ctx.fillStyle='#7FD8FF'; ctx.beginPath(); ctx.moveTo(xx,yy-16); ctx.quadraticCurveTo(xx+11,yy,xx,yy+8); ctx.quadraticCurveTo(xx-11,yy,xx,yy-16); ctx.fill(); } ctx.restore(); }
function gotaGrande(x,y,r,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.fillStyle='#5CC8FF'; ctx.beginPath(); ctx.moveTo(0,-r*1.6); ctx.quadraticCurveTo(r*1.1,-r*0.2,r,r*0.25); ctx.arc(0,r*0.25,r,0,Math.PI); ctx.quadraticCurveTo(-r*1.1,-r*0.2,0,-r*1.6); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(-r*0.35,-r*0.1,r*0.15,r*0.3,-0.3,0,PI2); ctx.fill(); ctx.restore(); }
function sol(x,y,r,t){ ctx.save(); ctx.translate(x,y); const g=ctx.createRadialGradient(0,0,r*0.5,0,0,r*1.8); g.addColorStop(0,'rgba(255,240,150,0.9)'); g.addColorStop(1,'rgba(255,240,150,0)'); ctx.fillStyle=g; blob(0,0,r*1.8);
  ctx.rotate(t*0.4); ctx.fillStyle='#FFD23F'; for(let i=0;i<12;i++){ ctx.save(); ctx.rotate(i/12*PI2); ctx.beginPath(); ctx.moveTo(-18,-r-10); ctx.lineTo(0,-r-60-Math.sin(t*6+i)*14); ctx.lineTo(18,-r-10); ctx.fill(); ctx.restore(); }
  ctx.fillStyle='#FFE45C'; blob(0,0,r); ctx.restore(); }
function rayosSol(t,x0,y0,x1,y1,k){ if(k<=0) return; ctx.save(); ctx.globalAlpha=0.55*k; ctx.strokeStyle='#FFE45C'; ctx.lineWidth=16; ctx.lineCap='round'; for(let i=0;i<5;i++){ const u=((t*2+i/5)%1); const xa=lerp(x0,x1,u), ya=lerp(y0,y1,u); ctx.beginPath(); ctx.moveTo(xa+(i-2)*40,ya); ctx.lineTo(xa+(i-2)*40+(x1-x0)*0.12,ya+(y1-y0)*0.12); ctx.stroke(); } ctx.restore(); }
function polvo(t,t0,x,y,k=1){ if(t<t0) return; const u=clamp((t-t0)/1.2); ctx.save(); ctx.globalAlpha=(1-u)*0.8*k; ctx.fillStyle='#F2EEFF'; for(let i=0;i<10;i++){ const a=Math.PI+rand(i)*Math.PI; blob(x+Math.cos(a)*u*360,y+Math.sin(a)*u*160,40+u*50); } ctx.restore(); }
function vaso(x,y,s,ang){ ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.scale(s,s); ctx.fillStyle='rgba(220,245,255,0.85)'; ctx.beginPath(); ctx.moveTo(-50,-70); ctx.lineTo(50,-70); ctx.lineTo(38,70); ctx.lineTo(-38,70); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=6; ctx.stroke(); ctx.restore(); }

// ====================== atacama-001: utilería propia ======================
function calAnio(x,y,s,k,t,t0,d,desde,hasta){ if(k<=0) return; ocupa(x-120*s,y-150*s,x+120*s,y+140*s,1.1); chk('obj',x-120*s,y-160*s,x+120*s,y+140*s); ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle='#FFFFFF'; rr(-120,-140,240,280,22); ctx.fill(); ctx.fillStyle='#FF4D5E'; rr(-120,-140,240,70,22); ctx.fill(); ctx.fillRect(-120,-100,240,30);
  ctx.fillStyle='#8E8AA3'; for(const xx of [-60,60]){ rr(xx-10,-160,20,50,10); ctx.fill(); }
  const fl=((t-t0)*9)%1; if(t>t0 && t<t0+d){ ctx.save(); ctx.transform(1,0,0,1-fl,0,0); ctx.fillStyle='#F3EEFF'; rr(-110,-60,220,190,14); ctx.fill(); ctx.restore(); }
  const v=Math.round(lerp(desde,hasta,easeOut(prog(t,t0,d))));
  ctx.fillStyle='#1E1A2E'; ctx.font=fuente(92); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(v),0,34);
  ctx.font=fuente(40); ctx.fillStyle='#FFFFFF'; ctx.fillText('AÑO',0,-104); ctx.restore(); }

// paraguas: (x,y) = mano; el mango sube y la tela queda arriba. o.cerrado 0..1, o.tela (color), o.adorno (moño y flores), o.viento
function paraguas(x,y,s,t,o={}){ const ang=(o.ang||0)+Math.sin(t*3)*0.04+(o.viento||0)*Math.sin(t*9)*0.12, cer=o.cerrado||0;
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.scale(s,s);
  ctx.strokeStyle='#5E3716'; ctx.lineWidth=14; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-330); ctx.stroke();
  ctx.beginPath(); ctx.arc(-22,0,22,0,Math.PI); ctx.stroke();
  const R=230*(1-cer*0.8), H=150*(1-cer*0.1), cA=o.tela||'#FF5FA2', cB='#D7FF3D';
  for(let i=0;i<6;i++){ const a0=-R+i*(2*R/6), a1=a0+2*R/6; ctx.fillStyle=i%2?cB:cA; ctx.beginPath(); ctx.moveTo(0,-330-H);
    ctx.quadraticCurveTo(a0*0.6,-330-H*0.9,a0,-330); ctx.quadraticCurveTo((a0+a1)/2,-300,a1,-330); ctx.quadraticCurveTo(a1*0.6,-330-H*0.9,0,-330-H); ctx.fill(); }
  ctx.fillStyle='#5E3716'; blob(0,-334-H,12);
  if(o.adorno){ ctx.fillStyle='#FFD23F'; for(let i=0;i<5;i++){ const xx=-R+30+i*(2*R-60)/4; ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(xx,-326); ctx.lineTo(xx,-276); ctx.stroke(); ctx.fillStyle=i%2?'#4CC9F0':'#FFD23F'; blob(xx,-262,18); }
    ctx.fillStyle='#FF4D5E'; ctx.beginPath(); ctx.moveTo(0,-200); ctx.lineTo(-50,-230); ctx.lineTo(-50,-170); ctx.closePath(); ctx.moveTo(0,-200); ctx.lineTo(50,-230); ctx.lineTo(50,-170); ctx.closePath(); ctx.fill(); blob(0,-200,12); }
  ctx.restore(); ocupa(x-R*s,y-(330+H)*s,x+R*s,y-300*s,1.0); chk('obj',x-R*s,y-(340+H)*s,x+R*s,y); }
function nubeLluvia(x,y,s,t,k=1,gris=true){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); ctx.fillStyle=gris?'#B9B3D6':'#FFFFFF'; nube(0,0,1.6); ctx.fillStyle=gris?'#D9D4EE':'#FFFFFF'; blob(-40,-40,60); ctx.restore(); }
function lluvia(t,k,x0,x1,y0,y1,n=40){ if(k<=0) return; ctx.save(); ctx.strokeStyle='rgba(200,240,255,0.85)'; ctx.lineWidth=7; ctx.lineCap='round';
  for(let i=0;i<n;i++){ const x=x0+rand(i)*(x1-x0), sp=1.4+rand(i+5); const u=((t*sp+rand(i+9))%1); const y=lerp(y0,y1,u); ctx.globalAlpha=k*0.9; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-10,y+50); ctx.stroke(); } ctx.restore(); }
function solGrande(x,y,r,t){ sol(x,y,r,t); ctx.save(); ctx.translate(x,y); ctx.fillStyle='#1E1A2E'; for(const s of [-1,1]){ ctx.beginPath(); ctx.ellipse(s*r*0.3,-r*0.1,r*0.08,r*0.12,0,0,PI2); ctx.fill(); }
  ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=r*0.06; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(0,r*0.15,r*0.3,0.2,Math.PI-0.2); ctx.stroke(); ctx.restore(); }
function nubecita(t,t0,x,y,se){ // nube que llega y se evapora (puf) en t0
  if(t>t0+0.5) return; const u=t<t0?0:prog(t,t0,0.5); ctx.save(); ctx.globalAlpha=1-u; ctx.translate(x+Math.sin(t*2)*20,y); ctx.scale(0.8+u*0.6,0.8+u*0.6); ctx.fillStyle='#FFFFFF'; nube(0,0,0.9); ctx.restore();
  if(t>=t0 && se) chispas(t,t0,x,y,1.1,'#FFFFFF'); }
function grietas(y0,c,alpha=0.6){ ctx.save(); ctx.strokeStyle=c; ctx.globalAlpha=alpha; ctx.lineWidth=6; ctx.lineCap='round'; for(let i=0;i<7;i++){ const x=80+i*150+rand(i)*40, y=y0+40+rand(i+2)*300; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+40,y+30); ctx.lineTo(x+20,y+70); ctx.moveTo(x+40,y+30); ctx.lineTo(x+90,y+20); ctx.stroke(); } ctx.restore(); }
function pluviometro(x,y,s,k,nivel,t,telas){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); ocupa(-70,-330,70,0,1.1);
  ctx.fillStyle='#8E8AA3'; rr(-14,-120,28,120,10); ctx.fill();
  ctx.fillStyle='rgba(220,245,255,0.75)'; rr(-50,-320,100,210,20); ctx.fill(); ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=6; ctx.stroke();
  ctx.fillStyle='#C9D3E6'; ctx.beginPath(); ctx.moveTo(-80,-340); ctx.lineTo(80,-340); ctx.lineTo(50,-310); ctx.lineTo(-50,-310); ctx.closePath(); ctx.fill();
  if(nivel>0){ ctx.fillStyle='#3AB6FF'; rr(-44,-116-nivel*190,88,nivel*190+2,6); ctx.fill(); }
  ctx.strokeStyle='#1C79D2'; ctx.lineWidth=4; for(let i=1;i<8;i++){ ctx.beginPath(); ctx.moveTo(-50,-116-i*24); ctx.lineTo(-30,-116-i*24); ctx.stroke(); }
  if(telas){ ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=3; for(let i=0;i<6;i++){ const a=i/6*Math.PI; ctx.beginPath(); ctx.moveTo(50,-320); ctx.lineTo(50+Math.cos(a)*90,-320+Math.sin(a)*90); ctx.stroke(); } for(const r of [30,60,85]){ ctx.beginPath(); ctx.arc(50,-320,r,0,Math.PI); ctx.stroke(); } }
  ctx.restore(); chk('obj',x-80*s,y-345*s,x+(telas?145:80)*s,y); }
function caseta(x,y,s,t){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ocupa(-130,-560,130,0,1.1);
  ctx.fillStyle='#8E8AA3'; for(const xx of [-90,90]) { rr(xx-12,-260,24,260,10); ctx.fill(); }
  ctx.fillStyle='#FFFFFF'; rr(-130,-470,260,220,16); ctx.fill(); ctx.fillStyle='#E4E0F2'; for(let i=0;i<6;i++){ ctx.fillRect(-110,-450+i*34,220,12); }
  ctx.fillStyle='#F3EEFF'; ctx.beginPath(); ctx.moveTo(-150,-470); ctx.lineTo(0,-540); ctx.lineTo(150,-470); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.translate(0,-560); ctx.strokeStyle='#5C6E90'; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(0,20); ctx.lineTo(0,-60); ctx.stroke(); ctx.rotate(t*6);
  for(let i=0;i<3;i++){ ctx.rotate(PI2/3); ctx.beginPath(); ctx.moveTo(0,-60); ctx.lineTo(54,-60); ctx.stroke(); ctx.fillStyle='#FF5FA2'; blob(60,-60,16); } ctx.restore();
  ctx.restore(); chk('obj',x-150*s,y-640*s,x+150*s,y); }
function cantimplora(x,y,s,ang){ ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.scale(s,s); ctx.fillStyle='#4CA36B'; blob(0,0,70); ctx.fillStyle='#3A8456'; rr(-70,-12,140,24,12); ctx.fill(); ctx.fillStyle='#8E8AA3'; rr(-18,-96,36,34,8); ctx.fill(); ctx.restore(); }
// atrapanieblas: malla en marco con canaleta; gotas que bajan (k = aparición, moja 0..1)
function malla(x,y,w,h,k,t,moja=0){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(1,k); ocupa(-w/2-20,-h-260,w/2+20,0,1.0);
  ctx.fillStyle='#5E3716'; for(const xx of [-w/2,w/2]){ rr(xx-14,-h-260,28,h+260,12); ctx.fill(); }
  ctx.fillStyle='rgba(30,26,46,0.25)'; ctx.fillRect(-w/2,-h-240,w,h);
  ctx.strokeStyle='rgba(255,255,255,0.75)'; ctx.lineWidth=3; for(let xx=-w/2;xx<=w/2;xx+=18){ ctx.beginPath(); ctx.moveTo(xx,-h-240); ctx.lineTo(xx,-240); ctx.stroke(); } for(let yy=-h-240;yy<=-240;yy+=18){ ctx.beginPath(); ctx.moveTo(-w/2,yy); ctx.lineTo(w/2,yy); ctx.stroke(); }
  ctx.fillStyle='#3AB6FF'; rr(-w/2-10,-252,w+20,26,13); ctx.fill();
  if(moja>0){ for(let i=0;i<Math.round(14*moja);i++){ const xx=-w/2+20+rand(i)*(w-40), u=((t*0.9+rand(i+3))%1); gotaGrande(xx,-h-240+u*h,9,1); } }
  ctx.restore(); chk('obj',x-w/2-20,y-(h+260)*k,x+w/2+20,y); }
function neblina(t,x,y,s,a=0.9){ ctx.save(); ctx.globalAlpha=a; ctx.fillStyle='#FFFFFF'; ctx.translate(x,y); ctx.scale(s,s); nube(0,0,1.3); nube(150,30,1.0); ctx.restore(); }
function garrafita(x,y,s,k,t,i){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(t*4+i)*0.06); ctx.scale(s*k,s*k);
