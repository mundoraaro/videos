<script>
// estacion-001 — ¿Qué pasaría si vivieras en la Estación Espacial? (fórmula "¿qué pasaría si…?", 2ª persona)
// Disfraces: tripulante (polo azul) → astronauta (afuera) → tripulante → piyama + saco → astronauta → tripulante → astronauta (regreso) → tripulante (loop).
// Encuadre: Raro completo dentro de x≈20–940; letreros en y 390–520 (helper L); verificador CHECK en coordenadas de pantalla.
const PI2=Math.PI*2;
window.HIDE_CAPTIONS_LAST=false;
window.CAPTION_POP_MIN=0.85;

// ---------- captions en bloques de 2–3 palabras (v2: nunca una palabra vacía sola en pantalla) ----------
const _corta=w=>w.replace(/[¡!¿?.,:…"]/g,'').length<=3;
function buildChunks(){
  CH=[]; let cur=[];
  const len=c=>c.map(j=>W[j].t).join(' ').length;
  W.forEach((w,i)=>{ if(cur.length>=2 && (cur.map(j=>W[j].t).join(' ')+' '+w.t).length>17){ CH.push(cur); cur=[]; } cur.push(i); const fin=/[.,?!:…]$/.test(w.t);
    if(fin||cur.length>=3||len(cur)>16){
      // no cerrar un bloque con una palabra corta sin puntuación: pasa al siguiente
      if(!fin && cur.length>1 && _corta(w.t)){ cur.pop(); CH.push(cur); cur=[i]; }
      else { CH.push(cur); cur=[]; } } });
  if(cur.length) CH.push(cur);
  // un bloque de una sola palabra corta se une con el siguiente (o con el anterior)
  for(let c=0;c<CH.length;c++){ if(CH[c].length===1 && _corta(W[CH[c][0]].t)){
    if(c+1<CH.length && CH[c+1].length<=3){ CH[c+1]=CH[c].concat(CH[c+1]); CH.splice(c,1); c--; }
    else if(c>0 && CH[c-1].length<=3){ CH[c-1]=CH[c-1].concat(CH[c]); CH.splice(c,1); c--; } } }
}
// Igual que captions() del motor, pero las 2 primeras palabras de cada bloque aparecen juntas.
function captions(t){
  let ci=-1; for(let c=0;c<CH.length;c++){ if(W[CH[c][0]].s-0.05<=t) ci=c; }
  if(ci<0) return; const ch=CH[ci]; const last=W[ch[ch.length-1]];
  if(t>last.e+0.6 && (ci+1>=CH.length || t<W[CH[ci+1][0]].s-0.05)) return;
  const KW=window.KEYWORDS||[];
  let size=window.CAPTION_SIZE||80; const words=ch.map(i=>W[i].t.toUpperCase());
  const big=i=>KW.includes(i)?1.22:1;
  const widths=()=>ch.map((i,n)=>{ctx.font=fuente(size*big(i));return ctx.measureText(words[n]).width;});
  ctx.font=fuente(size); let sp=ctx.measureText(' ').width, ws=widths(), total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);
  if(total>800){size=Math.floor(size*800/total); ctx.font=fuente(size); sp=ctx.measureText(' ').width; ws=widths(); total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);}
  if(CAPPOS[ci]==null) CAPPOS[ci]=lugarCaption(total,size*1.25);
  const y=CAPPOS[ci]; let x=540-total/2; const s0=W[ch[0]].s-0.05;
  ctx.textBaseline='middle'; ctx.textAlign='center'; ctx.lineJoin='round';
  ch.forEach((i,n)=>{const w=words[n], wd=ws[n], kw=KW.includes(i); const ws_=n<2?Math.max(0,s0):W[i].s;
    const k=t<ws_?0:(kw?popIn(t,ws_,0.22):back((t-ws_)/0.16));
    if(k>0){ const sz=size*big(i); ctx.save(); ctx.translate(x+wd/2,y); const sc=lerp(window.CAPTION_POP_MIN??0.6,1,k); ctx.scale(sc,sc); if(kw) ctx.rotate(Math.sin(t*5+i)*0.03);
      ctx.font=fuente(sz); ctx.fillStyle='rgba(20,14,40,0.45)'; ctx.fillText(w,0,sz*0.09);
      ctx.lineWidth=sz*0.19; ctx.strokeStyle='#1E1A2E'; ctx.strokeText(w,0,0);
      ctx.fillStyle=kw?COL.lime:'#FFFFFF'; ctx.fillText(w,0,0); ctx.restore(); }
    x+=wd+sp*1.25;});
}

// ---------- verificador de encuadre (cajas en pantalla) ----------
window.CHECK=[];
const _raro=raro;
raro=function(o){ const s=o.s??1, m=ctx.getTransform(), alto=o.alto||0; const der=(o.brazos==='senala'||o.brazos==='saluda')?320:215, izq=215;
  const ex=(o.disfraz==='tardigrado'&&!(o.bolita>0.5))?255:0; let x0=-Math.max(izq,ex)*s, x1=Math.max(der,ex)*s; if(o.espejo){ const a=-x1; x1=-x0; x0=a; }
  const pts=[[o.x+x0,o.y-alto-470*s],[o.x+x1,o.y-alto-470*s],[o.x+x0,o.y-alto],[o.x+x1,o.y-alto]].map(([x,y])=>[m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f]);
  CHECK.push([o.color?'npc':'raro',Math.min(...pts.map(p=>p[0])),Math.min(...pts.map(p=>p[1])),Math.max(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[1]))]);
  return _raro(o); };
function chk(tag,x0,y0,x1,y1){ const m=ctx.getTransform(); const P=[[x0,y0],[x1,y0],[x0,y1],[x1,y1]].map(([x,y])=>[m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f]);
  CHECK.push([tag,Math.min(...P.map(p=>p[0])),Math.min(...P.map(p=>p[1])),Math.max(...P.map(p=>p[0])),Math.max(...P.map(p=>p[1]))]); }

// ---------- utilería ----------
let CUR=1;
// Letrero en coordenadas de PANTALLA, compensando el zoom de la toma (soplar-001-v2).
function L(txt,x,y,k,tipo='madera',opts={}){ const TM=(window.TOMAS||{})[CUR]||{}, Z=Math.max(1,TM.z||1), F=TM.foco||[540,960];
  let tam=(opts.tam||72)/Z; ctx.font=fuente(tam); let w=ctx.measureText(txt).width+tam*1.2; const maxW=680/Z;
  if(w>maxW){ tam*=maxW/w; w=maxW; } const sw=w*Z; x=clamp(x,180+sw/2,900-sw/2); y=clamp(y,390,520);
  const X=F[0]+(x-540)/Z, Y=F[1]+(y-960)/Z;
  letrero(txt,X,Y,k,tipo,{sinPalo:!opts.palo,...opts,tam}); if(k>0.5) chk('letrero',X-w/2,Y-tam*0.85,X+w/2,Y+tam*0.85); }
function calendario(x,y,s,k,t,t0,hasta,d,txt='DÍAS'){ if(k<=0) return; ocupa(x-120*s,y-150*s,x+120*s,y+140*s,1.1); chk('obj',x-120*s,y-160*s,x+120*s,y+140*s); ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle='#FFFFFF'; rr(-120,-140,240,280,22); ctx.fill(); ctx.fillStyle='#FF4D5E'; rr(-120,-140,240,70,22); ctx.fill(); ctx.fillRect(-120,-100,240,30);
  ctx.fillStyle='#8E8AA3'; for(const xx of [-60,60]){ rr(xx-10,-160,20,50,10); ctx.fill(); }
  const fl=((t-t0)*8)%1; if(t>t0 && t<t0+d){ ctx.save(); ctx.transform(1,0,0,1-fl,0,0); ctx.fillStyle='#F3EEFF'; rr(-110,-60,220,190,14); ctx.fill(); ctx.restore(); }
  ctx.fillStyle='#1E1A2E'; ctx.font=fuente(110); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(contador(t,t0,d,0,hasta),0,30);
  ctx.font=fuente(40); ctx.fillStyle='#FFFFFF'; ctx.fillText(txt,0,-104); ctx.restore(); }
function gotas(t,t0,x,y,n=12,dir=1){ if(t<t0) return; ctx.save(); for(let i=0;i<n;i++){ const u=((t-t0)*1.5+rand(i))%1, a=-Math.PI/2+(rand(i+2)-0.5)*2.4; const d=u*260;
  const xx=x+Math.cos(a)*d*dir, yy=y+Math.sin(a)*d+u*u*240; ctx.globalAlpha=1-u; ctx.fillStyle='#7FD8FF'; ctx.beginPath(); ctx.moveTo(xx,yy-16); ctx.quadraticCurveTo(xx+11,yy,xx,yy+8); ctx.quadraticCurveTo(xx-11,yy,xx,yy-16); ctx.fill(); } ctx.restore(); }
function gotaGrande(x,y,r,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.fillStyle='#5CC8FF'; ctx.beginPath(); ctx.moveTo(0,-r*1.6); ctx.quadraticCurveTo(r*1.1,-r*0.2,r,r*0.25); ctx.arc(0,r*0.25,r,0,Math.PI); ctx.quadraticCurveTo(-r*1.1,-r*0.2,0,-r*1.6); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(-r*0.35,-r*0.1,r*0.15,r*0.3,-0.3,0,PI2); ctx.fill(); ctx.restore(); }
function sol(x,y,r,t){ ctx.save(); ctx.translate(x,y); const g=ctx.createRadialGradient(0,0,r*0.5,0,0,r*1.8); g.addColorStop(0,'rgba(255,240,150,0.9)'); g.addColorStop(1,'rgba(255,240,150,0)'); ctx.fillStyle=g; blob(0,0,r*1.8);
  ctx.rotate(t*0.4); ctx.fillStyle='#FFD23F'; for(let i=0;i<12;i++){ ctx.save(); ctx.rotate(i/12*PI2); ctx.beginPath(); ctx.moveTo(-18,-r-10); ctx.lineTo(0,-r-60-Math.sin(t*6+i)*14); ctx.lineTo(18,-r-10); ctx.fill(); ctx.restore(); }
  ctx.fillStyle='#FFE45C'; blob(0,0,r); ctx.restore(); }
function rayosSol(t,x0,y0,x1,y1,k){ if(k<=0) return; ctx.save(); ctx.globalAlpha=0.55*k; ctx.strokeStyle='#FFE45C'; ctx.lineWidth=16; ctx.lineCap='round'; for(let i=0;i<5;i++){ const u=((t*2+i/5)%1); const xa=lerp(x0,x1,u), ya=lerp(y0,y1,u); ctx.beginPath(); ctx.moveTo(xa+(i-2)*40,ya); ctx.lineTo(xa+(i-2)*40+(x1-x0)*0.12,ya+(y1-y0)*0.12); ctx.stroke(); } ctx.restore(); }
function polvo(t,t0,x,y,k=1){ if(t<t0) return; const u=clamp((t-t0)/1.2); ctx.save(); ctx.globalAlpha=(1-u)*0.8*k; ctx.fillStyle='#F2EEFF'; for(let i=0;i<10;i++){ const a=Math.PI+rand(i)*Math.PI; blob(x+Math.cos(a)*u*360,y+Math.sin(a)*u*160,40+u*50); } ctx.restore(); }
function vaso(x,y,s,ang){ ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.scale(s,s); ctx.fillStyle='rgba(220,245,255,0.85)'; ctx.beginPath(); ctx.moveTo(-50,-70); ctx.lineTo(50,-70); ctx.lineTo(38,70); ctx.lineTo(-38,70); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=6; ctx.stroke(); ctx.restore(); }


// ====================== estacion-001: fondos propios (3+ capas) ======================
function ventanaTierra(x,y,r,t,sol=0){ ctx.save(); ctx.fillStyle='#8E8AA3'; blob(x,y,r+34); ctx.fillStyle='#C9CFDA'; blob(x,y,r+18);
  ctx.beginPath(); ctx.arc(x,y,r,0,PI2); ctx.clip(); const g=ctx.createLinearGradient(x,y-r,x,y+r); g.addColorStop(0,'#3B2A8F'); g.addColorStop(1,'#5A3FD0'); ctx.fillStyle=g; ctx.fillRect(x-r,y-r,2*r,2*r);
  ctx.fillStyle='#FFFFFF'; for(let i=0;i<10;i++){ ctx.globalAlpha=0.5+0.5*Math.sin(t*3+i); blob(x-r+rand(i+50)*2*r,y-r+rand(i+60)*r,3); } ctx.globalAlpha=1;
  tierra(x+r*0.2,y+r*1.25,r*1.05,t,true);
  if(sol>0){ ctx.globalAlpha=sol; const gs=ctx.createRadialGradient(x-r*0.5,y+r*0.25,4,x-r*0.5,y+r*0.25,r*1.2); gs.addColorStop(0,'rgba(255,250,200,1)'); gs.addColorStop(1,'rgba(255,220,120,0)'); ctx.fillStyle=gs; ctx.fillRect(x-r,y-r,2*r,2*r); ctx.globalAlpha=1; }
  ctx.restore(); ctx.save(); ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.ellipse(x-r*0.45,y-r*0.5,r*0.25,r*0.1,-0.6,0,PI2); ctx.fill(); ctx.restore(); }
let SOL_VENTANA=0;
function solV(t){ let n=1; for(let i=0;i<SC.length;i++) if(t>=SC[i].start) n=i+1; return n===13?0.5+0.5*Math.sin(t*9):(n===15?0.5+0.5*Math.sin(t*14):0); }
function zzz(t,x,y,i=0){ ctx.save(); ctx.fillStyle='#FFFFFF'; ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=8; ctx.font=fuente(54); ctx.textAlign='center'; for(let k=0;k<3;k++){ const u=((t*0.8+k/3+i*0.3)%1); ctx.globalAlpha=1-u; ctx.strokeText('z',x+u*50+k*14,y-u*110); ctx.fillText('z',x+u*50+k*14,y-u*110); } ctx.restore(); }
EXTRA_FONDOS.estacion=function(t,P,px){ // módulo de la estación: tubo con paneles, ventana redonda con la Tierra, pasamanos y cables
  ctx.fillStyle=P.claro; ctx.fillRect(-300,-300,1680,2520);
  ctx.fillStyle=mix(P.claro,P.medio,0.55); for(let r=0;r<5;r++) for(let i=-1;i<6;i++){ rr(-60+i*230+px(0.2)%230+(r%2)*115,240+r*250,200,210,30); ctx.fill(); }
  ctx.fillStyle=P.medio; ctx.beginPath(); ctx.ellipse(540+px(0.3),-40,1100,330,0,0,PI2); ctx.fill(); ctx.beginPath(); ctx.ellipse(540+px(0.3),1960,1100,330,0,0,PI2); ctx.fill();
  ventanaTierra(780+px(0.35),760,150,t,solV(t));
  ctx.strokeStyle=P.oscuro; ctx.lineWidth=22; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-100,1180+px(0.1)*0); ctx.lineTo(1180,1180); ctx.stroke();
  for(let i=0;i<6;i++){ ctx.beginPath(); ctx.moveTo(-40+i*220+px(0.5)%220,1180); ctx.lineTo(-40+i*220+px(0.5)%220,1220); ctx.stroke(); }
  ctx.fillStyle=mix(P.oscuro,P.medio,0.3); ctx.fillRect(-300,1500,1680,700);
  for(let i=0;i<7;i++){ ctx.fillStyle=['#FF4D6D','#D7FF3D','#4CC9F0'][i%3]; ctx.globalAlpha=0.6+0.4*Math.sin(t*4+i*1.7); blob(80+i*150+px(0.4)%150,300,9); } ctx.globalAlpha=1;
  ctx.strokeStyle=mix(P.oscuro,'#1E1A2E',0.15); ctx.lineWidth=14; ctx.beginPath(); ctx.moveTo(-80,140); ctx.bezierCurveTo(300+px(0.8),260+Math.sin(t)*10,700+px(0.8),120,1200,240); ctx.stroke();
};
EXTRA_FONDOS.modulo=function(t,P,px){ // laboratorio: casilleros, escotilla redonda al fondo, luces que parpadean
  ctx.fillStyle=P.claro; ctx.fillRect(-300,-300,1680,2520);
  ctx.fillStyle=P.medio; blob(540+px(0.2),820,300); ctx.fillStyle=mix(P.claro,'#FFFFFF',0.35); blob(540+px(0.2),820,230); ctx.fillStyle=mix(P.claro,P.medio,0.25); blob(540+px(0.2),820,150);
  for(const sx of [-1,1]){ for(let r=0;r<6;r++){ const x=540+sx*460+px(0.45), y=260+r*200; ctx.fillStyle=mix(P.medio,P.oscuro,r%2?0.2:0); rr(x-170,y,340,180,26); ctx.fill();
    ctx.fillStyle=mix(P.claro,'#FFFFFF',0.3); rr(x-140,y+30,120,26,10); ctx.fill(); ctx.fillStyle=['#D7FF3D','#FF4D6D','#4CC9F0'][(r+(sx>0))%3]; ctx.globalAlpha=0.5+0.5*Math.sin(t*5+r+sx); blob(x+110,y+44,12); ctx.globalAlpha=1; } }
  ctx.fillStyle=P.oscuro; ctx.fillRect(-300,1500,1680,700); ctx.fillStyle=mix(P.oscuro,P.medio,0.4); ctx.fillRect(-300,1500,1680,26);
};
EXTRA_FONDOS.cocina=function(t,P,px){ // cocina de la estación: gabinetes con correas, bolsitas de comida pegadas con velcro
  ctx.fillStyle=mix(P.claro,'#FFFFFF',0.2); ctx.fillRect(-300,-300,1680,2520);
  ctx.fillStyle=P.medio; for(let i=0;i<5;i++){ rr(-80+i*260+px(0.3),300,230,520,30); ctx.fill(); }
  ctx.fillStyle=mix(P.claro,'#FFFFFF',0.4); for(let i=0;i<5;i++){ for(let k=0;k<3;k++){ rr(-50+i*260+px(0.3),340+k*160,170,110,18); ctx.fill(); ctx.fillStyle=['#FF8A3D','#D7FF3D','#FF5FA2'][(i+k)%3]; rr(-10+i*260+px(0.3),370+k*160,90,50,10); ctx.fill(); ctx.fillStyle=mix(P.claro,'#FFFFFF',0.4); } }
  ctx.fillStyle=P.oscuro; ctx.fillRect(-300,1500,1680,700); ctx.fillStyle=mix(P.oscuro,P.medio,0.3); rr(-300+px(0.6),1080,1680,60,20); ctx.fill();
};
EXTRA_FONDOS.casa=function(t,P,px){ // cocina de tu casa: azulejos, ventana con cielo, barra
  ctx.fillStyle=mix(P.claro,'#FFFFFF',0.15); ctx.fillRect(-300,-300,1680,2520);
  ctx.fillStyle=mix(P.claro,P.medio,0.3); for(let r=0;r<12;r++) for(let i=-1;i<12;i++){ if((r+i)%2) { ctx.fillRect(-60+i*110+px(0.2)%110,700+r*110,110,110); } }
  ctx.fillStyle=P.oscuro; rr(560+px(0.3),760,300,260,26); ctx.fill(); ctx.fillStyle='#AEE6FF'; rr(580+px(0.3),780,260,220,18); ctx.fill(); ctx.fillStyle='#FFFFFF'; nube(700+px(0.3)+Math.sin(t)*20,880,0.5);
  ctx.fillStyle=P.oscuro; ctx.fillRect(-300,1440,1680,800); ctx.fillStyle=mix(P.oscuro,'#FFFFFF',0.15); ctx.fillRect(-300,1440,1680,24);
};
EXTRA_FONDOS.orbita=function(t,P,px){ // espacio de dulce: degradado, estrellas que titilan
  const g=ctx.createLinearGradient(0,0,0,1920); g.addColorStop(0,P.oscuro); g.addColorStop(1,P.medio); ctx.fillStyle=g; ctx.fillRect(-300,-300,1680,2520);
  for(let i=0;i<70;i++){ const x=((rand(i)*1400+px(0.15))%1400)-160, y=rand(i+9)*1920, r=2+rand(i+3)*5; ctx.globalAlpha=0.45+0.55*Math.sin(t*3+i); ctx.fillStyle=P.claro; blob(x,y,r); } ctx.globalAlpha=1;
  ctx.fillStyle=mix(P.medio,P.claro,0.3); ctx.globalAlpha=0.5; blob(140+px(0.3),360,60); ctx.globalAlpha=1;
};

// ====================== utilería propia ======================
function tierra(x,y,r,t,sinGlow){ ctx.save(); if(!sinGlow){ const g=ctx.createRadialGradient(x,y,r*0.9,x,y,r*1.25); g.addColorStop(0,'rgba(127,216,255,0.8)'); g.addColorStop(1,'rgba(127,216,255,0)'); ctx.fillStyle=g; blob(x,y,r*1.25); }
  ctx.fillStyle='#3AB6FF'; blob(x,y,r); ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,PI2); ctx.clip();
  const sp=t*0.05*r; ctx.fillStyle='#5CD67A'; for(let i=0;i<7;i++){ const xx=x-r+(((rand(i)*2.4*r+sp)%(2.4*r))) - 0.2*r, yy=y-r*0.8+rand(i+7)*r*1.6; blob(xx,yy,r*(0.18+rand(i+3)*0.2)); blob(xx+r*0.15,yy+r*0.1,r*0.14); }
  ctx.fillStyle='rgba(255,255,255,0.85)'; for(let i=0;i<6;i++){ const xx=x-r+(((rand(i+20)*2.4*r+sp*1.6)%(2.4*r)))-0.2*r, yy=y-r*0.9+rand(i+27)*r*1.8; ctx.beginPath(); ctx.ellipse(xx,yy,r*0.22,r*0.05,0,0,PI2); ctx.fill(); }
  ctx.fillStyle='rgba(30,26,80,0.25)'; ctx.beginPath(); ctx.arc(x+r*0.35,y+r*0.2,r*1.05,0,PI2); ctx.fill(); ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.ellipse(x-r*0.45,y-r*0.5,r*0.25,r*0.1,-0.6,0,PI2); ctx.fill(); ctx.restore(); }
// la Estación Espacial de dulce: armazón, módulos blancos y 4 paneles solares
function iss(x,y,s,t,rot=0){ ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s,s);
  ctx.fillStyle='#8E8AA3'; rr(-330,-12,660,24,10); ctx.fill();
  for(const sx of [-1,1]) for(const k of [0,1]){ const px=sx*(170+k*120); ctx.fillStyle='#8E8AA3'; ctx.fillRect(px-4,-140,8,280);
    for(const sy of [-1,1]){ ctx.fillStyle='#2F6FE0'; rr(px-45,sy>0?20:-150,90,130,8); ctx.fill(); ctx.strokeStyle='#7FD8FF'; ctx.lineWidth=3; for(let g=1;g<4;g++){ ctx.beginPath(); ctx.moveTo(px-45,(sy>0?20:-150)+g*32); ctx.lineTo(px+45,(sy>0?20:-150)+g*32); ctx.stroke(); } } }
  ctx.fillStyle='#FAF7F2'; rr(-110,-38,220,76,36); ctx.fill(); ctx.fillStyle='#E4E0F2'; rr(-36,-90,72,180,34); ctx.fill(); ctx.fillStyle='#FAF7F2'; rr(-28,-84,56,168,28); ctx.fill();
