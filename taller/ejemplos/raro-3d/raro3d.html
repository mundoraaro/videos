<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="g" width="540" height="960"></canvas>
<script>
// PROTOTIPO 3D de Raro (raymarching de SDF en WebGL2, sin librerías). Mismo diseño: frijol blanco cálido, sombreado de 2 tonos,
// brillo de vinil, ojos ovalados negros con brillo, cejas flotantes, bufanda lima, contraluz complementario, fondo de dulce.
const FS = `#version 300 es
precision highp float;
uniform vec2 R; uniform float T; uniform vec3 BG, BGD, RIM; uniform float EXPR, SQ;
out vec4 o;
float sdE(vec3 p, vec3 r){ float k0=length(p/r), k1=length(p/(r*r)); return k0*(k0-1.0)/k1; }
float sdCap(vec3 p, vec3 a, vec3 b, float r){ vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-r; }
float smin(float a,float b,float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }
float sdTor(vec3 p, float R_, float r){ vec2 q=vec2(length(p.xz)-R_,p.y); return length(q)-r; }
vec2 U(vec2 a, vec2 b){ return a.x<b.x?a:b; }
// materiales: 1 piel, 2 ojos, 3 bufanda, 4 suelo, 5 tinta (cejas/boca)
vec2 map(vec3 p){
  float br=1.0+0.012*sin(T*2.6);
  vec3 q=p; q.y/= (1.0-0.3*SQ)*br; q.xz/= (1.0+0.3*SQ);
  float body=smin(sdE(q-vec3(0,1.32,0),vec3(.60,.62,.52)), sdE(q-vec3(0,.78,0),vec3(.68,.66,.58)), .35);
  float arms=1e9;
  for(int i=0;i<2;i++){ float s=i==0?-1.:1.; float sw=sin(T*2.2+s)*.05;
    vec3 sh=vec3(s*.62,.92,.05), hd=vec3(s*.88,.52+sw,.12);
    arms=min(arms, sdCap(q,sh,mix(sh,hd,.5)+vec3(s*.08,-.02,0.),.085)); arms=min(arms, sdCap(q,mix(sh,hd,.5)+vec3(s*.08,-.02,0.),hd,.085)); arms=min(arms,length(q-hd)-.12);
    arms=min(arms, sdCap(q,vec3(s*.26,.2,0.),vec3(s*.3,.06,.04),.1)); arms=min(arms, sdE(q-vec3(s*.32,.05,.09),vec3(.17,.08,.2))); }
  vec2 res=vec2(smin(body,arms,.06),1.);
  // ojos
  float ey=1.36, es=EXPR>.5?1.6:1.0;
  for(int i=0;i<2;i++){ float s=i==0?-1.:1.; float bl=smoothstep(.0,.06,abs(fract(T*.33)-.5)-.0);
    float e=sdE(q-vec3(s*.22,ey,.5),vec3(.085*es,.13*es*max(bl,.08),.07)); res=U(res,vec2(e,2.));
    float b=sdCap(q,vec3(s*.14,ey+.24+.08*(es-1.),.5),vec3(s*.31,ey+.25+.08*(es-1.)-s*0.0,.47),.028); res=U(res,vec2(b,5.)); }
  // boca
  float m= EXPR>.5? sdE(q-vec3(0,1.1,.56),vec3(.06,.08,.05)) : sdCap(q,vec3(-.07,1.12,.57),vec3(.07,1.12,.57),.022);
  res=U(res,vec2(m,5.));
  // bufanda: anillo + nudo + colas que ondean
  vec3 sq=q-vec3(0,1.02,0); sq.y+= .06*sq.x*sq.x;
  float sc=sdTor(sq*vec3(1.,1.,1.15),.62,.1);
  sc=smin(sc,length(q-vec3(.34,.98,.48))-.12,.05);
  for(int i=0;i<2;i++){ float f=float(i); vec3 a=vec3(.36+f*.05,.95,.5), b=vec3(.48+f*.12+sin(T*3.+f)*.06,.55+f*.08,.5+sin(T*2.4+f)*.05);
    sc=min(sc,sdCap(q,a,b,.075)); }
  res=U(res,vec2(sc,3.));
  res=U(res,vec2(p.y,4.));
  return res;
}
vec3 nor(vec3 p){ vec2 e=vec2(.0015,0); return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x)); }
float sombra(vec3 ro, vec3 rd){ float r=1., t=.02; for(int i=0;i<40;i++){ float h=map(ro+rd*t).x; r=min(r,10.*h/t); t+=clamp(h,.02,.2); if(r<.001||t>4.) break; } return clamp(r,0.,1.); }
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;
  float a=.35*sin(T*.4);
  vec3 ro=vec3(6.6*sin(a),1.7,6.6*cos(a)), ta=vec3(0,1.25,0);
  vec3 ww=normalize(ta-ro), uu=normalize(cross(ww,vec3(0,1,0))), vv=cross(uu,ww);
  vec3 rd=normalize(uv.x*uu+uv.y*vv+1.9*ww);
  float t=0.; vec2 h; for(int i=0;i<120;i++){ h=map(ro+rd*t); if(h.x<.0008||t>20.) break; t+=h.x; }
  vec3 col=BG;
  if(t<20.){
    vec3 p=ro+rd*t, n=nor(p), L=normalize(vec3(-.6,1.,.8));
    float dif=clamp(dot(n,L),0.,1.)*sombra(p+n*.003,L);
    if(h.y==4.){ col=mix(BGD,BG,.35); float s=sombra(p+vec3(0,.002,0),normalize(vec3(-.3,1.,.4))); col*=mix(.72,1.,s); col=mix(col,BG,smoothstep(4.,12.,t)); }
    else {
      vec3 base= h.y==1.? vec3(.980,.969,.949) : h.y==2.? vec3(.08,.07,.12) : h.y==3.? vec3(.843,1.,.239) : vec3(.12,.1,.18);
      vec3 sha = h.y==1.? vec3(.851,.831,.910) : h.y==3.? vec3(.616,.769,.11) : base*.6;
      float k=smoothstep(.38,.46,dif);                 // sombreado plano de 2 tonos
      col=mix(sha,base,k);
      vec3 hv=normalize(L-rd); float sp=pow(clamp(dot(n,hv),0.,1.), h.y==2.?120.:60.);
      col+= (h.y==2.?1.2:.55)*smoothstep(.5,.55,sp);   // brillo de vinil / brillo del ojo
      float rim=pow(1.-clamp(dot(n,-rd),0.,1.),3.); col+=RIM*rim*.9*(h.y==4.?0.:1.);  // contraluz
      if(h.y==1.){ vec3 q=p; for(int i=0;i<2;i++){ float s=i==0?-1.:1.; float d=length((q-vec3(s*.4,1.2,.4))*vec3(1.,1.6,1.)); col=mix(col,vec3(1.,.62,.73),.55*smoothstep(.13,.05,d)*(EXPR>.5?1.:.6)); } }
    }
  }
  // grano sutil
  col+= (fract(sin(dot(gl_FragCoord.xy+T,vec2(12.9898,78.233)))*43758.5453)-.5)*.035;
  o=vec4(pow(clamp(col,0.,1.),vec3(1.)),1.);
}`;
const VS=`#version 300 es
in vec2 a; void main(){ gl_Position=vec4(a,0,1); }`;
const c=document.getElementById('g'), gl=c.getContext('webgl2',{preserveDrawingBuffer:true});
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(x);return x;}
const pr=gl.createProgram(); gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS)); gl.linkProgram(pr); gl.useProgram(pr);
const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
function frame3d(t,pal,expr=0,sq=0){ const P={turquesa:['#17C6B4','#0B8E89','#FF5FA2'],magenta:['#F0359B','#A9196F','#6CFFB5'],violeta:['#8D4DFF','#5622BE','#FFD84A'],mandarina:['#FF8A1F','#D25A08','#4CC4FF']}[pal];
  gl.viewport(0,0,c.width,c.height); const u=n=>gl.getUniformLocation(pr,n);
  gl.uniform2f(u('R'),c.width,c.height); gl.uniform1f(u('T'),t); gl.uniform3fv(u('BG'),hex(P[0])); gl.uniform3fv(u('BGD'),hex(P[1])); gl.uniform3fv(u('RIM'),hex(P[2]));
  gl.uniform1f(u('EXPR'),expr); gl.uniform1f(u('SQ'),sq); gl.drawArrays(gl.TRIANGLES,0,3); return c.toDataURL('image/png'); }
</script></body></html>
