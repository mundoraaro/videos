<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine.js"></script>
<script src="../../raro.js"></script>
<script>
// Demo de referencia de la identidad (10 s, sin voz). Muestra: Raro disfrazado desde el cuadro 0, puf de disfraz,
// salto de escena, barrido de bufanda, fondos de dulce, datos como objetos del mundo, freeze con zoom y cierre en loop.

// rata gigante medieval = otro personaje gomita (pastel, sin bufanda) con orejas y cola
const RATA = {
  atras(o){ ctx.fillStyle='#B9A8D9'; for(const s of [-1,1]){ctx.beginPath();ctx.arc(s*105,-370,62,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#FFB8D2'; for(const s of [-1,1]){ctx.beginPath();ctx.arc(s*105,-370,36,0,Math.PI*2);ctx.fill();}
    ctx.strokeStyle='#FFB8D2'; ctx.lineWidth=16; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-120,-80);
    for(let i=0;i<=12;i++){const u=i/12; ctx.lineTo(-120-u*200, -80-Math.sin(u*6+o.t*8)*40*u);} ctx.stroke(); },
  frente(o){ ctx.fillStyle='#FF5FA2'; ctx.beginPath(); ctx.ellipse(0,-250,20,14,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=4; for(const s of [-1,1]) for(const a of [-0.2,0.1]){ctx.beginPath();ctx.moveTo(s*30,-248);ctx.lineTo(s*110,-248+a*120);ctx.stroke();}
    ctx.fillStyle='#FFFFFF'; ctx.fillRect(-16,-226,14,20); ctx.fillRect(2,-226,14,20); }
};

function polvo(t,x,y){ ctx.fillStyle='rgba(255,255,255,0.7)'; for(let i=0;i<6;i++){const ph=((t*3+i/6)%1); ctx.globalAlpha=1-ph; blob(x-ph*160,y-ph*40-rand(i)*20,(14+ph*30));} ctx.globalAlpha=1; }

function S1(t,sc){ // cuadro 0: Raro campesino huyendo de una rata gigante
  const bob=Math.abs(Math.sin(t*16))*22;
  const sh=t>=at(6)?wobble(t,at(6),1):0;
  gomita({x:250+Math.sin(t*5)*20,y:SUELO,s:1.5,t,expr:'feliz',piernas:'corre',brazos:'arriba',disfraz:RATA,color:'#D9C8F5',alto:Math.abs(Math.sin(t*14))*16,tilt:0.12,seed:3});
  polvo(t,690,SUELO-10);
  raro({x:760,y:SUELO,s:1.3,t,expr:'terror',piernas:'corre',brazos:'arriba',disfraz:'campesino',alto:bob,tilt:0.1,viento:0.9,wob:sh});
  letrero('AÑO 1348',540,400,popIn(t,at(3)),'madera',{tam:84,t,t0:at(3)});
  chispas(t,at(6),880,1000,1.4);
}
function S2(t,sc){ // asombro -> puf -> caballero orgulloso -> sale brincando (salto de escena)
  const p=pufCambio(t,at(10));
  const land=gelatina(t,at(10)+0.34), w=wobble(t,at(10)+0.34,1.2);
  const sal=saleArriba(t,sc.end);
  const pre=t<at(10);
  raro({x:540,y:SUELO,s:1.45,t,expr:pre?'sospecha':'orgullo',brazos:pre?'idle':'jarras',disfraz:p.despues?'caballero':'campesino',
        spin:p.spin,sq:(pre?0:land)+sal.sq,alto:sal.alto,wob:w});
  nubePuf(t,at(10)+0.08,540,SUELO-160,1.6);
  letrero('¡NIVEL CABALLERO!',540,400,popIn(t,at(12)),'pergamino',{tam:66,t,t0:at(12)});
  chispas(t,at(12),260,1000,1.3); chispas(t,at(12)+0.1,820,940,1.3);
}
function S3(t,sc){ // cae al espacio con escafandra; se congela
  const c=caida(t,sc.start);
  const cong=t>=at(19);
  const fl=Math.sin(t*2)*30;
  raro({x:540+Math.sin(t*1.3)*30,y:SUELO-180+fl*(c.alto>0?0:1),s:1.4,t,expr:cong?'terror':'asombro',piernas:'flota',brazos:cong?'cara':'arriba',
        disfraz:'astronauta',roto:cong,sq:c.sq,alto:c.alto,wob:c.wob,tilt:Math.sin(t*1.1)*0.15});
  if(cong){ ctx.save(); ctx.globalAlpha=0.35*easeOut(prog(t,at(19),0.3)); ctx.fillStyle='#BFF4FF'; blob(540,SUELO-560,430); ctx.restore(); }
  letrero('-270 °C',540,400,popIn(t,at(17)),'panel',{tam:96,t,t0:at(17)});
  chispas(t,at(19),640,1020,1.5,'#BFF4FF');
}
function S4(t,sc){ // pattern interrupt: mira a cámara "¿en serio?" con freeze+zoom; cierre en loop
  const z=1+0.75*easeOut(prog(t,at(20),0.18))*(t<at(22)?1:1-easeOut(prog(t,at(22),0.25)));
  ctx.save(); ctx.translate(540,SUELO-400); ctx.scale(z,z); ctx.translate(-540,-(SUELO-400));
  const p=pufCambio(t,sc.start+0.02), q=pufCambio(t,at(25)-0.1);
  const fin=t>=at(25);
  const expr= t<at(22)?'sospecha' : (fin?'terror':'risa');
  raro({x:540,y:SUELO,s:1.45,t,expr,mira:t<at(22)?{x:0,y:0}:undefined,brazos:fin?'arriba':(t<at(22)?'jarras':'saluda'),piernas:fin?'corre':'quieto',
        disfraz:q.despues?'campesino':'pirata',spin:p.spin||q.spin,sq:gelatina(t,sc.start+0.36),wob:wobble(t,sc.start+0.36)});
  nubePuf(t,sc.start+0.06,540,SUELO-120,1.2); nubePuf(t,at(25),540,SUELO-120,1.2);
  ctx.restore();
}
const SCENES=[S1,S2,S3,S4];
const CHIPS={};
window.FONDOS={1:{pal:'magenta',tipo:'cerros'},2:{pal:'turquesa',tipo:'interior'},3:{pal:'violeta',tipo:'espacio'},4:{pal:'mandarina',tipo:'cielo'}};
window.TRANS={2:'bufanda'};          // escena 3 entra con "salto de escena" (Raro sale arriba en S2 y cae en S3)
window.KEYWORDS=[3,10,12,16,19,21,25];
window.SHAKES=[6,19];
window.FLASHES=[[10,'#FFFFFF'],[19,'#BFF4FF']];
</script></body></html>
