<script>
// saturno-001 — Planetas donde NO quieres vacacionar (Parte 5): Saturno, contado como viaje de vacaciones. Raro turista (playero con flotador) → abrigo (anillos y polo) → playero → fiesta → playero (loop).
const PI2=Math.PI*2;
window.HIDE_CAPTIONS_LAST=false;
window.CAPTION_POP_MIN=0.85;

// ---------- captions en bloques de 2–3 palabras (v2: nunca una palabra vacía sola en pantalla) ----------
const _corta=w=>w.replace(/[¡!¿?.,:…"]/g,'').length<=3;
function buildChunks(){
  CH=[]; let cur=[];
  const len=c=>c.map(j=>W[j].t).join(' ').length;
  W.forEach((w,i)=>{ if(cur.length>=2 && (cur.map(j=>W[j].t).join(' ')+' '+w.t).length>17){ CH.push(cur); cur=[]; } cur.push(i); const fin=/[.,?!:…]$/.test(w.t);
    if(fin||cur.length>=3||len(cur)>16){
      // no cerrar un bloque con una palabra corta sin puntuación: pasa al siguiente
      if(!fin && cur.length>1 && _corta(w.t)){ cur.pop(); CH.push(cur); cur=[i]; }
      else { CH.push(cur); cur=[]; } } });
  if(cur.length) CH.push(cur);
  { const rest=[]; CH.forEach(c=>{ const r=c.filter(j=>j>7); if(r.length) rest.push(r); }); CH=[[0,1,2,3,4,5,6,7]].concat(rest); }
  // un bloque de una sola palabra corta se une con el siguiente (o con el anterior)
  for(let c=0;c<CH.length;c++){ if(CH[c].length===1 && _corta(W[CH[c][0]].t)){
    if(c+1<CH.length && CH[c+1].length<=3){ CH[c+1]=CH[c].concat(CH[c+1]); CH.splice(c,1); c--; }
    else if(c>0 && CH[c-1].length<=3){ CH[c-1]=CH[c-1].concat(CH[c]); CH.splice(c,1); c--; } } }
}
// Igual que captions() del motor, pero las 2 primeras palabras de cada bloque aparecen juntas.
function captions(t){
  let ci=-1; for(let c=0;c<CH.length;c++){ if(W[CH[c][0]].s-0.05<=t) ci=c; }
  if(ci<0) ci=0; const ch=CH[ci]; const last=W[ch[ch.length-1]];
  if(ci===0){ capGancho(t); return; }
  if(t>last.e+0.6 && (ci+1>=CH.length || t<W[CH[ci+1][0]].s-0.05)) return;
  const KW=window.KEYWORDS||[];
  let size=window.CAPTION_SIZE||80; const words=ch.map(i=>W[i].t.toUpperCase());
  const big=i=>KW.includes(i)?1.22:1;
  const widths=()=>ch.map((i,n)=>{ctx.font=fuente(size*big(i));return ctx.measureText(words[n]).width;});
  ctx.font=fuente(size); let sp=ctx.measureText(' ').width, ws=widths(), total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);
  if(total>800){size=Math.floor(size*800/total); ctx.font=fuente(size); sp=ctx.measureText(' ').width; ws=widths(); total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);}
  if(CAPPOS[ci]==null) CAPPOS[ci]=lugarCaption(total,size*1.25);
  const y=CAPPOS[ci]; let x=540-total/2; const s0=W[ch[0]].s-0.05;
  ctx.textBaseline='middle'; ctx.textAlign='center'; ctx.lineJoin='round';
  ch.forEach((i,n)=>{const w=words[n], wd=ws[n], kw=KW.includes(i); const ws_=n<2?Math.max(0,s0):W[i].s;
    const k=t<ws_?0:(kw?popIn(t,ws_,0.22):back((t-ws_)/0.16));
    if(k>0){ const sz=size*big(i); ctx.save(); ctx.translate(x+wd/2,y); const sc=lerp(window.CAPTION_POP_MIN??0.6,1,k); ctx.scale(sc,sc); if(kw) ctx.rotate(Math.sin(t*5+i)*0.03);
      ctx.font=fuente(sz); ctx.fillStyle='rgba(20,14,40,0.45)'; ctx.fillText(w,0,sz*0.09);
      ctx.lineWidth=sz*0.19; ctx.strokeStyle='#1E1A2E'; ctx.strokeText(w,0,0);
      ctx.fillStyle=kw?COL.lime:'#FFFFFF'; ctx.fillText(w,0,0); ctx.restore(); }
    x+=wd+sp*1.25;});
}

// El gancho se lee desde el cuadro 0: "¡TE BAJAS EN SATURNO…" + "¡NO HAY PISO!" grande en lima.
function capGancho(t){ const y=CAPY0; ctx.save(); ctx.textBaseline='middle'; ctx.textAlign='center'; ctx.lineJoin='round';
  const lin=(txt,yy,sz,col,rot)=>{ ctx.save(); ctx.translate(540,yy); ctx.rotate(rot); ctx.font=fuente(sz); ctx.fillStyle='rgba(20,14,40,0.45)'; ctx.fillText(txt,0,sz*0.09); ctx.lineWidth=sz*0.19; ctx.strokeStyle='#1E1A2E'; ctx.strokeText(txt,0,0); ctx.fillStyle=col; ctx.fillText(txt,0,0); ctx.restore(); };
  lin('¡TE BAJAS EN SATURNO…',y-70,74,'#FFFFFF',0); const k=t<0.35?1:1+0.08*Math.max(0,Math.sin((t-0.35)*9))*Math.exp(-(t-0.35)*1.5);
  ctx.save(); ctx.translate(540,y+50); ctx.scale(k,k); ctx.translate(-540,-(y+50)); lin('¡NO HAY PISO!',y+50,118,COL.lime,Math.sin(t*5)*0.03); ctx.restore(); ctx.restore(); }
const CAPY0=735;
// ---------- verificador de encuadre (cajas en pantalla) ----------
window.CHECK=[];
function chk(tag,x0,y0,x1,y1){ const m=ctx.getTransform(); const P=[[x0,y0],[x1,y0],[x0,y1],[x1,y1]].map(([x,y])=>[m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f]);
  CHECK.push([tag,Math.min(...P.map(p=>p[0])),Math.min(...P.map(p=>p[1])),Math.max(...P.map(p=>p[0])),Math.max(...P.map(p=>p[1]))]); }
let CUR=1;
// Letrero en coordenadas de PANTALLA, compensando el zoom de la toma (soplar-001-v2).
function L(txt,x,y,k,tipo='madera',opts={}){ const TM=(window.TOMAS||{})[CUR]||{}, Z=Math.max(1,TM.z||1), F=TM.foco||[540,960];
  let tam=(opts.tam||72)/Z; ctx.font=fuente(tam); let w=ctx.measureText(txt).width+tam*1.2; const maxW=680/Z;
  if(w>maxW){ tam*=maxW/w; w=maxW; } const sw=w*Z; x=clamp(x,180+sw/2,900-sw/2); y=clamp(y,390,520);
  const X=F[0]+(x-540)/Z, Y=F[1]+(y-960)/Z;
  letrero(txt,X,Y,k,tipo,{sinPalo:!opts.palo,...opts,tam}); if(k>0.5) chk('letrero',X-w/2,Y-tam*0.85,X+w/2,Y+tam*0.85); }
function tierra(x,y,r,t,sinGlow){ ctx.save(); if(!sinGlow){ const g=ctx.createRadialGradient(x,y,r*0.9,x,y,r*1.25); g.addColorStop(0,'rgba(127,216,255,0.8)'); g.addColorStop(1,'rgba(127,216,255,0)'); ctx.fillStyle=g; blob(x,y,r*1.25); }
  ctx.fillStyle='#3AB6FF'; blob(x,y,r); ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,PI2); ctx.clip();
  const sp=t*0.05*r; ctx.fillStyle='#5CD67A'; for(let i=0;i<7;i++){ const xx=x-r+(((rand(i)*2.4*r+sp)%(2.4*r))) - 0.2*r, yy=y-r*0.8+rand(i+7)*r*1.6; blob(xx,yy,r*(0.18+rand(i+3)*0.2)); blob(xx+r*0.15,yy+r*0.1,r*0.14); }
  ctx.fillStyle='rgba(255,255,255,0.85)'; for(let i=0;i<6;i++){ const xx=x-r+(((rand(i+20)*2.4*r+sp*1.6)%(2.4*r)))-0.2*r, yy=y-r*0.9+rand(i+27)*r*1.8; ctx.beginPath(); ctx.ellipse(xx,yy,r*0.22,r*0.05,0,0,PI2); ctx.fill(); }
  ctx.fillStyle='rgba(30,26,80,0.25)'; ctx.beginPath(); ctx.arc(x+r*0.35,y+r*0.2,r*1.05,0,PI2); ctx.fill(); ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.ellipse(x-r*0.45,y-r*0.5,r*0.25,r*0.1,-0.6,0,PI2); ctx.fill(); ctx.restore(); }
function reloj(x,y,r,t,t0,vel=12,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.fillStyle='#FF4D6D'; blob(0,0,r+16); ctx.fillStyle='#FFFFFF'; blob(0,0,r);
  ctx.fillStyle='#1E1A2E'; for(let i=0;i<12;i++){ ctx.save(); ctx.rotate(i/12*PI2); rr(-4,-r+10,8,18,4); ctx.fill(); ctx.restore(); }
  ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=10; ctx.lineCap='round'; const a=Math.max(0,t-t0)*vel; ctx.save(); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-r*0.75); ctx.stroke(); ctx.restore(); ctx.save(); ctx.rotate(a/12); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-r*0.5); ctx.stroke(); ctx.restore(); blob(0,0,10); ctx.restore(); ocupa(x-r,y-r,x+r,y+r,1.2); chk('obj',x-r-16,y-r-16,x+r+16,y+r+16); }
function solito(x,y,r,t,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.rotate(t); ctx.fillStyle='#FFD23F'; for(let i=0;i<8;i++){ ctx.save(); ctx.rotate(i/8*PI2); ctx.beginPath(); ctx.moveTo(-r*0.25,-r*1.05); ctx.lineTo(0,-r*1.5); ctx.lineTo(r*0.25,-r*1.05); ctx.fill(); ctx.restore(); } ctx.fillStyle='#FFE45C'; blob(0,0,r); ctx.restore(); }
function tache(x,y,r,k){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=46; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-r,-r); ctx.lineTo(r,r); ctx.moveTo(r,-r); ctx.lineTo(-r,r); ctx.stroke(); ctx.strokeStyle='#FF4D5E'; ctx.lineWidth=30; ctx.stroke(); ctx.restore(); }
function scn(t){ let n=1; for(let i=0;i<SC.length;i++) if(t>=SC[i].start) n=i+1; return n; }
const dur=sc=>sc.end-sc.start;
function flechaAbajo(x,y,k,c='#D7FF3D'){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI); ctx.scale(k,k); ctx.fillStyle=c; ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(0,-90); ctx.lineTo(60,-20); ctx.lineTo(22,-20); ctx.lineTo(22,60); ctx.lineTo(-22,60); ctx.lineTo(-22,-20); ctx.lineTo(-60,-20); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
function bascula(x,y,s,txt,rojo,t){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle='#5E5A7A'; rr(-230,-20,460,70,30); ctx.fill(); ctx.fillStyle='#F3F0FF'; rr(-240,-40,480,70,30); ctx.fill();
  ctx.fillStyle='#1E1A2E'; rr(-110,-30,220,52,14); ctx.fill(); ctx.fillStyle=rojo?'#FF4D5E':'#D7FF3D'; ctx.font=fuente(42); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,0,-3); ctx.restore(); ocupa(x-240*s,y-40*s,x+240*s,y+50*s,1); }
function manometro(x,y,r,u,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.fillStyle='#3B3557'; blob(0,0,r+16); ctx.fillStyle='#FFFFFF'; blob(0,0,r);
  for(let i=0;i<=8;i++){ const a=Math.PI*0.8+i/8*Math.PI*1.4; ctx.strokeStyle=i>5?'#FF4D5E':'#1E1A2E'; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(Math.cos(a)*r*0.72,Math.sin(a)*r*0.72); ctx.lineTo(Math.cos(a)*r*0.9,Math.sin(a)*r*0.9); ctx.stroke(); }
  const a=Math.PI*0.8+clamp(u,0,1.05)*Math.PI*1.4+Math.sin(performance.now?0:0); ctx.strokeStyle='#FF4D5E'; ctx.lineWidth=12; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*r*0.78,Math.sin(a)*r*0.78); ctx.stroke(); ctx.fillStyle='#1E1A2E'; blob(0,0,14); ctx.restore(); ocupa(x-r-16,y-r-16,x+r+16,y+r+16,1.1); }
function termometro(x,y,h,u,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.fillStyle='#FFFFFF'; rr(-34,-h,68,h,34); ctx.fill(); blob(0,10,56); ctx.fillStyle='#FF4D5E'; blob(0,10,40); rr(-16,-(h-30)*clamp(u),32,(h-30)*clamp(u)+10,16); ctx.fill(); ctx.restore(); ocupa(x-56,y-h,x+56,y+66,1.1); }
function cohete(x,y,s,t,fuego=1){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); const f=fuego*(120+Math.sin(t*40)*30);
  ctx.fillStyle='#FFB13D'; ctx.beginPath(); ctx.moveTo(-50,170); ctx.quadraticCurveTo(0,170+f*1.6,50,170); ctx.fill(); ctx.fillStyle='#FFF0A0'; ctx.beginPath(); ctx.moveTo(-26,170); ctx.quadraticCurveTo(0,170+f,26,170); ctx.fill();
  for(const k of [-1,1]){ ctx.fillStyle='#FF5FA2'; ctx.beginPath(); ctx.moveTo(70*k,60); ctx.lineTo(130*k,190); ctx.lineTo(40*k,160); ctx.fill(); }
  ctx.fillStyle='#F3F0FF'; ctx.beginPath(); ctx.moveTo(0,-260); ctx.quadraticCurveTo(110,-120,80,170); ctx.lineTo(-80,170); ctx.quadraticCurveTo(-110,-120,0,-260); ctx.fill();
  ctx.fillStyle='#FF5FA2'; ctx.beginPath(); ctx.moveTo(0,-260); ctx.quadraticCurveTo(60,-190,72,-140); ctx.lineTo(-72,-140); ctx.quadraticCurveTo(-60,-190,0,-260); ctx.fill(); ctx.fillStyle='#7FD8FF'; blob(0,-40,40); ctx.restore(); ocupa(x-130*s,y-260*s,x+130*s,y+200*s,1); }
function burbujas(t,x,y,n=10,k=1){ ctx.save(); ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=5; for(let i=0;i<n;i++){ const u=((t*0.8+rand(i))%1); ctx.globalAlpha=(1-u)*k; ctx.beginPath(); ctx.arc(x+(rand(i+2)-0.5)*300+Math.sin(t*4+i)*20,y-u*700,8+rand(i+5)*16,0,PI2); ctx.stroke(); } ctx.restore(); }

// ====================== marte-001: utilería ======================
const BOCA=(x,y,s)=>[x,y-232*s]; const OJO=(x,y,s,k)=>[x+k*50*s,y-290*s];
// burbujas que salen de la boca (saliva hirviendo)
function burbujasBoca(t,x,y,s,k=1,n=7){ if(k<=0) return; ctx.save(); for(let i=0;i<n;i++){ const u=((t*1.6+rand(i))%1), r=(14+rand(i+3)*16)*s*(0.6+u*0.6);
  const sd=i%2?1:-1, bx=x+sd*(30+u*190)*s+Math.sin(t*6+i)*10*s, by=y+10*s-u*120*s; ctx.globalAlpha=(1-u)*k; ctx.fillStyle='rgba(160,230,255,0.75)'; blob(bx,by,r*1.3); ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=5*s; ctx.beginPath(); ctx.arc(bx,by,r,0,PI2); ctx.stroke();
  ctx.fillStyle='#FFFFFF'; blob(bx-r*0.35,by-r*0.35,r*0.22); if(u>0.92){ ctx.globalAlpha=k; estrella4(bx,by,r*1.4,'#FFFFFF'); } } ctx.restore(); }
// lágrimas que burbujean y revientan
function lagrimas(t,x,y,s,k=1){ if(k<=0) return; for(const sd of [-1,1]){ const [ox,oy]=OJO(x,y,s,sd); ctx.save(); for(let i=0;i<4;i++){ const u=((t*1.3+i/4+(sd>0?0.13:0))%1);
  const bx=ox+sd*(20+u*40)*s, by=oy+20*s+u*150*s, r=(10+Math.sin(t*14+i)*3)*s; ctx.globalAlpha=k*(1-u*0.6); ctx.fillStyle='#7FD8FF'; blob(bx,by,r); ctx.fillStyle='#FFFFFF'; blob(bx-r*0.3,by-r*0.3,r*0.3);
  if(u>0.8){ ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=3*s; ctx.beginPath(); ctx.arc(bx,by,r*1.8*(u-0.8)*5,0,PI2); ctx.stroke(); } } ctx.restore(); } }
// escarcha sobre Raro (sombrero y hombros) + estalactitas
function escarcha(x,y,s,k,t){ if(k<=0) return; ctx.save(); ctx.globalAlpha=k; ctx.fillStyle='#BFEFFF';
  for(let i=0;i<9;i++){ const a=-Math.PI+i/8*Math.PI; blob(x+Math.cos(a)*175*s,y-370*s+Math.sin(a)*40*s,(10+rand(i)*8)*s); }
  ctx.fillStyle='#CFF3FF'; for(let i=0;i<6;i++){ const xx=x+(-150+i*60)*s, L=(30+rand(i+9)*40)*s*k; ctx.beginPath(); ctx.moveTo(xx-12*s,y-350*s); ctx.lineTo(xx,y-350*s+L); ctx.lineTo(xx+12*s,y-350*s); ctx.fill(); }
  for(let i=0;i<5;i++){ ctx.globalAlpha=k*(0.5+0.5*Math.sin(t*5+i)); estrella4(x+(rand(i+20)-0.5)*300*s,y-(80+rand(i+25)*300)*s,12*s,'#FFFFFF'); } ctx.restore(); }
// bloque de hielo que sube desde los pies
function hielo(x,y,s,k){ if(k<=0) return; const h=300*s*k, w=380*s; ctx.save(); ctx.fillStyle='rgba(170,235,255,0.38)'; rr(x-w/2,y-h+10,w,h,30*s); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=7*s; rr(x-w/2,y-h+10,w,h,30*s); ctx.stroke(); ctx.fillStyle='rgba(255,255,255,0.7)'; rr(x-w/2+24*s,y-h+30*s,24*s,Math.max(0,h-60*s),12*s); ctx.fill(); ctx.restore(); }
// frasco con moléculas de aire
function frasco(x,y,s,n,t,k,txt,col){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle='rgba(255,255,255,0.28)'; rr(-120,-320,240,320,50); ctx.fill(); ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=10; rr(-120,-320,240,320,50); ctx.stroke(); ctx.fillStyle='#FFFFFF'; rr(-90,-350,180,40,14); ctx.fill();
  for(let i=0;i<n;i++){ const px_=-80+((rand(i)*160+Math.sin(t*3+i)*30)%160+160)%160, py=-280+((rand(i+40)*250+Math.cos(t*2.5+i*1.3)*30)%250+250)%250; ctx.fillStyle=col; blob(px_,py,13); ctx.fillStyle='#FFFFFF'; blob(px_-4,py-4,4); }
  ctx.font=fuente(56); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineWidth=12; ctx.strokeStyle='#1E1A2E'; ctx.strokeText(txt,0,60); ctx.fillStyle='#FFFFFF'; ctx.fillText(txt,0,60); ctx.restore(); ocupa(x-130*s,y-360*s,x+130*s,y+90*s,1.3); chk('obj',x-130*s,y-360*s,x+130*s,y+90*s); }
// vaso de agua (hierve: 0..1)
function vaso(x,y,s,t,hv){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); if(hv>0) ctx.translate(Math.sin(t*50)*4*hv,0);
  ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.moveTo(-70,-180); ctx.lineTo(70,-180); ctx.lineTo(55,0); ctx.lineTo(-55,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#4CC9F0'; const lv=-140+Math.sin(t*20)*6*hv; ctx.beginPath(); ctx.moveTo(-66,lv); ctx.lineTo(66,lv); ctx.lineTo(55,0); ctx.lineTo(-55,0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(-70,-180); ctx.lineTo(-55,0); ctx.lineTo(55,0); ctx.lineTo(70,-180); ctx.stroke();
  for(let i=0;i<Math.round(12*hv);i++){ const u=((t*2.2+rand(i))%1); ctx.fillStyle='#FFFFFF'; ctx.globalAlpha=1-u*0.5; blob(-45+rand(i+2)*90,-10-u*(130+20)+0,6+rand(i)*8); } ctx.globalAlpha=1;
  if(hv>0.5){ ctx.fillStyle='rgba(255,255,255,0.6)'; for(let i=0;i<4;i++){ const u=((t*1.2+i/4)%1); ctx.globalAlpha=(1-u)*hv; blob(-30+i*20+Math.sin(t*3+i)*14,-190-u*160,18+u*20); } ctx.globalAlpha=1; }
  ctx.restore(); }
// florecitas a los pies
function flor(x,y,s,k,c){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); ctx.strokeStyle='#5CD67A'; ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-70); ctx.stroke();
  ctx.fillStyle=c; for(let i=0;i<5;i++){ const a=i/5*PI2; blob(Math.cos(a)*22,-80+Math.sin(a)*22,18); } ctx.fillStyle='#FFE45C'; blob(0,-80,13); ctx.restore(); }
function copo(x,y,r,a){ ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=r*0.25; ctx.lineCap='round'; for(let i=0;i<3;i++){ ctx.rotate(Math.PI/3); ctx.beginPath(); ctx.moveTo(-r,0); ctx.lineTo(r,0); ctx.stroke(); } ctx.restore(); }
// gorro de nieve encima del sombrero
function gorro(x,y,s,k){ if(k<=0) return; ctx.save(); ctx.translate(x,y-372*s); ctx.scale(s*k,s*k); ctx.fillStyle='#4CC9F0'; ctx.beginPath(); ctx.moveTo(-120,20); ctx.quadraticCurveTo(-110,-150,0,-160); ctx.quadraticCurveTo(110,-150,120,20); ctx.closePath(); ctx.fill();
