const GENTE=['#FF5FA2','#4CC9F0','#FFD23F','#B388FF','#FF8A3D','#6CFFB5','#FFB8D2'];

    ctx.fillStyle='#FFFFFF'; rr(-70,24,56,30,8); ctx.fill(); ctx.fillStyle='#D7FF3D'; rr(26,94,44,40,8); ctx.fill(); ctx.restore(); }
};

 [-112.2,29.0],[-112.9,30.6],[-113.1,31.2],[-114.8,31.6],[-114.6,30.2],[-113.5,28.9],[-112.4,27.4],[-111.6,26.0],[-110.7,24.6],[-110.0,23.4],[-109.4,23.2],[-109.9,22.9],

function proy(lon,lat,cx,cy,w){ const k=w/30.6; return [cx+(lon+101.9)*k, cy+(23.6-lat)*k*1.12]; }
function poli(pts,cx,cy,w){ ctx.beginPath(); pts.forEach((p,i)=>{ const [x,y]=proy(p[0],p[1],cx,cy,w); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.closePath(); }
// gente: textura de puntitos de colores que se mueven; u = cuánto se ha llenado (de sureste a noroeste)
function gente(t,cx,cy,w,u,dens=1){ const step=Math.max(9,22/dens)*w/840, r=step*0.36;
  for(let y=cy-w*0.4;y<cy+w*0.4;y+=step) for(let x=cx-w*0.55;x<cx+w*0.55;x+=step){ const i=Math.round(x*7.1+y*3.3);

    ctx.fillStyle=GENTE[Math.abs(i)%GENTE.length]; blob(x+Math.sin(t*6+i)*r*0.4, y+Math.cos(t*5+i)*r*0.4, r); } }

  const nn=o.norte||0;

  ctx.fillStyle='#2FB563'; rr(-24,-290,22,270,11); ctx.fill(); ctx.fillStyle='#FF5FA2'; blob(0,-306,22); ctx.restore(); }

// el planeta con México brillando y el resto vacío
function planeta(t,cx,cy,R,o={}){ if(typeof ocupa==='function') ocupa(cx-R,cy-R,cx+R,cy+R,o.peso??0.8);
  ctx.save(); ctx.shadowColor='#AEE6FF'; ctx.shadowBlur=60; ctx.fillStyle='#3AB6FF'; blob(cx,cy,R); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,PI2); ctx.clip(); const g=(o.giro??t*0.15);
  ctx.fillStyle='#86E3A8';
  for(const [a,b,rx,ry,rot] of [[-0.55,-0.35,0.42,0.28,0.4],[-0.38,0.05,0.16,0.12,0.6],[-0.2,0.45,0.16,0.3,0.2],[0.45,-0.3,0.5,0.25,-0.1],[0.35,0.25,0.22,0.3,0.1],[0.75,0.5,0.15,0.1,0]]){
    ctx.beginPath(); ctx.ellipse(cx+(a+Math.sin(g)*0.1)*R, cy+b*R, rx*R, ry*R, rot, 0, PI2); ctx.fill(); }
  // México
  const mx=cx+(-0.38+Math.sin(g)*0.1)*R, my=cy+0.06*R, pul=1+0.08*Math.sin(t*8);
  ctx.save(); ctx.shadowColor='#D7FF3D'; ctx.shadowBlur=40; ctx.fillStyle='#D7FF3D'; ctx.beginPath(); ctx.ellipse(mx,my,R*0.15*pul,R*0.09*pul,0.5,0,PI2); ctx.fill(); ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.ellipse(cx-R*0.35,cy-R*0.45,R*0.35,R*0.16,-0.5,0,PI2); ctx.fill();
  ctx.restore(); return [mx,my]; }
function casita(x,y,s,c,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle=c; rr(-80,-130,160,130,14); ctx.fill(); ctx.fillStyle=mix(c,'#1E1A2E',0.3); ctx.beginPath(); ctx.moveTo(-100,-120); ctx.lineTo(0,-210); ctx.lineTo(100,-120); ctx.closePath(); ctx.fill();

    ctx.fillStyle=GENTE[(i+seed)%GENTE.length]; ctx.beginPath(); ctx.ellipse(x,y-b,st*0.34,st*0.42,0,0,PI2); ctx.fill(); ctx.fillStyle='#1E1A2E'; blob(x-st*0.1,y-b-st*0.1,st*0.06); blob(x+st*0.1,y-b-st*0.1,st*0.06); } }
function fantasma(x,y,s,t,i=0){ ctx.save(); ctx.translate(x,y+Math.sin(t*3+i)*24); ctx.scale(s,s); ctx.rotate(Math.sin(t*2+i)*0.1); ctx.globalAlpha=0.85;

  for(let k=0;k<4;k++){ ctx.quadraticCurveTo(90-k*45-22,30+Math.sin(t*8+k)*10,90-(k+1)*45,0); } ctx.closePath(); ctx.fill();
  ctx.globalAlpha=1; ctx.fillStyle='#1E1A2E'; ctx.beginPath(); ctx.ellipse(-30,-150,14,22,0,0,PI2); ctx.ellipse(30,-150,14,22,0,0,PI2); ctx.fill(); ctx.beginPath(); ctx.ellipse(0,-95,16,22,0,0,PI2); ctx.fill(); ctx.restore(); }
function cama(x,y){ ctx.fillStyle='#7A4A22'; rr(x-330,y-280,40,300,16); ctx.fill(); rr(x+290,y-180,40,200,16); ctx.fill(); ctx.fillStyle='#FFFFFF'; rr(x-300,y-150,600,90,30); ctx.fill(); }

function tortilla(x,y,r,a=0){ ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.fillStyle='#E9C46A'; ctx.beginPath(); ctx.ellipse(0,0,r,r*0.92,0,0,PI2); ctx.fill(); ctx.fillStyle='#F4D58D'; ctx.beginPath(); ctx.ellipse(-r*0.1,-r*0.08,r*0.82,r*0.74,0,0,PI2); ctx.fill();

function elote(x,y,s,a){ ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.scale(s,s); ctx.fillStyle='#FFD23F'; ctx.beginPath(); ctx.ellipse(0,0,34,90,0,0,PI2); ctx.fill(); ctx.fillStyle='#E9A800'; for(let j=-3;j<=3;j++) for(let i=-1;i<=1;i++) blob(i*18,j*22,6);
  ctx.fillStyle='#2FA35E'; ctx.beginPath(); ctx.moveTo(0,90); ctx.quadraticCurveTo(-70,20,-30,-60); ctx.quadraticCurveTo(-20,40,0,90); ctx.fill(); ctx.beginPath(); ctx.moveTo(0,90); ctx.quadraticCurveTo(70,20,30,-50); ctx.quadraticCurveTo(20,40,0,90); ctx.fill(); ctx.restore(); }
function vaca(x,y,s,t,i=0){ ctx.save(); ctx.translate(x,y-Math.abs(Math.sin(t*4+i))*6); ctx.scale(s,s); ctx.fillStyle='#FFFFFF'; rr(-120,-150,240,110,50); ctx.fill(); ctx.fillStyle='#1E1A2E'; blob(-50,-110,26); blob(40,-90,20);
  for(const lx of [-90,-40,40,90]){ ctx.fillStyle='#FFFFFF'; rr(lx-12,-60,24,60,10); ctx.fill(); } ctx.fillStyle='#FFFFFF'; rr(100,-200,90,90,36); ctx.fill(); ctx.fillStyle='#FFB8D2'; rr(150,-150,50,40,18); ctx.fill(); ctx.fillStyle='#1E1A2E'; blob(130,-170,7); ctx.restore(); }
function surcos(t,y0){ const P=PAL_ACTUAL; for(let r=0;r<7;r++){ const y=y0+r*70; ctx.fillStyle=r%2?'#8FCB5A':'#B4E07A'; ctx.beginPath(); ctx.moveTo(-200,y); ctx.lineTo(1280,y-30); ctx.lineTo(1280,y+40); ctx.lineTo(-200,y+70); ctx.fill();
  for(let i=0;i<12;i++){ ctx.fillStyle='#2FA35E'; const x=i*100+(r%2)*50, yy=y+30-i*2.5; ctx.beginPath(); ctx.ellipse(x,yy-10+Math.sin(t*3+i+r)*3,10,24,Math.sin(t*2+i)*0.2,0,PI2); ctx.fill(); } } }
function cocheFrente(x,y,s,c,t,i=0){ ctx.save(); ctx.translate(x,y+Math.abs(Math.sin(t*10+i))*3); ctx.scale(s,s); ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(0,6,200,20,0,0,PI2); ctx.fill();
  ctx.fillStyle=c; rr(-190,-150,380,120,40); ctx.fill(); ctx.fillStyle=mix(c,'#1E1A2E',0.25); rr(-120,-240,240,110,40); ctx.fill(); ctx.fillStyle='#CFF3FF'; rr(-100,-225,200,80,24); ctx.fill();
  ctx.fillStyle='#FFF38A'; blob(-140,-95,22); blob(140,-95,22); ctx.fillStyle='#3E3A55'; rr(-170,-40,60,44,14); ctx.fill(); rr(110,-40,60,44,14); ctx.fill(); ctx.restore(); }
function megafono(x,y,s,a){ ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.scale(s,s); ctx.fillStyle='#E5333F'; ctx.beginPath(); ctx.moveTo(0,-26); ctx.lineTo(160,-80); ctx.lineTo(160,80); ctx.lineTo(0,26); ctx.closePath(); ctx.fill(); ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.ellipse(160,0,24,80,0,0,PI2); ctx.fill(); ctx.fillStyle='#1E1A2E'; rr(-40,-20,50,40,10); ctx.fill(); ctx.restore(); }

function L(txt,x,y,k,tipo='madera',opts={}){ // letrero en zona segura: ancho máx. 740, centrado en la franja 430–520
  let tam=opts.tam||72; ctx.font=fuente(tam); let w=Math.max(opts.ancho||0,ctx.measureText(txt).width+tam*1.2);

}
const loc=(rx,ry,s,wx,wy)=>[(wx-rx)/s,(wy-ry)/s];

// ---------- S1 y S31: ¡todos a México! (mismo cuadro para el loop) ----------
// Raro viajero corre con maleta frente al mapa que se llena de gente; letrero ¡TODOS A MÉXICO!; multitud marchando.
function escenaMudanza(t,sc,fin){
  const lt=t-sc.start;
  mapa(t,540,800,820,{lleno:0.35+0.25*Math.min(1,lt/3)+0.15*Math.sin(t*2)*0});
  marcha(t,1210,0.34,9,0,170,1.4);
  const x=300+Math.sin(t*3)*20;
  raro({x,y:SUELO,s:1.12,t,expr:fin&&t>=at(180)?'asombro':(t>=at(6)&&!fin?'risa':'feliz'),disfraz:VIAJERO,maleta:true,piernas:'corre',brazos:'corre',manos:{d:[150,-120]},alto:Math.abs(Math.sin(t*14))*22,tilt:0.08});
  L('¡TODOS A MÉXICO!',540,480,1,'madera',{tam:84,sinPalo:true,t,t0:-1});
  if(!fin) chispas(t,at(6),760,820,1.3,'#D7FF3D');
}
function S1(t,sc){ escenaMudanza(t,sc,false); }
function S31(t,sc){ escenaMudanza(t,sc,true); }
