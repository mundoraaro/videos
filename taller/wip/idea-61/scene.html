function inodoro(x,y,s,t,o={}){ // inodoro gigante de porcelana azul pálido; o.giro (0..1) remolino; o.palanca (0..1) jalada; devuelve pos de la palanca
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s); if(o.espejo) ctx.scale(-1,1);

  ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(-90,-500,34,12,-0.4,0,PI2); ctx.fill();

  ctx.fillStyle=P; ctx.beginPath(); ctx.moveTo(-84,0); ctx.quadraticCurveTo(-60,-140,-112,-230); ctx.lineTo(100,-230); ctx.quadraticCurveTo(54,-140,72,0); ctx.closePath(); ctx.fill();
  // taza
  ctx.fillStyle=S; ctx.beginPath(); ctx.ellipse(0,-246,200,66,0,0,PI2); ctx.fill();
  ctx.fillStyle=P; ctx.beginPath(); ctx.ellipse(-4,-254,196,62,0,0,PI2); ctx.fill();
  ctx.fillStyle=D; ctx.beginPath(); ctx.ellipse(0,-254,158,44,0,0,PI2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.ellipse(0,-252,150,40,0,0,PI2); ctx.clip();
  ctx.fillStyle=AGUA; ctx.fillRect(-160,-300,320,100);
  const g=o.giro||0; ctx.strokeStyle='rgba(255,255,255,'+(0.35+0.5*g)+')'; ctx.lineWidth=10; ctx.lineCap='round';
  for(let k=0;k<3;k++){ ctx.beginPath(); for(let i=0;i<=30;i++){ const u=i/30, a=u*5+k*2.1+t*(2+g*16), r=140*(1-u*0.85); const px=Math.cos(a)*r, py=-252+Math.sin(a)*r*0.27; i?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.stroke(); }
  ctx.restore();
  // salpicaduras del jalón
  if((o.giro||0)>0.3){ ctx.fillStyle=AGUA_C; for(let i=0;i<8;i++){ const ph=((t*2.4+i/8)%1); ctx.globalAlpha=1-ph; blob(Math.cos(i*0.8)*(120+ph*120), -300-Math.sin(ph*Math.PI)*120, 14*(1-ph)+4);} ctx.globalAlpha=1; }
  ctx.restore();
  return [x+(-118-60)*s*(o.espejo?-1:1), y-470*s];
}

  const P=PAL_ACTUAL;
  ctx.fillStyle=mix(P.oscuro,'#000000',0.45); ctx.fillRect(-300,-300,1680,2520);

function tanque(x0,y0,x1,y1,nivel,t,o={}){ // tanque en corte con nivel de agua (nivel = y de la superficie)
  const P=PAL_ACTUAL; if(typeof ocupa==='function') ocupa(x0,y0,x1,y1,0.8);
  ctx.fillStyle=mix(P.oscuro,'#000000',0.25); rr(x0-20,y0-20,x1-x0+40,y1-y0+40,46); ctx.fill();
  ctx.fillStyle=mix(P.claro,'#FFFFFF',0.35); rr(x0,y0,x1-x0,y1-y0,32); ctx.fill();
  ctx.save(); rr(x0,y0,x1-x0,y1-y0,32); ctx.clip();
  if(nivel<y1){ ctx.fillStyle=AGUA; ctx.beginPath(); ctx.moveTo(x0,y1+10); for(let x=x0;x<=x1;x+=16) ctx.lineTo(x,nivel+Math.sin(x*0.02+t*6)*12); ctx.lineTo(x1,y1+10); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.35)'; for(let i=0;i<10;i++){ const by=((rand(i)*900 - t*160)%900+900)%900; const yy=y1-by; if(yy>nivel+20) blob(x0+40+rand(i+3)*(x1-x0-80),yy,6+rand(i+1)*8);} }
  ctx.restore();
  if(o.etiqueta){ ctx.font=fuente(64); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=mix(P.oscuro,'#000000',0.25); ctx.fillText(o.etiqueta,(x0+x1)/2,y0+70); }
}

  if(typeof ocupa==='function') ocupa(x0,y0,x0+w,y0+h,2.2);

  ctx.strokeStyle='rgba(143,240,255,0.18)'; ctx.lineWidth=3; for(let j=1;j<4;j++){ ctx.beginPath(); ctx.moveTo(x0+30,y0+j*h/4); ctx.lineTo(x0+w-30,y0+j*h/4); ctx.stroke(); }

function filaGomitas(t,y,s,n,x0,dx,o={}){ for(let i=0;i<n;i++){ const x=x0+i*dx; const b=Math.abs(Math.sin(t*(7+i)+i))*16*(o.salta?1:0.3);

// ---------- S1 y S30: el jalón masivo (mismo cuadro para el loop) ----------
function escenaJalon(t,sc,fin){
  const t0=sc.start;
  filaGomitas(t,1130,0.36,7,120,140,{inodoros:true,giro:1,salta:true});
  const jal=Math.abs(Math.sin((t-t0)*7)); // jala la palanca una y otra vez
  const lev=inodoro(740,SUELO,1.12,t,{giro:1,palanca:jal});
