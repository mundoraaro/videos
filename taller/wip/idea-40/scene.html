<!doctype html>

<body><canvas id="c" width="1080" height="1920"></canvas>

<script>
// colibri-001 — "Si fueras colibrí, comerías treinta kilos al día". Raro disfrazado de colibrí (DISFRACES.colibri en raro.js).
// ---------- utilería propia de este video ----------
const NECTAR='#FFB52E';
function flor(x,y,s,t,k=1,o={}){ if(k<=0) return; // flor de trompeta gigante, la boca mira a la izquierda (hacia el pico de Raro)
  ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); ctx.rotate(Math.sin(t*1.6)*0.04+(o.sacude||0));
  ctx.strokeStyle='#2E9E57'; ctx.lineWidth=26; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(150,10); ctx.quadraticCurveTo(230,260,170,(o.tallo||620)); ctx.stroke();
  ctx.fillStyle='#3FC46E'; for(const [hx,hy,a] of [[205,250,-0.6],[190,420,0.7]]) hoja(hx,hy,170,a,'#3FC46E');
  if(o.cerrada){ ctx.fillStyle='#FF8A1F'; ctx.beginPath(); ctx.ellipse(70,0,120,46,0,0,Math.PI*2); ctx.fill(); ctx.restore(); return; }
  ctx.fillStyle='#FF8A1F'; ctx.beginPath(); ctx.moveTo(170,-26); ctx.quadraticCurveTo(40,-40,-80,-140); ctx.lineTo(-80,140); ctx.quadraticCurveTo(40,40,170,26); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#FFD23F'; for(let i=0;i<5;i++){ const a=-0.9+i*0.45; ctx.beginPath(); ctx.ellipse(-80+Math.cos(a)*-10,Math.sin(a)*120,70,52,a*0.6,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle='#C2410C'; ctx.beginPath(); ctx.ellipse(-78,0,30,96,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFE9A3'; ctx.beginPath(); ctx.ellipse(40,-14,90,12,-0.1,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=7; for(const a of [-0.3,0,0.3]){ ctx.beginPath(); ctx.moveTo(-60,a*40); ctx.lineTo(-140,a*120+Math.sin(t*4+a)*6); ctx.stroke(); ctx.fillStyle='#FFFFFF'; blob(-140,a*120+Math.sin(t*4+a)*6,12); }
  ctx.restore();
  if(typeof ocupa==='function') ocupa(x-170*s*k,y-170*s*k,x+190*s*k,y+180*s*k,1.6);
}
function frasco(x,y,s,txt,k=1,t=0){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle='rgba(255,255,255,0.55)'; rr(-62,-150,124,150,30); ctx.fill();
  ctx.fillStyle=NECTAR; rr(-54,-118+Math.sin(t*3+x)*3,108,112,24); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.45)'; rr(-42,-104,18,70,9); ctx.fill();
  ctx.fillStyle='#E23D5B'; rr(-58,-176,116,32,12); ctx.fill();
  if(txt){ ctx.fillStyle='#FFF4DC'; rr(-46,-82,92,38,10); ctx.fill(); ctx.fillStyle='#7A3A12'; ctx.font=fuente(26); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,0,-62); }
  ctx.restore(); }
function corazon(x,y,size,t,bpm,k=1,col='#FF3B6B'){ if(k<=0) return; const f=bpm/60, ph=(t*f)%1, beat=1+0.16*Math.exp(-ph*9)*Math.min(1,f);
  ctx.save(); ctx.translate(x,y); ctx.scale(k*beat,k*beat); heartPath(size); ctx.fillStyle=col; ctx.fill(); ctx.lineWidth=size*0.06; ctx.strokeStyle=mix(col,'#3A1430',0.45); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.ellipse(-size*0.28,-size*0.2,size*0.1,size*0.16,-0.6,0,Math.PI*2); ctx.fill(); ctx.restore();
  if(typeof ocupa==='function') ocupa(x-size*0.65*k,y-size*0.6*k,x+size*0.65*k,y+size*0.65*k,2); }
function reloj(x,y,r,t,vel,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k);
  ctx.fillStyle='#1E1A2E'; blob(6,8,r+14); ctx.fillStyle='#FFD23F'; blob(0,0,r+14); ctx.fillStyle='#FFF8E6'; blob(0,0,r);
  ctx.fillStyle='#1E1A2E'; for(let i=0;i<12;i++){ const a=i/12*Math.PI*2; blob(Math.cos(a)*r*0.82,Math.sin(a)*r*0.82,i%3?5:10); }
  ctx.fillStyle='rgba(255,79,160,0.45)'; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r*0.78,-Math.PI/2,0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#1E1A2E'; ctx.lineCap='round'; ctx.lineWidth=12; const a=-Math.PI/2+t*vel; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*r*0.7,Math.sin(a)*r*0.7); ctx.stroke();
  ctx.lineWidth=16; const b=-Math.PI/2+t*vel/12; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(b)*r*0.45,Math.sin(b)*r*0.45); ctx.stroke(); blob(0,0,14);
  ctx.restore(); if(typeof ocupa==='function') ocupa(x-r-14,y-r-14,x+r+14,y+r+14,2.5); }
function bocadillo(x,y,txt,k,tam=48,col='#FFFFFF',tinta='#1E1A2E'){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.font=fuente(tam);
  const w=ctx.measureText(txt).width+tam*1.1, h=tam*1.7; ctx.fillStyle=tinta; rr(-w/2+5,-h/2+7,w,h,h/2); ctx.fill(); ctx.fillStyle=col; rr(-w/2,-h/2,w,h,h/2); ctx.fill();
  ctx.fillStyle=tinta; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,0,3); ctx.restore(); if(typeof ocupa==='function') ocupa(x-w/2,y-h/2,x+w/2,y+h/2,2.5); }
function pila(x,y,s,nivel,k=1,t=0){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle='#1E1A2E'; rr(-90,-170,180,340,34); ctx.fill(); rr(-36,-200,72,40,12); ctx.fill();
  ctx.fillStyle='#FFFFFF'; rr(-72,-152,144,304,24); ctx.fill();
  const c= nivel>0.5?'#3DDC84':(nivel>0.2?'#FFD23F':'#FF3B5B'); const h=288*clamp(nivel); ctx.fillStyle=c; if(nivel<0.2) ctx.globalAlpha=0.6+0.4*Math.sin(t*14);
  rr(-64,144-h,128,Math.max(h,10),18); ctx.fill(); ctx.globalAlpha=1;
  ctx.fillStyle='#1E1A2E'; ctx.font=fuente(52); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(Math.round(nivel*100)+'%',0,-10);
  ctx.restore(); if(typeof ocupa==='function') ocupa(x-90*s*k,y-200*s*k,x+90*s*k,y+170*s*k,2.5); }
function termometro(x,y,s,v,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle='#1E1A2E'; rr(-46,-420,92,460,46); ctx.fill(); blob(0,60,80); ctx.fillStyle='#FFFFFF'; rr(-30,-404,60,440,30); ctx.fill(); blob(0,60,64);
  const c=mix('#4CC9F0','#FF3B5B',clamp(v)); ctx.fillStyle=c; blob(0,60,48); rr(-16,40-380*clamp(v),32,380*clamp(v)+30,16); ctx.fill();
  ctx.fillStyle='#1E1A2E'; for(let i=0;i<8;i++) ctx.fillRect(18,-360+i*48,22,6);
  ctx.restore(); if(typeof ocupa==='function') ocupa(x-50*s*k,y-420*s*k,x+80*s*k,y+140*s*k,2); }
function hieloBloque(x,y,w,h,k,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.fillStyle='rgba(200,242,255,0.55)'; rr(-w/2,-h,w,h,40); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=10; rr(-w/2,-h,w,h,40); ctx.stroke(); ctx.fillStyle='rgba(255,255,255,0.7)'; rr(-w/2+30,-h+30,40,h*0.5,20); ctx.fill(); rr(-w/2+86,-h+30,18,h*0.25,9); ctx.fill();
  ctx.restore(); }
function rama(x0,x1,y,t){ ctx.save(); ctx.strokeStyle='#7A4A22'; ctx.lineCap='round'; ctx.lineWidth=40; ctx.beginPath(); ctx.moveTo(x0,y+30); ctx.quadraticCurveTo((x0+x1)/2,y-14+Math.sin(t)*4,x1,y+10); ctx.stroke();
  ctx.lineWidth=14; ctx.strokeStyle='#9C6230'; ctx.beginPath(); ctx.moveTo(x0+40,y+10); ctx.quadraticCurveTo((x0+x1)/2,y-26,x1-40,y-4); ctx.stroke();
  for(const [hx,a] of [[x0+90,-2.4],[x1-120,-0.7],[(x0+x1)/2+40,-1.9]]) hoja(hx,y-6,120,a,'#3FC46E'); ctx.restore(); }
function luna(x,y,r,t){ ctx.save(); ctx.fillStyle='rgba(255,246,200,0.25)'; blob(x,y,r*1.5+Math.sin(t*2)*6); ctx.fillStyle='#FFF4C2'; blob(x,y,r); ctx.fillStyle='#F2E29A'; blob(x-r*0.3,y+r*0.2,r*0.18); blob(x+r*0.3,y-r*0.25,r*0.12); ctx.restore();
  for(let i=0;i<10;i++){ ctx.globalAlpha=0.5+0.5*Math.sin(t*3+i); estrella4(80+rand(i+70)*920,250+rand(i+80)*650,10+rand(i)*10,'#FFF4C2'); } ctx.globalAlpha=1; }
function zzz(t,x,y){ ctx.save(); ctx.font=fuente(56); ctx.textAlign='center'; for(let i=0;i<3;i++){ const ph=((t*0.9+i/3)%1); ctx.globalAlpha=Math.sin(ph*Math.PI); ctx.fillStyle='#FFFFFF'; ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=8;
  ctx.strokeText('Z',x+ph*90,y-ph*170); ctx.fillText('Z',x+ph*90,y-ph*170);} ctx.restore(); }
function taco(x,y,s,t,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); ctx.rotate(Math.sin(t*3)*0.06);
  ctx.fillStyle='#3FC46E'; blob(-50,-40,34); blob(0,-56,36); blob(50,-40,34); ctx.fillStyle='#E23D5B'; blob(-20,-62,18); blob(34,-60,16); ctx.fillStyle='#C8702E'; blob(0,-40,46);
  ctx.fillStyle='#FFD782'; ctx.beginPath(); ctx.arc(0,-10,110,Math.PI*0.05,Math.PI*0.95,false); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.ellipse(0,-14,110,24,0,0,Math.PI); ctx.fill();
  ctx.fillStyle='#E8B85C'; for(let i=0;i<5;i++) blob(-70+i*35,40+Math.abs(i-2)*-8,7); ctx.restore(); }
function sol(x,y,r,t,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.rotate(t*0.6); ctx.fillStyle='#FFE36B'; for(let i=0;i<12;i++){ ctx.save(); ctx.rotate(i/12*Math.PI*2); rr(-14,-r-70,28,56,14); ctx.fill(); ctx.restore(); }
  ctx.fillStyle='#FFD23F'; blob(0,0,r); ctx.fillStyle='#FFF1A8'; blob(-r*0.3,-r*0.3,r*0.3); ctx.restore(); }
function gotas(t,x0,y0,x1,y1,n=6){ ctx.fillStyle=NECTAR; for(let i=0;i<n;i++){ const ph=((t*3.2+i/n)%1); blob(lerp(x0,x1,ph),lerp(y0,y1,ph)-Math.sin(ph*Math.PI)*30,9+4*Math.sin(ph*Math.PI)); } }
function bichito(x,y,s,t,seed=0){ mosquito(x,y,s,t,{seed,color:'#6E5BB8',dir:-1}); }
const flota=(t,a=18)=>110+Math.sin(t*5.2)*a;

// ---------- escenas ----------
// S1 · cuadro 0 = gancho: Raro colibrí YA chupando una flor gigante a toda velocidad, encima de su "comida del día" (montaña de frascos)
//      y el letrero "30 KG AL DÍA" visible desde el cuadro 0. Fondo magenta selva. Toma: push lento.
function S1(t,sc){ hookFrame(t,sc,false); }
function hookFrame(t,sc,fin){
  const sacude=Math.sin(t*30)*0.025;
  // pila de frascos (la comida del día) debajo de Raro
  const pilaF=[0,1,2,3,4,5].map(i=>[130+i*148,1450]);   // fila de 6 frascos de 5 kg = 30 kg
  pilaF.forEach(([x,y],i)=>frasco(x,y,1.1,'5 KG',1,t+i));
  ocupa(60,1250,940,1450,1.5);
  flor(830,940,1.5,t,1,{sacude,tallo:420});
  gotas(t,710,945,640,942,5);
  const chupa=Math.sin(t*14)*10;
  const ve=!fin && t>=at(4) && t<sc.end-0.1;   // al oír "treinta" mira la montaña de frascos con ojos al doble
  raro({x:400+(ve?0:chupa),y:1200,s:1.08,t,expr:ve?'asombro':'feliz',mira:ve?{x:-0.5,y:0.7}:undefined,piernas:'flota',brazos:ve?'arriba':'frente',disfraz:'colibri',aleteo:1,picoDir:1,picoAng:-0.02,
        alto:Math.sin(t*5)*16,tilt:ve?-0.04:0.08,rubor:1,sq:fin?0:gelatina(t,at(4)),wob:fin?0:wobble(t,at(4))});
  letrero('¡30 KG AL DÍA!',540,400,fin?1:1,'madera',{sinPalo:true,tam:84,t,t0:-1});
  if(!fin){ chispas(t,at(4),540,400,1.4,'#FFD23F'); estrellitas(t,at(4),510,1250); }
}
// S2 · báscula: Raro de pie en una báscula que marca 60 KG; a su lado aparece un frasco gigante de 30 KG (la mitad). Al "¿y por qué tanto?" mira a cámara.
//      Fondo turquesa interior. Toma: paneo-der.
function S2(t,sc){
  const c=caida(t,sc.start); const pre=t<at(16);
  const kg=t<at(13)? contador(t,sc.start+0.1,Math.max(0.2,at(13)-sc.start-0.2),0,60,' KG') : '60 KG';
  ctx.fillStyle='#1E1A2E'; rr(222,1290,350,170,30); ctx.fill(); ctx.fillStyle='#F4F1FF'; rr(212,1280,350,160,30); ctx.fill();
  ocupa(212,1280,562,1440,2);
  const mira=t>=at(17);
  raro({x:387,y:1290,s:1.0,t,expr:mira?'sospecha':(pre?'orgullo':'asombro'),mira:mira?{x:0.6,y:0}:undefined,brazos:mira?'jarras':(pre?'jarras':'arriba'),disfraz:'colibri',aleteo:0,picoDir:1,
        sq:c.sq+gelatina(t,at(16)),alto:c.alto,wob:c.wob+wobble(t,at(16))});
  const k=popIn(t,at(16));
  frasco(760,1440,2.4,'30 KG',k,t);
  if(t<at(16)) letrero('TU PESO: '+kg,540,420,popIn(t,sc.start+0.05),'panel',{tam:76,t,t0:sc.start});
  else letrero('LA MITAD DE TU PESO',540,440,popIn(t,at(16)),'pergamino',{tam:56,t,t0:at(16)});
  chispas(t,at(16),760,1080,1.4,'#FFD23F');
}
// S3 · corazón: Raro flotando con un corazón enorme latiendo a lo loco sobre el pecho; el panel cuenta 70 → 1,200 y llega ANTES de "mil doscientas".
//      Fondo mandarina cerros. Toma: push a su cara.
function S3(t,sc){
  const bpm=lerp(70,1200,easeOut(prog(t,sc.start,at(26)-sc.start-0.1)));
  const vib=Math.sin(t*90)*4*(bpm/1200);
  raro({x:540+vib,y:1360,s:1.15,t,expr:t>=at(26)?'terror':'asombro',piernas:'flota',brazos:'arriba',disfraz:'colibri',aleteo:1,picoDir:-1,alto:flota(t,12),tilt:-0.05});
  corazon(540+vib,1360-flota(t,12)-150,130,t,Math.min(bpm,600),1);
  letrero(Math.round(bpm).toLocaleString('es-MX')+' LATIDOS/MIN',540,460,popIn(t,sc.start+0.05),'panel',{tam:66,t,t0:sc.start});
  lineasVelocidad(t,at(26),540,1050); ondaChoque(t,at(26),540,1200,'#FFFFFF');
}
// S4 · el tuyo: Raro señala a cámara; a la derecha, un corazón tranquilo en un cojín con letrero "TÚ: 70". Contraste: el de Raro sigue vibrando.
//      Fondo limón interior. Toma: paneo-izq.
function S4(t,sc){
  raro({x:330,y:1420,s:1.0,t,expr:'sospecha',mira:{x:0.4,y:0},brazos:'senala',disfraz:'colibri',aleteo:1,picoDir:-1,alto:flota(t,10)-40,sq:gelatina(t,sc.start+0.1)});
  corazon(330+Math.sin(t*90)*3,1270-flota(t,10),70,t,600,1);
  ctx.fillStyle='#E23D5B'; rr(640,1300,260,90,40); ctx.fill(); ctx.fillStyle='#FF6B8A'; rr(650,1290,240,60,30); ctx.fill();
  corazon(770,1170,150,t,70,popIn(t,sc.start+0.15));
  letrero('TÚ: 70',770,420,popIn(t,at(37)-0.25),'madera',{sinPalo:true,tam:90,t,t0:at(37)-0.25});
  if(t>at(37)) estrellitas(t,at(37),770,1000);
}
// S5 · alas: Raro vuela por el cielo con las alas hechas un borrón; panel 0 → 50 POR SEGUNDO (llega antes de "cincuenta"). Rachas de viento.
//      Fondo cielo. Toma: paneo-der.
function S5(t,sc){
  rachas(t,1.2,0.6);
  const lt=t-sc.start, x=420+Math.sin(lt*2.2)*90;
  const n=Math.round(lerp(0,50,easeOut(prog(t,sc.start+0.1,at(43)-sc.start-0.2))));
  raro({x,y:1300,s:1.2,t,expr:t>=at(44)?'risa':'asombro',piernas:'flota',brazos:'corre',disfraz:'colibri',aleteo:1.3,picoDir:1,alto:flota(t,30),tilt:0.18,viento:1});
  letrero(n+' ALETEOS POR SEGUNDO',540,440,popIn(t,sc.start+0.05),'panel',{tam:50,t,t0:sc.start});
  if(t>at(44)) lineasVelocidad(t,at(44),x,1000);
  chispas(t,at(44),x-200,1000,1.2); chispas(t,at(44)+0.05,x+200,1000,1.2);
}
// S6 · cada 15 minutos: reloj gigante que gira rápido y Raro yendo y viniendo a la flor en latigazos (se vacía, regresa).
//      Fondo violeta selva. Toma: orbita.
function S6(t,sc){
  reloj(540,440,135,t,6,popIn(t,sc.start+0.05));
  letrero('CADA 15 MIN',540,660,popIn(t,at(50)),'madera',{sinPalo:true,tam:60,t,t0:at(50)});
  flor(800,1120,1.0,t,1);
  const lt=t-sc.start, ida=(Math.sin(lt*5.2)+1)/2;   // va a la flor y regresa
  const x=lerp(330,560,easeInOut(ida));
  raro({x,y:1400,s:1.0,t,expr:ida>0.7?'feliz':'yavalio',piernas:'flota',brazos:'corre',disfraz:'colibri',aleteo:1,picoDir:1,alto:flota(t,14)+90,tilt:0.15*(Math.cos(lt*5.2))});
  if(ida>0.85) gotas(t,700,1120,x+250,1170,4);
}
// S7 · tu serie: Raro en el sillón con el control viendo un capítulo; la barra del capítulo apenas avanza y salta la alarma "¡HORA DE COMER!" → Raro sale disparado.
//      Fondo turquesa interior. Toma: push.
function S7(t,sc){
  // tele
  ctx.fillStyle='#1E1A2E'; rr(590,880,360,260,30); ctx.fill(); ctx.fillStyle='#4CC9F0'; rr(612,902,316,190,18); ctx.fill();
  ctx.fillStyle='#FFFFFF'; ctx.font=fuente(40); ctx.textAlign='center'; ctx.fillText('CAP. 1',770,980); ctx.fillStyle='rgba(255,255,255,0.4)'; rr(640,1040,260,16,8); ctx.fill();
  ctx.fillStyle='#D7FF3D'; rr(640,1040,260*Math.min(0.33,prog(t,sc.start,3)*0.33),16,8); ctx.fill();
  ctx.fillStyle='#1E1A2E'; ctx.fillRect(760,1140,20,120); rr(680,1250,180,24,12); ctx.fill();
  ocupa(590,880,950,1270,2);
  // sillón
  ctx.fillStyle='#FF5FA2'; rr(110,1170,520,180,60); ctx.fill(); ctx.fillStyle='#E23D8A'; rr(90,1260,560,170,50); ctx.fill(); rr(70,1200,90,230,40); ctx.fill(); rr(580,1200,90,230,40); ctx.fill();
  const al=t>=at(65), b=brinco(t,at(65)+0.05,0.5,300);
  raro({x:370+(al?prog(t,at(66),0.4)*130:0),y:1330,s:0.95,t,expr:al?'terror':'feliz',brazos:al?'arriba':'frente',piernas:al?'flota':'quieto',disfraz:'colibri',aleteo:al?1:0,picoDir:1,
        alto:b.alto,sq:b.sq,wob:wobble(t,at(65))});
  bocadillo(540,560,'¡HORA DE COMER!',popIn(t,at(65)-0.1),56,'#FFD23F');
  if(al) chispas(t,at(65),540,560,1.3,'#FFFFFF');
}
// S8 · escala humana: regla gigante al lado; Raro crece de tamaño pájaro a tamaño persona en "escala" (puf de crecimiento).
//      Fondo mandarina ciudad. Toma: sube.
function S8(t,sc){
  ctx.fillStyle='#FFF4DC'; rr(820,620,110,820,18); ctx.fill(); ctx.fillStyle='#7A3A12'; for(let i=0;i<16;i++) ctx.fillRect(820,640+i*50,i%2?30:56,7);
