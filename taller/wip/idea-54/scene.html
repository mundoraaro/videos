// hielo-001 — "¡Si se derrite todo el hielo, despídete de Cancún!" Raro playero flotando con su flotador mientras el mar sube en Cancún;
// puf a parka (Antártida), buzo (mar +70 m), playero (CDMX), piyama (días más largos), parka de patinadora, anciano (5,000 años), playero (loop).
const PI=Math.PI;
const PAST=['#FFB8D2','#B8E6FF','#FFE3A3','#C9F2B8','#D9C2FF','#FFC9A8'];
const MAR1='#1F8FE0', MAR2='#8FE6FF';
// ---------- helpers ----------
function ola(x,t,amp,front){ return Math.sin(x*0.012+t*(front?3.1:2.3))*amp+Math.sin(x*0.031-t*1.7)*amp*0.35; }
function agua(t,y,o={}){ const a=o.a??1, amp=o.amp??16, front=!!o.front, c1=o.c1||MAR1, c2=o.c2||MAR2;
  ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=c1; ctx.beginPath(); ctx.moveTo(-300,2400);
  for(let x=-300;x<=1380;x+=20) ctx.lineTo(x,y+ola(x,t,amp,front)); ctx.lineTo(1380,2400); ctx.closePath(); ctx.fill();
  if(!front){ ctx.fillStyle='rgba(255,255,255,0.10)'; for(let i=0;i<5;i++){ const yy=y+60+i*90; rr(-200+((i*230+t*40)%300),yy,700,14,7); ctx.fill(); } }
  ctx.globalAlpha=Math.min(1,a+0.25); ctx.strokeStyle=c2; ctx.lineWidth=front?12:16; ctx.lineCap='round'; ctx.beginPath();
  for(let x=-300;x<=1380;x+=20){ const yy=y+ola(x,t,amp,front); x===-300?ctx.moveTo(x,yy):ctx.lineTo(x,yy); } ctx.stroke(); ctx.restore(); }
function burbujas(t,x,y,n=6,s=1){ ctx.save(); ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=4*s;
  for(let i=0;i<n;i++){ const u=(t*0.9+i/n)%1; ctx.globalAlpha=1-u; ctx.beginPath(); ctx.arc(x+Math.sin(t*4+i)*20*s+(i%3-1)*30*s,y-u*260*s,(8+rand(i)*10)*s,0,PI*2); ctx.stroke(); } ctx.restore(); }
function salpica(t,t0,x,y,s=1){ const u=(t-t0)/0.5; if(u<0||u>1) return; ctx.save(); ctx.fillStyle=MAR2;
  for(let i=0;i<9;i++){ const a=-PI*0.15-i/8*PI*0.7, v=(260+rand(i)*200)*s; ctx.globalAlpha=1-u; blob(x+Math.cos(a)*v*u,y+Math.sin(a)*v*u+500*u*u*s,(14-u*8)*s); } ctx.restore(); }
function cubo(x,y,s,t,melt=0,k=1){ if(k<=0) return; const w=240*s*k, h=240*s*k*(1-0.6*melt);
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(143,230,255,0.6)'; ctx.beginPath(); ctx.ellipse(0,0,w*(0.62+melt*0.9),w*0.1*(1+melt),0,0,PI*2); ctx.fill();
  ctx.fillStyle='#8ED6F0'; rr(-w/2,-h,w,h,w*0.2); ctx.fill();
  ctx.fillStyle='#D8F8FF'; rr(-w/2,-h,w*0.86,h*0.9,w*0.18); ctx.fill();
  ctx.fillStyle='#BDEFFF'; rr(-w*0.3,-h*0.55,w*0.5,h*0.3,w*0.1); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.9)'; rr(-w*0.38,-h*0.85,w*0.1,h*0.45,w*0.05); ctx.fill(); blob(-w*0.2,-h*0.8,w*0.035);
  ctx.fillStyle='#7FD8FF'; for(let i=0;i<4;i++){ const u=(t*1.3+i/4)%1; const gx=(-0.38+i*0.26)*w; ctx.globalAlpha=1-u; ctx.beginPath(); ctx.ellipse(gx,-h*0.06+u*w*0.22,w*0.028,w*0.042,0,0,PI*2); ctx.fill(); }
  ctx.globalAlpha=1; ctx.restore(); ocupa(x-w/2,y-h,x+w/2,y,1.5); }
function palmera(x,y,s,t){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.strokeStyle='#A8703C'; ctx.lineWidth=36; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(50,-260,-20,-500); ctx.stroke(); ctx.strokeStyle='#8A5A2E'; ctx.lineWidth=6;
  for(let i=1;i<8;i++){ const u=i/8; const px=lerp(0,-20,u)+Math.sin(u*PI)*28; ctx.beginPath(); ctx.moveTo(px-16,-u*500); ctx.lineTo(px+16,-u*500-8); ctx.stroke(); }
  ctx.translate(-20,-500); ctx.rotate(Math.sin(t*1.5)*0.05);
  for(let i=0;i<7;i++){ const a=-PI+0.15+i*(PI-0.3)/6; ctx.save(); ctx.rotate(a); ctx.fillStyle=i%2?'#26B36A':'#3FD07F'; ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(90,-50+Math.sin(t*2+i)*6,190,40); ctx.quadraticCurveTo(90,10,0,0); ctx.fill(); ctx.restore(); }
  ctx.fillStyle='#7A4F2C'; blob(-14,12,20); blob(14,16,18); ctx.restore(); }
function edif(x,y,w,h,c,k=1){ if(k<=0) return; const hh=h*k; ctx.fillStyle=mix(c,'#3B2B6A',0.3); rr(x-w/2+14,y-hh+10,w,hh,22); ctx.fill(); ctx.fillStyle=c; rr(x-w/2,y-hh,w,hh,22); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.75)'; const cols=Math.max(1,Math.floor((w-30)/62)), rows=Math.floor((hh-40)/64);
  for(let r=0;r<rows;r++) for(let q=0;q<cols;q++){ rr(x-w/2+22+q*((w-30)/cols),y-hh+28+r*64,(w-30)/cols-22,36,9); ctx.fill(); } }
function sol(x,y,r,t,lentes=true){ ctx.save(); ctx.translate(x,y); ctx.rotate(t*0.6); ctx.fillStyle='#FFE66B'; for(let i=0;i<10;i++){ ctx.rotate(PI/5); rr(-14,-r*1.55,28,r*0.4,14); ctx.fill(); } ctx.restore();
  ctx.fillStyle='#FFD23F'; blob(x,y,r); ctx.fillStyle='#FFE98A'; blob(x-r*0.25,y-r*0.25,r*0.45);
  if(lentes){ ctx.fillStyle='#1E1A2E'; rr(x-r*0.7,y-r*0.2,r*0.62,r*0.38,r*0.15); ctx.fill(); rr(x+r*0.08,y-r*0.2,r*0.62,r*0.38,r*0.15); ctx.fill(); ctx.fillRect(x-r*0.1,y-r*0.12,r*0.2,r*0.08);
    ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=r*0.07; ctx.beginPath(); ctx.arc(x,y+r*0.32,r*0.28,0.2,PI-0.2); ctx.stroke(); }
  ocupa(x-r*1.4,y-r*1.4,x+r*1.4,y+r*1.4,1); }
function sudor(t,x,y){ ctx.fillStyle='#7FD8FF'; for(let i=0;i<3;i++){ const u=((t*1.5+i/3)%1); ctx.globalAlpha=1-u; ctx.beginPath(); ctx.ellipse(x+(i-1)*40,y+u*80,8,12,0,0,PI*2); ctx.fill(); } ctx.globalAlpha=1; }
function signos(t,x,y){ ctx.font=fuente(110); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#FFFFFF';
  for(let i=0;i<3;i++){ const u=(t*0.8+i/3)%1; ctx.globalAlpha=Math.sin(u*PI); ctx.fillText('?',x+(i-1)*190,y-u*110); } ctx.globalAlpha=1; }
function vaso(x,y,k,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.rotate(Math.sin(t*9)*0.12);
  ctx.fillStyle='rgba(220,250,255,0.55)'; ctx.beginPath(); ctx.moveTo(-70,-190); ctx.lineTo(70,-190); ctx.lineTo(55,0); ctx.lineTo(-55,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,170,90,0.7)'; ctx.beginPath(); ctx.moveTo(-64,-120); ctx.lineTo(64,-120); ctx.lineTo(55,0); ctx.lineTo(-55,0); ctx.closePath(); ctx.fill();
  for(const [cx,cy,a] of [[-25,-130,0.3],[22,-150,-0.4],[0,-95,0.1]]){ ctx.save(); ctx.translate(cx,cy+Math.sin(t*6+cx)*4); ctx.rotate(a); ctx.fillStyle='#E8FBFF'; rr(-22,-22,44,44,10); ctx.fill(); ctx.fillStyle='#FFFFFF'; rr(-14,-16,10,22,5); ctx.fill(); ctx.restore(); }
  ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(-50,-175); ctx.lineTo(-42,-20); ctx.stroke(); ctx.restore();
  ocupa(x-80*k,y-200*k,x+80*k,y,1.5); }
function globo(x,y,r,t,o={}){ const vel=o.vel??20; ctx.save(); ctx.translate(x,y); ctx.fillStyle='rgba(140,220,255,0.3)'; blob(0,0,r*1.12);
  ctx.scale(o.ancho||1,1); ctx.fillStyle='#3AB6FF'; blob(0,0,r);
  ctx.save(); ctx.beginPath(); ctx.arc(0,0,r,0,PI*2); ctx.clip(); ctx.fillStyle='#7FD34E'; const of=((o.giro??t*vel)%(r*4)+r*4)%(r*4);
  const of2=((o.giro??t*vel)%(r*2)+r*2)%(r*2); for(const [a,b,c] of [[-0.5,-0.3,0.4],[0.4,0.15,0.35],[-0.1,0.45,0.22],[0.7,-0.5,0.2]]){ for(const k of [-2,-1,0,1]) blob(a*r+of2+k*r*2,b*r,c*r); }
  const cap=o.cap??1; ctx.fillStyle='#F4FBFF'; ctx.beginPath(); ctx.ellipse(0,r*0.98,r*0.85*cap,r*0.3*cap,0,0,PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(0,-r*0.98,r*0.6*cap,r*0.2*cap,0,0,PI*2); ctx.fill();
  if(o.brillaSur){ ctx.globalAlpha=0.5+0.5*Math.sin(t*8); ctx.strokeStyle='#D7FF3D'; ctx.lineWidth=14; ctx.beginPath(); ctx.ellipse(0,r*0.95,r*0.88,r*0.33,0,PI,PI*2); ctx.stroke(); ctx.globalAlpha=1; }
  ctx.restore(); ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.ellipse(-r*0.4,-r*0.45,r*0.25,r*0.1,-0.5,0,PI*2); ctx.fill(); ctx.restore();
  ocupa(x-r*(o.ancho||1),y-r,x+r*(o.ancho||1),y+r,1.5); }
function reloj(x,y,r,t,k=1,txt='6:00',ring=true){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); if(ring) ctx.rotate(Math.sin(t*30)*0.08);
  ctx.fillStyle='#FFD23F'; blob(-r*0.7,-r*0.85,r*0.32); blob(r*0.7,-r*0.85,r*0.32); ctx.fillStyle='#FF5FA2'; blob(0,0,r); ctx.fillStyle='#FFF4DC'; blob(0,0,r*0.8);
  ctx.font=fuente(r*0.5); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#1E1A2E'; ctx.fillText(txt,0,4); ctx.restore();
  ocupa(x-r,y-r*1.2,x+r,y+r,2); }
function cama(x,y,s,frente){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  if(!frente){ ctx.fillStyle='#8A5BD6'; rr(-330,-430,90,470,40); ctx.fill(); ctx.fillStyle='#A47BEA'; rr(-310,-410,50,420,25); ctx.fill(); }
  else { ctx.fillStyle='#FFFFFF'; rr(-270,-200,250,90,45); ctx.fill(); ctx.fillStyle='#FF8FB8'; rr(-200,-150,560,180,60); ctx.fill();
    ctx.fillStyle='#FFB8D2'; for(let i=0;i<5;i++){ blob(-140+i*110,-90,22); } ctx.fillStyle='#6B3FB8'; rr(-300,10,700,40,20); ctx.fill(); }
  ctx.restore(); }
function zzz(t,x,y){ ctx.font=fuente(70); ctx.textAlign='center'; ctx.fillStyle='#FFFFFF'; for(let i=0;i<3;i++){ const u=(t*0.7+i/3)%1; ctx.globalAlpha=Math.sin(u*PI); ctx.fillText('Z',x+u*120,y-u*200); } ctx.globalAlpha=1; }
function montana(x,y,w,h,P){ ctx.fillStyle=mix(P.oscuro,'#000000',0.1); ctx.beginPath(); ctx.moveTo(x-w/2,y); ctx.quadraticCurveTo(x-w*0.2,y-h*1.05,x,y-h); ctx.quadraticCurveTo(x+w*0.2,y-h*1.05,x+w/2,y); ctx.closePath(); ctx.fill();
  ctx.fillStyle=P.medio; ctx.beginPath(); ctx.moveTo(x-w*0.45,y); ctx.quadraticCurveTo(x-w*0.2,y-h*0.98,x-w*0.02,y-h*0.97); ctx.quadraticCurveTo(x-w*0.05,y-h*0.5,x+w*0.05,y); ctx.closePath(); ctx.fill(); }
function nubeLluvia(t,x,y,s,int=1){ ctx.save(); ctx.strokeStyle='rgba(200,235,255,0.85)'; ctx.lineWidth=7*s; ctx.lineCap='round';
  for(let i=0;i<Math.round(22*int);i++){ const u=(t*2.6+rand(i))%1; const xx=x+(rand(i+3)-0.5)*380*s; const yy=y+40*s+u*620*s; ctx.globalAlpha=0.9; ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx-10*s,yy+46*s); ctx.stroke(); }
  ctx.globalAlpha=1; ctx.fillStyle='#7C6FA8'; nube(x,y,1.5*s); ctx.fillStyle='#9A8DC6'; nube(x-20*s,y-18*s,1.2*s); ctx.restore(); ocupa(x-220*s,y-110*s,x+220*s,y+90*s,1.2); }
function tumbona(x,y,s){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.strokeStyle='#8A5A2E'; ctx.lineWidth=14; ctx.beginPath(); ctx.moveTo(-200,0); ctx.lineTo(-120,-90); ctx.moveTo(180,0); ctx.lineTo(120,-90); ctx.stroke();
  for(let i=0;i<6;i++){ ctx.fillStyle=i%2?'#FFFFFF':'#FF5FA2'; ctx.save(); ctx.translate(-150+i*55,-100-(i<2?(2-i)*60:0)); ctx.rotate(i<2?-0.8:0); rr(-28,-16,56,32,8); ctx.fill(); ctx.restore(); } ctx.restore(); }
function sombrilla(x,y,s,t){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.rotate(Math.sin(t*1.2)*0.03); ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=14; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-420); ctx.stroke();
  for(let i=0;i<6;i++){ ctx.fillStyle=i%2?'#FFFFFF':'#FF4D5E'; ctx.beginPath(); ctx.moveTo(0,-440); ctx.arc(0,-420,230,PI+i*PI/6,PI+(i+1)*PI/6); ctx.closePath(); ctx.fill(); } ctx.restore(); }
function pez(x,y,s,t,o={}){ ctx.save(); ctx.translate(x,y); ctx.scale(s*(o.dir||1),s); const c=o.color||'#FF9F6B';
  ctx.fillStyle=mix(c,'#5B4B8A',0.25); ctx.save(); ctx.translate(-120,0); ctx.rotate(Math.sin(t*10)*0.3); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-80,-60); ctx.lineTo(-80,60); ctx.closePath(); ctx.fill(); ctx.restore();
  ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(0,0,140,90,0,0,PI*2); ctx.fill(); ctx.fillStyle=mix(c,'#FFFFFF',0.4); ctx.beginPath(); ctx.ellipse(10,30,90,40,0,0,PI*2); ctx.fill();
  ctx.fillStyle='#1E1A2E'; blob(70,-26,16); ctx.fillStyle='#FFFFFF'; blob(75,-31,5); ctx.restore(); }
function regla(x,y0,y1,t,P){ ctx.fillStyle='#FFF4DC'; rr(x-46,y1-20,92,y0-y1+40,20); ctx.fill(); ctx.fillStyle='#E7D3A6'; rr(x+10,y1-20,36,y0-y1+40,18); ctx.fill();
  ctx.font=fuente(34); ctx.textAlign='left'; ctx.textBaseline='middle';
  for(let m=0;m<=70;m+=10){ const y=lerp(y0,y1,m/70); ctx.fillStyle='#5A3A12'; rr(x-46,y-4,m%20===0?58:38,8,4); ctx.fill(); if(m%20===0&&m>0){ ctx.fillStyle='#FFFFFF'; ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=7; ctx.strokeText(m+' M',x+56,y); ctx.fillText(m+' M',x+56,y); } }
  ocupa(x-50,y1-20,x+160,y0+20,1.5); }
function casita(x,y,w,h,c){ ctx.fillStyle=mix(c,'#3B2B6A',0.25); rr(x-w/2+10,y-h+8,w,h,16); ctx.fill(); ctx.fillStyle=c; rr(x-w/2,y-h,w,h,16); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.8)'; rr(x-w*0.3,y-h*0.7,w*0.22,h*0.28,8); ctx.fill(); rr(x+w*0.08,y-h*0.7,w*0.22,h*0.28,8); ctx.fill(); ctx.fillStyle=mix(c,'#3B2B6A',0.45); rr(x-w*0.12,y-h*0.38,w*0.24,h*0.38,10); ctx.fill(); }
function relojArena(x,y,s,t,u){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle='#A8703C'; rr(-110,-30,220,30,12); ctx.fill(); rr(-110,-330,220,30,12); ctx.fill();
  ctx.fillStyle='rgba(220,250,255,0.6)'; ctx.beginPath(); ctx.moveTo(-85,-300); ctx.quadraticCurveTo(-85,-180,0,-165); ctx.quadraticCurveTo(-85,-150,-85,-30); ctx.lineTo(85,-30); ctx.quadraticCurveTo(85,-150,0,-165); ctx.quadraticCurveTo(85,-180,85,-300); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#FFD23F'; const top=1-u; ctx.beginPath(); ctx.moveTo(-70*top,-180-110*top); ctx.lineTo(70*top,-180-110*top); ctx.lineTo(0,-170); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-80,-32); ctx.lineTo(80,-32); ctx.lineTo(0,-32-120*u); ctx.closePath(); ctx.fill(); ctx.fillRect(-3,-170,6,138); ctx.restore(); ocupa(x-120*s,y-340*s,x+120*s,y,1.5); }
function bloqueHielo(x,y,w,h,k){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.fillStyle='#8ED6F0'; rr(-w/2,-h,w,h,20); ctx.fill(); ctx.fillStyle='#D8F8FF'; rr(-w/2,-h,w*0.9,h*0.82,18); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.9)'; rr(-w*0.4,-h*0.75,w*0.25,h*0.16,8); ctx.fill(); ctx.restore(); }

// ---------- gancho y loop: Cancún se inunda ----------
const WL=lt=>lerp(1540,1000,easeInOut(clamp((lt+3)/6)));
function escenaCancun(t,lt){
  const wl=WL(lt);
  letrero('ADIÓS, CANCÚN',540,420,1,'madera',{tam:72,t,t0:-1});
  ctx.fillStyle='#FFE3A3'; rr(-200,1300,1480,700,0); ctx.fill(); ctx.fillStyle='#F5CF84'; for(let i=0;i<8;i++) blob(80+i*140,1400+(i%2)*60,18);
  edif(160,1330,220,560,'#FFB8D2'); edif(400,1330,170,420,'#FFE3A3'); edif(900,1330,220,640,'#C9F2B8');
  cubo(240,wl+60+Math.sin(t*2)*8,1.25,t,clamp((lt+3)/6)*0.5);
  agua(t,wl-8,{a:1});
  palmera(860,1460,1.0,t);
  agua(t,wl+30,{a:0.9,c1:'#2BA0F0'});
  const rs=1.0, ry=wl+70*rs+Math.sin(t*3.2)*10;
  raro({x:610,y:ry,s:rs,t,expr:'terror',brazos:'arriba',piernas:'flota',disfraz:'playero',sinLentes:true,tilt:Math.sin(t*2.4)*0.09,ojos:1.3,sinSombra:true,viento:0.6});
  agua(t,wl+70,{a:0.55,front:true,c1:'#3CB8FF'});
  burbujas(t,610,wl+150,5,0.8);
  const per=0.9, k=Math.floor((lt+30)/per); salpica(t,t-((lt+30)%per),610,wl+20,0.9);
}

// ========== ESCENAS ==========
// S1 (0–2.9) GANCHO: playa de Cancún (liso turquesa con arena, hoteles y palmera). El mar ya está subiendo en el cuadro 0: Raro playero flota con su flotador, aterrado, brazos arriba; un hielo gigante se derrite a la izquierda. Letrero ADIÓS, CANCÚN desde el cuadro 0. Toma: push.
function S1(t,sc){ escenaCancun(t,t); }
// S2 (2.9–5.0) "¿Cuánta agua puede salir de unos hielitos?" Cerros limón. Raro playero (seco) cae con boing sosteniendo un vaso con 3 hielitos y mira a cámara con sospecha; signos de pregunta. Toma: push leve.
function S2(t,sc){ const c={alto:0,sq:gelatina(t,sc.start+0.02),wob:wobble(t,sc.start+0.02)}; signos(t,540,760);
  raro({x:560,y:SUELO,s:1.35,t,expr:t>=at(15)?'sospecha':'asombro',mira:{x:0,y:0},brazos:'frente',disfraz:'playero',sinFlotador:true,alto:c.alto,sq:c.sq,wob:c.wob,tilt:Math.sin(t*6)*0.04});
  vaso(560,SUELO-150-c.alto,1.15,t); if(t>=at(15)) chispas(t,at(15),560,SUELO-360,1.1,'#E8FBFF');
  letrero('¿UNOS HIELITOS?',540,420,popIn(t,sc.start+0.05),'pergamino',{tam:70,t,t0:sc.start}); }

// Captions: bloques cortos (máx. 13 letras) y pop corto desde 88 % para que ninguna palabra salga diminuta.
function buildChunks(){ CH=[]; let cur=[]; W.forEach((w,i)=>{ const len=cur.concat([i]).map(j=>W[j].t).join(' ').length; if(cur.length&&(len>13)){CH.push(cur);cur=[];} cur.push(i); if(/[.,?!:…]$/.test(w.t)||cur.length>=3){CH.push(cur);cur=[];} }); if(cur.length) CH.push(cur); }
function captions(t){
  if(window.HIDE_CAPTIONS_LAST!==false && t>=SC[SC.length-1].start-0.05) return;
  let ci=-1; for(let c=0;c<CH.length;c++){ if(W[CH[c][0]].s-0.05<=t) ci=c; }
  if(ci<0) return; const ch=CH[ci]; const last=W[ch[ch.length-1]];
  if(t>last.e+0.6 && (ci+1>=CH.length || t<W[CH[ci+1][0]].s-0.05)) return;
  const KW=window.KEYWORDS||[];
  let size=window.CAPTION_SIZE||80; const words=ch.map(i=>W[i].t.toUpperCase());
  const big=i=>KW.includes(i)?1.22:1;
  const widths=()=>ch.map((i,n)=>{ctx.font=fuente(size*big(i));return ctx.measureText(words[n]).width;});
  ctx.font=fuente(size); let sp=ctx.measureText(' ').width, ws=widths(), total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);
  if(total>800){size=Math.floor(size*800/total); ctx.font=fuente(size); sp=ctx.measureText(' ').width; ws=widths(); total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);}
  if(CAPPOS[ci]==null) CAPPOS[ci]=lugarCaption(total,size*1.25);
  const y=CAPPOS[ci];
  let x=540-total/2;
  ctx.textBaseline='middle'; ctx.textAlign='center'; ctx.lineJoin='round';
  ch.forEach((i,n)=>{const w=words[n], wd=ws[n], kw=KW.includes(i);
    const k=t<W[i].s?0:(kw?popIn(t,W[i].s,0.22):back((t-W[i].s)/0.16));
    if(k>0){ const sz=size*big(i); ctx.save(); ctx.translate(x+wd/2,y); const sc=lerp(0.88,1,k)*(kw?1:1); ctx.scale(sc,sc); if(kw) ctx.rotate(Math.sin(t*5+i)*0.03);
      ctx.font=fuente(sz);
      ctx.fillStyle='rgba(20,14,40,0.45)'; ctx.fillText(w,0,sz*0.09);            // sombra
      ctx.lineWidth=sz*0.19; ctx.strokeStyle='#1E1A2E'; ctx.strokeText(w,0,0);       // contorno grueso
      ctx.fillStyle=kw?COL.lime:'#FFFFFF'; ctx.fillText(w,0,0); ctx.restore(); }
    x+=wd+sp*1.25;});
}
