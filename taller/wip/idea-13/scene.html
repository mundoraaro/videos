<script>
// saltar-001 — ¿Qué pasaría si todos saltáramos al mismo tiempo? (idea-13)
// Raro es el ÁRBITRO que organiza el salto de la humanidad; cambia a científico, astronauta, turista y anciano.

// ---------- helpers propios ----------
const hop=(t,per,h,ph=0)=>h*Math.abs(Math.sin(Math.PI*(t/per+ph)));
// gente: frijolitos pastel (personajes secundarios, nunca blancos)
function frijol(x,y,s,c,alto=0,brazos=0,t=0,seed=0){
  ctx.save(); ctx.translate(x,y-alto); ctx.scale(s,s);
  if(alto<4){ ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(0,4+alto,34,8,0,0,Math.PI*2); ctx.fill(); }
  const sh=mix(c,'#5B4B8A',0.28);
  if(brazos){ ctx.strokeStyle=c; ctx.lineWidth=12; ctx.lineCap='round'; for(const k of [-1,1]){ ctx.beginPath(); ctx.moveTo(k*28,-58); ctx.quadraticCurveTo(k*52,-80,k*(40+Math.sin(t*14+seed)*8),-112); ctx.stroke(); } }
  ctx.fillStyle=sh; ctx.beginPath(); ctx.ellipse(3,-48,38,50,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(0,-50,36,48,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(-12,-80,9,6,-0.5,0,Math.PI*2); ctx.fill();
  const bl=parpadeo(t,seed);
  ctx.fillStyle='#1E1A2E'; for(const k of [-1,1]){ ctx.beginPath(); ctx.ellipse(k*12,-60,5,7*bl,0,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
}
// multitud en filas (de atrás hacia adelante); salto(i,fila) devuelve la altura del brinco
function multitud(t,{x0=-40,x1=1120,y0=1180,filas=3,dy=70,dx=70,s0=0.7,ds=0.15,salto=null,brazos=0,seed=0,mueve=0}={}){
  for(let f=0;f<filas;f++){ const s=s0+f*ds, y=y0+f*dy, paso=dx*(s/s0);
    for(let x=x0+((f*37+mueve*(1+f*0.3))%paso+paso)%paso-paso, i=0; x<x1; x+=paso, i++){
      const id=f*100+i+seed, al=salto?salto(id,f):0;
      frijol(x+(rand(id)-0.5)*18, y+(rand(id+5)-0.5)*10, s, PASTELES[(id*7)%PASTELES.length], al, brazos, t, id);
    } }
}
// la Tierra (objeto)
function tierra(x,y,r,t,zz=0){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(255,255,255,0.25)'; blob(0,0,r*1.12);
  ctx.save(); ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.clip();
  ctx.fillStyle='#3AB6FF'; ctx.fillRect(-r,-r,2*r,2*r);
  ctx.fillStyle='#6CE08A'; const off=(t*0.25*r)%(2.6*r);
  for(const [bx,by,br] of [[-0.4,-0.3,0.42],[0.5,0.25,0.35],[0.1,0.6,0.25],[-0.7,0.45,0.22],[0.8,-0.5,0.2]]) for(const k of [0,1]){
    const xx=bx*r+off-k*2.6*r; blob(xx,by*r,br*r); blob(xx+br*r*0.6,by*r+br*r*0.4,br*r*0.7); }
  ctx.fillStyle='rgba(28,121,210,0.35)'; ctx.beginPath(); ctx.arc(r*0.35,r*0.35,r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.8)'; for(let i=0;i<3;i++){ const cx=((i*0.8*r+t*40)%(2.4*r))-1.2*r; rr(cx,-r*0.65+i*r*0.55,r*0.5,r*0.12,r*0.06); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.ellipse(-r*0.4,-r*0.5,r*0.18,r*0.1,-0.6,0,Math.PI*2); ctx.fill();
  if(zz){ ctx.font=fuente(r*0.45); ctx.fillStyle='#FFFFFF'; ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=8; ctx.textAlign='center';
    for(let i=0;i<3;i++){ const u=((t*0.7+i/3)%1); ctx.globalAlpha=Math.sin(u*Math.PI)*zz; const zx=r*0.8+u*r*0.7, zy=-r*0.7-u*r*1.1, sz=0.6+u*0.6;
      ctx.save(); ctx.translate(zx,zy); ctx.scale(sz,sz); ctx.strokeText('z',0,0); ctx.fillText('z',0,0); ctx.restore(); } ctx.globalAlpha=1; }
  ctx.restore(); ocupa(x-r,y-r,x+r,y+r,2);
}
function ondasSonido(t,t0,x,y,c='#FFFFFF',n=4){ if(t<t0) return; ctx.save(); ctx.strokeStyle=c; ctx.lineCap='round';
  for(let i=0;i<n;i++){ const u=((t-t0)*1.4+i/n)%1; ctx.globalAlpha=1-u; ctx.lineWidth=18*(1-u)+4;
    for(const s of [-1,1]){ ctx.beginPath(); ctx.arc(x,y,120+u*420,s>0?-0.6:Math.PI-0.6,s>0?0.6:Math.PI+0.6); ctx.stroke(); } } ctx.restore(); }
function atomo(x,y,s,t){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=8;
  for(let i=0;i<3;i++){ ctx.save(); ctx.rotate(i*Math.PI/3+t*0.6); ctx.beginPath(); ctx.ellipse(0,0,110,38,0,0,Math.PI*2); ctx.stroke();
    const a=t*5+i*2; ctx.fillStyle='#4CC9F0'; blob(Math.cos(a)*110,Math.sin(a)*38,14); ctx.restore(); }
  ctx.fillStyle='#FF5FA2'; blob(-10,-6,24); ctx.fillStyle='#FFD23F'; blob(12,8,22); ctx.restore(); ocupa(x-120*s,y-120*s,x+120*s,y+120*s,2); }
function sismografo(t,x,y,s,amp){ // caja con rollo de papel y aguja que dibuja; amp(tt) da la amplitud
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle='#5A4A8A'; rr(-260,-40,520,200,40); ctx.fill(); ctx.fillStyle='#7B68B5'; rr(-250,-36,500,60,30); ctx.fill();
  ctx.fillStyle='#FFFDF5'; rr(-230,-300,460,270,20); ctx.fill();
  ctx.strokeStyle='#D9D4E8'; ctx.lineWidth=3; for(let gy=-280;gy<-40;gy+=40){ ctx.beginPath(); ctx.moveTo(-230,gy); ctx.lineTo(230,gy); ctx.stroke(); }
  ctx.strokeStyle='#FF4D6D'; ctx.lineWidth=6; ctx.beginPath();
  for(let px=-230;px<=120;px+=4){ const tt=t-(120-px)/260, a=amp(tt); const yy=-165+Math.sin(tt*47)*a*0.6+Math.sin(tt*83)*a*0.4; px===-230?ctx.moveTo(px,yy):ctx.lineTo(px,yy); }
  ctx.stroke();
  const a=amp(t), ny=-165+Math.sin(t*47)*a*0.6+Math.sin(t*83)*a*0.4;
  ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(240,-165); ctx.lineTo(124,ny); ctx.stroke();
  ctx.fillStyle='#FF4D6D'; blob(124,ny,12); ctx.fillStyle='#D7FF3D'; blob(250,-165,24);
  ctx.restore(); ocupa(x-260*s,y-300*s,x+260*s,y+160*s,2);
}
function casita(x,y,s,k){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle='#FFE3A3'; rr(-140,-220,280,220,24); ctx.fill(); ctx.fillStyle='#FF5FA2'; ctx.beginPath(); ctx.moveTo(-180,-200); ctx.lineTo(0,-360); ctx.lineTo(180,-200); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#8D4DFF'; rr(-40,-130,80,130,30); ctx.fill(); ctx.fillStyle='#4CC9F0'; rr(60,-170,56,56,12); ctx.fill(); rr(-116,-170,56,56,12); ctx.fill(); ctx.restore(); }
function avion(x,y,s,rot){ ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s,s);
  ctx.fillStyle='#E9ECF3'; rr(-220,-40,440,80,40); ctx.fill(); ctx.fillStyle='#C9CFDA'; ctx.beginPath(); ctx.moveTo(-40,0); ctx.lineTo(60,0); ctx.lineTo(-30,140); ctx.lineTo(-90,140); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-200,-20); ctx.lineTo(-150,-20); ctx.lineTo(-200,-110); ctx.lineTo(-235,-110); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#4CC9F0'; for(let i=0;i<6;i++){ blob(-100+i*44,-8,10); } rr(160,-22,40,20,8); ctx.fill(); ctx.restore(); }
function piso(c){ ctx.fillStyle=c; ctx.fillRect(-300,SUELO-10,1680,900); }

// ---------- escenas ----------
// S1 cuadro 0: Raro árbitro en pleno brinco con la humanidad; la Tierra dormida ni se entera. Fondo magenta cerros. Toma push.
function S1(t,sc){
  multitud(t,{y0:1210,filas:3,salto:(id)=>hop(t+rand(id)*0.1,0.55,70),brazos:1});
  tierra(830,560,120,t, t>=at(5)?easeOut(prog(t,at(5),0.4)):0);
  const h=hop(t+0.14,0.55,170), land=h<20;
  raro({x:430,y:SUELO,s:1.3,t,expr:t<at(8)?'feliz':'sospecha',brazos:t<at(8)?'arriba':'jarras',disfraz:'arbitro',silbato:t<at(4),alto:t<at(8)?h:0,sq:land&&t<at(8)?0.25:gelatina(t,at(8)),wob:wobble(t,at(8))});
  letrero('¡TODOS A SALTAR!',420,400,1,'madera',{tam:70,t,t0:-1});
  chispas(t,at(8),830,560,1.2);
}
// S2 "Somos 8 mil millones": contador gigante; Raro sorprendido a la derecha. Turquesa ciudad. Toma paneo.
function S2(t,sc){
  cascada(t,at(12),18,(x,y,k,i)=>frijol(x,y,0.75*k,PASTELES[i%6],hop(t+i*0.07,0.5,24)),{x0:120,y0:1120,cols:6,dx:110,dy:110,cada:0.03});
  raro({x:800,y:SUELO,s:1.2,t,expr:t<at(13)?'sospecha':'asombro',brazos:t<at(13)?'jarras':'arriba',disfraz:'arbitro',sq:gelatina(t,at(13)),wob:wobble(t,at(13)),alto:susto(t,at(13)).alto});
  const k=popIn(t,sc.start+0.05);
  letrero(t<at(13)?'¿CUÁNTOS?':contador(t,at(13),0.9,0,8000000000),540,410,k,'panel',{tam:t<at(13)?80:76,t,t0:at(13)});
  chispas(t,at(16),540,410,1.2);
}
// S3 balanza: la Tierra vs. toda la humanidad. Raro en el platillo ligero sale volando. Violeta espacio. Toma pull.
function S3(t,sc){
  const u=easeOut(prog(t,at(20),0.5)), slam=t>=at(23)?1:0, ang=lerp(0,0.32,u)+0.06*slam+wobble(t,at(23),0.08);
  ctx.save(); ctx.translate(540,1000);
  ctx.fillStyle='#FFD23F'; ctx.beginPath(); ctx.moveTo(-60,440); ctx.lineTo(60,440); ctx.lineTo(0,0); ctx.closePath(); ctx.fill();
  ctx.rotate(-ang); ctx.fillStyle='#FFE36E'; rr(-330,-18,660,36,18); ctx.fill(); ctx.restore();
  const L=[540-330*Math.cos(ang),1000+330*Math.sin(ang)], R=[540+330*Math.cos(ang),1000-330*Math.sin(ang)];
  for(const [px,py] of [L,R]){ ctx.strokeStyle='#FFE36E'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px-120,py+200); ctx.moveTo(px,py); ctx.lineTo(px+120,py+200); ctx.stroke();
    ctx.fillStyle='#FFD23F'; ctx.beginPath(); ctx.ellipse(px,py+200,150,30,0,0,Math.PI*2); ctx.fill(); }
  tierra(L[0],L[1]+200-130*popIn(t,at(19)),130*popIn(t,at(19)),t);
  for(let i=0;i<5;i++) frijol(R[0]-40+i*20,R[1]+196,0.22,PASTELES[i],0,0,t,i);
  const fly=t>=at(24)?easeOut(prog(t,at(24),0.5)):0;
  raro({x:R[0]+fly*40,y:R[1]+196-fly*260,s:0.55,t,expr:t<at(24)?'sospecha':'terror',brazos:t<at(24)?'jarras':'arriba',disfraz:'arbitro',tilt:fly*0.5,sinSombra:true});
  letrero('× 10 BILLONES',540,420,popIn(t,at(23)),'piedra',{tam:84,t,t0:at(23)});
  ondaChoque(t,at(24),L[0],L[1]+200); chispas(t,at(24),L[0],L[1]+120,1.3);
}
// S4 puf a científico: con la lupa mira un átomo; "menos que el ancho de un átomo". Mandarina liso (laboratorio). Toma push a la lupa.
function S4(t,sc){
  const P=PAL_ACTUAL; ctx.fillStyle=P.claro; for(let i=0;i<4;i++){ rr(80+i*240,520+Math.sin(t+i)*6,170,300,30); ctx.fill(); }
  ctx.fillStyle=P.medio; rr(-100,1080,1280,90,30); ctx.fill(); piso(P.oscuro);
  for(let i=0;i<3;i++){ ctx.fillStyle=['#4CC9F0','#D7FF3D','#FF5FA2'][i]; rr(700+i*110,960-i*20,60,120+i*20,20); ctx.fill(); }
  const p=pufCambio(t,sc.start+0.05);
  raro({x:390,y:SUELO,s:1.3,t,expr:t<at(36)?'neutral':(t<at(43)?'sospecha':'asombro'),brazos:'senala',disfraz:p.despues?'cientifico':'arbitro',lupa:p.despues,spin:p.spin,sq:gelatina(t,sc.start+0.4),sal:0,
    alto:saleArriba(t,sc.end).alto, wob:wobble(t,at(43))});
  nubePuf(t,sc.start+0.12,390,SUELO-160,1.3);
  atomo(760,760,0.35+0.55*popIn(t,at(37)),t);
  letrero('MENOS QUE UN ÁTOMO',540,400,popIn(t,at(40)),'panel',{tam:62,t,t0:at(40)});
  chispas(t,at(43),760,760,1.1);
}
// S5 cae (salto de escena) y regresa la Tierra a su lugar: marcador EMPATE. Limón cerros. Toma fija->push.
function S5(t,sc){
  const c=caida(t,sc.start);
  raro({x:620,y:SUELO,s:1.3,t,expr:t<at(52)?'orgullo':'yavalio',brazos:t<at(52)?'jarras':'idle',disfraz:'cientifico',alto:c.alto,sq:c.sq+gelatina(t,sc.start+0.34),wob:wobble(t,sc.start+0.34)});
  ondaChoque(t,sc.start+0.34,620,SUELO);
  tierra(240,900,110+8*Math.sin(t*3),t);
  letrero('TÚ 1 – 1 TIERRA',540,410,popIn(t,at(51)),'panel',{tam:72,t,t0:at(51)});
  estrellitas(t,at(52),620,SUELO-560);
}
// S6 todos se juntan en un solo lugar: la gente entra corriendo desde los lados. Cielo ciudad. Toma pull.
function S6(t,sc){
  const u=easeOut(prog(t,at(55),at(62)-at(55)));
  multitud(t,{x0:-700+700*u,x1:420,y0:1220,filas:3,salto:(id)=>hop(t+rand(id),0.3,26*(1-u)+6)});
  multitud(t,{x0:660,x1:1780-700*u,y0:1220,filas:3,salto:(id)=>hop(t+rand(id),0.3,26*(1-u)+6),seed:50});
  const b=brinco(t,at(62),0.5,200);
  raro({x:540,y:SUELO,s:1.25,t,expr:t<at(62)?'sospecha':'orgullo',brazos:t<at(57)?'saluda':'jarras',disfraz:'arbitro',silbato:t>=at(55)&&t<at(60),alto:b.alto,sq:b.sq+gelatina(t,at(62)+0.55),wob:wobble(t,at(62)+0.55)});
  letrero('¡TODOS AQUÍ!',540,410,popIn(t,at(57)),'madera',{tam:76,t,t0:at(57)});
  chispas(t,at(62),300,1050,1.2); chispas(t,at(62)+0.06,800,1050,1.2);
}
// S7 apretaditos como en el metro: Raro aplastado entre gomitas. Magenta liso (vagón). Toma push a la cara.
function S7(t,sc){
  const P=PAL_ACTUAL; ctx.fillStyle=P.claro; ctx.fillRect(-200,300,1480,1200);
  ctx.fillStyle=P.medio; for(let i=-1;i<5;i++){ rr(i*300+40+Math.sin(t*0.8)*6,560,220,260,40); ctx.fill(); }
  ctx.fillStyle='#AEE6FF'; for(let i=-1;i<5;i++){ rr(i*300+56,576,188,228,30); ctx.fill(); }
  ctx.fillStyle='#FFFFFF'; ctx.globalAlpha=0.5; for(let i=0;i<5;i++){ const x=((i*260-t*900)%1600+1600)%1600-260; rr(x,640+i*20,120,14,7); ctx.fill(); } ctx.globalAlpha=1;
  ctx.fillStyle=P.oscuro; ctx.fillRect(-200,480,1480,26); ctx.fillStyle='#E9ECF3'; ctx.fillRect(170,480,22,1000); ctx.fillRect(890,480,22,1000);
  for(let i=0;i<7;i++){ const x=60+i*160, sw=Math.sin(t*3+i)*0.15; ctx.save(); ctx.translate(x,506); ctx.rotate(sw); ctx.strokeStyle='#E9ECF3'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,80); ctx.stroke(); ctx.beginPath(); ctx.arc(0,100,22,0,Math.PI*2); ctx.stroke(); ctx.restore(); }
  piso(P.oscuro);
  const sq=0.08+0.22*easeOut(prog(t,at(65),0.4));
  const pushL=easeOut(prog(t,at(64),0.5))*120;
  gomita({x:150+pushL,y:SUELO,s:1.1,t,expr:'feliz',color:'#B8E6FF',seed:2,sq:-0.1});
  gomita({x:930-pushL,y:SUELO,s:1.1,t,expr:'neutral',color:'#FFE3A3',seed:4,sq:-0.1,espejo:true});
  raro({x:540,y:SUELO,s:1.2,t,expr:t<at(69)?'apenado':'yavalio',brazos:'cara',disfraz:'arbitro',sq,wob:wobble(t,at(65),0.6)});
  letrero('METRO · 8:00 AM',540,380,popIn(t,at(69)),'panel',{tam:70,t,t0:at(69)});
}
// S8 cuadro de 40 km por lado: un cuadro gigante lleno de gente; Raro lo señala. Turquesa desierto. Toma paneo-der.
function S8(t,sc){
  const k=popIn(t,at(79));
  if(k>0){ ctx.save(); ctx.translate(600,1250); ctx.scale(1.25*k,1.25*k);
    ctx.fillStyle='rgba(30,26,46,0.25)'; ctx.beginPath(); ctx.moveTo(-380,40); ctx.lineTo(380,40); ctx.lineTo(260,-180); ctx.lineTo(-260,-180); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#D7FF3D'; ctx.beginPath(); ctx.moveTo(-370,30); ctx.lineTo(370,30); ctx.lineTo(250,-190); ctx.lineTo(-250,-190); ctx.closePath(); ctx.fill();
    for(let r=0;r<8;r++){ const v=r/7, y=-175+v*195, half=255+v*110; for(let x=-half+12;x<half-8;x+=22+v*8){ ctx.fillStyle=PASTELES[(r*5+Math.round(x))%6]; const b=hop(t+rand(x+r),0.4,4); blob(x,y-b,5+v*5); } }
    ctx.restore(); ocupa(180,1040,940,1280,1.5); }
  raro({x:250,y:SUELO+40,s:1.0,t,expr:t<at(82)?'feliz':'asombro',brazos:'senala',disfraz:'arbitro',sq:gelatina(t,at(82)),wob:wobble(t,at(82))});
  letrero('40 km × 40 km',600,400,popIn(t,at(82)),'piedra',{tam:80,t,t0:at(82)});
  chispas(t,at(83),560,1150,1.3,'#D7FF3D');
}
// S9 "Una Ciudad de México y tantito más": mapa de la CDMX con el cuadro un poco más grande. Mandarina ciudad. Toma orbita.
function S9(t,sc){
  const k=popIn(t,sc.start+0.05), k2=popIn(t,at(90));
  ctx.save(); ctx.translate(560,820); ctx.scale(k,k);
  ctx.fillStyle='rgba(30,26,46,0.3)'; ctx.beginPath(); for(let i=0;i<=24;i++){ const a=i/24*Math.PI*2, r=210+Math.sin(i*1.7)*40+Math.cos(i*2.9)*25; ctx.lineTo(Math.cos(a)*r+8,Math.sin(a)*r*1.15+12); } ctx.fill();
  ctx.fillStyle='#FFE3A3'; ctx.beginPath(); for(let i=0;i<=24;i++){ const a=i/24*Math.PI*2, r=210+Math.sin(i*1.7)*40+Math.cos(i*2.9)*25; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r*1.15); } ctx.fill();
  ctx.fillStyle='#FF5FA2'; ctx.beginPath(); ctx.arc(0,-40,30,Math.PI,0); ctx.lineTo(0,10); ctx.closePath(); ctx.fill(); ctx.fillStyle='#FFFFFF'; blob(0,-42,11);
  if(k2>0){ ctx.save(); ctx.scale(k2,k2); ctx.strokeStyle='#D7FF3D'; ctx.lineWidth=14; ctx.setLineDash([34,20]); ctx.lineDashOffset=-t*80; ctx.strokeRect(-270,-280,540,560); ctx.restore(); }
  ctx.restore(); ocupa(290,520,830,1110,1.5);
  raro({x:880,y:SUELO,s:1.1,t,expr:t<at(90)?'neutral':'orgullo',brazos:t<at(90)?'senala':'jarras',espejo:t<at(90),disfraz:'arbitro',sq:gelatina(t,at(90)),wob:wobble(t,at(90))});
  letrero(t<at(90)?'CDMX':'CDMX… Y TANTITO',540,380,popIn(t,at(87)),'madera',{tam:72,t,t0:at(t<at(90)?87:90)});
}
// S10 "¡A la cuenta de tres!": Raro con el silbato; la gente se agacha para brincar. Violeta cerros. Toma push.
function S10(t,sc){
  multitud(t,{y0:1200,filas:3,salto:()=>-10*easeOut(prog(t,at(95),0.3))});
