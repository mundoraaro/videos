function cubo(x,y,s,k,t,derrite=0){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k*(1-derrite*0.35)); ctx.rotate(Math.sin(t*3)*0.06);
  ctx.globalAlpha=0.9; ctx.fillStyle='#BFF3FF'; rr(-70,-70,140,140,26); ctx.fill(); ctx.fillStyle='#FFFFFF'; rr(-50,-52,40,70,14); ctx.fill(); ctx.restore();
  if(derrite>0){ ctx.fillStyle='#8FE3FF'; ctx.beginPath(); ctx.ellipse(x,y+70*s*k,90*s*derrite+40,18,0,0,Math.PI*2); ctx.fill(); } }
function plomo(x,y,k,u,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); // lingote que se derrite (u 0..1)
  ctx.fillStyle='#8E8AA3'; ctx.beginPath(); ctx.ellipse(0,0,120+u*190,18+u*30,0,0,Math.PI*2); ctx.fill();
  const h=150*(1-u); ctx.fillStyle='#B9B3C9'; rr(-140+u*30,-h-10,280-u*60,h+20,24*(1-u)+8); ctx.fill(); ctx.fillStyle='#D9D4E8'; rr(-110+u*30,-h-10,120,30*(1-u)+6,12); ctx.fill();
  ctx.fillStyle='#B9B3C9'; for(let i=0;i<4;i++){ const dx=-110+i*72; blob(dx,-h+Math.min(h,u*80+i*10),14*(1-u)+6); }
  if(u<0.9){ ctx.fillStyle='#1E1A2E'; ctx.font=fuente(52); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.globalAlpha=1-u; ctx.fillText('Pb',0,-h/2); }
  ctx.restore(); ocupa(x-160*k,y-170*k,x+160*k,y+30*k,1.5); }
function cuerda(x,y0,y1){ ctx.save(); ctx.strokeStyle='#C98A52'; ctx.lineWidth=12; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke(); ctx.restore(); }

function S2(t,sc){ // ÓRBITA: Mercurio da la vuelta al Sol rapidísimo con Raro colgado; estela lima; 12 "Sol" el Sol late; 14 contador 0 → 88 DÍAS · violeta/espacio · orbita
  const cx=540, cy=1000, rx=380, ry=220, u=easeInOut(prog(t,sc.start,sc.end-sc.start-0.1));
