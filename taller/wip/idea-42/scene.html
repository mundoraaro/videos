<!doctype html>

<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine.js"></script>
<script src="../../raro.js"></script>
<script>
// emperador-001 — "El hombre que se nombró emperador de Estados Unidos" (Norton I). Raro = Norton.
// ---------------- disfraces nuevos (también se agregan a raro.js) ----------------
DISFRACES.emperador = { // uniforme azul de gala con charreteras doradas, banda roja y sombrero alto con pluma
  cuerpo(o){ ctx.fillStyle='#2B3A8C'; ctx.fillRect(-200,-205,400,175); ctx.fillStyle='#22307A'; ctx.fillRect(-4,-205,8,175);
    ctx.fillStyle='#E23D5B'; ctx.save(); ctx.translate(0,-120); ctx.rotate(-0.55); ctx.fillRect(-260,-18,520,36); ctx.restore();
    ctx.fillStyle='#FFD23F'; for(const y of [-180,-140,-100,-62]) for(const x of [-34,34]){ ctx.beginPath(); ctx.arc(x,y,9,0,Math.PI*2); ctx.fill(); } },
  cabeza(o){ const w=o.wob||0, t=o.t||0; ctx.save(); ctx.translate(0,-362); ctx.rotate(-0.06+w*0.07);
    ctx.fillStyle='#1B2257'; ctx.beginPath(); ctx.ellipse(0,0,132,24,0,0,Math.PI*2); ctx.fill();
    rr(-84,-190,168,190,18); ctx.fill(); ctx.fillStyle='#2A3478'; rr(-70,-182,40,170,14); ctx.fill();
    ctx.fillStyle='#FFD23F'; ctx.fillRect(-84,-46,168,24);
    ctx.fillStyle='#E23D5B'; ctx.beginPath(); ctx.arc(-50,-34,22,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#FFD23F'; ctx.beginPath(); ctx.arc(-50,-34,9,0,Math.PI*2); ctx.fill();
    // pluma de pavorreal que se mece
    ctx.save(); ctx.translate(-50,-40); ctx.rotate(-0.35+Math.sin(t*4)*0.08+w*0.35);
    ctx.fillStyle='#17C6B4'; ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(-70,-120,-20,-250); ctx.quadraticCurveTo(40,-120,0,0); ctx.fill();
    ctx.fillStyle='#4CC9F0'; ctx.beginPath(); ctx.ellipse(-18,-215,22,30,0.2,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#2B3A8C'; ctx.beginPath(); ctx.arc(-17,-212,11,0,Math.PI*2); ctx.fill();
    ctx.restore(); ctx.restore(); },
  frente(o,B){ const w=o.wob||0, t=o.t||0; // charreteras con flecos que rebotan + sable
    for(const s of [-1,1]){ ctx.save(); ctx.translate(s*128,-190); ctx.fillStyle='#FFD23F'; ctx.beginPath(); ctx.ellipse(0,0,52,22,s*0.25,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#F2B807'; ctx.lineWidth=7; ctx.lineCap='round'; for(let i=-3;i<=3;i++){ const sw=Math.sin(t*7+i)*4+w*14; ctx.beginPath(); ctx.moveTo(i*13,12); ctx.lineTo(i*13+sw,44); ctx.stroke(); } ctx.restore(); }
    ctx.save(); ctx.translate(-120,-70); ctx.rotate(0.5); ctx.fillStyle='#C9CFDA'; rr(-6,0,12,170,6); ctx.fill(); ctx.fillStyle='#FFD23F'; rr(-22,-14,44,16,8); ctx.fill(); ctx.restore(); }
};
DISFRACES.rico = { // comerciante rico de 1850: levita negra, moño rojo, sombrero de copa y monóculo; o.bolsa=true lleva bolsa de oro
  cuerpo(o){ ctx.fillStyle='#2A2438'; ctx.fillRect(-200,-205,400,175); ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.moveTo(-56,-205); ctx.lineTo(0,-90); ctx.lineTo(56,-205); ctx.fill();
    ctx.fillStyle='#E23D5B'; ctx.beginPath(); ctx.moveTo(0,-186); ctx.lineTo(-30,-200); ctx.lineTo(-30,-172); ctx.closePath(); ctx.moveTo(0,-186); ctx.lineTo(30,-200); ctx.lineTo(30,-172); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#FFD23F'; ctx.fillRect(40,-120,60,6); },
  cabeza(o){ const w=o.wob||0; ctx.save(); ctx.translate(0,-360); ctx.rotate(0.08+w*0.08); if(o.chafa){ ctx.rotate(-0.3); }
    ctx.fillStyle='#1E1A2E'; ctx.beginPath(); ctx.ellipse(0,0,120,22,0,0,Math.PI*2); ctx.fill(); rr(-74,o.chafa?-110:-170,148,o.chafa?110:170,12); ctx.fill();
    ctx.fillStyle='#E23D5B'; ctx.fillRect(-74,-36,148,20); ctx.restore(); },
  frente(o,B){ ctx.strokeStyle='#FFD23F'; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(52,-288,40,0,Math.PI*2); ctx.stroke();
    ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(88,-270); ctx.quadraticCurveTo(110,-200,80,-150); ctx.stroke();
    if(o.bolsa){ const h=B[1].h; bolsaOro(h[0]+20,h[1]+40,1,o.t); } }
};
const POLI = { // gorra y uniforme de policía de 1860 para gomita
  cuerpo(o){ ctx.fillStyle='#34407A'; ctx.fillRect(-200,-205,400,175); ctx.fillStyle='#FFD23F'; estrella4(-60,-150,26,'#FFD23F'); },
  cabeza(o){ ctx.save(); ctx.translate(0,-350); ctx.fillStyle='#1F2756'; rr(-100,-90,200,90,30); ctx.fill(); ctx.fillStyle='#141A40'; ctx.beginPath(); ctx.ellipse(10,0,140,22,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#FFD23F'; ctx.beginPath(); ctx.arc(0,-50,14,0,Math.PI*2); ctx.fill(); ctx.restore(); }
};
const MESERO = { cuerpo(o){ ctx.fillStyle='#FFFFFF'; ctx.fillRect(-200,-205,400,175); ctx.fillStyle='#1E1A2E'; ctx.fillRect(-200,-90,400,60);
  ctx.beginPath(); ctx.moveTo(0,-190); ctx.lineTo(-26,-204); ctx.lineTo(-26,-176); ctx.closePath(); ctx.moveTo(0,-190); ctx.lineTo(26,-204); ctx.lineTo(26,-176); ctx.closePath(); ctx.fill(); } };

// ---------------- objetos del mundo ----------------
function bolsaOro(x,y,k,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.rotate(Math.sin((t||0)*3)*0.06);
  ctx.fillStyle='#C98A2B'; blob(0,0,60); ctx.beginPath(); ctx.moveTo(-30,-48); ctx.lineTo(30,-48); ctx.lineTo(18,-80); ctx.lineTo(-18,-80); ctx.fill();
  ctx.fillStyle='#E9B04A'; blob(-16,-12,30); ctx.fillStyle='#FFD23F'; ctx.font=fuente(56); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('$',0,8); ctx.restore(); }
function moneda(x,y,r,a){ ctx.save(); ctx.translate(x,y); ctx.scale(Math.abs(Math.cos(a))+0.15,1); ctx.fillStyle='#F2B807'; blob(0,0,r); ctx.fillStyle='#FFD23F'; blob(0,0,r*0.75); ctx.restore(); }
function lluviaMonedas(t,t0,n=14){ if(t<t0) return; for(let i=0;i<n;i++){ const u=((t-t0)*0.9+rand(i))%1; moneda(80+rand(i+5)*920, -60+u*1500, 26+rand(i+2)*14, t*8+i); } }
function caja(x,y,s=1){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle='#9C6230'; rr(-170,-120,340,120,14); ctx.fill(); ctx.fillStyle='#B97A3E'; rr(-160,-112,320,50,10); ctx.fill();
  ctx.strokeStyle='#7A4A22'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(-150,-10); ctx.lineTo(150,-110); ctx.stroke(); ctx.restore(); if(typeof ocupa==='function') ocupa(x-170*s,y-120*s,x+170*s,y,0.6); }
function barco(x,y,s,t,txt){ ctx.save(); ctx.translate(x,y+Math.sin(t*2+x)*10); ctx.rotate(Math.sin(t*1.6+x)*0.04); ctx.scale(s,s);
  ctx.fillStyle='#7A4A22'; ctx.beginPath(); ctx.moveTo(-220,-40); ctx.lineTo(220,-40); ctx.lineTo(170,60); ctx.lineTo(-170,60); ctx.fill(); ctx.fillStyle='#9C6230'; ctx.fillRect(-210,-40,420,22);
  ctx.fillStyle='#5E3716'; ctx.fillRect(-8,-360,16,320); ctx.fillStyle='#FFF4DC'; ctx.beginPath(); ctx.moveTo(14,-340); ctx.quadraticCurveTo(170,-210,14,-70); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-14,-320); ctx.quadraticCurveTo(-140,-210,-14,-90); ctx.fill();
  if(txt){ ctx.fillStyle='#A9196F'; ctx.font=fuente(40); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,70,-200); }
  ctx.fillStyle='#F3DDAA'; for(const [sx,sy] of [[-140,-62],[-80,-62],[100,-62],[150,-62],[-110,-100],[125,-100]]){ rr(sx-26,sy-30,52,60,16); ctx.fill(); }
  ctx.restore(); }
function billete(x,y,k,a,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(a+Math.sin((t||0)*4+x)*0.08); ctx.scale(k,k);
  ctx.fillStyle='#7BD389'; rr(-110,-55,220,110,12); ctx.fill(); ctx.strokeStyle='#3E9B57'; ctx.lineWidth=6; rr(-96,-42,192,84,10); ctx.stroke();
  ctx.fillStyle='#2E7D46'; ctx.beginPath(); ctx.arc(0,0,30,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#D7FFE0'; ctx.font=fuente(40); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('N',0,2);
  ctx.fillStyle='#2E7D46'; ctx.font=fuente(26); ctx.fillText('50¢',-64,-20); ctx.fillText('50¢',64,22); ctx.restore(); }
function edificio(x,y,s,t,P){ // capitolio con cúpula
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle=P.claro; ctx.beginPath(); ctx.ellipse(0,-520,170,170,0,Math.PI,0); ctx.fill();
  ctx.fillRect(-14,-760,28,90); ctx.beginPath(); ctx.arc(0,-770,22,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=mix(P.claro,'#FFFFFF',0.5); rr(-200,-540,400,40,12); ctx.fill(); rr(-380,-380,760,380,20); ctx.fill();
  ctx.fillStyle=mix(P.claro,P.medio,0.4); ctx.beginPath(); ctx.moveTo(-400,-380); ctx.lineTo(0,-500); ctx.lineTo(400,-380); ctx.fill();
  ctx.fillStyle=mix(P.medio,'#FFFFFF',0.15); for(let i=-3;i<=3;i++){ rr(i*104-22,-350,44,330,18); ctx.fill(); }
  ctx.restore(); if(typeof ocupa==='function') ocupa(x-380*s,y-780*s,x+380*s,y,0.8); }
function ventanita(x,y,t,i,P){ ctx.fillStyle=P.oscuro; rr(x-46,y-46,92,92,20); ctx.fill(); gomita({x,y:y+40,s:0.22,t,expr:'neutral',seed:i,brazos:i%2?'frente':'idle',sinSombra:true,mira:{x:Math.sin(t+i)*6,y:0}}); }
function rejas(x,y,k){ if(k<=0.001) return; ctx.save(); ctx.translate(x,y); ctx.fillStyle='#5B5470'; ctx.globalAlpha=1; rr(-300,-640*k,600,24,10); ctx.fill();
  for(let i=-3;i<=3;i++){ rr(i*90-12,-640*k,24,640*k,12); ctx.fill(); } ctx.fillStyle='#8E8AA3'; for(let i=-3;i<=3;i++){ rr(i*90-6,-630*k,8,620*k,4); ctx.fill(); } ctx.restore(); }
function pergaminoAbierto(x,y,k,t,lineas,w=520){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(t*2)*0.02); const h=lineas.length*80+90; ctx.scale(1,k);
  ctx.fillStyle='#F3DDAA'; rr(-w/2,-h/2,w,h,10); ctx.fill(); ctx.fillStyle='#D9BB7A'; rr(-w/2-20,-h/2-22,w+40,40,20); ctx.fill(); rr(-w/2-20,h/2-18,w+40,40,20); ctx.fill();
  ctx.fillStyle='#5A3A12'; ctx.textAlign='center'; ctx.textBaseline='middle'; lineas.forEach((l,i)=>{ ctx.font=fuente(i?50:64); ctx.fillText(l,0,-h/2+70+i*80); });
  ctx.fillStyle='#E23D5B'; ctx.beginPath(); ctx.arc(w/2-60,h/2-60,30,0,Math.PI*2); ctx.fill(); ctx.restore(); if(typeof ocupa==='function') ocupa(x-w/2,y-h/2,x+w/2,y+h/2,2.5); }
function interrogacion(x,y,k,t,i){ if(k<=0) return; ctx.save(); ctx.translate(x,y+Math.sin(t*5+i)*8); ctx.scale(k,k); ctx.fillStyle='#FFFFFF'; blob(0,0,40); ctx.fillStyle='#1E1A2E'; ctx.font=fuente(56); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('?',0,4); ctx.restore(); }
function agua(t,P,y0){ for(const [y,c,a,d] of [[y0,P.claro,20,0.5],[y0+60,P.medio,26,0.8],[y0+150,P.oscuro,30,1]]){ ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(-200,2200); for(let x=-200;x<=1280;x+=20) ctx.lineTo(x,y+Math.sin(x*0.013+t*1.8*d+d*3)*a); ctx.lineTo(1280,2200); ctx.fill(); } }
function multitud(t,xs,y,s,opt={}){ xs.forEach((x,i)=>gomita({x,y:y+(i%2)*30,s,t,seed:i+(opt.seed||0),expr:typeof opt.expr==='function'?opt.expr(i):(opt.expr||'feliz'),brazos:typeof opt.brazos==='function'?opt.brazos(i):(opt.brazos||'idle'),alto:opt.salta?Math.abs(Math.sin(t*7+i*1.3))*opt.salta:0,tilt:opt.tilt?opt.tilt(i):0,disfraz:opt.disfraz,npc_peso:0.6})); }
function flor(x,y,c,t,i){ ctx.strokeStyle='#3E9B57'; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-70); ctx.stroke(); ctx.fillStyle=c; for(let k=0;k<5;k++){ const a=k/5*Math.PI*2+t*0.5+i; blob(x+Math.cos(a)*18,y-80+Math.sin(a)*18,14);} ctx.fillStyle='#FFD23F'; blob(x,y-80,10); }
function sombreroEmp(x,y,s,t){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); DISFRACES.emperador.cabeza({t,wob:0}); ctx.restore(); }

// ---------------- escenas ----------------
function S1(t,sc){ // HOOK: Raro emperador sobre su caja en la calle; letrero desde el cuadro 0
  const b=brinco(t,at(4)-0.05,0.42,120);
  caja(560,SUELO+60,1.15);
  multitud(t,[130,950],SUELO+40,0.62,{expr:i=>t>at(4)?'asombro':'sospecha',brazos:'idle',seed:3});
  raro({x:560,y:SUELO-78,s:1.1,t,expr:t<at(4)?'orgullo':'feliz',brazos:t<at(4)?'jarras':'arriba',disfraz:'emperador',sq:b.sq,alto:b.alto,wob:b.wob});
  letrero('EMPERADOR DE EE. UU.',540,400,1,'madera',{tam:66,t,t0:at(4)});
  chispas(t,at(4)+0.3,560,700,1.4,'#FFD23F');
}
function S2(t,sc){ // la ciudad le sigue el juego: todos hacen reverencia
  const k=easeOut(prog(t,at(12),0.3));
  multitud(t,[160,380,700,920],SUELO+10,0.75,{expr:'feliz',brazos:i=>i%2?'saluda':'idle',seed:1,tilt:i=>(i<2?1:-1)*0.35*k});
  raro({x:540,y:SUELO-80,s:1.15,t,expr:t>at(12)?'risa':'orgullo',brazos:'saluda',disfraz:'emperador',sq:gelatina(t,sc.start+0.1),wob:wobble(t,sc.start+0.1)});
  chispas(t,at(12),300,1150,1.2); chispas(t,at(14),800,1150,1.2,'#FFD23F');
}
function S3(t,sc){ // San Francisco 1859; puf → comerciante rico
  const p=pufCambio(t,sc.start+0.05);
  raro({x:620,y:SUELO,s:1.3,t,expr:'orgullo',brazos:'jarras',disfraz:p.despues?'rico':'emperador',spin:p.spin,sq:gelatina(t,sc.start+0.4),wob:wobble(t,sc.start+0.4)});
  nubePuf(t,sc.start+0.12,620,SUELO-180,1.5);
  barco(220,SUELO-260,0.5,t);
  letrero('SAN FRANCISCO · 1859',540,400,popIn(t,at(16)),'pergamino',{tam:62,t,t0:at(16)});
}
function S4(t,sc){ // había sido rico: lluvia de monedas, bolsas de oro
  lluviaMonedas(t,sc.start,16);
  cascada(t,at(18),4,(x,y,k,i)=>bolsaOro(x,y,k*1.1,t),{x0:150,y0:SUELO-40,cols:4,dx:110,dy:0,cada:0.12});
  const b=brinco(t,at(22),0.45,160);
  raro({x:700,y:SUELO,s:1.3,t,expr:'feliz',brazos:'carga',disfraz:'rico',sq:b.sq,alto:b.alto,wob:b.wob});
  bolsaOro(700,SUELO-730-b.alto,1,t);
  letrero('RICO',540,400,popIn(t,at(22)),'madera',{tam:84,t,t0:at(22)});
  chispas(t,at(22)+0.1,700,800,1.4,'#FFD23F');
}
function S5(t,sc){ // apuesta todo a un barco de arroz
  const P=PAL_ACTUAL; agua(t,P,SUELO-180);
  const bx=lerp(1300,760,easeOut(prog(t,at(29),0.6)));
  barco(bx,SUELO-170,0.95,t,'ARROZ');
  const empuja=t>at(25);
  cascada(t,at(26),3,(x,y,k,i)=>bolsaOro(x+(empuja?easeOut(prog(t,at(26),0.8))*140:0),y,k,t),{x0:120,y0:SUELO+70,cols:3,dx:100,dy:0,cada:0.08});
  raro({x:330,y:SUELO+110,s:1.15,t,expr:empuja?'feliz':'sospecha',brazos:empuja?'frente':'jarras',disfraz:'rico',piernas:empuja?'camina':'quieto'});
  chispas(t,at(31),760,1100,1.3);
}
function S6(t,sc){ // llegan más barcos; el precio se desploma (gráfica)
  for(let i=0;i<4;i++){ const k=popIn(t,at(33)+i*0.12); if(k>0){ ctx.save(); ctx.translate(130+i*230,SUELO-40); ctx.scale(k,k); barco(0,0,0.6,t); ctx.restore(); } }
  // pizarrón con la gráfica
  const x0=170,y0=440,w=740,h=430; ctx.fillStyle='#1B1F3B'; rr(x0,y0,w,h,30); ctx.fill(); ctx.strokeStyle='#4CC9F0'; ctx.lineWidth=8; ctx.stroke(); ocupa(x0,y0,x0+w,y0+h,2.5);
  const u=easeIn(prog(t,at(38)-0.25,0.35)); ctx.strokeStyle='#FF4D6D'; ctx.lineWidth=16; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(x0+60,y0+120); ctx.lineTo(x0+260,y0+90); ctx.lineTo(x0+380,y0+110); ctx.lineTo(x0+380+u*280,y0+110+u*270); ctx.stroke();
  ctx.fillStyle='#8FF0FF'; ctx.font=fuente(48); ctx.textAlign='left'; ctx.fillText('PRECIO DEL ARROZ',x0+40,y0+h-40);
  ondaChoque(t,at(38),x0+660,y0+380,'#FF4D6D');
  const s=susto(t,at(38));
  raro({x:760,y:SUELO,s:1.0,t,expr:t>at(38)?'terror':'asombro',brazos:t>at(38)?'cara':'idle',disfraz:'rico',sq:s.sq,alto:s.alto,wob:s.wob});
}
function S7(t,sc){ // se queda sin nada; puf a harapos; "¿y qué hizo?" mira a cámara
  const p=pufCambio(t,at(42));
  const mira=t>at(44);
  raro({x:540,y:SUELO,s:1.35,t,expr:mira?'sospecha':(p.despues?'llanto':'yavalio'),brazos:mira?'jarras':'idle',disfraz:p.despues?'campesino':'rico',spin:p.spin,mira:mira?{x:0,y:0}:undefined,
        sq:gelatina(t,at(42)+0.36),wob:wobble(t,at(42)+0.36)});
  nubePuf(t,at(42)+0.08,540,SUELO-180,1.5);
  if(p.despues){ ctx.fillStyle='#FFFFFF'; ctx.globalAlpha=0.8; for(let i=0;i<3;i++){ const u=((t-at(42))*0.8+i/3)%1; blob(260+i*30,SUELO-300-u*400,10+u*20);} ctx.globalAlpha=1; }
  letrero('$0',540,420,popIn(t,at(43)),'piedra',{tam:100,t,t0:at(43)});
}
function S8(t,sc){ // escribe la carta al periódico
  ctx.fillStyle=mix(PAL_ACTUAL.oscuro,'#000000',0.1); rr(120,SUELO-180,840,60,20); ctx.fill(); ctx.fillRect(170,SUELO-130,40,200); ctx.fillRect(870,SUELO-130,40,200);
  const vuela=prog(t,at(52),0.45);
  ctx.save(); const cx=lerp(640,1250,easeIn(vuela)), cy=lerp(SUELO-240,300,easeIn(vuela)); ctx.translate(cx,cy); ctx.rotate(-0.1-vuela*0.8);
  ctx.fillStyle='#FFFFFF'; rr(-110,-70,220,140,12); ctx.fill(); ctx.strokeStyle='#D9D4E8'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(-110,-70); ctx.lineTo(0,10); ctx.lineTo(110,-70); ctx.stroke();
  ctx.fillStyle='#E23D5B'; blob(0,10,18); ctx.restore();
  raro({x:380,y:SUELO-100,s:1.3,t,expr:t>at(50)?'orgullo':'sospecha',brazos:'frente',disfraz:'campesino',tilt:Math.sin(t*12)*0.03});
  ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(470+Math.sin(t*14)*16,SUELO-290); ctx.lineTo(520,SUELO-480); ctx.stroke();
  letrero('AL PERIÓDICO',540,400,popIn(t,at(52)),'madera',{tam:66,t,t0:at(52)});
}
function S9(t,sc){ // ¡Emperador! puf al uniforme con líneas de velocidad
  const p=pufCambio(t,sc.start+0.05);
  raro({x:540,y:SUELO,s:1.4,t,expr:'orgullo',brazos:p.despues?'arriba':'idle',disfraz:p.despues?'emperador':'campesino',spin:p.spin,sq:gelatina(t,sc.start+0.4),wob:wobble(t,sc.start+0.4)});
  nubePuf(t,sc.start+0.12,540,SUELO-180,1.6);
