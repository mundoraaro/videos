<body><canvas id="c" width="1080" height="1920"></canvas>

<script>
// gritar-001-v2 — ¿Qué pasaría si todos gritáramos al mismo tiempo? (serie "¿Qué pasaría si TODOS…?", Parte 6)
// Disfraces: vocero de estadio con megáfono → científico (decibeles) → vocero → explorador (Krakatoa) → ¡volcán! → vocero (loop).
const PI2=Math.PI*2;
const GENTE=['#FF5FA2','#4CC9F0','#FFD23F','#B388FF','#FF8A3D','#6CFFB5','#FFB8D2'];

// ---------- megáfono (en la mano derecha, a la altura de la boca) ----------
function megafonoLocal(o){ const a=o.megaA??-0.12, k=1+0.06*Math.sin(o.t*30)*(o.gritando?1:0);
  ctx.save(); ctx.translate(70,-236); ctx.rotate(a); ctx.scale(k,k);
  ctx.fillStyle='#B8222D'; ctx.beginPath(); ctx.moveTo(0,-24); ctx.lineTo(170,-82); ctx.lineTo(170,82); ctx.lineTo(0,24); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#E5333F'; ctx.beginPath(); ctx.moveTo(0,-24); ctx.lineTo(170,-82); ctx.lineTo(170,10); ctx.lineTo(0,6); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.ellipse(170,0,22,82,0,0,PI2); ctx.fill(); ctx.fillStyle='#FFD9DD'; ctx.beginPath(); ctx.ellipse(172,0,12,60,0,0,PI2); ctx.fill();
  ctx.fillStyle='#1E1A2E'; rr(-36,-18,44,36,10); ctx.fill(); ctx.fillStyle='#FFD23F'; rr(60,10,40,40,8); ctx.fill();
  ctx.restore(); }
const MANOS_MEGA={i:[60,-200],d:[130,-206]};
// ---------- disfraces nuevos ----------
const VOCERO={ // aficionado de estadio: gorra al revés, playera a rayas con número y megáfono (o.mega)
  cuerpo(o){ ctx.fillStyle='#FFD23F'; ctx.fillRect(-200,-210,400,215); ctx.fillStyle='#2F7BFF'; for(const y of [-150,-70]) ctx.fillRect(-200,y,400,26);
    ctx.fillStyle='#FFFFFF'; ctx.font=fuente(70); ctx.textAlign='center'; ctx.fillText('8',0,-92); },
  cabeza(o){ const w=o.wob||0; ctx.save(); ctx.translate(0,-352); ctx.rotate(0.12+w*0.08);
    ctx.fillStyle='#2F7BFF'; ctx.beginPath(); ctx.ellipse(0,-8,124,66,0,Math.PI,0); ctx.fill();
    ctx.fillStyle='#1C56C4'; ctx.beginPath(); ctx.ellipse(-112,0,74,16,-0.1,0,PI2); ctx.fill();
    ctx.fillStyle='#FFD23F'; blob(0,-70,13); ctx.restore(); },
  frente(o,B){ if(o.mega) megafonoLocal(o); if(o.laser){ const h=B[1].h; ctx.save(); ctx.translate(h[0],h[1]); ctx.rotate(o.laserA??-0.9);
      ctx.fillStyle='#3E3A55'; rr(-12,-14,110,28,12); ctx.fill(); ctx.fillStyle='#D7FF3D'; blob(104,0,9); ctx.restore(); } }
};
const EXPLORADOR={ // explorador de 1883: casco de safari y chaleco con bolsillos
  cuerpo(o){ ctx.fillStyle='#C9A66B'; ctx.fillRect(-200,-210,400,215); ctx.fillStyle='#A9854C'; rr(-110,-150,70,60,10); ctx.fill(); rr(40,-150,70,60,10); ctx.fill();
    ctx.fillStyle='#7A5A2A'; ctx.fillRect(-200,-40,400,22); },
  cabeza(o){ const w=o.wob||0; ctx.save(); ctx.translate(0,-350); ctx.rotate(-0.06+w*0.08);
    ctx.fillStyle='#B98E52'; ctx.beginPath(); ctx.ellipse(0,0,175,30,0,0,PI2); ctx.fill();
    ctx.fillStyle='#E8CF9A'; ctx.beginPath(); ctx.ellipse(0,-14,118,82,0,Math.PI,0); ctx.fill(); ctx.fillStyle='#7A5A2A'; ctx.fillRect(-118,-22,236,16);
    ctx.restore(); }
};
const VOLCAN={ // ¡disfraz de volcán! cono de roca con lava en la cabeza que burbujea
  atras(o){ ctx.fillStyle='#6E4A3A'; ctx.beginPath(); ctx.moveTo(-230,0); ctx.lineTo(-120,-300); ctx.lineTo(120,-300); ctx.lineTo(230,0); ctx.closePath(); ctx.fill(); },
  cuerpo(o){ ctx.fillStyle='#8A5E48'; ctx.fillRect(-200,-420,400,425); ctx.fillStyle='#FF6A1F'; for(const [x,y0] of [[-90,-330],[40,-360],[110,-300]]){ ctx.beginPath(); ctx.moveTo(x-18,-420); ctx.quadraticCurveTo(x+Math.sin(o.t*3+x)*10,y0+60,x+10,y0); ctx.lineTo(x+26,-420); ctx.fill(); }
    ctx.fillStyle='#A8745A'; ctx.beginPath(); ctx.ellipse(-60,-120,50,24,0,0,PI2); ctx.fill(); ctx.beginPath(); ctx.ellipse(80,-60,40,20,0,0,PI2); ctx.fill(); },
  cabeza(o){ const t=o.t; ctx.save(); ctx.translate(0,-372);
    ctx.fillStyle='#FF6A1F'; ctx.beginPath(); ctx.ellipse(0,0,120,34,0,0,PI2); ctx.fill();
    for(let i=0;i<5;i++){ const ph=(t*1.6+i/5)%1; ctx.globalAlpha=1-ph; ctx.fillStyle=i%2?'#FFD23F':'#FF8A1F'; blob(-60+i*30+Math.sin(t*5+i)*10,-20-ph*120,16+ph*10); } ctx.globalAlpha=1;
    for(let i=0;i<3;i++){ const ph=(t*0.7+i/3)%1; ctx.globalAlpha=0.8*(1-ph); ctx.fillStyle='#EDE7FF'; blob(-30+i*30+ph*40,-120-ph*260,34+ph*40); } ctx.globalAlpha=1;
    ctx.restore(); }
};

// ---------- utilería ----------
function ondas(t,x,y,n=3,col='#FFFFFF',dir=0,ab=0.6,alc=260){ ctx.save(); ctx.strokeStyle=col; ctx.lineCap='round'; for(let i=0;i<n;i++){ const ph=(t*1.6+i/n)%1; ctx.globalAlpha=1-ph; ctx.lineWidth=14; ctx.beginPath(); ctx.arc(x,y,60+ph*alc,dir-ab,dir+ab); ctx.stroke(); } ctx.restore(); }
function grito(txt,x,y,tam,k=1,col='#FFFFFF',a=0){ if(k<=0.01||tam<4) return; ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.scale(k,k); ctx.font=fuente(tam); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=tam*0.18; ctx.strokeStyle='#1E1A2E'; ctx.lineJoin='round'; ctx.strokeText(txt,0,0); ctx.fillStyle=col; ctx.fillText(txt,0,0); ctx.restore(); }
function zzz(t,x,y){ for(let i=0;i<3;i++){ const ph=(t*0.8+i/3)%1; ctx.globalAlpha=1-ph; grito('Z',x+ph*90+i*8,y-ph*170,50+ph*30,1,'#FFFFFF'); } ctx.globalAlpha=1; }
function L(txt,x,y,k,tipo='madera',opts={}){ let tam=opts.tam||72; ctx.font=fuente(tam); let w=Math.max(opts.ancho||0,ctx.measureText(txt).width+tam*1.2);
  if(w>740){ tam*=740/w; w=740; } const ancho=opts.ancho?Math.min(opts.ancho,740):undefined; x=clamp(x,170+w/2,910-w/2); if(y<=430) y=480;
  letrero(txt,x,y,k,tipo,{sinPalo:!opts.palo,...opts,tam,ancho}); }
function torreTokio(x,y,s,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle='#E5333F'; ctx.beginPath(); ctx.moveTo(-90,0); ctx.lineTo(-10,-420); ctx.lineTo(10,-420); ctx.lineTo(90,0); ctx.lineTo(50,0); ctx.lineTo(0,-300); ctx.lineTo(-50,0); ctx.fill();
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(-60,-180,120,24); ctx.fillRect(-36,-300,72,20); ctx.fillStyle='#E5333F'; ctx.fillRect(-4,-470,8,60); ctx.restore(); }
function casita(x,y,s,c,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle=c; rr(-80,-130,160,130,14); ctx.fill(); ctx.fillStyle=mix(c,'#1E1A2E',0.3); ctx.beginPath(); ctx.moveTo(-100,-120); ctx.lineTo(0,-210); ctx.lineTo(100,-120); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#FFF4DC'; rr(-55,-100,40,40,8); ctx.fill(); ctx.fillStyle='#7A4A22'; rr(14,-80,40,80,10); ctx.fill(); ctx.restore(); }
// planeta: México a la izquierda, Japón a la derecha (o.japon = brillo), o.anillo = onda que da la vuelta (0..1), o.gajo = parte iluminada (1/13)
function planeta(t,cx,cy,R,o={}){ if(typeof ocupa==='function') ocupa(cx-R,cy-R,cx+R,cy+R,o.peso??0.8);
  ctx.save(); ctx.shadowColor='#AEE6FF'; ctx.shadowBlur=60; ctx.fillStyle='#3AB6FF'; blob(cx,cy,R); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,PI2); ctx.clip(); const g=o.giro??Math.sin(t*0.6)*0.06;
  ctx.fillStyle='#86E3A8';
  for(const [a,b,rx,ry,rot] of [[-0.62,-0.3,0.3,0.36,0.5],[-0.45,0.3,0.14,0.3,0.2],[0.55,-0.25,0.32,0.3,-0.2],[0.62,0.2,0.1,0.18,0.4],[0.1,0.65,0.3,0.12,0],[-0.05,-0.75,0.4,0.12,0]]){
    ctx.beginPath(); ctx.ellipse(cx+(a+g)*R, cy+b*R, rx*R, ry*R, rot, 0, PI2); ctx.fill(); }
  if(o.gajo){ ctx.globalAlpha=0.75*o.gajo; ctx.fillStyle='#D7FF3D'; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R*1.1,-0.25,-0.25+PI2/13); ctx.closePath(); ctx.fill(); ctx.globalAlpha=1; }
  ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.beginPath(); ctx.ellipse(cx-R*0.35,cy-R*0.5,R*0.35,R*0.14,-0.5,0,PI2); ctx.fill();
  ctx.restore();
  if(o.anillo!=null){ const u=o.anillo; ctx.save(); ctx.strokeStyle='#D7FF3D'; ctx.lineWidth=16; ctx.lineCap='round'; ctx.shadowColor='#D7FF3D'; ctx.shadowBlur=24;
    ctx.beginPath(); ctx.arc(cx,cy,R+34,-Math.PI/2,-Math.PI/2+u*PI2); ctx.stroke(); const a=-Math.PI/2+u*PI2; ctx.fillStyle='#FFFFFF'; blob(cx+Math.cos(a)*(R+34),cy+Math.sin(a)*(R+34),20); ctx.restore(); } }
function volcan(x,y,s,t,erup=0,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  if(erup>0){ for(let i=0;i<7;i++){ const ph=(t*0.9+i/7)%1; ctx.globalAlpha=0.85*(1-ph)*erup; ctx.fillStyle=i%2?'#EDE7FF':'#C9C3E0'; blob(Math.sin(i*2.1+t)*80*ph,-430-ph*520*erup,70+ph*110); } ctx.globalAlpha=1;
    for(let i=0;i<8;i++){ const ph=(t*1.4+i/8)%1; ctx.fillStyle=i%2?'#FFD23F':'#FF6A1F'; blob(Math.cos(i*0.8-2.4)*ph*300*erup,-430-Math.sin(i*0.8)*ph*200*erup+ph*ph*260,18); } }
  ctx.fillStyle='#5A3A2C'; ctx.beginPath(); ctx.moveTo(-380,0); ctx.lineTo(-90,-430); ctx.lineTo(90,-430); ctx.lineTo(380,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#7A5040'; ctx.beginPath(); ctx.moveTo(-380,0); ctx.lineTo(-90,-430); ctx.lineTo(-10,-430); ctx.lineTo(-120,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#FF6A1F'; ctx.beginPath(); ctx.ellipse(0,-430,92,22,0,0,PI2); ctx.fill();
  if(erup>0){ ctx.fillStyle='#FF8A1F'; for(const [dx,l] of [[-40,220],[30,300],[60,160]]){ ctx.beginPath(); ctx.moveTo(dx-20,-430); ctx.quadraticCurveTo(dx+Math.sin(t*2+dx)*20,-430+l*0.6*erup,dx,-430+l*erup); ctx.lineTo(dx+22,-430); ctx.fill(); } }
  ctx.restore(); }
function barometro(x,y,r,t,ag,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); if(typeof ocupa==='function') ocupa(-r-20,-r-20,r+20,r+20,1.2);
  ctx.fillStyle='#B07A2E'; blob(0,0,r+24); ctx.fillStyle='#FFF4DC'; blob(0,0,r);
  ctx.strokeStyle='#5A3A12'; ctx.lineWidth=6; for(let i=0;i<=10;i++){ const a=Math.PI*0.75+i*Math.PI*1.5/10; ctx.beginPath(); ctx.moveTo(Math.cos(a)*r*0.78,Math.sin(a)*r*0.78); ctx.lineTo(Math.cos(a)*r*0.92,Math.sin(a)*r*0.92); ctx.stroke(); }
  const a=-Math.PI/2+Math.sin(t*22)*0.5*ag+0.1; ctx.strokeStyle='#E5333F'; ctx.lineWidth=12; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*r*0.72,Math.sin(a)*r*0.72); ctx.stroke();
  ctx.fillStyle='#1E1A2E'; blob(0,0,16); ctx.restore(); }
function luna(x,y,r,t){ ctx.save(); ctx.shadowColor='#FFF6C8'; ctx.shadowBlur=60; ctx.fillStyle='#FFF3C4'; blob(x,y,r); ctx.restore(); ctx.fillStyle='#E9D99A'; blob(x-r*0.3,y-r*0.2,r*0.2); blob(x+r*0.35,y+r*0.25,r*0.14); blob(x+r*0.1,y-r*0.45,r*0.1); if(typeof ocupa==='function') ocupa(x-r,y-r,x+r,y+r,1); }
function puerta(x,y,abre=0){ ctx.fillStyle='#B388FF'; rr(x-200,y-640,400,660,20); ctx.fill(); ctx.fillStyle='#4A2E7A'; rr(x-150,y-560,300,580,14); ctx.fill();
  ctx.save(); ctx.translate(x-150,y-560); ctx.scale(1-abre*0.55,1); ctx.fillStyle='#7A4A22'; rr(0,0,300,580,14); ctx.fill(); ctx.fillStyle='#5E3716'; rr(30,40,240,200,12); ctx.fill(); rr(30,300,240,240,12); ctx.fill(); ctx.fillStyle='#FFD23F'; blob(260,300,14); ctx.restore(); }
function multitud(t,y,s,n,x0,dx,o={}){ for(let i=0;i<n;i++){ const x=x0+i*dx+Math.sin(t*2+i)*10;
  gomita({x,y:y-(i%2)*30,s,t,seed:i+2,expr:o.expr||(i%3?'risa':'terror'),brazos:o.brazos||'arriba',alto:Math.abs(Math.sin(t*(9+i%3)+i))*14,npc_peso:0.25}); } }
function marcaDist(x,y,txt,k){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.fillStyle='#FFFFFF'; rr(-10,-120,20,120,10); ctx.fill(); grito(txt,0,-160,64,1,'#FFF38A'); ctx.restore(); }
function oreja(x,y,s){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle='#FFB8D2'; ctx.beginPath(); ctx.ellipse(0,0,60,90,0,0,PI2); ctx.fill(); ctx.fillStyle='#F28AB3'; ctx.beginPath(); ctx.ellipse(6,4,32,56,0,0,PI2); ctx.fill(); ctx.restore(); }

// ---------- S1 y S28: ¡TODOS A GRITAR DESDE MÉXICO! (mismo cuadro para el loop) ----------
// Storyboard: plano abierto con push. Raro vocero (grande, izquierda) grita al megáfono; detrás la multitud de gomitas con bandera de México grita;
// arriba a la derecha el planeta con Japón (torre roja + gomita dormida, zzz) ya visible desde el cuadro 0; ondas salen hacia el planeta. Letrero ¡TODOS A GRITAR!
function banderaMx(x,y,s,t){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle='#FFFFFF'; rr(-6,-260,12,260,6); ctx.fill();
  const o=Math.sin(t*6)*8; ctx.fillStyle='#16A34A'; ctx.beginPath(); ctx.moveTo(6,-260); ctx.lineTo(66,-260+o*0.3); ctx.lineTo(66,-150+o*0.3); ctx.lineTo(6,-150); ctx.fill();
  ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.moveTo(66,-260+o*0.3); ctx.lineTo(126,-260+o); ctx.lineTo(126,-150+o); ctx.lineTo(66,-150+o*0.3); ctx.fill();
  ctx.fillStyle='#E5333F'; ctx.beginPath(); ctx.moveTo(126,-260+o); ctx.lineTo(186,-260+o*0.6); ctx.lineTo(186,-150+o*0.6); ctx.lineTo(126,-150+o); ctx.fill();
  ctx.fillStyle='#A16207'; blob(96,-205+o*0.6,14); ctx.restore(); }
function japonEnPlaneta(t,cx,cy,R,b,ts,gs){ const jx=cx+Math.cos(b)*R, jy=cy+Math.sin(b)*R;
  ctx.save(); ctx.translate(jx,jy); ctx.rotate(b+Math.PI/2); torreTokio(-R*0.16,4,ts,1);
  gomita({x:R*0.2,y:4,s:gs,t,seed:5,expr:'dormido',brazos:'idle',sinSombra:true,npc_peso:0.2}); ctx.restore();
  zzz(t,jx+R*0.15,jy-R*0.45); return [jx,jy]; }
function escenaGrito(t,sc,fin){
  planeta(t,740,790,135,{peso:1.2});
  japonEnPlaneta(t,740,790,135,-0.95,0.2,0.2);
  multitud(t,1080,0.36,7,90,125,{});
  banderaMx(820,1150,0.9,t);
  multitud(t,1260,0.5,2,700,170,{});
  const g=gelatina(t,fin?sc.start:0.05,0.35);
  raro({x:330,y:SUELO,s:1.2,t,expr:'terror',ojos:1.4,disfraz:VOCERO,mega:true,gritando:true,brazos:'frente',manos:MANOS_MEGA,megaA:-0.45,sq:g+0.06*Math.sin(t*24),tilt:-0.04});
  ondas(t,330+250*1.2,SUELO-300*1.2,3,'#FFFFFF',-0.85,0.5,300);
  letrero('¡TODOS A GRITAR!',540,400,1,'madera',{tam:84,sinPalo:true,t,t0:-1});
  if(!fin) chispas(t,0.15,640,1000,1.2,'#D7FF3D');
}
function S1(t,sc){ escenaGrito(t,sc,false); }
function S28(t,sc){ escenaGrito(t,sc,true); }
// S2: "Japón no oye" — plano medio: Raro vocero grande a la izquierda grita hacia el planeta; del otro lado Japón duerme (torre + gomita + zzz).
// Las ondas se encogen y se apagan antes de llegar. Letrero JAPÓN: NADA ya puesto (registrado para que el caption no lo toque).
function S2(t,sc){
  const R=215, cx=700, cy=1010; planeta(t,cx,cy,R,{peso:1.2});
  japonEnPlaneta(t,cx,cy,R,-1.05,0.28,0.28);
  const g=gelatina(t,sc.start+0.05,0.4);
  raro({x:260,y:SUELO,s:1.05,t,expr:t>=at(7)?'yavalio':'terror',ojos:1.3,disfraz:VOCERO,mega:true,gritando:t<at(7),brazos:'frente',manos:MANOS_MEGA,megaA:-0.3,sq:g+0.05*Math.sin(t*24)});
  for(let i=0;i<3;i++){ const ph=(t*1.4+i/3)%1, x=lerp(520,640,ph), k=1-ph; ctx.save(); ctx.globalAlpha=k; ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=16*k+2; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(x,1080-ph*60,lerp(110,30,ph),-0.6,0.6); ctx.stroke(); ctx.restore(); }
  L('JAPÓN: NADA',540,480,popIn(t,sc.start-0.3),'madera',{tam:80,sinPalo:true,t,t0:sc.start-0.3});
}
// S3: más de 8 mil millones gritando — contador + gomitas en cascada gritando; Raro dirige con el megáfono
function S3(t,sc){
  cascada(t,sc.start,21,(x,y,k,i)=>gomita({x,y,s:0.27*k,t,seed:i,expr:i%2?'terror':'risa',brazos:'arriba',alto:Math.abs(Math.sin(t*11+i))*12,npc_peso:0.7}),{x0:120,y0:900,cols:7,dx:140,dy:110,cada:0.05});
  const b=brinco(t,at(12),0.42,150);
  raro({x:560,y:SUELO,s:1.0,t,expr:t>=at(12)?'terror':'risa',disfraz:VOCERO,mega:true,gritando:t>=at(12),brazos:'frente',manos:MANOS_MEGA,alto:b.alto,sq:b.sq,wob:b.wob});
  L(contador(t,at(10),0.6,0,8000000000,'+'),540,480,popIn(t,sc.start),'panel',{tam:80,ancho:720,t,t0:sc.start});
}
// S4: y allá, silencio — calle de Tokio de noche, gomita durmiendo, grillos; Raro asoma con el megáfono, desconcertado
function S4(t,sc){
  torreTokio(820,SUELO-40,0.95,1);
  casita(220,SUELO-30,0.9,'#B388FF',1);
  gomita({x:600,y:SUELO,s:0.75,t,seed:3,expr:'dormido',brazos:'idle',npc_peso:0.8,tilt:Math.sin(t*1.5)*0.03});
  zzz(t,650,980);
  const u=easeOut(prog(t,sc.start,0.4));
  raro({x:lerp(-120,230,u),y:SUELO,s:0.95,t,expr:'sospecha',disfraz:VOCERO,mega:true,brazos:'frente',manos:MANOS_MEGA,piernas:u<1?'corre':'quieto',tilt:0.05});
  L('SILENCIO',540,480,popIn(t,at(15)),'piedra',{tam:84,t,t0:at(15)});
}
// S5: ¿por qué? porque tu grito se gasta — plano medio: Raro vocero grande grita; del megáfono salen ondas que se encogen y se apagan,
// y tres "¡AAAH!" cada vez más chiquitos y transparentes. Letrero TU GRITO SE GASTA.
function S5(t,sc){
  const g=gelatina(t,at(18));
