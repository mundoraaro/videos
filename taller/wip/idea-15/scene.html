<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine.js"></script>
<script src="../../raro.js"></script>
<script>
// camaron-001 — El camarón mantis. Raro = camarón mantis boxeador (disfraz 'mantis'); cambia a científico para explicar
// la burbuja y a buzo cuando es "tú" viendo colores. Loop: S28 = S1 (mismo fondo turquesa/mar, Raro a la izquierda pegando).

// ---------- utilidades de la escena ----------
const ext=(t,f,ph=0)=>{const u=((t*f+ph)%1+1)%1; return u<0.22?easeOut(u/0.22):1-easeInOut((u-0.22)/0.78);};       // golpe repetido
const extUna=(t,t0)=>{ if(t<t0) return 0; const u=(t-t0)/0.5; return u<0.2?easeOut(u/0.2):1-easeInOut(clamp((u-0.2)/0.8)); }; // un golpe
const punch=(e)=>({d:[lerp(60,380,e),lerp(-130,-236,e)]});
function impacto(t,t0,x,y,c='#FFFFFF'){ chispas(t,t0,x,y,1.5,c); ondaChoque(t,t0,x,y+40,c,0.35);
  const u=(t-t0)/0.18; if(u>=0&&u<1){ ctx.save(); ctx.globalAlpha=1-u; ctx.fillStyle='#FFFFFF'; blob(x,y,60+u*90); ctx.restore(); } }
function chisporroteo(t,x,y,f){ // chispas en cada golpe repetido (periodo 1/f)
  const k=Math.floor(t*f); for(const j of [k,k-1]) impacto(t,j/f+0.05/f*4,x,y,j%2?'#FFF38A':'#FFFFFF'); }
function burbujas(t,x,y,n=8,s=1){ ctx.save(); ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=5*s;
  for(let i=0;i<n;i++){ const u=((t*0.9+rand(i))%1); ctx.globalAlpha=1-u; ctx.beginPath(); ctx.arc(x+Math.sin(t*4+i)*30*s+(rand(i+2)-0.5)*120*s,y-u*420*s,(10+rand(i+5)*18)*s,0,Math.PI*2); ctx.stroke(); } ctx.restore(); }
function arrecife(t){ // escenario propio (tipo 'liso'): 3 capas en tonos de la paleta
  const P=PAL_ACTUAL; ctx.fillStyle=P.claro; ctx.globalAlpha=0.55; for(let i=0;i<6;i++) blob(i*220+Math.sin(t*0.3+i)*10,1080-rand(i)*120,190); ctx.globalAlpha=1;
  ctx.fillStyle=P.medio; for(let i=0;i<5;i++){ const x=80+i*240, h=260+rand(i+3)*200; ctx.save(); ctx.translate(x,1300); ctx.rotate(Math.sin(t*1.2+i)*0.05);
    rr(-34,-h,68,h,34); ctx.fill(); rr(-110,-h*0.7,80,40,20); ctx.fill(); rr(30,-h*0.55,90,40,20); ctx.fill(); ctx.restore(); }
  ctx.fillStyle=mix(P.oscuro,'#FFFFFF',0.15); ctx.fillRect(-300,1340,1700,700); ctx.fillStyle=P.oscuro; for(let i=0;i<7;i++) blob(-60+i*200,1380+rand(i)*30,70+rand(i+1)*40);
  burbujas(t,160,1300,6); burbujas(t,920,1250,6); }
const CARACOL={atras(o){ ctx.save(); ctx.translate(-30,-230); ctx.rotate(o.roto?0.4:0);
    ctx.fillStyle='#FF9F6B'; blob(0,0,170); ctx.fillStyle='#FFC49A'; blob(-10,-10,120); ctx.fillStyle='#FF9F6B'; blob(-18,-18,72); ctx.fillStyle='#FFC49A'; blob(-22,-24,34);
    if(o.roto){ ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=8; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-40,-170); ctx.lineTo(10,-80); ctx.lineTo(-30,-10); ctx.lineTo(30,60); ctx.lineTo(0,160); ctx.stroke(); }
    ctx.restore(); },
  cabeza(o){ for(const s of [-1,1]){ ctx.strokeStyle='#FFD9A8'; ctx.lineWidth=14; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(s*40,-360); ctx.lineTo(s*70,-450+Math.sin(o.t*4+s)*10); ctx.stroke(); ctx.fillStyle='#FFD9A8'; blob(s*70,-455+Math.sin(o.t*4+s)*10,16); } }};
const CANGREJO={frente(o,B){ for(const k of [-1,1]){ const h=B[k].h; ctx.save(); ctx.translate(h[0],h[1]); ctx.rotate(k*0.4+Math.sin(o.t*8)*0.15);
    ctx.fillStyle='#FF6B6B'; ctx.beginPath(); ctx.ellipse(0,-20,40,52,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle=PAL_ACTUAL.medio; ctx.beginPath(); ctx.moveTo(-6,-80); ctx.lineTo(10,-20); ctx.lineTo(26,-80); ctx.fill(); ctx.restore(); } }};
const DINO={cabeza(o){ ctx.fillStyle='#FFB8D2'; for(let i=0;i<5;i++){ const a=-2.4+i*0.4, x=Math.cos(a)*120, y=-250+Math.sin(a)*150; ctx.save(); ctx.translate(x,y); ctx.rotate(a+Math.PI/2); ctx.beginPath(); ctx.moveTo(-26,10); ctx.lineTo(0,-50); ctx.lineTo(26,10); ctx.fill(); ctx.restore(); } }, atras(o){ ctx.fillStyle='#8FD98A'; ctx.beginPath(); ctx.moveTo(120,-60); ctx.quadraticCurveTo(330,-40+Math.sin(o.t*3)*20,380,-150); ctx.quadraticCurveTo(300,-120,130,-170); ctx.fill();
    ctx.fillStyle='#FFB8D2'; for(let i=0;i<5;i++){ const y=-380+i*70; ctx.beginPath(); ctx.moveTo(118+i*10,y); ctx.lineTo(180+i*14,y+30); ctx.lineTo(128+i*10,y+60); ctx.fill(); } }};
const MANTIS_INSECTO={cabeza(o){ for(const s of [-1,1]){ ctx.strokeStyle='#6FBF5B'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(s*30,-370); ctx.quadraticCurveTo(s*80,-470,s*140,-500); ctx.stroke(); } },
  frente(o,B){ for(const k of [-1,1]){ const h=B[k].h; ctx.strokeStyle='#6FBF5B'; ctx.lineWidth=18; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(h[0],h[1]); ctx.lineTo(h[0]+k*20,h[1]-70); ctx.lineTo(h[0]-k*10,h[1]-20); ctx.stroke(); } }};
function nuez(x,y,k,i,roto){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.rotate(Math.sin(i)*0.4);
  if(roto){ for(const s of [-1,1]){ ctx.save(); ctx.translate(s*24,10); ctx.rotate(s*0.5); ctx.fillStyle='#C98B4E'; ctx.beginPath(); ctx.ellipse(0,0,26,46,0,s<0?Math.PI/2:-Math.PI/2,s<0?Math.PI*1.5:Math.PI/2); ctx.fill(); ctx.restore(); } }
  else { ctx.fillStyle='#C98B4E'; ctx.beginPath(); ctx.ellipse(0,0,46,54,0,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#8E5A2A'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(0,-54); ctx.lineTo(0,54); ctx.stroke();
    ctx.fillStyle='#E0A96E'; ctx.beginPath(); ctx.ellipse(-16,-20,12,16,0,0,Math.PI*2); ctx.fill(); }
  ctx.restore(); }
function guanteGigante(x,y,s,rot=0){ ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s,s);
  ctx.fillStyle='#2FD47A'; rr(-520,-50,440,100,50); ctx.fill(); ctx.fillStyle='#FF8A1F'; rr(-300,-50,60,100,20); ctx.fill();
  ctx.fillStyle='#FFFFFF'; rr(-120,-70,60,140,20); ctx.fill(); ctx.fillStyle='#E5333F'; ctx.beginPath(); ctx.ellipse(40,0,130,115,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FF6B6B'; ctx.beginPath(); ctx.ellipse(60,-40,60,44,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(20,-70,30,14,-0.4,0,Math.PI*2); ctx.fill();
  ctx.restore(); ocupa(x-120*s,y-120*s,x+170*s,y+120*s,1.5); }
function burbujaGrande(t,x,y,r){ ctx.save(); const w=Math.sin(t*14)*0.06; ctx.translate(x,y); ctx.scale(1+w,1-w);
  ctx.fillStyle='rgba(220,250,255,0.35)'; blob(0,0,r); ctx.strokeStyle='rgba(255,255,255,0.95)'; ctx.lineWidth=10; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.ellipse(-r*0.4,-r*0.45,r*0.22,r*0.1,-0.6,0,Math.PI*2); ctx.fill(); ctx.restore(); ocupa(x-r,y-r,x+r,y+r,1.5); }
function icono(tipo,x,y,k,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.rotate(Math.sin(t*6+x)*0.08);
  ctx.fillStyle='#FFFFFF'; blob(0,0,92); ctx.fillStyle=PAL_ACTUAL.claro; blob(0,0,80);
  if(tipo==='luz'){ for(let i=0;i<8;i++){ ctx.save(); ctx.rotate(i/8*Math.PI*2+t*2); ctx.fillStyle='#FFD23F'; rr(-9,-70,18,34,9); ctx.fill(); ctx.restore(); } ctx.fillStyle='#FFE36E'; blob(0,0,34); }
  if(tipo==='ruido'){ ctx.strokeStyle='#5622BE'; ctx.lineWidth=10; ctx.lineCap='round'; for(let i=1;i<=3;i++){ ctx.beginPath(); ctx.arc(-30,0,i*20+Math.sin(t*12)*3,-0.8,0.8); ctx.stroke(); } ctx.fillStyle='#5622BE'; rr(-62,-22,24,44,8); ctx.fill(); }
  if(tipo==='calor'){ const f=Math.sin(t*14)*6; ctx.fillStyle='#FF4D6D'; ctx.beginPath(); ctx.moveTo(0,-62-f); ctx.bezierCurveTo(50,-20,44,50,0,52); ctx.bezierCurveTo(-44,50,-50,-20,0,-62-f); ctx.fill();
    ctx.fillStyle='#FFD23F'; ctx.beginPath(); ctx.moveTo(0,-22-f); ctx.bezierCurveTo(26,0,22,40,0,42); ctx.bezierCurveTo(-22,40,-26,0,0,-22-f); ctx.fill(); }
  ctx.restore(); ocupa(x-92,y-92,x+92,y+92,2); }
function tache(t,t0,x,y,w){ const u=prog(t,t0,0.2); if(u<=0) return; ctx.save(); ctx.strokeStyle='#E5333F'; ctx.lineWidth=22; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-w/2,y-50); ctx.lineTo(lerp(x-w/2,x+w/2,u),lerp(y-50,y+50,u)); ctx.stroke();
  const v=prog(t,t0+0.12,0.2); if(v>0){ ctx.beginPath(); ctx.moveTo(x+w/2,y-50); ctx.lineTo(lerp(x+w/2,x-w/2,v),lerp(y-50,y+50,v)); ctx.stroke(); } ctx.restore(); }
function pecera(x,y,w,h,grietas,t){ ctx.save(); ctx.fillStyle='rgba(180,240,255,0.30)'; rr(x-w/2,y-h,w,h,30); ctx.fill();
  ctx.fillStyle='rgba(58,182,255,0.35)'; rr(x-w/2,y-h*0.8,w,h*0.8,26); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=12; rr(x-w/2,y-h,w,h,30); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.6)'; rr(x-w/2+30,y-h+40,24,h*0.5,12); ctx.fill(); ctx.fillStyle='#7A4A22'; rr(x-w/2-30,y-10,w+60,60,20); ctx.fill();
  if(grietas>0){ ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=7; ctx.lineCap='round'; const cx=x+w*0.25, cy=y-h*0.55;
    for(let i=0;i<9;i++){ const a=i/9*Math.PI*2+0.3, L=(80+rand(i)*160)*grietas; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*L*0.5+rand(i+3)*20,cy+Math.sin(a)*L*0.5); ctx.lineTo(cx+Math.cos(a+0.15)*L,cy+Math.sin(a+0.15)*L); ctx.stroke(); } }
  ctx.restore(); }
function vidrios(t,t0,x,y){ if(t<t0) return; const u=t-t0; ctx.save(); ctx.fillStyle='rgba(220,250,255,0.9)';
  for(let i=0;i<12;i++){ const a=rand(i)*Math.PI*2, v=500+rand(i+1)*700; const px=x+Math.cos(a)*v*u, py=y+Math.sin(a)*v*u+900*u*u; ctx.save(); ctx.translate(px,py); ctx.rotate(u*8+i);
    ctx.beginPath(); ctx.moveTo(0,-26); ctx.lineTo(20,14); ctx.lineTo(-18,18); ctx.fill(); ctx.restore(); } ctx.restore(); }
function conos(t,t0,n,x0,y0,cols,dx){ const C16=['#FF4D6D','#FF8A1F','#FFD23F','#D7FF3D','#2FD47A','#17C6B4','#3AB6FF','#4D6BFF','#8D4DFF','#C04DFF','#FF5FA2','#FFB8D2','#B8FFF0','#FFF38A','#9DFF8A','#FFFFFF'];
  const C3=['#FF4D6D','#2FD47A','#3AB6FF']; const P=n===3?C3:C16;
  cascada(t,t0,n,(x,y,k,i)=>{ ctx.save(); ctx.translate(x,y+Math.sin(t*4+i)*8); ctx.scale(k,k); ctx.fillStyle='#FFFFFF'; blob(0,0,46); ctx.fillStyle=P[i]; blob(0,0,38);
    ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.ellipse(-12,-14,12,7,-0.5,0,Math.PI*2); ctx.fill(); ctx.restore(); },{x0,y0,cols,dx,dy:110,cada:0.04});
  ocupa(x0-50,y0-50,x0+(cols-1)*dx+50,y0+Math.ceil(n/cols)*110,1.2); }
function ojoGigante(x,y,cierre){ ctx.save(); ctx.translate(x,y); ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.ellipse(0,0,170,110,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3AB6FF'; blob(0,0,70); ctx.fillStyle='#1E1A2E'; blob(0,0,34); ctx.fillStyle='#FFFFFF'; blob(-20,-22,14);
  ctx.fillStyle='#FFC9A8'; ctx.beginPath(); ctx.ellipse(0,-110+220*cierre*0.5,180,110*cierre+4,0,Math.PI,0); ctx.fill(); ctx.fillRect(-180,-112,360,110*cierre);
  ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=8; ctx.beginPath(); ctx.ellipse(0,0,170,110,0,0,Math.PI*2); ctx.stroke(); ctx.restore(); ocupa(x-180,y-120,x+180,y+120,1.5); }

// ---------- escenas ----------
function S1(t,sc){ // CUADRO 0: Raro mantis pegando al agua, chispas, letrero ya visible
  const e=ext(t,2.2,0.2), sal=saleArriba(t,sc.end);
  raro({x:330,y:SUELO,s:1.3,t,expr:t<at(9)?'orgullo':'risa',brazos:'frente',manos:punch(e),disfraz:'mantis',alto:sal.alto,sq:sal.sq+0.08*e,tilt:0.1*e,wob:wobble(t,at(9))});
  chisporroteo(t+0.2/2.2,330+380*1.3,SUELO-236*1.3,2.2);
  burbujas(t,800,1200,10);
  letrero('¡AGUA CON CHISPAS!',540,420,t<0.05?1:1,'panel',{tam:70,t,t0:at(9)});
  if(t>=at(9)) lineasVelocidad(t,at(9),830,1130,'#FFFFFF',0.35);
}
function S2(t,sc){ // cae al arrecife y presume su nombre
  arrecife(t); const c=caida(t,sc.start);
  raro({x:620,y:SUELO,s:1.35,t,expr:'orgullo',brazos:t>=at(11)?'jarras':'arriba',disfraz:'mantis',alto:c.alto,sq:c.sq,wob:c.wob});
  letrero('CAMARÓN MANTIS',540,400,popIn(t,at(12)),'madera',{tam:68,t,t0:at(12)});
  chispas(t,at(13),300,1000,1.2);
}
function S3(t,sc){ // velocímetro 0 -> 80 km/h
  const e=ext(t,2.6);
  raro({x:380,y:SUELO,s:1.25,t,expr:'orgullo',brazos:'frente',manos:punch(e),disfraz:'mantis',sq:0.08*e,tilt:0.08*e});
  chisporroteo(t,380+380*1.25,SUELO-236*1.25,2.6);
  const k=popIn(t,at(16)); if(k>0){ ctx.save(); ctx.translate(540,520); ctx.scale(k,k);
    ctx.fillStyle='#1B1F3B'; ctx.beginPath(); ctx.arc(0,0,190,Math.PI,0); ctx.fill(); ctx.strokeStyle='#4CC9F0'; ctx.lineWidth=10; ctx.stroke();
    for(let i=0;i<=8;i++){ const a=Math.PI+i/8*Math.PI; ctx.strokeStyle=i>5?'#FF4D6D':'#8FF0FF'; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(Math.cos(a)*150,Math.sin(a)*150); ctx.lineTo(Math.cos(a)*175,Math.sin(a)*175); ctx.stroke(); }
    const v=easeOut(prog(t,at(20),0.5))*(1+0.03*Math.sin(t*40)); const a=Math.PI+v*0.85*Math.PI; ctx.strokeStyle='#D7FF3D'; ctx.lineWidth=14; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*140,Math.sin(a)*140); ctx.stroke(); ctx.fillStyle='#D7FF3D'; blob(0,0,20);
    ctx.font=fuente(64); ctx.textAlign='center'; ctx.fillStyle='#8FF0FF'; ctx.fillText(contador(t,at(20),0.5,0,80,' KM/H'),0,-40); ctx.restore(); ocupa(340,320,740,540,2.5); }
  lineasVelocidad(t,at(20),540,600,'#FFFFFF',0.3);
}
function S4(t,sc){ // ¡bajo el agua! acercamiento a la cara, burbujas por todos lados
  arrecife(t);
  raro({x:540,y:SUELO,s:1.45,t,expr:'asombro',brazos:'arriba',piernas:'flota',disfraz:'mantis',sq:gelatina(t,at(24)),wob:wobble(t,at(24))});
  burbujas(t,300,1200,14,1.3); burbujas(t,800,1150,14,1.3);
  letrero('¡BAJO EL AGUA!',540,520,popIn(t,at(24)+0.1),'panel',{tam:72,t,t0:at(24)});
}
function S5(t,sc){ // ojo parpadea lento vs. 50 golpes
  const cierre=0.5-0.5*Math.cos(clamp((t-sc.start)/2.0)*Math.PI*2);
  ojoGigante(300,900,cierre);
  const e=ext(t,6);
  raro({x:760,y:SUELO,s:1.15,t,expr:'risa',brazos:'frente',manos:{i:[lerp(-60,-380,ext(t,6,0.5)),lerp(-130,-236,ext(t,6,0.5))]},disfraz:'mantis',tilt:-0.06});
  ctx.save(); ctx.globalAlpha=0.5; ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=10; for(let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(760-200*1.15,SUELO-230*1.15,40+i*30,Math.PI*0.6,Math.PI*1.4); ctx.stroke(); } ctx.restore();
  letrero('×50',540,420,popIn(t,at(27)),'piedra',{tam:110,t,t0:at(27)});
  chispas(t,at(33),300,900,1.2);
}
function S6(t,sc){ // puf: científico con lupa. ¿Cómo?
  arrecife(t); const p=pufCambio(t,at(34));
  raro({x:600,y:SUELO,s:1.35,t,expr:p.despues?'sospecha':'asombro',brazos:'idle',disfraz:p.despues?'cientifico':'mantis',lupa:p.despues,spin:p.spin,sq:gelatina(t,at(34)+0.34),wob:wobble(t,at(34)+0.34)});
  nubePuf(t,at(34)+0.08,600,SUELO-160,1.4);
  for(const [i,x,y] of [[35,250,620],[37,880,560],[39,330,420]]){ const k=popIn(t,at(i)); if(k>0){ ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.rotate(Math.sin(t*5+x)*0.15);
    ctx.font=fuente(150); ctx.textAlign='center'; ctx.lineWidth=14; ctx.strokeStyle='#1E1A2E'; ctx.strokeText('?',0,50); ctx.fillStyle='#D7FF3D'; ctx.fillText('?',0,50); ctx.restore(); ocupa(x-60,y-80,x+60,y+80,1); } }
}
function S7(t,sc){ // el brazo cruza a toda velocidad
  raro({x:280,y:SUELO,s:1.1,t,expr:'asombro',brazos:'senala',disfraz:'cientifico',lupa:false,tilt:-0.05});
  const u=prog(t,at(41),0.25), gx=lerp(-600,820,easeOut(u));
  if(t>=at(41)){ ctx.save(); ctx.globalAlpha=0.6; ctx.fillStyle='#FFFFFF'; for(let i=0;i<6;i++) rr(gx-700-i*60,830+i*30-90,500,14,7), ctx.fill(); ctx.restore(); guanteGigante(gx,900,1.0,0); }
  lineasVelocidad(t,at(44),820,900,'#FFFFFF',0.3);
}
function S8(t,sc){ // el agua hierve... en frío
  arrecife(t);
  guanteGigante(560+Math.sin(t*30)*6,620,0.9,-0.1);
  const k=prog(t,at(51),0.3); burbujas(t,620,780,Math.round(4+14*k),1.1);
  const fr=t>=at(53);
  raro({x:300,y:SUELO,s:1.2,t,expr:fr?'sospecha':'asombro',mira:fr?{x:0,y:0}:undefined,brazos:fr?'jarras':'idle',disfraz:'cientifico',lupa:!fr,sq:gelatina(t,at(53)),wob:wobble(t,at(53))});
  // termómetro frío
  const tk=popIn(t,at(52)); if(tk>0){ ctx.save(); ctx.translate(860,1180); ctx.scale(tk,tk); ctx.fillStyle='#FFFFFF'; rr(-34,-300,68,300,34); ctx.fill(); blob(0,10,60);
    ctx.fillStyle='#3AB6FF'; blob(0,10,44); rr(-16,-80-Math.sin(t*3)*10,32,100,16); ctx.fill(); ctx.restore(); ocupa(790,860,930,1250,1.5); }
  letrero('HIERVE... EN FRÍO',540,400,popIn(t,at(52)),'pergamino',{tam:62,t,t0:at(52)});
}
function S9(t,sc){ // se forma una burbuja... y revienta
  const r=t<at(60)? 40+190*easeOut(prog(t,at(57),0.6)) : 0;
  guanteGigante(380,900,0.75,0);
  if(r>0) burbujaGrande(t,650,900,r);
