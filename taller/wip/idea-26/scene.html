<body><canvas id="c" width="1080" height="1920"></canvas>

<script src="../../raro.js"></script>
<script>
// mosquitos-001 — "Si mañana borraras todos los mosquitos… alguien lloraría." Raro en piyama borra mosquitos con una goma gigante;
// puf a mosquito macho (vegetariano), puf a parka en el Ártico, puf de vuelta a piyama.
const PI=Math.PI;
const PAST=['#FFB8D2','#B8E6FF','#FFE3A3','#C9F2B8','#D9C2FF','#FFC9A8'];
// ---------- helpers ----------
function goma(x,y,s,rot){ ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0); ctx.scale(s,s);
  ctx.fillStyle='#E0447F'; rr(-130,-48,260,104,26); ctx.fill(); ctx.fillStyle='#FF8FB8'; rr(-130,-60,260,96,26); ctx.fill();
  ctx.fillStyle='#4CC9F0'; rr(-20,-60,110,96,10); ctx.fill(); ctx.fillStyle='rgba(255,255,255,0.55)'; rr(-110,-48,80,18,9); ctx.fill(); ctx.restore();
  if(typeof ocupa==='function') ocupa(x-140*s,y-70*s,x+140*s,y+60*s,1.2); }
function migajas(t,x,y,n=6){ ctx.fillStyle='#FFB8D2'; for(let i=0;i<n;i++){ const u=(t*2+i/n)%1; blob(x+(rand(i)*2-1)*90*u,y+u*160,9*(1-u)+2); } }
function cama(x,y,s,frente){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  if(!frente){ ctx.fillStyle='#8A5BD6'; rr(-330,-430,90,470,40); ctx.fill(); ctx.fillStyle='#A47BEA'; rr(-310,-410,50,420,25); ctx.fill(); }
  else { ctx.fillStyle='#FFFFFF'; rr(-270,-200,250,90,45); ctx.fill(); ctx.fillStyle='#FF8FB8'; rr(-200,-150,560,180,60); ctx.fill();
    ctx.fillStyle='#FFB8D2'; for(let i=0;i<5;i++){ blob(-140+i*110,-90,22); } ctx.fillStyle='#6B3FB8'; rr(-300,10,700,40,20); ctx.fill(); }
  ctx.restore(); }
function reloj(x,y,r,t,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.rotate(Math.sin(t*20)*0.06);
  ctx.fillStyle='#FFD23F'; blob(-r*0.7,-r*0.85,r*0.32); blob(r*0.7,-r*0.85,r*0.32); ctx.fillStyle='#FF5FA2'; blob(0,0,r); ctx.fillStyle='#FFF4DC'; blob(0,0,r*0.8);
  ctx.font=fuente(r*0.55); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#1E1A2E'; ctx.fillText('3:00',0,4); ctx.restore();
  if(typeof ocupa==='function') ocupa(x-r,y-r*1.2,x+r,y+r,2); }
function ave(x,y,s,t,o={}){ ctx.save(); ctx.translate(x,y+(o.vuela?Math.sin(t*8+(o.seed||0))*14:0)); ctx.scale(s*(o.dir||1),s);
  const c=o.color||'#FFE3A3', osc=mix(c,'#5B4B8A',0.3); const al=o.vuela? Math.sin(t*14+(o.seed||0))*0.7 : 0.2;
  ctx.fillStyle=osc; ctx.save(); ctx.translate(-20,-10); ctx.rotate(-0.4-al); ctx.beginPath(); ctx.ellipse(-30,-20,70,30,0,0,PI*2); ctx.fill(); ctx.restore();
  ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(0,0,90,80,0,0,PI*2); ctx.fill(); ctx.fillStyle=mix(c,'#FFFFFF',0.5); ctx.beginPath(); ctx.ellipse(18,22,52,44,0,0,PI*2); ctx.fill();
  ctx.fillStyle='#FF9F1C'; ctx.beginPath(); ctx.moveTo(78,-14); ctx.lineTo(126,0); ctx.lineTo(78,14); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#1E1A2E'; ctx.beginPath(); ctx.ellipse(46,-24,11,14,0,0,PI*2); ctx.fill(); ctx.fillStyle='#FFFFFF'; blob(49,-28,4);
  if(o.llora){ ctx.fillStyle='#7FD8FF'; for(let i=0;i<2;i++){ const u=(t*1.8+i*0.5)%1; ctx.globalAlpha=1-u; ctx.beginPath(); ctx.ellipse(40+u*10,-6+u*90,9,13,0,0,PI*2); ctx.fill(); } ctx.globalAlpha=1;
    ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(30,-46); ctx.lineTo(62,-40); ctx.stroke(); }
  ctx.save(); ctx.translate(-20,-10); ctx.rotate(0.2+al); ctx.fillStyle=osc; ctx.beginPath(); ctx.ellipse(-20,-6,56,24,0,0,PI*2); ctx.fill(); ctx.restore();
  ctx.restore(); if(typeof ocupa==='function') ocupa(x-100*s,y-90*s,x+100*s,y+90*s,1); }
function pez(x,y,s,t,o={}){ ctx.save(); ctx.translate(x,y); ctx.scale(s*(o.dir||1),s); const c=o.color||'#FF9F6B';
  ctx.fillStyle=mix(c,'#5B4B8A',0.25); ctx.save(); ctx.translate(-120,0); ctx.rotate(Math.sin(t*10)*0.3); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-80,-60); ctx.lineTo(-80,60); ctx.closePath(); ctx.fill(); ctx.restore();
  ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(0,0,140,90,0,0,PI*2); ctx.fill(); ctx.fillStyle=mix(c,'#FFFFFF',0.4); ctx.beginPath(); ctx.ellipse(10,30,90,40,0,0,PI*2); ctx.fill();
  ctx.fillStyle='#1E1A2E'; blob(70,-26,16); ctx.fillStyle='#FFFFFF'; blob(75,-31,5);
  const m=o.boca||0; ctx.fillStyle='#7A2E4A'; ctx.beginPath(); ctx.ellipse(126,14,10+18*m,6+26*m,0,0,PI*2); ctx.fill(); ctx.restore();
  if(typeof ocupa==='function') ocupa(x-200*s,y-100*s,x+150*s,y+100*s,1); }
function larva(x,y,s,t,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); ctx.rotate(Math.sin(t*7+x)*0.5);
  ctx.fillStyle='#B9A86E'; for(let i=0;i<5;i++) blob(0,i*16,13-i*1.5); ctx.fillStyle='#7E6E3C'; blob(0,-8,15); ctx.restore(); }
function orquidea(x,y,s,t){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.strokeStyle='#3FAF5A'; ctx.lineWidth=16; ctx.beginPath(); ctx.moveTo(0,500); ctx.quadraticCurveTo(-30,250,0,0); ctx.stroke();
  ctx.fillStyle='#57C96F'; for(const sd of [-1,1]){ ctx.beginPath(); ctx.ellipse(sd*90,380,110,34,sd*-0.5,0,PI*2); ctx.fill(); }
  ctx.rotate(Math.sin(t*1.5)*0.05); ctx.fillStyle='#D8F5C8'; for(let i=0;i<5;i++){ ctx.save(); ctx.rotate(-PI/2+i/5*PI*2); ctx.beginPath(); ctx.ellipse(0,-90,40,90,0,0,PI*2); ctx.fill(); ctx.restore(); }
  ctx.fillStyle='#B6E89E'; ctx.beginPath(); ctx.ellipse(0,60,34,90,0,0,PI*2); ctx.fill(); ctx.fillStyle='#FFD23F'; blob(0,-10,26); ctx.restore();
  if(typeof ocupa==='function') ocupa(x-200*s,y-200*s,x+200*s,y+200*s,1.2); }
const CUERNOS={ cabeza(o){ const w=o.wob||0; ctx.save(); ctx.translate(0,-360); ctx.strokeStyle='#8A5A2E'; ctx.lineWidth=18; ctx.lineCap='round';
  for(const s of [-1,1]){ ctx.save(); ctx.rotate(s*w*0.1); ctx.beginPath(); ctx.moveTo(s*50,0); ctx.quadraticCurveTo(s*110,-120,s*90,-230); ctx.stroke();
    for(const [a,b,c,d] of [[80,-80,150,-120],[95,-150,170,-190],[92,-200,40,-260]]){ ctx.beginPath(); ctx.moveTo(s*a,b); ctx.lineTo(s*c,d); ctx.stroke(); } ctx.restore(); }
  ctx.fillStyle='#4A2F17'; blob(0,110,22); ctx.restore(); } };
function caribu(x,y,s,t,o={}){ gomita({x,y,s,t,seed:o.seed||3,color:'#D9B48A',expr:o.expr||'feliz',brazos:o.brazos||'idle',disfraz:CUERNOS,alto:o.alto,sq:o.sq,wob:o.wob,piernas:o.piernas}); }
function lata(x,y,s,k=1,t=0){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); ctx.rotate(Math.sin(t*3)*0.04);
  ctx.fillStyle='#C7303F'; rr(-110,-380,220,380,40); ctx.fill(); ctx.fillStyle='#FF4D5E'; rr(-110,-380,180,380,40); ctx.fill();
  ctx.fillStyle='#D9D4E8'; ctx.beginPath(); ctx.ellipse(0,-380,110,26,0,0,PI*2); ctx.fill(); ctx.fillStyle='#B8B2CC'; ctx.beginPath(); ctx.ellipse(10,-384,30,10,0,0,PI*2); ctx.fill();
  ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.moveTo(-110,-230); ctx.bezierCurveTo(-30,-280,40,-150,110,-210); ctx.lineTo(110,-170); ctx.bezierCurveTo(40,-110,-30,-240,-110,-190); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.35)'; rr(-90,-350,26,320,13); ctx.fill(); ctx.restore();
  if(typeof ocupa==='function') ocupa(x-110*s*k,y-400*s*k,x+110*s*k,y,1.5); }
function podio(t,t0,x,y){ const k=popIn(t,t0); if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(1,k);
  for(const [dx,h,c,n] of [[-230,180,'#B8E6FF','3'],[230,260,'#FFC9A8','2'],[0,360,'#FFD23F','1']]){ ctx.fillStyle=mix(c,'#5B4B8A',0.25); rr(dx-115,-h+10,230,h,18); ctx.fill(); ctx.fillStyle=c; rr(dx-115,-h,230,h,18); ctx.fill();
    ctx.font=fuente(110); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#FFFFFF'; ctx.fillText(n,dx,-h/2); }
  ctx.restore(); if(typeof ocupa==='function') ocupa(x-345,y-380,x+345,y,1.2); }
function tierra(x,y,r,t){ ctx.save(); ctx.translate(x,y); ctx.fillStyle='rgba(120,200,255,0.3)'; blob(0,0,r*1.12); ctx.fillStyle='#3AB6FF'; blob(0,0,r);
  ctx.save(); ctx.beginPath(); ctx.arc(0,0,r,0,PI*2); ctx.clip(); ctx.fillStyle='#7FD34E'; const o=(t*20)%(r*4);
  for(const [a,b,c] of [[-0.5,-0.3,0.4],[0.4,0.2,0.35],[-0.1,0.55,0.25],[0.7,-0.5,0.2]]){ blob(a*r+o-r*2,b*r,c*r); blob(a*r+o+r*2,b*r,c*r); blob(a*r+o,b*r,c*r);} ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.ellipse(-r*0.4,-r*0.45,r*0.25,r*0.1,-0.5,0,PI*2); ctx.fill(); ctx.restore();
  if(typeof ocupa==='function') ocupa(x-r,y-r,x+r,y+r,1.5); }
function hoyo(x,y,w,c){ ctx.fillStyle=c||'#2E1F4A'; ctx.beginPath(); ctx.ellipse(x,y,w,w*0.28,0,0,PI*2); ctx.fill(); }
function nido(x,y,s,t,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); ctx.fillStyle='#A8754A'; ctx.beginPath(); ctx.ellipse(0,0,120,46,0,0,PI); ctx.fill();
  ctx.strokeStyle='#7A4F2C'; ctx.lineWidth=6; for(let i=0;i<5;i++){ ctx.beginPath(); ctx.moveTo(-110+i*10,4+i*6); ctx.lineTo(100-i*12,10+i*5); ctx.stroke(); } ctx.restore();
  ave(x-30*s*k,y-40*s*k,0.45*s*k,t,{color:'#FFE3A3',seed:x}); ave(x+40*s*k,y-36*s*k,0.4*s*k,t,{color:'#FFD7A3',seed:x+1,dir:-1}); }
function sudor(t,x,y){ ctx.fillStyle='#7FD8FF'; for(let i=0;i<3;i++){ const u=((t*1.5+i/3)%1); ctx.globalAlpha=1-u; ctx.beginPath(); ctx.ellipse(x+(i-1)*40,y+u*80,8,12,0,0,PI*2); ctx.fill(); } ctx.globalAlpha=1; }
function prohibido(x,y,r,k){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.strokeStyle='#FF3B5C'; ctx.lineWidth=22; ctx.beginPath(); ctx.arc(0,0,r,0,PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-r*0.7,-r*0.7); ctx.lineTo(r*0.7,r*0.7); ctx.stroke(); ctx.restore(); }
function signos(t,x,y){ ctx.font=fuente(120); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#FFFFFF';
  for(let i=0;i<3;i++){ const u=(t*0.8+i/3)%1; ctx.globalAlpha=Math.sin(u*PI); ctx.fillText('?',x+(i-1)*200,y-u*120); } ctx.globalAlpha=1; }
function confeti(t,n=26){ for(let i=0;i<n;i++){ const y=((rand(i)*2000+t*(260+rand(i+3)*200))%2000)-80, x=rand(i+7)*1080+Math.sin(t*3+i)*30;
  ctx.save(); ctx.translate(x,y); ctx.rotate(t*4+i); ctx.fillStyle=PAST[i%6]; ctx.fillRect(-12,-6,24,12); ctx.restore(); } }

// ---------- enjambre que se borra (gancho y loop) ----------
const ENJ=[[230,820],[820,760],[400,640],[690,980],[170,1060],[900,1100],[560,560],[330,1180],[760,600],[120,700]];
function escenaBorrar(t,lt){ cama(540,SUELO+40,1,false);
  const sw=Math.sin(lt*5.5); const gx=540+230*sw, gy=760+40*Math.cos(lt*11);
  ENJ.forEach(([x,y],i)=>{ const te=0.25+i*0.27; const b=clamp((lt-te)/0.3,0,1); mosquito(x+Math.sin(t*3+i)*30,y,1.2,t,{seed:i,dir:i%2?-1:1,borrado:b,hembra:i%3===0}); if(lt>=te&&lt<te+0.5){ chispas(t,te+(t-lt),x,y,1.4,'#FFFFFF'); ondaChoque(t,te+(t-lt),x,y,'#FFB8D2',0.4); } });
  if(lt>0.6&&lt<1.0) lineasVelocidad(t,0.6+(t-lt),gx,gy,'#FFFFFF',0.35);
  raro({x:560,y:SUELO-150,s:0.95,t,expr:'orgullo',brazos:'carga',manos:{d:[(gx-560)/0.95+40,-560],i:[(gx-560)/0.95-80,-540]},disfraz:'piyama',tilt:sw*0.08,wob:Math.sin(lt*11)*0.3});
  goma(gx,gy,0.9,sw*0.4); migajas(t,gx,gy+40);
  cama(540,SUELO+40,1,true); }

// ========== ESCENAS ==========
// S1 (0–2.96) GANCHO: cuarto de noche (interior violeta). Raro en piyama, parado en la cama, barre con una goma gigante un enjambre de mosquitos que se borran uno por uno. Letrero "¡ADIÓS, MOSQUITOS!" desde el cuadro 0. Toma: push.
function S1(t,sc){ escenaBorrar(t,t-sc.start); letrero('¡ADIÓS, MOSQUITOS!',540,400,1,'madera',{tam:70,t,t0:-1}); }
// S2 (2.96–4.3) "alguien lloraría." Cerros turquesa: un pajarito y un pez en su pecera lloran a mares; Raro se asoma con la goma, sorprendido. Toma: pull.
function S2(t,sc){ ave(330,1150,1.1,t,{llora:true,color:'#FFE3A3'}); ctx.fillStyle='rgba(200,240,255,0.55)'; blob(780,1270,150); pez(780,1280,0.55,t,{dir:-1,color:'#FF9F6B'});
  ctx.fillStyle='#7FD8FF'; for(let i=0;i<2;i++){ const u=(t*1.8+i*0.5)%1; ctx.globalAlpha=1-u; ctx.beginPath(); ctx.ellipse(730,1250+u*60,8,12,0,0,PI*2); ctx.fill(); } ctx.globalAlpha=1;
  const c=caida(t,sc.start,700); raro({x:560,y:SUELO,s:0.7,t,expr:'asombro',brazos:'frente',disfraz:'piyama',alto:c.alto,sq:c.sq,wob:c.wob}); goma(560,SUELO-120,0.5,0.1);
  letrero('ALGUIEN LLORARÍA',540,410,popIn(t,at(6)),'pergamino',{tam:66,t,t0:at(6)}); }
// S3 (4.3–5.4) "Y no serías tú." Liso magenta, cerrado: Raro mira a cámara con cara de sospecha y niega con la cabeza.
function S3(t,sc){ raro({x:540,y:SUELO,s:1.35,t,expr:'sospecha',mira:{x:0,y:0},brazos:'jarras',disfraz:'piyama',tilt:Math.sin(t*9)*0.08});
  letrero('NO SERÍAS TÚ',540,410,popIn(t,at(9)),'panel',{tam:70,t,t0:at(9)}); }
// S4 (5.4–8.91) "Tú harías fiesta: adiós al bzzz en la oreja" Cielo limón: Raro brinca de fiesta con confeti; en "bzzz" un mosquito se acerca a su oreja y aparece el signo de prohibido.
function S4(t,sc){ confeti(t); const b=brinco(t,sc.start+0.1+Math.floor(Math.max(0,t-sc.start-0.1)/0.55)*0.55,0.5,150);
  raro({x:460,y:SUELO,s:1.0,t,expr:'risa',brazos:'arriba',disfraz:'piyama',alto:b.alto,sq:b.sq,wob:b.wob});
  if(t>=at(16)){ const k=popIn(t,at(16)); mosquito(760,900-b.alto*0.3,0.9*k,t,{dir:-1,seed:2}); prohibido(760,900,140,popIn(t,at(17)+0.15)); }
  letrero(t>=at(15)?'ADIÓS, BZZZ':'¡FIESTA!',540,400,popIn(t,at(14)),'madera',{tam:72,t,t0:t>=at(15)?at(15):at(14)}); chispas(t,at(14),460,900,1.3); }
// S5 (8.91–10.18) "a las 3 de la mañana." Interior violeta de noche: Raro acostado en la cama con los ojos al doble; reloj despertador 3:00 brinca.
function S5(t,sc){ cama(620,SUELO,1,false); raro({x:640,y:SUELO-120,s:0.9,t,expr:'terror',brazos:'cara',disfraz:'piyama',ojos:1.6});
  cama(620,SUELO,1,true); reloj(250,880,130,t,popIn(t,at(22))); mosquito(860,760,0.7,t,{dir:-1,seed:4});
  letrero('3 DE LA MAÑANA',540,400,popIn(t,at(23)),'pergamino',{tam:64,t,t0:at(23)}); }
// S6 (10.18–12.36) "Ese bzzz son sus alas:" Liso turquesa: mosquito gigante de cerca con las alas zumbando; Raro chiquito se tapa los oídos.
function S6(t,sc){ const k=easeOut(prog(t,sc.start,0.4)); mosquito(620,900,3.2*k+0.2,t,{dir:-1,seed:1}); ocupa(300,700,940,1250,1.5);
  raro({x:250,y:SUELO,s:0.6,t,expr:'asco',brazos:'cara',disfraz:'piyama',tilt:Math.sin(t*14)*0.05}); rachas(t,0.5,0.4,700,1200);
  letrero(t>=at(31)?'¡SON SUS ALAS!':'BZZZ…',540,400,popIn(t,sc.start+0.05),'panel',{tam:70,t,t0:t>=at(31)?at(31):sc.start}); }
// S7 (12.36–14.8) "unos 400 aleteos por segundo." Cielo mandarina: Raro intenta aletear como mosquito (brazos arriba a toda velocidad) y suda; contador 400.
function S7(t,sc){ const f=Math.sin(t*40); raro({x:620,y:SUELO,s:1.0,t,expr:t>=at(34)?'yavalio':'feliz',brazos:'idle',manos:{d:[200,-300+f*120],i:[-200,-300-f*120]},disfraz:'piyama',alto:Math.abs(f)*30});
  sudor(t,620,SUELO-420); mosquito(260,820,1.2,t,{seed:3}); rachas(t,0.4,0.35,600,1100);
  letrero(contador(t,at(33),0.8,0,400)+' POR SEGUNDO',540,400,popIn(t,at(33)),'panel',{tam:64,t,t0:at(33)}); }
// S8 (14.8–17.41) "Y la que te pica siempre es hembra:" Liso cielo: mosquito con moño rosa aterriza en el brazo de Raro; en "pica" Raro brinca del susto.
function S8(t,sc){ const su=susto(t,at(41)); const tx=lerp(1100,700,easeOut(prog(t,sc.start,1.0)));
  raro({x:440,y:SUELO,s:1.05,t,expr:t>=at(41)?'terror':'sospecha',brazos:'senala',disfraz:'piyama',alto:su.alto,sq:su.sq,wob:su.wob});
  mosquito(tx,1000-su.alto,1.1,t,{dir:-1,hembra:true,seed:5}); if(t>=at(41)) estrellitas(t,at(41),440,SUELO-470-su.alto);
  letrero(t>=at(44)?'¡ES HEMBRA!':'LA QUE TE PICA',540,400,popIn(t,sc.start+0.1),'madera',{tam:68,t,t0:t>=at(44)?at(44):sc.start}); }
// S9 (17.41–19.35) "necesita sangre para sus huevos." Olas magenta: la hembra con la panza roja deja una balsita de huevitos que van apareciendo con pop.
function S9(t,sc){ const pz=easeOut(prog(t,at(46),0.5)); mosquito(380,820,1.4,t,{hembra:true,panza:pz,seed:6});
  for(let i=0;i<7;i++){ const k=popIn(t,at(48)+i*0.08); if(k>0){ ctx.fillStyle='#FFF4DC'; ctx.beginPath(); ctx.ellipse(560+i*44,SUELO-60,16*k,26*k,0.2,0,PI*2); ctx.fill(); } }
  raro({x:820,y:SUELO+60,s:0.6,t,expr:'asco',brazos:'cara',disfraz:'piyama',piernas:'flota',tilt:Math.sin(t*2)*0.1});
  letrero(t>=at(48)?'PARA SUS HUEVOS':'SANGRE',540,400,popIn(t,at(46)),'pergamino',{tam:66,t,t0:t>=at(48)?at(48):at(46)}); }
// S10 (19.35–22.18) "Los machos ni pican. Toman néctar de flores." Selva limón: ¡puf! Raro se vuelve mosquito macho y sorbe néctar de una flor gigante.
const FLOR=(x,y,s,t,c)=>{ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.strokeStyle='#3FAF5A'; ctx.lineWidth=14; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,400); ctx.stroke(); ctx.rotate(Math.sin(t*1.2+x)*0.08);
