<script>
// soplar-001-v2 — ¿Qué pasaría si todos le sopláramos a un huracán? (serie "¿Qué pasaría si TODOS…?", Parte 8, corrección del revisor)
// Disfraces: playero (Cancún) → científico (velocidad del soplido) → ingeniero (juntar el aire, energía) → playero (el huracán regresa el soplido) → loop.
// Reglas de encuadre (comentarios del revisor): Raro siempre completo dentro de x≈20–940; huracán dentro de x≤920; letreros en y≥330.
const PI2=Math.PI*2;
window.HIDE_CAPTIONS_LAST=false;
window.CAPTION_POP_MIN=0.85;

// ---------- utilería ----------
// Letrero en coordenadas de PANTALLA (x,y = donde debe verse), compensando el zoom de la toma de la escena: nunca sale de x 180–900 ni arriba de y=330.
let CUR=1;
function L(txt,x,y,k,tipo='madera',opts={}){ const TM=(window.TOMAS||{})[CUR]||{}, Z=Math.max(1,TM.z||1), F=TM.foco||[540,960];
  let tam=(opts.tam||72)/Z; ctx.font=fuente(tam); let w=ctx.measureText(txt).width+tam*1.2; const maxW=600/Z;
  if(w>maxW){ tam*=maxW/w; w=maxW; } const sw=w*Z; x=clamp(x,180+sw/2,900-sw/2); y=clamp(y,380,520);
  const X=F[0]+(x-540)/Z, Y=F[1]+(y-960)/Z;
  letrero(txt,X,Y,k,tipo,{sinPalo:!opts.palo,...opts,tam}); }
// boca de Raro en el mundo
function boca(o){ const s=o.s??1; return [o.x, o.y-(o.alto||0)-232*s]; }
// soplido: bocanadas y trazos que salen de la boca hacia dir (1 derecha, -1 izquierda)
function soplo(t,x,y,dir=1,s=1,k=1,largo=260){ if(k<=0) return; ctx.save(); ctx.lineCap='round';
  for(let i=0;i<7;i++){ const u=((t*1.7+i/7)%1); const px=x+dir*(26+u*largo)*s, py=y+Math.sin(u*7+i*1.3)*16*s;
    ctx.globalAlpha=0.8*(1-u)*k; ctx.fillStyle='#FFFFFF'; blob(px,py,(7+u*26)*s);
    ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=5*s; ctx.beginPath(); ctx.moveTo(px-dir*30*s,py-22*s); ctx.quadraticCurveTo(px,py-34*s,px+dir*24*s,py-20*s); ctx.stroke(); }
  ctx.restore(); }
// huracán: brazos en espiral que giran (antihorario, hemisferio norte), ojo al centro; o.cara = carita aburrida; o.calor = brillo naranja
function huracan(t,x,y,r,o={}){ const k=o.k??1; if(k<=0.01) return; const P=PAL_ACTUAL;
  if(typeof ocupa==='function') ocupa(x-r*k,y-r*k,x+r*k,y+r*k,o.peso??1.21);
  ctx.save(); ctx.translate(x,y); ctx.scale(k,k);
  const halo=ctx.createRadialGradient(0,0,r*0.2,0,0,r*1.05); halo.addColorStop(0,o.calor?`rgba(255,170,80,${0.55*o.calor})`:'rgba(255,255,255,0.4)'); halo.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=halo; blob(0,0,r*1.05);
  ctx.save(); ctx.scale(1,0.94); ctx.rotate(-t*(o.vel??1.3));
  for(let arm=0;arm<4;arm++) for(let j=34;j>=0;j--){ const u=j/34, a=arm*PI2/4+u*3.4, rad=r*(0.16+u*0.74);
    const c= (j+arm)%3===0? '#D9D4E8' : '#FFFFFF'; ctx.globalAlpha=0.55+0.45*(1-u); ctx.fillStyle=o.calor? mix(c,'#FFB45C',o.calor*0.6) : c;
    blob(Math.cos(a)*rad,Math.sin(a)*rad,r*(0.07+0.13*(1-u))); }
  ctx.globalAlpha=1; ctx.restore();
  ctx.fillStyle=mix(P.oscuro,'#000000',0.25); blob(0,0,r*0.13); ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=r*0.05; ctx.beginPath(); ctx.arc(0,0,r*0.16,0,PI2); ctx.stroke();
  if(o.cara){ const bl=parpadeo(t,9); ctx.fillStyle='#1E1A2E'; for(const sx of [-1,1]){ ctx.beginPath(); ctx.ellipse(sx*r*0.36,-r*0.34,r*0.07,r*0.06*bl*(o.cara==='aburrido'?0.55:1)+1,0,0,PI2); ctx.fill(); }
    ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=r*0.035; ctx.lineCap='round'; ctx.beginPath();
    if(o.cara==='sopla'){ ctx.arc(r*0.0,r*0.4,r*0.07,0,PI2); } else { ctx.moveTo(-r*0.12,r*0.42); ctx.lineTo(r*0.12,r*0.42); } ctx.stroke();
    if(o.cara==='aburrido'){ ctx.fillStyle='#1E1A2E'; for(const sx of [-1,1]){ ctx.fillRect(sx*r*0.36-r*0.1,-r*0.43,r*0.2,r*0.035); } } }
  ctx.restore(); }
// rachas de derecha a izquierda (el huracán sopla de regreso)
function rachasIzq(t,f,a,y0,y1){ ctx.save(); ctx.translate(1080,0); ctx.scale(-1,1); rachas(t,f,a,y0,y1); ctx.restore(); }
// playa de Cancún: mar turquesa al fondo, arena, palmeras (3 capas)
function playa(t,px=0){ const P=PAL_ACTUAL, G=SUELO;
  ctx.fillStyle=mix(P.claro,'#FFFFFF',0.3); nube(220+px*0.2,360,1.1); nube(820+px*0.2,520,0.8);
  ctx.fillStyle=mix('#3FE0D0',P.medio,0.35); ctx.fillRect(-300,G-420,1680,300);
  ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=8; ctx.lineCap='round'; for(let i=0;i<7;i++){ const x=((i*190+t*40+px*0.4)%1400)-160, y=G-380+(i%3)*80; ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x+40,y-12,x+80,y); ctx.stroke(); }
  ctx.fillStyle='#FFFFFF'; ctx.globalAlpha=0.85; ctx.beginPath(); ctx.moveTo(-300,G-130); for(let x=-300;x<=1380;x+=20) ctx.lineTo(x,G-130+Math.sin(x*0.02+t*2.4)*10); ctx.lineTo(1380,G-100); ctx.lineTo(-300,G-100); ctx.fill(); ctx.globalAlpha=1;
  ctx.fillStyle='#FFE3A3'; ctx.fillRect(-300,G-120,1680,1000);
  ctx.fillStyle='#F5CF7E'; for(let i=0;i<12;i++){ const x=((rand(i)*1400+px*1.1)%1400)-160; ctx.beginPath(); ctx.ellipse(x,G+40+rand(i+3)*380,40+rand(i+5)*50,10,0,0,PI2); ctx.fill(); }
  const palma=(x,s)=>{ ctx.save(); ctx.translate(x,G-100); ctx.scale(s,s); ctx.strokeStyle='#B07A3E'; ctx.lineWidth=34; ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(30,-260,-10,-520); ctx.stroke();
    for(let k=0;k<6;k++) hoja(-10,-520,240,-Math.PI+k*0.62+Math.sin(t*1.6+k)*0.06,k%2?'#2FB36B':'#23935A'); ctx.restore(); };
  palma(70+px*0.5,0.8); palma(1010+px*0.5,0.7);
}
EXTRA_FONDOS.playa=function(t,P,px){ playa(t,px(0.6)/0.6); };
// multitud de gomitas en la playa que soplan hacia (tx,ty)
function multitud(t,filas,dir=1,k=1){ for(const [y,s,n,x0,dx,f] of filas) for(let i=0;i<n;i++){ const x=x0+i*dx+(f%2?dx*0.5:0)+Math.sin(t*2+i+f)*5; if(x<20||x>1060) continue;
  const seed=f*11+i+3, al=Math.abs(Math.sin(t*(4+i%3)+i*1.3+f))*8;
  const o={x,y,s,t,seed,expr:'sopla',cachetes:0.8+0.2*Math.sin(t*6+i),brazos:(i+f)%3?'idle':'jarras',npc_peso:0.1,alto:al,espejo:dir<0};
  gomita(o); const b=boca(o); soplo(t+rand(seed),b[0]+dir*20*s,b[1],dir,s*1.4,k,200); } }
// velocímetro: v y vmax en km/h; rojo a partir de rojoDesde
function velocimetro(x,y,r,v,vmax,k=1,rojoDesde=119){ if(k<=0) return; if(typeof ocupa==='function') ocupa(x-r,y-r,x+r,y+r*0.3,1.1);
  ctx.save(); ctx.translate(x,y); ctx.scale(k,k);
  ctx.fillStyle='#2A2440'; ctx.beginPath(); ctx.arc(0,0,r+22,Math.PI,0); ctx.lineTo(r+22,r*0.25); ctx.lineTo(-r-22,r*0.25); ctx.fill();
  ctx.lineWidth=r*0.16; const a0=Math.PI, f=v=>a0+Math.PI*clamp(v/vmax);
  ctx.strokeStyle='#6CFFB5'; ctx.beginPath(); ctx.arc(0,0,r*0.82,a0,f(rojoDesde*0.6)); ctx.stroke();
  ctx.strokeStyle='#FFD23F'; ctx.beginPath(); ctx.arc(0,0,r*0.82,f(rojoDesde*0.6),f(rojoDesde)); ctx.stroke();
  ctx.strokeStyle='#FF4D5E'; ctx.beginPath(); ctx.arc(0,0,r*0.82,f(rojoDesde),2*Math.PI); ctx.stroke();
  ctx.save(); ctx.rotate(f(v)); ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(r*0.78,0); ctx.lineTo(0,12); ctx.fill(); ctx.restore();
  ctx.fillStyle='#FFFFFF'; blob(0,0,r*0.1); ctx.restore(); }
function regla(x,y,w,k){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.fillStyle='#FFD23F'; rr(-w/2,-40,w,80,14); ctx.fill();
  ctx.strokeStyle='#7A5A0A'; ctx.lineWidth=5; for(let i=0;i<=10;i++){ const xx=-w/2+16+i*(w-32)/10; ctx.beginPath(); ctx.moveTo(xx,-40); ctx.lineTo(xx,i%5?-18:0); ctx.stroke(); } ctx.restore(); }
function garrafon(x,y,s,k,t){ if(k<=0) return; if(typeof ocupa==='function') ocupa(x-110*s*k,y-330*s*k,x+110*s*k,y,1.1); ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); ctx.rotate(Math.sin(t*3)*0.04);
  ctx.fillStyle='rgba(174,230,255,0.75)'; rr(-110,-260,220,260,50); ctx.fill(); rr(-40,-320,80,70,16); ctx.fill(); ctx.fillStyle='#3AB6FF'; rr(-46,-340,92,30,10); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.7)'; rr(-80,-230,30,180,15); ctx.fill();
  for(let i=0;i<4;i++){ const u=((t*0.7+i/4)%1); ctx.fillStyle='rgba(255,255,255,0.8)'; blob(-40+i*28,-40-u*190,10+i*2); }
  ctx.fillStyle='#FFFFFF'; rr(-70,-160,140,70,14); ctx.fill(); ctx.fillStyle='#1C79D2'; ctx.font=fuente(52); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('5 L',0,-123); ctx.restore(); }
function cuboAire(x,y,lado,k,t){ if(k<=0) return; const d=lado*0.13; ctx.save(); ctx.translate(x,y); ctx.scale(1,k); ctx.translate(0,0);
  ctx.globalAlpha=0.55; ctx.fillStyle='#BDF3FF'; ctx.beginPath(); ctx.moveTo(-lado/2,-lado); ctx.lineTo(-lado/2-d,-lado-d); ctx.lineTo(lado/2-d,-lado-d); ctx.lineTo(lado/2,-lado); ctx.fill();
  ctx.fillStyle='#7FD8FF'; ctx.beginPath(); ctx.moveTo(-lado/2,0); ctx.lineTo(-lado/2-d,-d); ctx.lineTo(-lado/2-d,-lado-d); ctx.lineTo(-lado/2,-lado); ctx.fill();
  ctx.fillStyle='#AEE6FF'; ctx.fillRect(-lado/2,-lado,lado,lado); ctx.globalAlpha=1;
  ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=8; ctx.lineJoin='round'; ctx.strokeRect(-lado/2,-lado,lado,lado);
  ctx.beginPath(); ctx.moveTo(-lado/2,-lado); ctx.lineTo(-lado/2-d,-lado-d); ctx.lineTo(lado/2-d,-lado-d); ctx.lineTo(lado/2,-lado); ctx.moveTo(-lado/2-d,-lado-d); ctx.lineTo(-lado/2-d,-d); ctx.lineTo(-lado/2,0); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.7)'; for(let i=0;i<9;i++){ const u=((t*0.3+rand(i))%1); blob(-lado/2+30+rand(i+2)*(lado-60),-30-u*(lado-60),8+rand(i+4)*16); }
  ctx.restore(); if(typeof ocupa==='function') ocupa(x-lado/2-d,y-(lado+d)*k,x+lado/2,y,1.21); }
function torreLatino(x,y,h,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(1,k); const w=h*0.2;
  ctx.fillStyle='#5A6FB0'; ctx.beginPath(); ctx.moveTo(-w/2,0); ctx.lineTo(-w*0.36,-h*0.85); ctx.lineTo(w*0.36,-h*0.85); ctx.lineTo(w/2,0); ctx.fill();
  ctx.fillStyle='#8FA3E0'; for(let i=0;i<14;i++){ const yy=-h*0.06-i*h*0.056, ww=lerp(w*0.44,w*0.32,i/14); ctx.fillRect(-ww,yy,ww*2,h*0.02); }
  ctx.fillStyle='#43558C'; rr(-w*0.26,-h*0.93,w*0.52,h*0.09,6); ctx.fill(); ctx.fillStyle='#C9C3E0'; ctx.fillRect(-4,-h*1.04,8,h*0.11); ctx.fillStyle='#FF4D5E'; blob(0,-h*1.04,8); ctx.restore(); }
function cronometro(x,y,r,t,t0,k,txt){ if(k<=0) return; if(typeof ocupa==='function') ocupa(x-r,y-r*1.3,x+r,y+r,1.1); ctx.save(); ctx.translate(x,y); ctx.scale(k,k);
  ctx.fillStyle='#C9C3E0'; rr(-26,-r-50,52,40,10); ctx.fill(); ctx.fillStyle='#FFFFFF'; blob(0,0,r+14); ctx.fillStyle='#FF4D5E'; blob(0,0,r); ctx.fillStyle='#FFFFFF'; blob(0,0,r-18);
  ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=6; for(let i=0;i<12;i++){ const a=i/12*PI2; ctx.beginPath(); ctx.moveTo(Math.cos(a)*(r-30),Math.sin(a)*(r-30)); ctx.lineTo(Math.cos(a)*(r-46),Math.sin(a)*(r-46)); ctx.stroke(); }
  const a=-Math.PI/2+Math.min(0.06,Math.max(0,t-t0)*0.4); ctx.strokeStyle='#FF4D5E'; ctx.lineWidth=10; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*(r-40),Math.sin(a)*(r-40)); ctx.stroke();
  ctx.fillStyle='#1E1A2E'; blob(0,0,12); if(txt){ ctx.font=fuente(r*0.42); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#1E1A2E'; ctx.fillText(txt,0,r*0.42); } ctx.restore(); }
function planta(x,y,s,k,t,seed=0){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); const c=PASTELES[seed%PASTELES.length];
  for(const cx of [-50,40]){ ctx.fillStyle=mix(c,'#5B4B8A',0.25); rr(cx-18,-230,36,180,10); ctx.fill(); ctx.fillStyle='#FF4D5E'; ctx.fillRect(cx-18,-210,36,14);
    for(let i=0;i<3;i++){ const u=((t*0.8+i/3+rand(seed+cx))%1); ctx.globalAlpha=0.8*(1-u); ctx.fillStyle='#FFFFFF'; blob(cx+u*30,-240-u*120,14+u*22); } ctx.globalAlpha=1; }
  ctx.fillStyle=c; rr(-100,-110,200,110,16); ctx.fill(); ctx.fillStyle='#FFD23F'; ctx.beginPath(); ctx.moveTo(10,-90); ctx.lineTo(-14,-46); ctx.lineTo(6,-46); ctx.lineTo(-8,-12); ctx.lineTo(26,-60); ctx.lineTo(6,-60); ctx.closePath(); ctx.fill(); ctx.restore(); }
function foco(x,y,s,on,t){ if(typeof ocupa==='function') ocupa(x-90*s,y-130*s,x+90*s,y+120*s,1.1); ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  if(on>0){ const g=ctx.createRadialGradient(0,-20,10,0,-20,300); g.addColorStop(0,`rgba(255,246,160,${0.9*on})`); g.addColorStop(1,'rgba(255,246,160,0)'); ctx.fillStyle=g; blob(0,-20,300); }
  ctx.fillStyle=on>0? mix('#E9E4F7','#FFF6A0',on) : '#E9E4F7'; blob(0,-30,90); ctx.fillStyle=on>0?'#FFFFFF':'#C9C3E0'; rr(-40,40,80,30,8); ctx.fill();
  ctx.fillStyle='#8E8AA3'; rr(-46,58,92,70,14); ctx.fill(); ctx.strokeStyle='#6E6A88'; ctx.lineWidth=6; for(const yy of [78,98,118]){ ctx.beginPath(); ctx.moveTo(-46,yy); ctx.lineTo(46,yy); ctx.stroke(); }
  ctx.strokeStyle=on>0.5?'#FFB800':'#8E8AA3'; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(-24,40); ctx.lineTo(-14,-40); ctx.lineTo(0,-10); ctx.lineTo(14,-40); ctx.lineTo(24,40); ctx.stroke();
  ctx.fillStyle='#FFFFFF'; ctx.globalAlpha=0.6; ctx.beginPath(); ctx.ellipse(-40,-70,18,30,-0.5,0,PI2); ctx.fill(); ctx.restore(); }
function calendario(x,y,s,k,t,t0){ if(k<=0) return; if(typeof ocupa==='function') ocupa(x-120*s,y-150*s,x+120*s,y+140*s,1.1); ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle='#FFFFFF'; rr(-120,-140,240,280,22); ctx.fill(); ctx.fillStyle='#FF4D5E'; rr(-120,-140,240,70,22); ctx.fill(); ctx.fillRect(-120,-100,240,30);
  ctx.fillStyle='#8E8AA3'; for(const xx of [-60,60]) rr(xx-10,-160,20,50,10), ctx.fill();
  const flip=((t-t0)*6)%1; if(t>t0 && t<t0+1.6){ ctx.save(); ctx.transform(1,0,0,1-flip,0,0); ctx.fillStyle='#F3EEFF'; rr(-110,-60,220,190,14); ctx.fill(); ctx.restore(); }
  ctx.fillStyle='#1E1A2E'; ctx.font=fuente(110); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(contador(t,t0,1.4,0,11),0,30);
  ctx.font=fuente(40); ctx.fillStyle='#FFFFFF'; ctx.fillText('AÑOS',0,-104); ctx.restore(); }
function arena(t,t0,k,x0=980,y0=900){ if(t<t0||k<=0) return; ctx.save(); for(let i=0;i<70;i++){ const u=((t-t0)*1.4+rand(i))%1; const x=x0-u*900, y=y0+(rand(i+3)-0.5)*700+Math.sin(u*8+i)*30;
  ctx.globalAlpha=k*(0.9-u*0.5); ctx.fillStyle=i%3?'#F5CF7E':'#E2B25C'; blob(x,y,5+rand(i+5)*9); } ctx.restore(); }
function calorOndas(t,x,y,w,k){ if(k<=0) return; ctx.save(); ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=8; ctx.lineCap='round'; ctx.globalAlpha=k;
  for(let i=0;i<5;i++){ const xx=x-w/2+i*w/4, u=((t*0.8+i*0.3)%1); ctx.beginPath(); for(let j=0;j<=10;j++){ const yy=y-u*140-j*14; ctx.lineTo(xx+Math.sin(j*0.9+t*6+i)*12,yy); } ctx.stroke(); } ctx.restore(); }

// ---------- S1 y S23: ¡TODOS A SOPLAR! (mismo cuadro para el loop) ----------
// Storyboard: playa de Cancún llena de gomitas que soplan con cachetes inflados hacia un huracán gigante (centro-derecha, dentro de x≤870)
// que gira tranquilo. Raro playero al frente a la izquierda (completo, x≈300) sopla con todo, rebota. Letrero ¡TODOS A SOPLAR! desde el cuadro 0 (y=430).
function escenaSoplar(t,sc,fin){
  huracan(t,625,800,215,{cara:'aburrido'});
  multitud(t,[[1090,0.2,9,300,78,0],[1170,0.25,8,300,92,1],[1265,0.3,6,330,110,2]],1,1);
  const g=gelatina(t,fin?sc.start:0.02,0.3);
  const o={x:300,y:SUELO,s:1.05,t,expr:'sopla',cachetes:0.85+0.15*Math.sin(t*5),disfraz:'playero',brazos:'jarras',sq:g,tilt:0.05,alto:Math.abs(Math.sin(t*6))*8};
  raro(o); const b=boca(o); soplo(t,b[0]+20,b[1],1,1.3,1,300);
  rachas(t,0.5,0.35,640,980);
  L('¡TODOS A SOPLAR!',540,430,1,'madera',{tam:84,t,t0:-1});
}
function S1(t,sc){ escenaSoplar(t,sc,false); }
function S23(t,sc){ escenaSoplar(t,sc,true); }

// S2 "ni lo despeinamos": acercamiento al huracán con carita aburrida; arriba de él flota un peine que no le hace nada; Raro playero chiquito a la izquierda sopla y se desinfla (ya valió).
function S2(t,sc){
  huracan(t,590,860,230,{cara:'aburrido',vel:1.1});
  const pk=popIn(t,at(9)); if(pk>0){ ctx.save(); ctx.translate(600,560+Math.sin(t*4)*10); ctx.rotate(-0.2+Math.sin(t*5)*0.08); ctx.scale(pk,pk);
    ctx.fillStyle='#FF5FA2'; rr(-150,-24,300,48,18); ctx.fill(); for(let i=0;i<14;i++){ rr(-140+i*20,18,10,60,5); ctx.fill(); } ctx.restore(); }
  const desinfla=prog(t,at(8),0.6);
  const o={x:250,y:SUELO,s:0.78,t,expr:desinfla<0.5?'sopla':'yavalio',cachetes:1-desinfla,disfraz:'playero',sinLentes:desinfla>=0.5,brazos:desinfla<0.5?'jarras':'idle',sq:gelatina(t,at(9),0.4)};
  raro(o); if(desinfla<0.6){ const b=boca(o); soplo(t,b[0]+14,b[1],1,1,1-desinfla,240); }
  L('NI LO DESPEINAMOS',540,400,popIn(t,at(9)),'madera',{tam:70,t,t0:at(9)});
}
