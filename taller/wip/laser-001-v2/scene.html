<script>
// laser-001 — ¿Qué pasaría si todos apuntáramos un láser a la Luna? (serie "¿Qué pasaría si TODOS…?", Parte 7)
// Disfraces: astrónomo con lentes oscuros y apuntador → astronauta (Sol / espejos del Apolo) → científico (observatorio, fotones)
// → soldado (láser militar de un megawatt) → astrónomo (gatos, avión, loop).
const PI2=Math.PI*2;
const ROJO='#FF2E4D';

// ---------- disfraz nuevo: astrónomo aficionado ----------
const ASTRONOMO={
  atras(o){ const w=o.wob||0, t=o.t||0; ctx.save(); ctx.rotate(w*0.04+Math.sin(t*3)*0.02); ctx.fillStyle='#3B2F8F';
    ctx.beginPath(); ctx.moveTo(-150,-210); ctx.quadraticCurveTo(-250,-80,-220,-10); ctx.lineTo(220,-10); ctx.quadraticCurveTo(250,-80,150,-210); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#FFD23F'; for(const [x,y] of [[-190,-60],[200,-90],[-170,-150]]) estrella4(x,y,14,'#FFD23F'); ctx.restore(); },
  cuerpo(o){ ctx.fillStyle='#2B2A6B'; ctx.fillRect(-200,-210,400,215);
    for(const [x,y,r] of [[-110,-160,16],[90,-120,12],[-40,-70,10],[130,-180,9],[20,-170,8]]) estrella4(x,y,r,'#FFD23F');
    ctx.fillStyle='#FFF3C4'; blob(-80,-90,22); ctx.fillStyle='#2B2A6B'; blob(-70,-96,18); },
  cabeza(o){ const w=o.wob||0, t=o.t||0; ctx.save(); ctx.translate(0,-352); ctx.rotate(-0.05+w*0.08);
    ctx.fillStyle='#3B2F8F'; ctx.beginPath(); ctx.ellipse(0,-6,128,70,0,Math.PI,0); ctx.fill();
    ctx.fillStyle='#FFD23F'; rr(-130,-14,260,26,13); ctx.fill();
    ctx.fillStyle='#FFD23F'; blob(Math.sin(t*4)*6,-82,22);
    if(o.lentesArriba){ ctx.fillStyle='#1E1A2E'; rr(-110,-60,90,44,18); ctx.fill(); rr(20,-60,90,44,18); ctx.fill(); ctx.fillRect(-22,-46,44,10); }
    ctx.restore(); },
  frente(o,B){
    if(!o.lentesArriba){ ctx.fillStyle='#1E1A2E'; rr(-108,-326,100,66,24); ctx.fill(); rr(8,-326,100,66,24); ctx.fill(); ctx.fillRect(-12,-306,24,10);
      ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.ellipse(-80,-308,16,8,-0.5,0,PI2); ctx.fill(); ctx.beginPath(); ctx.ellipse(36,-308,16,8,-0.5,0,PI2); ctx.fill(); }
    if(o.laser){ const h=B[1].h; ctx.save(); ctx.translate(h[0],h[1]); ctx.rotate(o.laserA??-0.8);
      ctx.fillStyle='#3E3A55'; rr(-16,-15,120,30,13); ctx.fill(); ctx.fillStyle='#C9C3E0'; ctx.fillRect(70,-15,10,30); ctx.fillStyle=ROJO; blob(104,0,9); ctx.restore(); }
    if(o.red){ const h=B[1].h; ctx.save(); ctx.translate(h[0],h[1]); ctx.strokeStyle='#7A4A22'; ctx.lineWidth=12; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(60,-200); ctx.stroke();
      ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=6; ctx.beginPath(); ctx.ellipse(80,-270,70,60,0.2,0,PI2); ctx.stroke(); ctx.restore(); }
  }
};
// punta del apuntador en coordenadas del mundo (para dibujar el rayo)
function puntaLaser(o){ const B=posBrazos(o), h=B[1].h, a=o.laserA??-0.8, s=o.s??1, e=o.espejo?-1:1;
  const lx=h[0]+Math.cos(a)*108, ly=h[1]+Math.sin(a)*108; return [o.x+lx*s*e, o.y-(o.alto||0)+ly*s]; }
function rayo(x0,y0,x1,y1,col=ROJO,w=7,a=0.95){ ctx.save(); ctx.globalAlpha=a; ctx.lineCap='round'; ctx.shadowColor=col; ctx.shadowBlur=22; ctx.strokeStyle=col; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  ctx.shadowBlur=0; ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=Math.max(2,w*0.35); ctx.stroke(); ctx.restore(); }
function raroLaser(o,dest,k=1){ raro({...o,disfraz:o.disfraz||ASTRONOMO,laser:true}); if(dest&&k>0){ const p=puntaLaser(o); rayo(p[0],p[1],lerp(p[0],dest[0],k),lerp(p[1],dest[1],k)); } }

// ---------- utilería ----------
function L(txt,x,y,k,tipo='madera',opts={}){ let tam=opts.tam||72; ctx.font=fuente(tam); let w=Math.max(opts.ancho||0,ctx.measureText(txt).width+tam*1.2);
  if(w>740){ tam*=740/w; w=740; } const ancho=opts.ancho?Math.min(opts.ancho,740):undefined; x=clamp(x,170+w/2,910-w/2); if(y<=430) y=480;
  letrero(txt,x,y,k,tipo,{sinPalo:!opts.palo,...opts,tam,ancho}); }
function grito(txt,x,y,tam,k=1,col='#FFFFFF',a=0){ if(k<=0.01||tam<4) return; ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.scale(k,k); ctx.font=fuente(tam); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=tam*0.18; ctx.strokeStyle='#1E1A2E'; ctx.lineJoin='round'; ctx.strokeText(txt,0,0); ctx.fillStyle=col; ctx.fillText(txt,0,0); ctx.restore(); }
// Luna: o.puntos = n puntitos rojos (o.pa opacidad), o.oscura = mitad izquierda en sombra, o.brillo = brillo en la parte oscura, o.mancha = círculo del rayo del observatorio
function luna(t,x,y,r,o={}){ if(typeof ocupa==='function') ocupa(x-r,y-r,x+r,y+r,o.peso??1);
  ctx.save(); ctx.shadowColor='#FFF6C8'; ctx.shadowBlur=70; ctx.fillStyle='#F6F0D6'; blob(x,y,r); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,PI2); ctx.clip();
  ctx.fillStyle='#E2D8AE'; for(const [a,b,c] of [[-0.35,-0.25,0.22],[0.3,0.2,0.16],[0.05,-0.55,0.11],[-0.2,0.45,0.13],[0.55,-0.3,0.09],[-0.6,0.1,0.08]]) blob(x+a*r,y+b*r,c*r);
  ctx.fillStyle='#EFE6C4'; for(const [a,b,c] of [[-0.38,-0.28,0.14],[0.28,0.17,0.1]]) blob(x+a*r,y+b*r,c*r);
  if(o.oscura){ ctx.globalAlpha=0.82*o.oscura; ctx.fillStyle='#3A2F6E'; ctx.fillRect(x-r,y-r,r,2*r); ctx.beginPath(); ctx.ellipse(x,y,r*0.35,r,0,Math.PI/2,Math.PI*1.5); ctx.fill(); ctx.globalAlpha=1;
    if(o.brillo){ ctx.globalAlpha=clamp(o.brillo); const g=ctx.createRadialGradient(x-r*0.45,y,0,x-r*0.45,y,r*0.9); g.addColorStop(0,'rgba(255,90,110,0.95)'); g.addColorStop(1,'rgba(255,90,110,0)'); ctx.fillStyle=g; ctx.fillRect(x-r,y-r,r*1.2,2*r); ctx.globalAlpha=1; } }
  if(o.puntos){ for(let i=0;i<o.puntos;i++){ const a=rand(i+1)*PI2, d=Math.sqrt(rand(i+7))*r*0.85; ctx.globalAlpha=(o.pa??1)*(0.6+0.4*Math.sin(t*9+i)); ctx.fillStyle=ROJO; blob(x+Math.cos(a)*d,y+Math.sin(a)*d,Math.max(2,r*0.012)); } ctx.globalAlpha=1; }
  if(o.mancha){ ctx.globalAlpha=0.5*o.mancha; ctx.fillStyle='#6CFFB5'; blob(x+r*0.1,y-r*0.05,r*0.22); ctx.globalAlpha=1; ctx.strokeStyle='#6CFFB5'; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(x+r*0.1,y-r*0.05,r*0.22*o.mancha,0,PI2); ctx.stroke(); }
  ctx.restore(); }
function sol(t,x,y,r,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.rotate(t*0.4);
  ctx.fillStyle='#FFD23F'; for(let i=0;i<12;i++){ ctx.save(); ctx.rotate(i*PI2/12); ctx.beginPath(); ctx.moveTo(-r*0.18,-r*1.05); ctx.lineTo(0,-r*1.5-Math.sin(t*6+i)*r*0.08); ctx.lineTo(r*0.18,-r*1.05); ctx.fill(); ctx.restore(); }
  ctx.shadowColor='#FFF38A'; ctx.shadowBlur=80; ctx.fillStyle='#FFE14D'; blob(0,0,r); ctx.shadowBlur=0; ctx.fillStyle='#FFF3A6'; blob(-r*0.25,-r*0.25,r*0.45); ctx.restore();
  if(typeof ocupa==='function') ocupa(x-r*1.4*k,y-r*1.4*k,x+r*1.4*k,y+r*1.4*k,0.8); }
function sueloLunar(y=1400){ ctx.fillStyle='#CFC8E6'; ctx.beginPath(); ctx.ellipse(540,y+380,1100,480,0,0,PI2); ctx.fill();
  ctx.fillStyle='#B6AED3'; for(const [x,dy,r] of [[200,40,70],[760,70,90],[480,140,50],[930,20,40]]){ ctx.beginPath(); ctx.ellipse(x,y+dy,r,r*0.32,0,0,PI2); ctx.fill(); } }
function tierraChica(t,x,y,r){ ctx.save(); ctx.shadowColor='#AEE6FF'; ctx.shadowBlur=40; ctx.fillStyle='#3AB6FF'; blob(x,y,r); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,PI2); ctx.clip(); ctx.fillStyle='#86E3A8'; const g=Math.sin(t*0.5)*0.1;
  for(const [a,b,rx,ry] of [[-0.4,-0.2,0.35,0.4],[0.45,0.25,0.3,0.35],[0.1,-0.7,0.4,0.15]]){ ctx.beginPath(); ctx.ellipse(x+(a+g)*r,y+b*r,rx*r,ry*r,0.3,0,PI2); ctx.fill(); } ctx.restore(); }
function domo(x,y,s,t,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle='#E9E4F7'; rr(-170,-200,340,200,20); ctx.fill(); ctx.fillStyle='#C9C3E0'; rr(-170,-60,340,60,12); ctx.fill();
  ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.arc(0,-200,170,Math.PI,0); ctx.fill(); ctx.fillStyle='#DCD6EE'; ctx.beginPath(); ctx.arc(0,-200,170,Math.PI,Math.PI*1.35); ctx.lineTo(0,-200); ctx.fill();
  ctx.fillStyle='#2B2A6B'; ctx.beginPath(); ctx.moveTo(-30,-200); ctx.lineTo(-24,-366); ctx.lineTo(24,-366); ctx.lineTo(30,-200); ctx.fill();
  ctx.fillStyle='#7A4A22'; rr(-40,-130,80,130,12); ctx.fill(); ctx.restore(); }
function reflectorGigante(x,y,s,a,t,on=1){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  if(on>0){ ctx.save(); ctx.rotate(a); const g=ctx.createLinearGradient(0,0,0,-1400); g.addColorStop(0,'rgba(255,250,210,0.75)'); g.addColorStop(1,'rgba(255,250,210,0)'); ctx.fillStyle=g; ctx.globalAlpha=on;
    ctx.beginPath(); ctx.moveTo(-90,-150); ctx.lineTo(-260,-1400); ctx.lineTo(260,-1400); ctx.lineTo(90,-150); ctx.closePath(); ctx.fill(); ctx.restore(); }
  ctx.fillStyle='#3E3A55'; rr(-130,-40,260,60,20); ctx.fill(); ctx.fillStyle='#1E1A2E'; blob(-90,30,30); blob(90,30,30);
  ctx.fillStyle='#5A5578'; ctx.fillRect(-14,-110,28,80);
  ctx.save(); ctx.translate(0,-110); ctx.rotate(a); ctx.fillStyle='#8E86B5'; rr(-100,-80,200,120,30); ctx.fill(); ctx.fillStyle='#FFF8D0'; ctx.beginPath(); ctx.ellipse(0,-80,96,26,0,0,PI2); ctx.fill(); ctx.restore();
  ctx.restore(); }
function edificio(x,y,w,h,c,t){ ctx.fillStyle=c; rr(x-w/2,y-h,w,h,16); ctx.fill(); ctx.fillStyle='#FFF38A'; for(let i=0;i<Math.floor(h/80);i++) for(let j=0;j<3;j++){ if(rand(i*7+j+x)>0.35){ rr(x-w/2+20+j*(w-40)/3,y-h+30+i*80,(w-40)/3-16,40,6); ctx.fill(); } } }
function canonLaser(x,y,s,t,k=1,dispara=0){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle='#5F6B4B'; rr(-150,-60,300,70,24); ctx.fill(); ctx.fillStyle='#1E1A2E'; blob(-100,14,32); blob(100,14,32);
  ctx.save(); ctx.translate(0,-80); ctx.rotate(-1.12); ctx.fillStyle='#7E8C66'; rr(-40,-50,320,100,40); ctx.fill(); ctx.fillStyle='#4B5537'; rr(220,-62,80,124,26); ctx.fill();
  ctx.fillStyle='#FFD23F'; ctx.font=fuente(46); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('1 MW',110,4);
  if(dispara>0){ ctx.fillStyle=ROJO; blob(300,0,40+Math.sin(t*40)*8); } ctx.restore(); ctx.restore(); }
function balanza(x,y,t,u){ const a=lerp(0,-0.38,easeOut(u)); ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='#B07A2E'; rr(-24,0,48,420,16); ctx.fill(); rr(-140,400,280,40,16); ctx.fill();
  ctx.rotate(a); ctx.fillStyle='#D99A3E'; rr(-380,-18,760,36,18); ctx.fill(); ctx.restore();
  const lx=x+Math.cos(a)*(-360), ly=y+Math.sin(a)*(-360), rx=x+Math.cos(a)*360, ry=y+Math.sin(a)*360;
  ctx.strokeStyle='#8A5A1E'; ctx.lineWidth=6; for(const [px,py] of [[lx,ly],[rx,ry]]){ ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px-90,py+160); ctx.moveTo(px,py); ctx.lineTo(px+90,py+160); ctx.stroke(); ctx.fillStyle='#D99A3E'; ctx.beginPath(); ctx.ellipse(px,py+165,120,26,0,0,PI2); ctx.fill(); }
  return [[lx,ly+140],[rx,ry+140]]; }
function apuntadorSuelto(x,y,s,a){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.rotate(a); ctx.fillStyle='#3E3A55'; rr(-60,-15,120,30,13); ctx.fill(); ctx.fillStyle=ROJO; blob(62,0,9); ctx.restore(); }
function espejoLunar(x,y,s,k){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); ctx.rotate(-0.12);
  ctx.fillStyle='#8E8AA3'; ctx.fillRect(-10,-20,20,60); ctx.fillStyle='#C9C3E0'; rr(-150,-160,300,150,16); ctx.fill(); ctx.fillStyle='#5A5578'; rr(-138,-148,276,126,10); ctx.fill();
  for(let i=0;i<3;i++) for(let j=0;j<6;j++){ ctx.fillStyle=(i+j)%2?'#AEE6FF':'#E6F7FF'; blob(-112+j*45,-122+i*40,17); }
  ctx.restore(); }
function regla(x,y,w,k){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,1); ctx.fillStyle='#FFD23F'; rr(-w/2,-50,w,100,16); ctx.fill();
  ctx.strokeStyle='#7A5A0A'; ctx.lineWidth=5; for(let i=0;i<=20;i++){ const xx=-w/2+20+i*(w-40)/20; ctx.beginPath(); ctx.moveTo(xx,-50); ctx.lineTo(xx,i%5?-22:0); ctx.stroke(); } ctx.restore(); }
function dedo(x,y,s,crece,t){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.rotate(-0.15);
  ctx.fillStyle='#FFD9C2'; rr(-80,-60,160,520,80); ctx.fill(); ctx.fillStyle='#F2BFA5'; rr(-60,140,120,14,7); ctx.fill(); rr(-60,300,120,14,7); ctx.fill();
  ctx.fillStyle='#FFF4F0'; rr(-58,-80-crece,116,140+crece,50); ctx.fill(); ctx.fillStyle='#FFFFFF'; rr(-40,-70-crece,30,80,15); ctx.fill(); ctx.restore(); }
function gato(o){ const s=o.s, x=o.x, y=o.y-(o.alto||0), c=PASTELES[(o.seed||0)%PASTELES.length], d=mix(c,'#1E1A2E',0.2);
  ctx.save(); ctx.strokeStyle=d; ctx.lineWidth=34*s; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x-110*s,y-90*s); ctx.quadraticCurveTo(x-260*s,y-140*s+Math.sin(o.t*10+o.seed)*40*s,x-220*s,y-330*s); ctx.stroke(); ctx.restore();
  ctx.fillStyle=c; for(const sd of [-1,1]){ ctx.beginPath(); ctx.moveTo(x+sd*40*s,y-360*s); ctx.lineTo(x+sd*120*s,y-470*s); ctx.lineTo(x+sd*140*s,y-330*s); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle='#FFB8D2'; for(const sd of [-1,1]){ ctx.beginPath(); ctx.moveTo(x+sd*70*s,y-360*s); ctx.lineTo(x+sd*118*s,y-435*s); ctx.lineTo(x+sd*125*s,y-350*s); ctx.closePath(); ctx.fill(); }
  gomita({...o,color:c});
  ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=5*s; for(const sd of [-1,1]) for(const dy of [-12,8]){ ctx.beginPath(); ctx.moveTo(x+sd*80*s,y+(-226+dy)*s); ctx.lineTo(x+sd*170*s,y+(-236+dy*2)*s); ctx.stroke(); } }
function avion(x,y,s,t){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.rotate(Math.sin(t*1.5)*0.03);
  ctx.fillStyle='#C9C3E0'; ctx.beginPath(); ctx.moveTo(-40,0); ctx.lineTo(-170,150); ctx.lineTo(-90,150); ctx.lineTo(60,10); ctx.fill(); ctx.beginPath(); ctx.moveTo(-40,-10); ctx.lineTo(-150,-130); ctx.lineTo(-80,-130); ctx.lineTo(50,-10); ctx.fill();
  ctx.fillStyle='#FFFFFF'; rr(-300,-50,560,100,50); ctx.fill(); ctx.fillStyle='#E5333F'; ctx.beginPath(); ctx.moveTo(-300,-20); ctx.lineTo(-340,-150); ctx.lineTo(-250,-150); ctx.lineTo(-200,-30); ctx.fill();
  ctx.fillStyle='#3AB6FF'; for(let i=0;i<6;i++){ blob(-170+i*55,-8,13); } ctx.fillStyle='#1E1A2E'; ctx.beginPath(); ctx.ellipse(215,-14,30,18,0,0,PI2); ctx.fill(); ctx.restore(); }
function prohibido(x,y,r,k){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.strokeStyle='#E5333F'; ctx.lineWidth=34; ctx.beginPath(); ctx.arc(0,0,r,0,PI2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-r*0.7,-r*0.7); ctx.lineTo(r*0.7,r*0.7); ctx.stroke(); ctx.restore(); }
function multitudLaser(t,y,s,n,x0,dx,dest,k=1){ for(let i=0;i<n;i++){ const x=x0+i*dx+Math.sin(t*2+i)*8, yy=y-(i%2)*30;
  const o={x,y:yy,s,t,seed:i+2,expr:i%3?'feliz':'orgullo',brazos:'senala',laser:true,laserA:-1.1-((x-dest[0])/2000),npc_peso:0.25,alto:Math.abs(Math.sin(t*(5+i%3)+i))*6};
  gomita({...o,disfraz:{frente:ASTRONOMO.frente.bind(null),cuerpo(){} },lentesArriba:true}); if(k>0){ const p=puntaLaser(o); rayo(p[0],p[1],lerp(p[0],dest[0]+(rand(i)-0.5)*120,k),lerp(p[1],dest[1]+(rand(i+3)-0.5)*120,k),ROJO,4,0.8); } } }

// marea de gomitas: filas de atrás (chiquitas) hacia adelante, cada una con apuntador; decenas de rayos que se juntan en la Luna
function mareaLaser(t,dest,k=1){
  const filas=[[1000,0.17,13,40,80],[1075,0.2,12,20,92],[1160,0.24,10,50,108],[1250,0.28,9,0,124],[1345,0.32,8,60,140]];
  // rayos primero (detrás de las gomitas de adelante se ven igual porque salen de la punta)
  const pts=[];
  filas.forEach(([y,s,n,x0,dx],f)=>{ for(let i=0;i<n;i++){ const x=x0+i*dx+((f%2)?dx*0.5:0)+Math.sin(t*2+i+f)*6; if(x<-20||x>1100) continue;
    const yy=y-Math.abs(Math.sin(t*(5+(i%3))+i*1.7+f))*10*s/0.2; const seed=f*13+i+2;
    const o={x,y:yy,s,t,seed,expr:(i+f)%3?'feliz':'orgullo',brazos:'senala',laser:true,laserA:Math.atan2(dest[1]-(yy-170*s),dest[0]-x),npc_peso:0.12,espejo:false,lentesArriba:true};
    pts.push(o); } });
  for(const o of pts){ gomita({...o,disfraz:{frente:ASTRONOMO.frente.bind(null),cuerpo(){}}});
    if(k>0){ const p=puntaLaser(o); const j=rand(o.seed*3); rayo(p[0],p[1],lerp(p[0],dest[0]+(j-0.5)*130,k),lerp(p[1],dest[1]+(rand(o.seed*5)-0.5)*130,k),ROJO,2.5+o.s*6,0.55+0.3*j); } }
}
// ---------- S1 y S26: ¡TODOS AL LÁSER! (mismo cuadro para el loop) ----------
// Storyboard: calle de ciudad de noche llena hasta el horizonte: una MAREA de gomitas (≈50, en 5 filas) apunta láseres a la Luna gigante (arriba derecha);
// decenas de rayos rojos se juntan en la Luna, que sigue igualita. Raro astrónomo con lentes oscuros al frente (grande, izquierda) apunta orgulloso
// y rebota. Letrero ¡TODOS AL LÁSER! desde el cuadro 0. Toma: push lento.
function escenaLaser(t,sc,fin){
  const M=[760,700], R=165;
  luna(t,M[0],M[1],R,{puntos:45,pa:0.95,peso:1.2});
  mareaLaser(t,[M[0]-20,M[1]+30],1);
  const g=gelatina(t,fin?sc.start:0.05,0.3);
  const o={x:300,y:SUELO,s:1.15,t,expr:'orgullo',brazos:'senala',laserA:-0.95,sq:g,tilt:-0.03,alto:Math.abs(Math.sin(t*6))*8};
  raroLaser(o,[M[0]-30,M[1]+40],1);
  chispas(t,fin?sc.start+0.1:0.1,M[0]-30,M[1]+40,0.9,'#FF8A9B');
  letrero('¡TODOS AL LÁSER!',540,400,1,'madera',{tam:84,sinPalo:true,t,t0:-1});
