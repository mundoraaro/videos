<script>
// emus-001 — La guerra que Australia perdió contra los emús (1932). Raro soldado australiano → (puf) mayor → … → (puf) disfraz de emú → (puf) soldado (loop).
// ---------------- objetos ----------------
function polvo(t,x,y,dir=-1,s=1){ ctx.fillStyle='rgba(255,240,220,0.75)'; for(let i=0;i<7;i++){ const ph=((t*3.2+i/7)%1); ctx.globalAlpha=0.8*(1-ph); blob(x+dir*ph*200*s,y-ph*50*s-rand(i)*20,(14+ph*34)*s); } ctx.globalAlpha=1; }
function bala(x,y,k,ang=0){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.scale(k,k); ctx.fillStyle='#E8A33B'; rr(-16,-10,30,40,8); ctx.fill(); ctx.fillStyle='#FFD23F'; ctx.beginPath(); ctx.moveTo(-16,-8); ctx.quadraticCurveTo(-16,-44,-1,-50); ctx.quadraticCurveTo(14,-44,14,-8); ctx.closePath(); ctx.fill(); ctx.fillStyle='rgba(255,255,255,0.6)'; rr(-10,-36,6,50,3); ctx.fill(); ctx.restore(); }
function arbusto(x,y,s,t,col){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.rotate(Math.sin(t*3)*0.02); ctx.fillStyle=col; blob(-120,-60,110); blob(40,-110,130); blob(170,-50,100); ctx.fillRect(-230,-60,500,60);
  ctx.fillStyle='rgba(255,255,255,0.18)'; blob(10,-170,40); blob(-140,-110,30); ctx.restore(); }
function estanque(x,y,t,P){ ctx.save(); ctx.translate(x,y); ctx.fillStyle=mix(P.oscuro,'#1C79D2',0.5); ctx.beginPath(); ctx.ellipse(0,0,420,90,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#7FD8FF'; ctx.beginPath(); ctx.ellipse(0,-6,390,72,0,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=6; ctx.lineCap='round';
  for(let i=0;i<5;i++){ const xx=-260+i*130+Math.sin(t*2+i)*20; ctx.beginPath(); ctx.moveTo(xx,-10+i%2*20); ctx.lineTo(xx+60,-10+i%2*20); ctx.stroke(); }
  ctx.fillStyle=mix(P.oscuro,'#000000',0.1); for(const [a,b,r] of [[-400,10,40],[-330,50,30],[380,20,46],[300,60,28]]) blob(a,b,r); ctx.restore(); }
function escritorio(x,y,P){ ctx.fillStyle=mix(P.oscuro,'#000000',0.2); rr(x-260,y-200,520,40,16); ctx.fill(); ctx.fillStyle=P.oscuro; rr(x-240,y-170,480,170,20); ctx.fill(); ctx.fillStyle=mix(P.oscuro,P.medio,0.4); rr(x-200,y-140,160,110,12); ctx.fill(); rr(x+40,y-140,160,110,12); ctx.fill(); ocupa(x-260,y-200,x+260,y,1); }
function sello(x,y,k,t0,t,txt){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(-0.18); ctx.scale(k,k); ctx.strokeStyle='#E23D5B'; ctx.lineWidth=12; rr(-150,-70,300,140,24); ctx.stroke(); ctx.fillStyle='#E23D5B'; ctx.font=fuente(96); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,0,6); ctx.restore(); ocupa(x-150,y-70,x+150,y+70,2); }
function hoja(x,y,w,h,k,t,lineas){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(t*2)*0.03-0.05); ctx.scale(k,k); ctx.fillStyle='rgba(0,0,0,0.15)'; rr(-w/2+10,-h/2+12,w,h,14); ctx.fill(); ctx.fillStyle='#FFF8E8'; rr(-w/2,-h/2,w,h,14); ctx.fill();
  ctx.fillStyle='#C9B79A'; for(let i=0;i<lineas;i++) rr(-w/2+40,-h/2+60+i*44,w-80-(i%3)*60,14,7); ctx.fill(); ctx.restore(); ocupa(x-w/2*k,y-h/2*k,x+w/2*k,y+h/2*k,1.5); }
function atril(x,y,P){ ctx.fillStyle=mix(P.oscuro,'#000000',0.15); ctx.beginPath(); ctx.moveTo(x-150,y); ctx.lineTo(x-110,y-300); ctx.lineTo(x+110,y-300); ctx.lineTo(x+150,y); ctx.closePath(); ctx.fill(); ctx.fillStyle=P.oscuro; rr(x-170,y-340,340,60,20); ctx.fill(); ctx.fillStyle='#FFD23F'; blob(x,y-170,36); ctx.fillStyle=P.oscuro; estrella4(x,y-170,24,P.oscuro); ocupa(x-170,y-340,x+170,y,1); }
function medallaGrande(x,y,k,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.rotate(Math.sin(t*3)*0.08); ctx.fillStyle='#E23D5B'; ctx.beginPath(); ctx.moveTo(-50,-200); ctx.lineTo(50,-200); ctx.lineTo(30,-60); ctx.lineTo(-30,-60); ctx.fill(); ctx.fillStyle='#4CC9F0'; ctx.fillRect(-12,-200,24,140);
  ctx.save(); ctx.shadowColor='#FFF38A'; ctx.shadowBlur=40; ctx.fillStyle='#F2B807'; blob(0,0,90); ctx.restore(); ctx.fillStyle='#FFD23F'; blob(0,0,72); estrella4(0,0,50,'#F2B807'); ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(-30,-34,22,10,-0.6,0,Math.PI*2); ctx.fill(); ctx.restore(); ocupa(x-90*k,y-200*k,x+90*k,y+90*k,1.5); }
function regla(x,y0,y1,k){ if(k<=0) return; ctx.save(); ctx.globalAlpha=k; ctx.fillStyle='#FFF4DC'; rr(x-30,y1,60,y0-y1,14); ctx.fill(); ctx.fillStyle='#E07A5F'; for(let i=0;i<=12;i++){ const yy=lerp(y0,y1,i/12); ctx.fillRect(x-30,yy-3,i%3?26:46,6); } ctx.restore(); }
function banderaPanel(x,y,w,h,col,txt,k,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.fillStyle='#7A4A22'; rr(-w/2-20,-h/2,16,h+500,8); ctx.fill();
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(-w/2,-h/2); for(let i=0;i<=10;i++){ const u=i/10; ctx.lineTo(-w/2+u*w,-h/2+Math.sin(u*5+t*6)*12*u); } for(let i=10;i>=0;i--){ const u=i/10; ctx.lineTo(-w/2+u*w,h/2+Math.sin(u*5+t*6)*12*u); } ctx.closePath(); ctx.fill();
  ctx.fillStyle='#FFFFFF'; ctx.font=fuente(52); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineWidth=12; ctx.strokeStyle='rgba(30,26,46,0.5)'; ctx.strokeText(txt,0,4); ctx.fillText(txt,0,4); ctx.restore(); ocupa(x-w/2*k,y-h/2*k,x+w/2*k,y+h/2*k,2); }
function manadaFondo(t,n,y0,s,seed=0,run=true){ for(let i=0;i<n;i++){ const x=((rand(i+seed)*1500 - (run? t*260*(0.8+rand(i+seed+5)*0.4):0))%1500+1500)%1500-200; emu({x,y:y0+rand(i+seed+2)*60,s:s*(0.85+rand(i+seed+3)*0.3),t,corre:run,espejo:true,seed:i+seed,expr:'feliz'}); } }

// mundo del gancho (se repite al final para el loop): Raro soldado huye de una manada de emús en el outback
function hookMundo(t,k5){
  const tr=Math.sin(t*1.3)*30;
  for(let i=0;i<3;i++){ const ex=110+i*175+tr*0.5+Math.sin(t*2+i)*30, sc=0.7+i*0.04; emu({x:ex,y:SUELO-30+i*40,s:sc,t,corre:true,seed:i*3,expr:i==1?'orgullo':'feliz',alto:i==2&&k5?brinco(t,k5,0.45,160).alto:0}); polvo(t,ex-120,SUELO+i*40,-1,0.8); }
  raro({x:745+tr*0.3,y:SUELO+40,s:1.0,t,expr:'terror',piernas:'corre',brazos:'arriba',disfraz:'soldado',alto:Math.abs(Math.sin(t*14))*18,tilt:0.12,viento:0.9,mira:{x:-1,y:0},espejo:false});
  polvo(t,635,SUELO+40,-1,0.7);
}
// ---------------- escenas ----------------
// Storyboard: acción de Raro · fondo · toma · eventos por palabra.
function S1(t,sc){ // HOOK: Raro soldado huye de 3 emús; marcador EMÚS 1 · AUSTRALIA 0 desde el cuadro 0 · mandarina/outback · push · 1 marcador tiembla, 3 emú pop, 5 emú brinca (shake, chispas)
  hookMundo(t,at(5));
  letrero('EMÚS 1 · AUSTRALIA 0',540,400,1,'madera',{tam:62,t,t0:at(1)});
  chispas(t,at(5),480,1000,1.4); lineasVelocidad(t,at(5),540,1000,'#FFFFFF',0.3);
}
function S2(t,sc){ // 1932: Raro brinca (boing) y saluda; asta con bandera roja que sube; letrero pergamino 1900→1932 · magenta/cerros · paneo-der
  const b=brinco(t,at(6),0.45,200);
  raro({x:620,y:SUELO,s:1.2,t,expr:'orgullo',brazos:t>at(6)+0.3?'saluda':'jarras',disfraz:'soldado',alto:b.alto,sq:b.sq,wob:b.wob});
  const kb=popIn(t,at(7)); if(kb>0){ ctx.fillStyle='#7A4A22'; rr(230,SUELO-760*kb,18,760*kb,9); ctx.fill(); const fy=SUELO-760*kb+40; ctx.fillStyle='#E23D5B'; ctx.beginPath(); ctx.moveTo(248,fy); for(let i=0;i<=8;i++){const u=i/8; ctx.lineTo(248+u*200,fy+Math.sin(u*5+t*8)*12*u);} for(let i=8;i>=0;i--){const u=i/8; ctx.lineTo(248+u*200,fy+110+Math.sin(u*5+t*8)*12*u);} ctx.fill(); }
  letrero(t>=at(8)?contador(t,at(8),0.5,1900,1932).replace(',',''):'AÑO',540,400,popIn(t,sc.start+0.05),'pergamino',{tam:96,t,t0:t>=at(8)?at(8):sc.start});
  chispas(t,at(8)+0.5,540,400,1.2,'#FFD23F');
}
function S3(t,sc){ // ¿QUÉ ES UN EMÚ?: Raro sospecha (9); 13 emú pop a la derecha; 16 regla de altura entre los dos; 19 "tamaño" emú se estira orgulloso; 20-22 intenta volar con brincos y nada · turquesa/liso (rayas de fondo, piso) · push
  const P=PAL_ACTUAL; ctx.fillStyle=mix(P.medio,P.claro,0.25); for(let i=0;i<8;i++){ ctx.save(); ctx.translate(540,1100); ctx.rotate(i/8*Math.PI*2+t*0.15); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-180,-1400); ctx.lineTo(180,-1400); ctx.fill(); ctx.restore(); }
  ctx.fillStyle=P.oscuro; ctx.fillRect(-200,SUELO-10,1480,900); ctx.fillStyle=mix(P.oscuro,P.medio,0.4); ctx.beginPath(); ctx.ellipse(540,SUELO,700,40,0,0,Math.PI*2); ctx.fill();
  const ke=popIn(t,at(13)), hop=brinco(t,at(20),0.35,90), hop2=brinco(t,at(22),0.35,110);
  raro({x:320,y:SUELO,s:1.05,t,expr:t>at(22)+0.2?'risa':(t>at(13)?'asombro':'sospecha'),brazos:t>at(16)?'senala':'jarras',disfraz:'soldado',mira:t>at(13)?{x:1,y:-0.5}:{x:0,y:0},sq:gelatina(t,at(13),0.3)});
  if(ke>0) emu({x:740,y:SUELO,s:0.62*ke*(1+0.06*easeOut(prog(t,at(19),0.3))),t,expr:t>at(22)?'sospecha':(t>at(19)?'orgullo':'feliz'),seed:2,alto:hop.alto+hop2.alto,sq:hop.sq+hop2.sq,espejo:true});
  regla(540,SUELO,SUELO-420,popIn(t,at(16)));
  letrero(t>=at(21)?'NO VUELA':(t>=at(16)?'MÁS DE 1.5 m':'¿EMÚ?'),540,400,popIn(t,t>=at(21)?at(21):(t>=at(16)?at(16):at(9))),'madera',{tam:80,t,t0:t>=at(21)?at(21):(t>=at(16)?at(16):at(9))});
}
function S4(t,sc){ // CORRE A 50 KM/H: el emú cruza la pantalla a toda velocidad; Raro corre detrás y no lo alcanza; 27 contador 0→50 KM/H; 30 rebasa a Raro, Raro tropieza (estrellitas) · limon/outback · paneo-der
  const lt=t-sc.start; const ex=lerp(260,1300,easeIn(prog(t,at(29),0.7)))+Math.sin(t*9)*6;
  polvo(t,ex-120,SUELO+20,-1,1.1);
  emu({x:ex,y:SUELO+20,s:0.62,t,corre:true,expr:t>at(30)?'orgullo':'feliz',seed:2,mira:{x:-1,y:0}});
  for(let i=0;i<6;i++){ const yy=SUELO-500+i*80; ctx.fillStyle='rgba(255,255,255,0.7)'; const xx=((-t*1400+i*300)%1300+1300)%1300; rr(xx-80,yy,260,10,5); ctx.fill(); }
  const caeR=t>at(30)?brinco(t,at(30),0.3,60):{alto:0,sq:0,wob:0};
  raro({x:lerp(120,300,prog(t,sc.start,1.5)),y:SUELO+30,s:0.85,t,expr:t>at(30)?'yavalio':'terror',piernas:t>at(30)?'quieto':'corre',brazos:t>at(30)?'idle':'corre',disfraz:'soldado',tilt:t>at(30)?-0.2:0.15,alto:caeR.alto+(t<at(30)?Math.abs(Math.sin(t*15))*14:0),sq:caeR.sq,viento:1});
  estrellitas(t,at(30)+0.2,lerp(120,300,prog(t,sc.start,1.5)),SUELO-360);
  letrero(t>=at(27)?contador(t,at(27),0.6,0,50,' KM/H'):'¡ZAS!',540,400,popIn(t,t>=at(27)?at(27):at(23)),'panel',{tam:88,t,t0:t>=at(27)?at(27):at(23)});
}
function S5(t,sc){ // ¿Y POR QUÉ UNA GUERRA?: pattern interrupt — freeze con zoom a la cara de Raro que mira a cámara con sospecha; 35 "guerra" signos de ¿? que brincan · violeta/liso (spot) · push z1.6
  const P=PAL_ACTUAL; const g=ctx.createRadialGradient(540,1000,60,540,1000,700); g.addColorStop(0,mix(P.claro,'#FFFFFF',0.3)); g.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle=g; ctx.fillRect(-200,-200,1480,2400);
  ctx.fillStyle=P.oscuro; ctx.fillRect(-200,SUELO-10,1480,900);
  raro({x:540,y:SUELO,s:1.35,t,expr:'sospecha',mira:{x:0,y:0},brazos:'jarras',disfraz:'soldado',sq:gelatina(t,at(31),0.25)+gelatina(t,at(35),0.3)});
  for(let i=0;i<2;i++){ const k=popIn(t,at(33)+i*0.15); if(k<=0) continue; ctx.save(); ctx.translate(i?790:290,800+Math.sin(t*6+i)*20); ctx.rotate((i?0.25:-0.25)+wobble(t,at(35),0.3)); ctx.scale(k,k); ctx.font=fuente(170); ctx.textAlign='center'; ctx.lineWidth=18; ctx.strokeStyle='#1E1A2E'; ctx.strokeText(i?'?':'¿',0,0); ctx.fillStyle='#D7FF3D'; ctx.fillText(i?'?':'¿',0,0); ctx.restore(); }
}
function S6(t,sc){ // SE COMÍAN EL TRIGO: campo de trigo; 3 emús picotean y las espigas desaparecen (39 comiendo, 41 trigo); Raro asoma con cara de asco · cielo/cerros · paneo-izq
  const lt=t-sc.start; for(let r=0;r<3;r++) for(let i=0;i<12;i++){ const x=40+i*92+r*30, y=SUELO-40+r*90, k=1-clamp((t-at(39)-rand(i+r*12)*1.4)/0.25); espiga(x,y,170+rand(i)*40,t,k,i+r); }
  for(let i=0;i<3;i++){ const pk=0.5+0.5*Math.sin(t*9+i*2); emu({x:220+i*260,y:SUELO+60+i*20,s:0.58,t,expr:'come',picotea:t>at(37)?pk:0,seed:i+4,espejo:i==1}); }
  raro({x:870,y:SUELO+120,s:0.75,t,expr:t>at(41)?'asco':'asombro',brazos:'cara',disfraz:'soldado',sq:gelatina(t,at(41),0.25)});
  letrero(t>=at(41)?'¡EL TRIGO!':'COMIDA GRATIS',540,400,popIn(t,t>=at(41)?at(41):sc.start+0.05),'madera',{tam:80,t,t0:t>=at(41)?at(41):sc.start});
}
function S7(t,sc){ // GRANJEROS EXSOLDADOS: granjero gomita con harapos; 46 puf → sombrero de soldado; Raro lo saluda; 49-52 carta "QUERIDO GOBIERNO" que se escribe · mandarina/cerros · push
  const p=pufCambio(t,at(46));
  const GRANJ={cuerpo:DISFRACES.campesino.cuerpo, cabeza:p.despues?DISFRACES.soldado.cabeza:DISFRACES.campesino.cabeza};
  gomita({x:360,y:SUELO,s:1.05,t,expr:t>at(46)?'orgullo':'feliz',brazos:t>at(49)?'frente':'idle',disfraz:GRANJ,spin:p.spin,seed:3,sq:gelatina(t,at(44),0.3)});
  nubePuf(t,at(46)+0.06,360,SUELO-180,1.1);
  raro({x:800,y:SUELO,s:0.85,t,expr:t>at(46)?'asombro':'feliz',brazos:t>at(46)+0.3?'saluda':'idle',espejo:true,disfraz:'soldado',sq:gelatina(t,at(46)+0.2,0.25)});
  hoja(560,960,300,360,popIn(t,at(49)),t,Math.floor(lerp(0,6,prog(t,at(49),1.0))));
  letrero(t>=at(46)?'EXSOLDADOS':'GRANJEROS',540,400,popIn(t,t>=at(46)?at(46):at(44)),'madera',{tam:80,t,t0:t>=at(46)?at(46):at(44)});
}
function S8(t,sc){ // ¡AMETRALLADORAS! / EL GOBIERNO DIJO QUE SÍ: oficina; ametralladora de juguete pop gigante (53, shake); funcionario gomita con copa sella SÍ (59, click, flash lima); Raro brinca de gusto · turquesa/interior · zoom
  escritorio(700,SUELO,PAL_ACTUAL);
  gomita({x:700,y:SUELO-150,s:0.7,t,expr:t>at(59)?'feliz':'sospecha',brazos:t>at(58)?'carga':'jarras',disfraz:'rico',seed:1,sq:gelatina(t,at(59),0.3)});
  ametralladora(300,SUELO-420+Math.sin(t*3)*10,1.1*popIn(t,at(53)),-0.15,t,{});
  sello(800,880,popIn(t,at(59),0.2),at(59),t,'¡SÍ!');
  const b=brinco(t,at(59)+0.15,0.45,180);
  raro({x:260,y:SUELO,s:0.9,t,expr:t>at(59)?'risa':'asombro',brazos:t>at(59)?'arriba':'cara',disfraz:'soldado',alto:b.alto,sq:b.sq+gelatina(t,at(53),0.3),wob:b.wob});
  letrero(t>=at(56)?'GOBIERNO':'PETICIÓN',540,400,popIn(t,t>=at(56)?at(56):sc.start+0.05),'pergamino',{tam:80,t,t0:t>=at(56)?at(56):sc.start});
}
function S9(t,sc){ // EL EJÉRCITO: 60 puf → Raro MAYOR con medallas al centro; 64-65 dos soldados gomita caen a los lados; 66-67 dos ametralladoras pop; 69 contador 10,000 BALAS con balas en cascada · cielo/outback · pull
  const p=pufCambio(t,at(60));
  for(let i=0;i<2;i++){ const k=popIn(t,at(64)+i*0.12); if(k>0) gomita({x:i?900:180,y:SUELO,s:0.72*k,t,expr:'orgullo',brazos:'saluda',disfraz:'soldado',seed:i+2,espejo:i==0,sq:gelatina(t,at(64)+i*0.12,0.3)}); }
  for(let i=0;i<2;i++) ametralladora(i?760:320,SUELO+150,0.7*popIn(t,at(67)+i*0.1),i?-0.2:0.2,t,{});
  raro({x:540,y:SUELO,s:1.05,t,expr:t>at(60)+0.3?'orgullo':'neutral',brazos:'jarras',disfraz:p.despues?{...DISFRACES.soldado}:'soldado',mayor:p.despues,spin:p.spin,sq:gelatina(t,at(60)+0.34,0.4),wob:wobble(t,at(60)+0.34)});
  nubePuf(t,at(60)+0.06,540,SUELO-170,1.2);
  cascada(t,at(69),12,(x,y,k,i)=>bala(x,y,k,(i%2?0.2:-0.2)),{x0:150,y0:560,cols:12,dx:70,dy:0,cada:0.03});
  letrero(t>=at(69)?contador(t,at(69),0.5,0,10000,' BALAS'):(t>=at(63)?'MAYOR':'EL EJÉRCITO'),540,400,popIn(t,t>=at(69)?at(69):(t>=at(63)?at(63):sc.start+0.05)),'madera',{tam:76,t,t0:t>=at(69)?at(69):(t>=at(63)?at(63):sc.start)});
}
function S10(t,sc){ // CONTRA 20,000 EMÚS: el horizonte se llena de emús en filas (cascada); Raro mayor chiquito al frente con cara de ya valió; 72 contador 20,000 (shake, thud) · violeta/cerros · pull
  const n=Math.floor(lerp(0,60,easeOut(prog(t,at(71),1.2))));
  for(let r=0;r<4;r++) for(let i=0;i<15;i++){ const id=r*15+i; if(id>=n) continue; const k=popIn(t,at(71)+id*0.02,0.2); emu({x:30+i*75+(r%2)*36,y:SUELO-330+r*95,s:(0.16+r*0.05)*k,t,expr:'feliz',seed:id,espejo:true}); }
  raro({x:540,y:SUELO+90,s:0.95,t,expr:t>at(72)?'yavalio':'asombro',brazos:t>at(72)?'idle':'cara',disfraz:'soldado',mayor:true,sq:gelatina(t,at(72),0.35)});
