<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine.js"></script>
<script src="../../raro.js"></script>
<script>
// aplaudir-todos-001 — ¿Qué pasaría si TODOS aplaudiéramos al mismo tiempo? (Parte 20)
// Disfraces: director (gancho) → astronauta → director → piyama → director → astronauta → piyama → director (loop).
const PI2=Math.PI*2;
window.HIDE_CAPTIONS_LAST=false;
window.CAPTION_POP_MIN=0.85;

// ---------- captions en bloques de 2–3 palabras (v2: nunca una palabra vacía sola en pantalla) ----------
const _corta=w=>w.replace(/[¡!¿?.,:…"]/g,'').length<=3;
function buildChunks(){
  CH=[]; let cur=[];
  const len=c=>c.map(j=>W[j].t).join(' ').length;
  W.forEach((w,i)=>{ if(cur.length>=2 && (cur.map(j=>W[j].t).join(' ')+' '+w.t).length>17){ CH.push(cur); cur=[]; } cur.push(i); const fin=/[.,?!:…]$/.test(w.t);
    if(fin||cur.length>=3||len(cur)>16){
      // no cerrar un bloque con una palabra corta sin puntuación: pasa al siguiente
      if(!fin && cur.length>1 && _corta(w.t)){ cur.pop(); CH.push(cur); cur=[i]; }
      else { CH.push(cur); cur=[]; } } });
  if(cur.length) CH.push(cur);
  // un bloque de una sola palabra corta se une con el siguiente (o con el anterior)
  for(let c=0;c<CH.length;c++){ if(CH[c].length===1 && _corta(W[CH[c][0]].t)){
    if(/[.?!…]$/.test(W[CH[c][0]].t) && c>0 && CH[c-1].length<=3){ CH[c-1]=CH[c-1].concat(CH[c]); CH.splice(c,1); c--; }
    else if(c+1<CH.length && CH[c+1].length<=3){ CH[c+1]=CH[c].concat(CH[c+1]); CH.splice(c,1); c--; }
    else if(c>0 && CH[c-1].length<=3){ CH[c-1]=CH[c-1].concat(CH[c]); CH.splice(c,1); c--; } } }
}
// Igual que captions() del motor, pero las 2 primeras palabras de cada bloque aparecen juntas.
function captions(t){
  let ci=-1; for(let c=0;c<CH.length;c++){ if(W[CH[c][0]].s-0.05<=t) ci=c; }
  if(ci<0) ci=0; const ch=CH[ci]; const last=W[ch[ch.length-1]];
  if(t>last.e+0.6 && (ci+1>=CH.length || t<W[CH[ci+1][0]].s-0.05)) return;
  const KW=window.KEYWORDS||[];
  let size=window.CAPTION_SIZE||80; const words=ch.map(i=>W[i].t.toUpperCase());
  const big=i=>KW.includes(i)?1.22:1;
  const widths=()=>ch.map((i,n)=>{ctx.font=fuente(size*big(i));return ctx.measureText(words[n]).width;});
  ctx.font=fuente(size); let sp=ctx.measureText(' ').width, ws=widths(), total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);
  if(total>800){size=Math.floor(size*800/total); ctx.font=fuente(size); sp=ctx.measureText(' ').width; ws=widths(); total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);}
  if(CAPPOS[ci]==null) CAPPOS[ci]=lugarCaption(total,size*1.25);
  const y=CAPPOS[ci]; let x=540-total/2; const s0=W[ch[0]].s-0.05;
  ctx.textBaseline='middle'; ctx.textAlign='center'; ctx.lineJoin='round';
  ch.forEach((i,n)=>{const w=words[n], wd=ws[n], kw=KW.includes(i); const ws_=n<2?Math.max(0,s0):W[i].s;
    const k=(ci===0&&n<2&&t<0.4)?1:(t<ws_?0:(kw?popIn(t,ws_,0.22):back((t-ws_)/0.16)));
    if(k>0){ const sz=size*big(i); ctx.save(); ctx.translate(x+wd/2,y); const sc=lerp(window.CAPTION_POP_MIN??0.6,1,k); ctx.scale(sc,sc); if(kw) ctx.rotate(Math.sin(t*5+i)*0.03);
      ctx.font=fuente(sz); ctx.fillStyle='rgba(20,14,40,0.45)'; ctx.fillText(w,0,sz*0.09);
      ctx.lineWidth=sz*0.19; ctx.strokeStyle='#1E1A2E'; ctx.strokeText(w,0,0);
      ctx.fillStyle=kw?COL.lime:'#FFFFFF'; ctx.fillText(w,0,0); ctx.restore(); }
    x+=wd+sp*1.25;});
}

// ---------- verificador de encuadre (cajas en pantalla) ----------
window.CHECK=[];
const _raro=raro;
raro=function(o){ const s=o.s??1, m=ctx.getTransform(), alto=o.alto||0; const der=(o.brazos==='senala'||o.brazos==='saluda')?320:215, izq=215;
  const ex=(o.disfraz==='tardigrado'&&!(o.bolita>0.5))?255:0; let x0=-Math.max(izq,ex)*s, x1=Math.max(der,ex)*s; if(o.espejo){ const a=-x1; x1=-x0; x0=a; }
  const pts=[[o.x+x0,o.y-alto-470*s],[o.x+x1,o.y-alto-470*s],[o.x+x0,o.y-alto],[o.x+x1,o.y-alto]].map(([x,y])=>[m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f]);
  CHECK.push([o.color?'npc':'raro',Math.min(...pts.map(p=>p[0])),Math.min(...pts.map(p=>p[1])),Math.max(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[1]))]);
  return _raro(o); };
function chk(tag,x0,y0,x1,y1){ const m=ctx.getTransform(); const P=[[x0,y0],[x1,y0],[x0,y1],[x1,y1]].map(([x,y])=>[m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f]);
  CHECK.push([tag,Math.min(...P.map(p=>p[0])),Math.min(...P.map(p=>p[1])),Math.max(...P.map(p=>p[0])),Math.max(...P.map(p=>p[1]))]); }

// ---------- utilería ----------
let CUR=1;
// Letrero en coordenadas de PANTALLA, compensando el zoom de la toma (soplar-001-v2).
function L(txt,x,y,k,tipo='madera',opts={}){ let tam=opts.tam||72; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.font=fuente(tam); let w=ctx.measureText(txt).width+tam*1.2; const maxW=700;
  if(w>maxW){ tam*=maxW/w; w=maxW; } x=clamp(x,170+w/2,910-w/2); y=clamp(y,390,520);
  letrero(txt,x,y,k,tipo,{sinPalo:!opts.palo,...opts,tam}); if(k>0.5) chk('letrero',x-w/2,y-tam*0.85,x+w/2,y+tam*0.85); ctx.restore(); }
function calendario(x,y,s,k,t,t0,hasta,d,txt='DÍAS'){ ocupa(x-120*s,y-170*s,x+120*s,y+140*s,1.5); if(k<=0) return; chk('obj',x-120*s,y-160*s,x+120*s,y+140*s); ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle='#FFFFFF'; rr(-120,-140,240,280,22); ctx.fill(); ctx.fillStyle='#FF4D5E'; rr(-120,-140,240,70,22); ctx.fill(); ctx.fillRect(-120,-100,240,30);
  ctx.fillStyle='#8E8AA3'; for(const xx of [-60,60]){ rr(xx-10,-160,20,50,10); ctx.fill(); }
  const fl=((t-t0)*8)%1; if(t>t0 && t<t0+d){ ctx.save(); ctx.transform(1,0,0,1-fl,0,0); ctx.fillStyle='#F3EEFF'; rr(-110,-60,220,190,14); ctx.fill(); ctx.restore(); }
  ctx.fillStyle='#1E1A2E'; ctx.font=fuente(110); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(contador(t,t0,d,0,hasta),0,30);
  ctx.font=fuente(40); ctx.fillStyle='#FFFFFF'; ctx.fillText(txt,0,-104); ctx.restore(); }
function tierra(x,y,r,t,sinGlow){ if(r<200) ocupa(x-r*1.2,y-r*1.2,x+r*1.2,y+r*1.2,0.8); ctx.save(); if(!sinGlow){ const g=ctx.createRadialGradient(x,y,r*0.9,x,y,r*1.25); g.addColorStop(0,'rgba(127,216,255,0.8)'); g.addColorStop(1,'rgba(127,216,255,0)'); ctx.fillStyle=g; blob(x,y,r*1.25); }
  ctx.fillStyle='#3AB6FF'; blob(x,y,r); ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,PI2); ctx.clip();
  const sp=t*0.05*r; ctx.fillStyle='#5CD67A'; for(let i=0;i<7;i++){ const xx=x-r+(((rand(i)*2.4*r+sp)%(2.4*r))) - 0.2*r, yy=y-r*0.8+rand(i+7)*r*1.6; blob(xx,yy,r*(0.18+rand(i+3)*0.2)); blob(xx+r*0.15,yy+r*0.1,r*0.14); }
  ctx.fillStyle='rgba(255,255,255,0.85)'; for(let i=0;i<6;i++){ const xx=x-r+(((rand(i+20)*2.4*r+sp*1.6)%(2.4*r)))-0.2*r, yy=y-r*0.9+rand(i+27)*r*1.8; ctx.beginPath(); ctx.ellipse(xx,yy,r*0.22,r*0.05,0,0,PI2); ctx.fill(); }
  ctx.fillStyle='rgba(30,26,80,0.25)'; ctx.beginPath(); ctx.arc(x+r*0.35,y+r*0.2,r*1.05,0,PI2); ctx.fill(); ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.ellipse(x-r*0.45,y-r*0.5,r*0.25,r*0.1,-0.6,0,PI2); ctx.fill(); ctx.restore(); }
function basculaPesaje(x,y,s,t,v){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle='#5B4B8A'; rr(-230,-40,460,50,22); ctx.fill(); ctx.fillStyle='#8D7BCF'; rr(-210,-60,420,30,14); ctx.fill();
  ctx.fillStyle='#5B4B8A'; rr(170,-560,40,520,16); ctx.fill(); ctx.translate(190,-640); ctx.fillStyle='#FFFFFF'; blob(0,0,120); ctx.strokeStyle='#5B4B8A'; ctx.lineWidth=16; ctx.beginPath(); ctx.arc(0,0,120,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='#1E1A2E'; for(let i=0;i<11;i++){ ctx.save(); ctx.rotate(-2.3+i*0.46); rr(-4,-104,8,22,4); ctx.fill(); ctx.restore(); } ctx.fillStyle='#E23D5B'; ctx.beginPath(); ctx.arc(0,-104,0,0,1); ctx.save(); ctx.rotate(-2.3+4.6*clamp(v)+(v>=1?Math.sin(t*40)*0.06:0)); ctx.fillRect(-5,-96,10,100); ctx.restore(); blob(0,0,16); ctx.restore(); chk('obj',x-230*s,y-760*s,x+310*s,y+10*s); ocupa(x+70*s,y-760*s,x+310*s,y-520*s,1.2); }
function flecha(x,y,ang,k,c='#D7FF3D'){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.scale(k,k); ctx.fillStyle=c; ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(90,0); ctx.lineTo(20,-60); ctx.lineTo(20,-22); ctx.lineTo(-80,-22); ctx.lineTo(-80,22); ctx.lineTo(20,22); ctx.lineTo(20,60); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
function confeti(t,t0,n=26){ if(t<t0) return; for(let i=0;i<n;i++){ const u=(t-t0)*0.9+rand(i)*0.3; const x=80+rand(i+3)*920+Math.sin(t*3+i)*30, y=-40+u*900%1700; ctx.save(); ctx.translate(x,y); ctx.rotate(t*6+i); ctx.fillStyle=['#D7FF3D','#FF5FA2','#4CC9F0','#FFD23F'][i%4]; ctx.fillRect(-10,-6,20,12); ctx.restore(); } }
function sudor(x,y,s,t,n=3){ for(let i=0;i<n;i++){ const a=-2.5+i*0.6; ctx.fillStyle='#7FD8FF'; const xx=x+Math.cos(a)*170*s, yy=y-290*s+Math.sin(a)*150*s+((t*2+i*0.3)%1)*30; ctx.beginPath(); ctx.moveTo(xx,yy-14*s*2); ctx.quadraticCurveTo(xx+10*s*2,yy,xx,yy+6*s*2); ctx.quadraticCurveTo(xx-10*s*2,yy,xx,yy-14*s*2); ctx.fill(); } }
const dur=sc=>sc.end-sc.start;
// v2: letrero de dos renglones, sin giro ni rebote, dentro de x 150–930; empuja el caption ≥60 px abajo.
function L2(l1,l2,k,tam1,tam2,col2,y1=360,y2=525){ if(k<=0) return; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ocupa(150,290,930,720,3);
  letrero(l1,540,y1,k,'panel',{tam:tam1,sinPalo:true}); if(l2) letrero(l2,540,y2,k,'panel',{tam:tam2,sinPalo:true,color:col2}); chk('letrero',170,y1-tam1*0.85,910,(l2?y2+tam2*0.85:y1+tam1*0.85)); ctx.restore(); }
const kIn=(t,t0,d=0.22)=>t<t0?0:easeOut(prog(t,t0,d));
function reloj(x,y,s,t){ ocupa(x-120*s,y-120*s,x+120*s,y+120*s,1.5); ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle='#FFFFFF'; blob(0,0,110); ctx.strokeStyle='#5B4B8A'; ctx.lineWidth=16; ctx.beginPath(); ctx.arc(0,0,110,0,PI2); ctx.stroke();
  ctx.fillStyle='#1E1A2E'; for(let i=0;i<12;i++){ ctx.save(); ctx.rotate(i*Math.PI/6); rr(-4,-96,8,18,4); ctx.fill(); ctx.restore(); }
  ctx.save(); ctx.rotate(Math.floor(t*3)*Math.PI/30*5); ctx.fillStyle='#E23D5B'; rr(-4,-90,8,96,4); ctx.fill(); ctx.restore(); ctx.save(); ctx.rotate(t*0.6); ctx.fillStyle='#1E1A2E'; rr(-7,-60,14,66,7); ctx.fill(); ctx.restore(); blob(0,0,12); ctx.restore(); chk('obj',x-120*s,y-120*s,x+120*s,y+120*s); }
function mini(x,y,s,col,t,i){ const b=Math.abs(Math.sin(t*5+i*1.3))*4*s; ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(x,y-b,16*s,20*s,0,0,PI2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.ellipse(x-5*s,y-b-10*s,5*s,3*s,-0.5,0,PI2); ctx.fill();
  ctx.fillStyle='#1E1A2E'; blob(x-5*s,y-b-4*s,2.6*s); blob(x+5*s,y-b-4*s,2.6*s); }

// ====================== utilería de aplausos ======================
const DIR='director', AST='astronauta', PIY='piyama';
// manos de Raro aplaudiendo (coordenadas locales); g=0 cuando chocan
const ritmo=(t,r=7)=>Math.abs(Math.sin(t*r));
function palmas(t,r=7,y=-105,ab=80){ const g=ritmo(t,r); return {i:[-24-g*ab,y], d:[24+g*ab,y]}; }
// destello del ¡plas! cuando las manos chocan (x,y en el mundo)
function plas(x,y,s,t,r=7,col='#D7FF3D'){ const g=ritmo(t,r); if(g>0.4) return; const a=1-g/0.4; ctx.save(); ctx.translate(x,y); ctx.globalAlpha=a; ctx.strokeStyle=col; ctx.lineCap='round'; ctx.lineWidth=11*s;
  for(let k=0;k<8;k++){ const an=k*Math.PI/4+0.2, r0=38*s, r1=(62+26*a)*s; ctx.beginPath(); ctx.moveTo(Math.cos(an)*r0,Math.sin(an)*r0); ctx.lineTo(Math.cos(an)*r1,Math.sin(an)*r1); ctx.stroke(); } ctx.restore(); }
// gomita chiquita aplaudiendo
function miniAp(x,y,s,col,t,i){ const r=6+(i%5)*0.6, g=ritmo(t+i*0.37,r); mini(x,y,s,col,t,i); const b=Math.abs(Math.sin(t*5+i*1.3))*4*s;
  ctx.fillStyle=mix(col,'#FFFFFF',0.35); blob(x-(5+g*11)*s,y-b-1*s,5.5*s); blob(x+(5+g*11)*s,y-b-1*s,5.5*s);
  if(g<0.25 && s>1.6){ ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=2.5*s/1.6; ctx.lineCap='round'; for(const an of [-2.2,-1.57,-0.9]){ ctx.beginPath(); ctx.moveTo(x+Math.cos(an)*9*s,y-b+Math.sin(an)*9*s-1*s); ctx.lineTo(x+Math.cos(an)*15*s,y-b+Math.sin(an)*15*s-1*s); ctx.stroke(); } } }
// multitud aplaudiendo en filas, de y0 (lejos) a y1 (cerca)
function multitud(t,y0,y1,filas=9,s0=0.7,s1=2.4,seed=0){ for(let r=0;r<filas;r++){ const u=r/(filas-1), y=y0+Math.pow(u,1.25)*(y1-y0), s=s0+u*(s1-s0), dx=30*s, n=Math.ceil(1500/dx);
  for(let i=0;i<n;i++) miniAp(-200+i*dx+(r%2)*dx/2,y,s,PASTELES[(i+r+seed)%6],t,i+r*50+seed*7); } }
// escenario de concierto (fondo propio de 3 capas: telón, reflectores y tarima)
function escenario(t){ const P=PAL_ACTUAL; ctx.fillStyle=mix(P.oscuro,'#000000',0.15); ctx.fillRect(-300,-300,1680,1300);
  for(let i=0;i<9;i++){ const x=-100+i*160; ctx.fillStyle=i%2?P.medio:mix(P.medio,P.oscuro,0.4); ctx.beginPath(); ctx.moveTo(x,-300); ctx.quadraticCurveTo(x+80+Math.sin(t*1.5+i)*14,500,x,1000); ctx.lineTo(x+170,1000); ctx.quadraticCurveTo(x+90,500,x+170,-300); ctx.fill(); }
  for(const [x,c] of [[150,'rgba(255,240,180,0.22)'],[930,'rgba(215,255,61,0.18)'],[540,'rgba(255,255,255,0.16)']]){ const sw=Math.sin(t*1.3+x)*120; ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(x,-200); ctx.lineTo(x+sw-260,1500); ctx.lineTo(x+sw+260,1500); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle=P.claro; rr(-100,1000,1280,40,10); ctx.fill(); ctx.fillStyle=mix(P.medio,'#FFFFFF',0.2); ctx.fillRect(-100,1040,1280,900); }
// tarima del director
function podio(x,y,s){ ctx.fillStyle='#5B4B8A'; rr(x-150*s,y,300*s,70*s,18*s); ctx.fill(); ctx.fillStyle='#8D7BCF'; rr(x-160*s,y-14*s,320*s,26*s,12*s); ctx.fill(); }
// sonómetro (medidor de decibeles) en una base
function sonometro(x,y,s,txt,k=1,t=0){ if(k<=0) return; ocupa(x-130*s,y-470*s,x+130*s,y,1.6); ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle='#5B4B8A'; rr(-14,-200,28,200,10); ctx.fill(); rr(-90,-14,180,24,10); ctx.fill();
  ctx.fillStyle='rgba(20,14,40,0.25)'; rr(-112,-452,236,268,40); ctx.fill(); ctx.fillStyle='#2E2A44'; rr(-118,-460,236,268,40); ctx.fill();
  ctx.fillStyle='#9AA3B5'; blob(0,-500,48); ctx.fillStyle='#C9CFDA'; for(let i=0;i<4;i++){ ctx.fillRect(-36,-520+i*14,72,5); }
  ctx.fillStyle='#CFF7B0'; rr(-96,-430,192,120,22); ctx.fill(); ctx.fillStyle='#1E1A2E'; ctx.font=fuente(txt.length>4?58:76); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,0,-368);
  ctx.font=fuente(36); ctx.fillStyle='#D7FF3D'; ctx.fillText('dB',0,-250); ctx.restore(); chk('obj',x-118*s,y-548*s,x+118*s,y); }
// reloj de pared con hora fija
function relojHora(x,y,s,h,m,t,noche=false){ ocupa(x-125*s,y-125*s,x+125*s,y+125*s,1.5); ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.rotate(Math.sin(t*3)*0.04);
  ctx.fillStyle=noche?'#2E2A44':'#FFFFFF'; blob(0,0,112); ctx.strokeStyle='#FF5FA2'; ctx.lineWidth=18; ctx.beginPath(); ctx.arc(0,0,112,0,PI2); ctx.stroke();
  ctx.fillStyle=noche?'#FFFFFF':'#1E1A2E'; for(let i=0;i<12;i++){ ctx.save(); ctx.rotate(i*Math.PI/6); rr(-4,-96,8,i%3?14:24,4); ctx.fill(); ctx.restore(); }
  ctx.save(); ctx.rotate((h%12+m/60)*Math.PI/6); rr(-8,-58,16,64,8); ctx.fill(); ctx.restore(); ctx.save(); ctx.rotate(m*Math.PI/30); rr(-5,-86,10,92,5); ctx.fill(); ctx.restore();
  ctx.fillStyle='#FF5FA2'; blob(0,0,13); ctx.restore(); chk('obj',x-125*s,y-125*s,x+125*s,y+125*s); }
function sol(x,y,r,t){ ctx.save(); ctx.translate(x,y); ctx.rotate(t*0.4); ctx.fillStyle='rgba(255,210,63,0.5)'; for(let i=0;i<12;i++){ ctx.rotate(Math.PI/6); ctx.beginPath(); ctx.moveTo(-18,-r-10); ctx.lineTo(0,-r-60); ctx.lineTo(18,-r-10); ctx.fill(); } ctx.restore(); ctx.fillStyle='#FFD23F'; blob(x,y,r); ctx.fillStyle='#FFE88A'; blob(x-r*0.3,y-r*0.3,r*0.35); }
function luna(x,y,r){ ctx.fillStyle='rgba(255,246,200,0.25)'; blob(x,y,r*1.4); ctx.fillStyle='#FFF4C2'; blob(x,y,r); ctx.fillStyle='#EADFA8'; blob(x+r*0.3,y-r*0.2,r*0.22); blob(x-r*0.35,y+r*0.3,r*0.16); }
