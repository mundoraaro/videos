<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine.js"></script>
<script src="../../raro.js"></script>
<script>
// venus-001 — "En Venus cumples años antes de que se acabe el día"
// Raro = astronauta cumpleañero (escafandra + gorrito de fiesta). Cambios: piyama (noche de 2 meses) y regreso.

// ---------- disfraz: astronauta con gorrito de fiesta ----------
const A=DISFRACES.astronauta;
function gorrito(o,y0){ const w=o.wob||0; ctx.save(); ctx.translate(30,y0); ctx.rotate(0.22+w*0.12+Math.sin(o.t*3)*0.03);
  ctx.fillStyle='#FF5FA2'; ctx.beginPath(); ctx.moveTo(-62,0); ctx.lineTo(0,-150); ctx.lineTo(62,0); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.clip(); ctx.fillStyle='#FFD23F'; for(let i=0;i<4;i++){ ctx.save(); ctx.translate(0,-30-i*38); ctx.rotate(-0.4); ctx.fillRect(-90,-8,180,14); ctx.restore(); } ctx.restore();
  ctx.fillStyle='#4CC9F0'; ctx.beginPath(); ctx.arc(Math.sin(o.t*6)*4,-156,22,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFFFFF'; rr(-70,-8,140,18,9); ctx.fill(); ctx.restore(); }
const CUMPLE={ atras:A.atras, cuerpo:A.cuerpo, frente(o,B){ A.frente(o,B); gorrito(o,-452); } };
const PIYAMA=DISFRACES.piyama;

// ---------- objetos del mundo ----------
function pastel(x,y,s,k,t,o={}){ if(k<=0) return; const d=o.derrite||0; ctx.save(); ctx.translate(x,y); ctx.scale(s*k*(1+0.5*d),s*k*(1-0.72*d));
  if(typeof ocupa==='function') ocupa(-150,-260,150,10,1.5);
  ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(0,8,170,26,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.ellipse(0,0,160,24,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FF8FC0'; rr(-125,-110,250,110,26); ctx.fill(); ctx.fillStyle='#FF6AAE'; rr(-125,-40,250,40,20); ctx.fill();
  ctx.fillStyle='#B98AFF'; rr(-85,-190,170,86,22); ctx.fill();
  ctx.fillStyle='#FFF4DC'; for(const [yy,w] of [[-110,125],[-190,85]]){ ctx.beginPath(); ctx.moveTo(-w,yy+8);
    for(let i=0;i<=8;i++){ const xx=-w+i*w/4; ctx.lineTo(xx,yy+8+(i%2?22+Math.sin(t*2+i)*4:6)); } ctx.lineTo(w,yy-4); ctx.lineTo(-w,yy-4); ctx.closePath(); ctx.fill(); rr(-w,yy-12,2*w,22,11); ctx.fill(); }
  const n=o.velas??3; for(let i=0;i<n;i++){ const vx=(i-(n-1)/2)*44; ctx.fillStyle=['#4CC9F0','#D7FF3D','#FFD23F','#FF8A3D'][i%4]; rr(vx-9,-262,18,72,8); ctx.fill();
    if(!o.apagadas){ const f=1+0.18*Math.sin(t*20+i*2); ctx.fillStyle='#FFD23F'; ctx.beginPath(); ctx.ellipse(vx,-285,13*f,24*f,Math.sin(t*9+i)*0.2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#FFF7C2'; ctx.beginPath(); ctx.ellipse(vx,-280,6,11,0,0,Math.PI*2); ctx.fill(); } }
  ctx.restore();
  if(d>0){ ctx.fillStyle='#FF8FC0'; ctx.globalAlpha=0.9; ctx.beginPath(); ctx.ellipse(x,y+4,190*s*(0.6+d),32*s*(0.5+d*0.6),0,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
}
function venus(x,y,r,t,rot=0,k=1,o={}){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k);
  if(typeof ocupa==='function' && !o.sinOcupa) ocupa(-r,-r,r,r,2);
  ctx.shadowColor='#FFE8A8'; ctx.shadowBlur=60; ctx.fillStyle='#FFC56B'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  ctx.save(); ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.clip();
  const bands=[['#F2A541',-0.55,0.16],['#FFE0A0',-0.2,0.12],['#E8913A',0.15,0.14],['#FFD58A',0.48,0.12]];
  for(const [c,yy,h] of bands){ ctx.fillStyle=c; for(let j=-2;j<=2;j++){ const ox=((rot*r*2+j*r*1.4)%(r*2.8)); ctx.beginPath(); ctx.ellipse(ox,yy*r+Math.sin(j+rot*3)*r*0.04,r*0.75,h*r,0.08,0,Math.PI*2); ctx.fill(); } }
  ctx.fillStyle='rgba(120,40,0,0.22)'; ctx.beginPath(); ctx.arc(r*0.35,r*0.3,r*1.05,0,Math.PI*2); ctx.arc(-r*0.1,-r*0.1,r*1.1,0,Math.PI*2,true); ctx.fill('evenodd');
  ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.ellipse(-r*0.42,-r*0.48,r*0.22,r*0.1,-0.6,0,Math.PI*2); ctx.fill();
  ctx.restore();
  if(o.cara){ ctx.fillStyle='#1E1A2E'; for(const s of [-1,1]){ ctx.beginPath(); ctx.ellipse(s*r*0.25,-r*0.08,r*0.07,r*0.11*(o.cara==='asombro'?1.4:1),0,0,Math.PI*2); ctx.fill(); }
    ctx.beginPath(); if(o.cara==='asombro'){ ctx.ellipse(0,r*0.22,r*0.08,r*0.1,0,0,Math.PI*2); ctx.fill(); } else { ctx.lineWidth=r*0.04; ctx.strokeStyle='#1E1A2E'; ctx.arc(0,r*0.12,r*0.18,0.2,Math.PI-0.2); ctx.stroke(); } }
  ctx.restore(); }
function tierraMini(x,y,r,t,rot=0,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.fillStyle='#3AB6FF'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.clip(); ctx.fillStyle='#6CE38B'; for(let j=-2;j<=2;j++){ const ox=((rot*r*2+j*r*1.3)%(r*2.6)); blob(ox,-r*0.2,r*0.38); blob(ox+r*0.3,r*0.3,r*0.25);} ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.ellipse(-r*0.4,-r*0.45,r*0.2,r*0.09,-0.6,0,Math.PI*2); ctx.fill(); ctx.restore(); }
function mercurio(x,y,r,t,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.fillStyle='#B9B3C9'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#958FA8'; for(const [a,b,c] of [[-0.3,-0.2,0.2],[0.35,0.2,0.16],[-0.1,0.45,0.12]]){ ctx.beginPath(); ctx.arc(a*r,b*r,c*r,0,Math.PI*2); ctx.fill(); } ctx.restore(); }
function solDib(x,y,r,t,k=1,cara=null){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); if(typeof ocupa==='function') ocupa(-r,-r,r,r,1.5);
  ctx.rotate(t*0.4); ctx.fillStyle='#FFB21A'; for(let i=0;i<12;i++){ ctx.save(); ctx.rotate(i/12*Math.PI*2); ctx.beginPath(); ctx.moveTo(-r*0.18,-r*0.92); ctx.lineTo(0,-r*1.32-Math.sin(t*6+i)*r*0.06); ctx.lineTo(r*0.18,-r*0.92); ctx.fill(); ctx.restore(); }
  ctx.rotate(-t*0.4); ctx.shadowColor='#FFF2A0'; ctx.shadowBlur=50; ctx.fillStyle='#FFE45C'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='#FFF4A8'; ctx.beginPath(); ctx.ellipse(-r*0.35,-r*0.4,r*0.25,r*0.12,-0.6,0,Math.PI*2); ctx.fill();
  if(cara){ ctx.fillStyle='#8A4B00'; for(const s of [-1,1]){ ctx.beginPath(); ctx.ellipse(s*r*0.28,-r*0.05,r*0.07,r*0.12,0,0,Math.PI*2); ctx.fill(); }
    ctx.strokeStyle='#8A4B00'; ctx.lineWidth=r*0.06; ctx.lineCap='round'; ctx.beginPath(); if(cara==='sospecha'){ ctx.moveTo(-r*0.2,r*0.3); ctx.lineTo(r*0.2,r*0.26);} else ctx.arc(0,r*0.15,r*0.25,0.2,Math.PI-0.2); ctx.stroke(); }
  ctx.restore(); }
function flechaGiro(x,y,r,dir,k,t,color='#FFFFFF'){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k*0.4); ctx.rotate(t*1.5*dir*0);
  ctx.strokeStyle=color; ctx.lineWidth=26; ctx.lineCap='round'; const a0=dir>0?-2.4:-0.7, a1=dir>0?-0.7:-2.4; ctx.beginPath(); ctx.arc(0,0,r,Math.min(a0,a1),Math.max(a0,a1)); ctx.stroke();
  const ae=a1, ex=Math.cos(ae)*r, ey=Math.sin(ae)*r; ctx.fillStyle=color; ctx.translate(ex,ey); ctx.rotate(ae+(dir>0?Math.PI/2:-Math.PI/2)); ctx.beginPath(); ctx.moveTo(0,-46); ctx.lineTo(60,0); ctx.lineTo(0,46); ctx.closePath(); ctx.fill(); ctx.restore(); }
function reloj(x,y,r,k,t,h,m,txt){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(wobble(t,0,0)); ctx.scale(k,k); if(typeof ocupa==='function') ocupa(-r,-r,r,r,2);
  ctx.fillStyle='#FF5FA2'; ctx.beginPath(); ctx.arc(0,0,r+22,0,Math.PI*2); ctx.fill(); for(const s of [-1,1]){ ctx.beginPath(); ctx.arc(s*r*0.7,-r*1.02,r*0.26,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle='#FFF8EC'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1E1A2E'; for(let i=0;i<12;i++){ const a=i/12*Math.PI*2; ctx.beginPath(); ctx.arc(Math.sin(a)*r*0.8,-Math.cos(a)*r*0.8,i%3?5:10,0,Math.PI*2); ctx.fill(); }
  ctx.strokeStyle='#1E1A2E'; ctx.lineCap='round'; const ah=(h%12+m/60)/12*Math.PI*2, am=m/60*Math.PI*2;
  ctx.lineWidth=16; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.sin(ah)*r*0.48,-Math.cos(ah)*r*0.48); ctx.stroke();
  ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.sin(am)*r*0.72,-Math.cos(am)*r*0.72); ctx.stroke();
  ctx.fillStyle='#FF5FA2'; ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2); ctx.fill(); ctx.restore(); }
function termometro(x,y,h,k,lleno,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.rotate(Math.sin(t*30)*0.03*lleno); if(typeof ocupa==='function') ocupa(-70,-h-40,70,90,2);
  ctx.fillStyle='#FFFFFF'; rr(-46,-h-40,92,h+60,46); ctx.fill(); ctx.beginPath(); ctx.arc(0,30,72,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FF3D3D'; ctx.beginPath(); ctx.arc(0,30,52,0,Math.PI*2); ctx.fill(); const lh=(h-10)*clamp(lleno); rr(-24,-lh,48,lh+40,24); ctx.fill();
  ctx.fillStyle='#1E1A2E'; for(let i=1;i<6;i++) ctx.fillRect(22,-i*h/6,26,6); ctx.restore(); }
function sonda(x,y,s,k,t,o={}){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); if(typeof ocupa==='function') ocupa(-170,-430,170,0,2);
  if(o.para){ ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=4; for(const xx of [-200,-70,70,200]){ ctx.beginPath(); ctx.moveTo(0,-300); ctx.lineTo(xx,-640); ctx.stroke(); }
    ctx.fillStyle='#FF5FA2'; ctx.beginPath(); ctx.ellipse(0,-640,230,120,0,Math.PI,0); ctx.fill(); ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.ellipse(0,-640,80,120,0,Math.PI,0); ctx.fill(); }
  ctx.fillStyle='#9AA3B5'; for(const sx of [-1,1]){ ctx.save(); ctx.rotate(sx*0.25); rr(sx*110-8,-120,16,120,8); ctx.fill(); ctx.restore(); }
  ctx.fillStyle='#C9CFDA'; ctx.beginPath(); ctx.ellipse(0,-60,170,42,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#E2E6EE'; ctx.beginPath(); ctx.ellipse(0,-70,150,26,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#E9C46A'; ctx.beginPath(); ctx.arc(0,-190,120,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#F7DE9A'; ctx.beginPath(); ctx.ellipse(-40,-235,40,22,-0.6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#C9CFDA'; ctx.beginPath(); ctx.ellipse(0,-300,90,26,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#9AA3B5'; ctx.lineWidth=10; const caida_=o.apagada||0; ctx.beginPath(); ctx.moveTo(0,-310); ctx.quadraticCurveTo(10+caida_*60,-380,caida_*120,-430+caida_*120); ctx.stroke();
  ctx.fillStyle=o.apagada? '#5B5470' : (Math.sin(t*10)>0?'#D7FF3D':'#6CFFB5'); ctx.beginPath(); ctx.arc(caida_*120,-438+caida_*120,16,0,Math.PI*2); ctx.fill();
  // carita de la sonda (es un personaje del mundo)
  ctx.fillStyle='#1E1A2E'; if(o.apagada){ ctx.lineWidth=7; ctx.strokeStyle='#1E1A2E'; for(const sx of [-1,1]){ ctx.beginPath(); ctx.moveTo(sx*40-14,-200); ctx.lineTo(sx*40+14,-180); ctx.moveTo(sx*40+14,-200); ctx.lineTo(sx*40-14,-180); ctx.stroke(); } }
  else for(const sx of [-1,1]){ ctx.beginPath(); ctx.ellipse(sx*40,-195,12,18,0,0,Math.PI*2); ctx.fill(); }
  ctx.restore(); }
function humo(t,t0,x,y,s=1){ if(t<t0) return; ctx.save(); for(let i=0;i<8;i++){ const ph=((t-t0)*0.9+i/8)%1; ctx.globalAlpha=0.55*(1-ph); ctx.fillStyle='#8E8AA3'; blob(x+Math.sin(i*2+ph*3)*30*s,y-ph*360*s,(24+ph*60)*s); } ctx.restore(); }
function gota(x,y,r,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(x,y-r*1.8); ctx.quadraticCurveTo(x+r,y-r*0.2,x,y+r); ctx.quadraticCurveTo(x-r,y-r*0.2,x,y-r*1.8); ctx.fill(); }
function confeti(t,t0,x,y,n=26){ if(t<t0||t>t0+2.2) return; const u=t-t0; for(let i=0;i<n;i++){ const a=rand(i)*Math.PI*2, v=380+rand(i+5)*520;
  const px=x+Math.cos(a)*v*u*0.9, py=y+Math.sin(a)*v*u*0.7-300*u+520*u*u; ctx.save(); ctx.translate(px,py); ctx.rotate(u*8+i); ctx.globalAlpha=clamp(2.2-u);
  ctx.fillStyle=DULCES[i%DULCES.length]; ctx.fillRect(-12,-6,24,12); ctx.restore(); } }
// superficie de Venus (escenario propio en 'liso'): volcanes lejanos, rocas medias, suelo agrietado con brillo y bruma
function sueloVenus(t,cam=0){ const P=PAL_ACTUAL, G=SUELO, px=d=>cam*d+Math.sin(t*0.25)*14*d;
  ctx.fillStyle=mix(P.claro,'#FFFFFF',0.25); for(const [x,h,w] of [[160,520,330],[620,640,380],[1000,470,300]]){ ctx.beginPath(); ctx.moveTo(x-w+px(0.15),G-150); ctx.quadraticCurveTo(x+px(0.15),G-150-h*1.6,x+w+px(0.15),G-150); ctx.fill(); }
  ctx.fillStyle=mix(P.claro,P.medio,0.4); blob(620+px(0.15),G-150-640*0.8+20,40);
  ctx.globalAlpha=0.45; ctx.fillStyle='#FFF2B8'; for(let i=0;i<4;i++){ const x=((rand(i)*1500+t*40*(0.5+rand(i+2)))%1500)-250; nube(x,G-700+i*120,1.2+rand(i)*0.6); } ctx.globalAlpha=1;
  ctx.fillStyle=P.medio; blob(80+px(0.45),G+120,360); blob(1000+px(0.45),G+90,330); blob(540+px(0.45),G+210,420);
  ctx.fillStyle=mix(P.oscuro,P.medio,0.25); ctx.fillRect(-200,G-12,1480,900);
  ctx.strokeStyle='#FFE45C'; ctx.globalAlpha=0.55+0.25*Math.sin(t*3); ctx.lineWidth=7; ctx.lineCap='round';
  for(const [x0,y0] of [[90,G+80],[700,G+150],[380,G+260],[930,G+330]]){ ctx.beginPath(); ctx.moveTo(x0+px(1),y0); ctx.lineTo(x0+60+px(1),y0+24); ctx.lineTo(x0+150+px(1),y0+8); ctx.lineTo(x0+210+px(1),y0+40); ctx.stroke(); } ctx.globalAlpha=1;
  ctx.fillStyle=mix(P.oscuro,'#000000',0.12); for(let i=0;i<7;i++){ const x=((rand(i+40)*1400+px(1.3))%1400)-160; rr(x,G+50+rand(i+3)*360,40+rand(i)*60,26+rand(i+1)*30,14); ctx.fill(); }
  ctx.fillStyle='rgba(255,236,170,0.5)'; for(let i=0;i<22;i++){ const x=((rand(i)*1200+t*30)%1200)-60, y=((rand(i+9)*1900-t*50*(0.5+rand(i)))%1900+1900)%1900; blob(x,y,3+rand(i+4)*5); }
}
function cuarto(t,cam=0){ // recámara para la noche: cama
  const P=PAL_ACTUAL; ctx.fillStyle=mix(P.medio,'#FFFFFF',0.15); rr(170,SUELO-330,740,200,40); ctx.fill(); }
function puerta(x,y,k,ab,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); if(typeof ocupa==='function') ocupa(-170,-560,170,0,1);
  ctx.fillStyle='#7A4A22'; rr(-170,-560,340,560,26); ctx.fill(); ctx.fillStyle='#FF8A3D'; ctx.globalAlpha=ab; rr(-140,-530,280,530,20); ctx.fill(); ctx.globalAlpha=1;
  ctx.save(); ctx.translate(-140,0); ctx.scale(1-0.85*ab,1); ctx.fillStyle='#B97A3E'; rr(0,-530,280,530,20); ctx.fill(); ctx.fillStyle='#FFD23F'; ctx.beginPath(); ctx.arc(240,-270,16,0,Math.PI*2); ctx.fill(); ctx.restore();
  if(ab>0.2){ ctx.globalAlpha=0.5*ab; ctx.fillStyle='#FFE45C'; for(let i=0;i<5;i++){ ctx.beginPath(); ctx.moveTo(0,-260); ctx.lineTo(380+i*40,-700+i*230); ctx.lineTo(380+i*40,-640+i*230); ctx.fill(); } ctx.globalAlpha=1; }
  ctx.restore(); }

// Raro sostiene el pastel a un lado con la mano derecha: devuelve la posición del pastel en el mundo
const MANO_PASTEL={d:[235,-150]};
function posPastel(x,y,s,alto=0){ return [x+235*s, y-alto-150*s+22]; }
// ---------- escenas ----------
// S1 (gancho, cuadro 0): Raro astronauta cumpleañero en Venus con pastel encendido, letrero VENUS ya puesto. Fondo mandarina, superficie de Venus.
function S1(t,sc){ sueloVenus(t); const w=wobble(t,at(2),0.9);
  const b={sq:gelatina(t,at(4),0.35),alto:0,wob:wobble(t,at(4),0.8)};
  raro({x:440,y:SUELO,s:1.25,t,expr:t<at(8)?'feliz':'orgullo',disfraz:CUMPLE,brazos:'saluda',manos:MANO_PASTEL,sq:b.sq,alto:b.alto,wob:w+b.wob,tilt:Math.sin(t*3)*0.04});
  { const [px,py]=posPastel(440,SUELO,1.25,b.alto); pastel(px,py,0.6,1,t,{velas:3}); }
  letrero('VENUS',540,380,1,'panel',{tam:96,t,t0:-1});
  letrero('¡FELIZ AÑO!',780,600,popIn(t,at(4)),'pergamino',{tam:54,t,t0:at(4)});
  confeti(t,at(2),700,1000); chispas(t,at(10),300,820,1.2);
  solDib(170,640,90+8*Math.sin(t*2),t,popIn(t,at(9)),'sospecha');
}
// S2: pattern interrupt — cerrado a la cara de Raro "¿cómo que antes?"; con "mira" señala hacia el planeta.
function S2(t,sc){ const m=t>=at(14);
  raro({x:540,y:SUELO,s:1.35,t,expr:m?'asombro':'sospecha',mira:m?undefined:{x:0,y:0},disfraz:CUMPLE,brazos:m?'senala':'jarras',sq:gelatina(t,sc.start+0.05),wob:wobble(t,at(14),0.8)});
  venus(930,560,120*popIn(t,at(14)),t,t*0.05,1); chispas(t,at(14),930,560,1);
}
// S3: Venus gigante gira lentísimo con Raro caminando encima; la Tierra mini gira rapidísimo; contador 243 DÍAS.
function S3(t,sc){ const r=520, cx=540, cy=1700; const rot=(t-sc.start)*0.02;
  venus(cx,cy,r,t,rot,popIn(t,sc.start,0.3),{cara:t>at(26)?'asombro':null,sinOcupa:true}); ocupa(0,1180,1080,1920,1);
  const c=caida(t,sc.start+0.05,900);
  raro({x:540,y:cy-r+10,s:0.95,t,expr:t<at(17)?'neutral':(t<at(26)?'asombro':'yavalio'),disfraz:CUMPLE,piernas:'camina',brazos:'idle',sq:c.sq,alto:c.alto,wob:c.wob});
  tierraMini(880,780,90,t,t*2.4,popIn(t,at(21)));
  if(t>=at(21)) flechaGiro(880,780,140,1,popIn(t,at(21)),t,'#D7FF3D');
  if(t>=at(26)) flechaGiro(cx,cy-r-60,330,1,popIn(t,at(26)),t);
  letrero(contador(t,at(17),0.9,0,243,' DÍAS'),540,400,popIn(t,at(17)),'panel',{tam:88,t,t0:at(17)});
  letrero('=1 VUELTA',540,560,popIn(t,at(26)),'madera',{tam:58,t,t0:at(26)});
