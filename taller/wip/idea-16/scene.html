<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine.js"></script>
<script src="../../raro.js"></script>
<script>
// sol-001 — ¿Qué pasaría si el Sol se apagara? (idea-16). Raro playero/astronauta/piyama/abrigo/buzo/científico.
const TAU=Math.PI*2;
// ---------- objetos del mundo ----------
function sol(x,y,r,t,enc=1){ // enc 1 = encendido, 0 = apagado (gris)
  const c1=mix('#9A98B8','#FFE14D',enc), c2=mix('#6F6C8E','#FF9A1F',enc);
  if(enc>0.05){ const g=ctx.createRadialGradient(x,y,r*0.6,x,y,r*2.6); g.addColorStop(0,`rgba(255,240,150,${0.55*enc})`); g.addColorStop(1,'rgba(255,240,150,0)'); ctx.fillStyle=g; blob(x,y,r*2.6); }
  ctx.save(); ctx.translate(x,y); ctx.rotate(t*0.35*enc+0.1);
  ctx.fillStyle=c2; for(let i=0;i<12;i++){ ctx.rotate(TAU/12); rr(-r*0.11,-r*1.42-Math.sin(t*5+i)*r*0.07*enc,r*0.22,r*0.36,r*0.11); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle=c2; blob(x,y,r); ctx.fillStyle=c1; blob(x-r*0.07,y-r*0.07,r*0.9);
  ctx.fillStyle=`rgba(255,255,255,${0.25+0.35*enc})`; ctx.beginPath(); ctx.ellipse(x-r*0.38,y-r*0.42,r*0.22,r*0.11,-0.6,0,TAU); ctx.fill();
  ocupa(x-r*1.3,y-r*1.3,x+r*1.3,y+r*1.3,1.5);
}
function haz(x0,y0,x1,y1,t,k,ancho=240){ // cono de luz con fotones que viajan
  if(k<=0.001) return; const a=Math.atan2(y1-y0,x1-x0), L=Math.hypot(x1-x0,y1-y0);
  ctx.save(); ctx.translate(x0,y0); ctx.rotate(a);
  ctx.globalAlpha=0.26*k; ctx.fillStyle='#FFF3A0'; ctx.beginPath(); ctx.moveTo(0,-70); ctx.lineTo(L,-ancho); ctx.lineTo(L,ancho); ctx.lineTo(0,70); ctx.fill();
  ctx.globalAlpha=0.9*k; ctx.fillStyle='#FFFFFF';
  for(let i=0;i<10;i++){ const u=((t*0.9+i/10)%1); const w=lerp(60,ancho,u); rr(u*L,(rand(i)*2-1)*w*0.75-6,70,12,6); ctx.fill(); }
  ctx.restore();
}
function interruptor(x,y,s,on,t){ // placa con palanca: on 0..1
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle='#BDB4D6'; rr(-86,-136,180,280,34); ctx.fill();
  ctx.fillStyle='#F4F0FF'; rr(-90,-140,180,280,34); ctx.fill();
  ctx.fillStyle='#8A84A3'; rr(-36,-80,72,160,24); ctx.fill();
  const ly=lerp(10,-90,on); ctx.fillStyle=on>0.5?RARO.lima:'#FF4D6D'; rr(-30,ly,60,80,24); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.6)'; rr(-20,ly+8,18,40,9); ctx.fill();
  ctx.font=fuente(34); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#1E1A2E'; ctx.fillText('ON',0,-112); ctx.fillText('OFF',0,112);
  ctx.restore(); ocupa(x-90*s,y-140*s,x+90*s,y+140*s,2);
}
function tierra(x,y,r,t,gira=1){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(120,200,255,0.35)'; blob(0,0,r*1.08);
  ctx.fillStyle='#1C79D2'; blob(0,0,r);
  ctx.save(); ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.clip();
  ctx.fillStyle='#3AB6FF'; blob(-r*0.08,-r*0.08,r*0.93);
  const off=t*gira*r*0.35;
  for(const [cx,cy,cr] of [[0,-0.35,0.34],[0.35,-0.1,0.24],[1.1,0.35,0.3],[1.45,0.15,0.22],[2.3,-0.25,0.32],[3.1,0.4,0.26]]){
    const xx=(((cx*r+off)%(4*r))+4*r)%(4*r)-2*r; ctx.fillStyle='#55D98A'; blob(xx,cy*r,cr*r); blob(xx+cr*r*0.7,cy*r+cr*r*0.4,cr*r*0.7); }
  ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.ellipse(0,-r*0.93,r*0.5,r*0.12,0,0,TAU); ctx.fill();
  ctx.fillStyle='rgba(10,20,80,0.22)'; blob(r*0.35,r*0.3,r*0.95);
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.ellipse(-r*0.42,-r*0.45,r*0.2,r*0.09,-0.7,0,TAU); ctx.fill();
  ctx.restore(); ocupa(x-r,y-r,x+r,y+r,1.5);
}
function luna(x,y,r,t,luz=1){
  if(luz>0.05){ ctx.fillStyle=`rgba(255,255,230,${0.3*luz})`; blob(x,y,r*1.35); }
  ctx.fillStyle=mix('#4B4766','#C9C4D8',luz); blob(x,y,r);
  ctx.fillStyle=mix('#5E5A7A','#F6F2E4',luz); blob(x-r*0.06,y-r*0.06,r*0.92);
  ctx.fillStyle=mix('#423E5C','#D8D2C2',luz); for(const [cx,cy,cr] of [[-0.3,-0.25,0.2],[0.3,0.1,0.14],[-0.1,0.4,0.16],[0.4,-0.4,0.09]]) blob(x+cx*r,y+cy*r,cr*r);
  ocupa(x-r,y-r,x+r,y+r,1.5);
}
function jupiter(x,y,r,t,luz=1){
  if(luz>0.05){ const g=ctx.createRadialGradient(x,y,r*0.8,x,y,r*1.9); g.addColorStop(0,`rgba(255,220,170,${0.55*luz})`); g.addColorStop(1,'rgba(255,220,170,0)'); ctx.fillStyle=g; blob(x,y,r*1.9); }
  ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.clip();
  const cols=['#F6E1C0','#E0A066','#F8EBD4','#C97A45','#F2D2A8','#D98E55','#F8EBD4','#B86A3A'];
  for(let i=0;i<8;i++){ ctx.fillStyle=mix('#4A4560',cols[i],luz); const y0=y-r+i*r/4; ctx.beginPath(); ctx.moveTo(x-r,y0); for(let xx=-r;xx<=r;xx+=20) ctx.lineTo(x+xx,y0+Math.sin(xx*0.02+t*1.5+i)*8); ctx.lineTo(x+r,y0+r/4+10); ctx.lineTo(x-r,y0+r/4+10); ctx.fill(); }
  ctx.fillStyle=mix('#4A4560','#E0533A',luz); ctx.beginPath(); ctx.ellipse(x+r*0.3+Math.sin(t)*6,y+r*0.32,r*0.2,r*0.11,0,0,TAU); ctx.fill();
  ctx.fillStyle='rgba(30,10,60,0.2)'; blob(x+r*0.35,y+r*0.3,r*0.95);
  ctx.restore(); ocupa(x-r,y-r,x+r,y+r,1.5);
}
function cuerda(x0,y0,x1,y1,t,pulso=-1,tens=1){ // liga lima de "gravedad"
  ctx.save(); ctx.lineCap='round';
  const mx=(x0+x1)/2, my=(y0+y1)/2+60*(1-tens)+Math.sin(t*3)*10;
  for(const [c,w] of [[RARO.limaD,30],[RARO.lima,20]]){ ctx.strokeStyle=c; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.quadraticCurveTo(mx,my,x1,y1); ctx.stroke(); }
  if(pulso>=0&&pulso<=1){ const u=pulso, px=(1-u)*(1-u)*x0+2*u*(1-u)*mx+u*u*x1, py=(1-u)*(1-u)*y0+2*u*(1-u)*my+u*u*y1; ctx.fillStyle='#FFFFFF'; blob(px,py,30); ctx.globalAlpha=0.4; blob(px,py,52); }
  ctx.restore();
}
function taza(x,y,s,t,inclina=0){
  ctx.save(); ctx.translate(x,y); ctx.rotate(inclina); ctx.scale(s,s);
  ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=8; ctx.globalAlpha=0.7; for(let i=0;i<3;i++){ ctx.beginPath(); const xx=-30+i*30; ctx.moveTo(xx,-70); ctx.bezierCurveTo(xx+20,-100-Math.sin(t*4+i)*10,xx-20,-130,xx+Math.sin(t*3+i)*10,-170); ctx.stroke(); } ctx.globalAlpha=1;
  ctx.strokeStyle='#C7303F'; ctx.lineWidth=18; ctx.beginPath(); ctx.arc(70,0,34,-1.2,1.2); ctx.stroke();
  ctx.fillStyle='#C7303F'; rr(-66,-64,136,128,24); ctx.fill(); ctx.fillStyle='#FF4D5E'; rr(-72,-66,136,128,24); ctx.fill();
  ctx.fillStyle='#6B3A1E'; ctx.beginPath(); ctx.ellipse(-4,-58,62,12,0,0,TAU); ctx.fill();
  ctx.restore();
}
const PERRO={ // disfraz para gomita(): orejas caídas, nariz y cola que se menea
  atras(o){ ctx.save(); ctx.strokeStyle=mix(o.color,'#7A4A22',0.35); ctx.lineWidth=30; ctx.lineCap='round'; const a=Math.sin(o.t*22)*0.6; ctx.beginPath(); ctx.moveTo(-120,-120); ctx.quadraticCurveTo(-220,-170,-230+Math.cos(a)*30,-260+Math.sin(a)*50); ctx.stroke(); ctx.restore(); },
  cabeza(o){ ctx.fillStyle='#B97A3E'; for(const s of [-1,1]){ ctx.save(); ctx.translate(s*120,-340); ctx.rotate(s*(0.5+Math.sin(o.t*14)*0.25)); ctx.beginPath(); ctx.ellipse(0,60,44,90,0,0,TAU); ctx.fill(); ctx.restore(); } },
  frente(o){ ctx.fillStyle='#1E1A2E'; ctx.beginPath(); ctx.ellipse(0,-262,26,18,0,0,TAU); ctx.fill(); ctx.fillStyle='#FF5FA2'; rr(-120,-200,240,28,14); ctx.fill(); ctx.fillStyle='#FFD23F'; blob(0,-170,18); }
};
function hielo(x,y,s,k,t){ if(k<=0.001) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle='rgba(190,240,255,0.5)'; rr(-210,-470,420,480,60); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.95)'; ctx.lineWidth=12; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.75)'; rr(-180,-440,40,170,20); ctx.fill(); rr(-120,-440,90,26,13); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(120,-120); ctx.lineTo(170,-60); ctx.moveTo(140,-100); ctx.lineTo(190,-110); ctx.stroke();
  ctx.restore(); }
function termometro(x,y,nivel,t){ // nivel 0..1 (1 = calientito)
  ctx.fillStyle='#FFFFFF'; rr(x-46,y-560,92,600,46); ctx.fill(); blob(x,y+40,86);
  ctx.fillStyle='#E9F4FF'; rr(x-30,y-540,60,560,30); ctx.fill();
  const c=mix('#3AB6FF','#FF4D5E',nivel); ctx.fillStyle=c; blob(x,y+40,64); const h=lerp(40,500,nivel); rr(x-22,y-h,44,h+40,22); ctx.fill();
  ctx.fillStyle='#9AA6C8'; for(let i=0;i<8;i++) rr(x+30,y-500+i*62,26,8,4), ctx.fill();
  ocupa(x-90,y-560,x+90,y+130,2);
}
function cuboAzucar(x,y,k){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.fillStyle='#E4E0F2'; rr(-34,-30,72,68,14); ctx.fill(); ctx.fillStyle='#FFFFFF'; rr(-38,-36,72,68,14); ctx.fill(); ctx.fillStyle='#E4E0F2'; for(let i=0;i<5;i++) blob(-20+rand(i)*44,-20+rand(i+3)*40,3); ctx.restore(); }
function pez(x,y,s,t,c){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); const w=Math.sin(t*10)*0.3; ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(0,0,70,44,0,0,TAU); ctx.fill();
  ctx.save(); ctx.translate(-62,0); ctx.rotate(w); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-50,-40); ctx.lineTo(-50,40); ctx.fill(); ctx.restore();
  ctx.fillStyle='#FFFFFF'; blob(34,-10,14); ctx.fillStyle='#1E1A2E'; blob(38,-10,7); ctx.restore(); }
function cronometro(t,t0,x,y,k,desde=480){ const s=Math.max(0,Math.round(desde-(t-t0)*3)); letrero(`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`,x,y,k,'panel',{tam:96,t,t0}); }
function signo(t,t0,x,y,txt='?'){ const k=popIn(t,t0); if(k<=0) return; label(txt,x,y+Math.sin(t*4+x)*10,96,'#FFFFFF',k); }
function ojosEnLaOscuridad(x,y,s,t,mirar){ const bl=parpadeo(t,2); for(const sd of [-1,1]){ ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.ellipse(x+sd*50*s,y-290*s,30*s,44*s*bl,0,0,TAU); ctx.fill();
  ctx.fillStyle='#1E1A2E'; ctx.beginPath(); ctx.ellipse(x+sd*50*s+mirar*14*s,y-290*s,15*s,22*s*bl,0,0,TAU); ctx.fill(); } }
function sombrilla(x,t){ const G=SUELO; ctx.fillStyle='#FFFFFF'; rr(x-8,G-560,16,580,8); ctx.fill();
  ctx.save(); ctx.translate(x,G-560); ctx.rotate(Math.sin(t*1.5)*0.04); for(let i=0;i<6;i++){ ctx.fillStyle=i%2?'#FFFFFF':'#4CC9F0'; ctx.beginPath(); ctx.moveTo(0,-20); ctx.arc(0,60,250,Math.PI+i*Math.PI/6,Math.PI+(i+1)*Math.PI/6); ctx.closePath(); ctx.fill(); } ctx.restore(); }
function estrellasFondo(t,P,n=50){ for(let i=0;i<n;i++){ const x=rand(i)*1200-60, y=rand(i+7)*1900; ctx.globalAlpha=0.4+0.6*Math.abs(Math.sin(t*2+i)); estrella4(x,y,6+rand(i+2)*10,P.claro);} ctx.globalAlpha=1; }

// ---------- escena del cuadro 0 y del loop ----------
function playa(t,sc,kLetrero,final){
  const SX=800, SY=560;
  sombrilla(120,t);
  haz(SX,SY,450,1080,t,1,260);
  const flick=(t>=at(4)&&t<at(4)+0.4)? 0.5*Math.abs(Math.sin((t-at(4))*40)) : 0;
  sol(SX+Math.sin(t*30)*(flick?8:0),SY,150,t,flick);
  letrero('SOL: APAGADO',330,400,kLetrero,'madera',{tam:62,t,t0:final?at(213):-1});
  const b=final? {alto:0,sq:gelatina(t,sc.start+0.05),wob:0} : brinco(t,at(8),0.4,120);
  const expr= final? 'feliz' : (t<at(6)?'feliz':(t<at(8)?'orgullo':'risa'));
  raro({x:450,y:SUELO,s:1.3,t,expr,brazos: (!final&&t>=at(6)&&t<at(8))?'saluda':'jarras',disfraz:'playero',tilt:-0.06+Math.sin(t*2)*0.03,alto:b.alto,sq:b.sq,wob:b.wob,mira:final&&t>at(212)?{x:0,y:0}:undefined});
  chispas(t,at(4),SX,SY,1.6,'#FFE14D');
  if(!final) chispas(t,at(8)+0.4,450,SUELO-40,1.2);
}

// S1 — cuadro 0: Raro playero tomando el sol... con el Sol ya apagado (letrero desde el cuadro 0). Toma: push lento.
function S1(t,sc){ playa(t,sc,1,false); }
// S2 — cronómetro 8:00 corriendo; "¿por qué?" Raro mira a cámara (sospecha). Fondo limón cielo. Toma: push a la cara.
function S2(t,sc){
  sol(860,640,110,t,1);
  cronometro(t,at(12),540,420,popIn(t,at(12)),480);
  const fin=t>=at(14);
  raro({x:560,y:SUELO,s:1.35,t,expr:fin?'sospecha':'asombro',brazos:fin?'jarras':'cara',disfraz:'playero',mira:fin?{x:0,y:0}:undefined,sq:gelatina(t,sc.start+0.05)+gelatina(t,at(14),0.4),wob:wobble(t,at(14))});
  if(t<at(12)) signo(t,sc.start+0.1,250,820,'¡!');
  signo(t,at(14),830,880,'?'); signo(t,at(15),230,960,'?');
}
// S3 — espacio violeta: puf a astronauta; Raro viaja montado en un rayo de luz del Sol a la Tierra. Letrero 8 MIN 20 S.
function S3(t,sc){
  sol(140,980,170,t,1); tierra(930,1180,110,t);
  haz(140,980,930,1180,t,0.7,120);
  const p=pufCambio(t,sc.start+0.04), u=easeInOut(prog(t,sc.start+0.3,at(28)-sc.start-0.3));
  const x=lerp(330,800,u), y=lerp(1080,1120,u)-Math.sin(u*Math.PI)*120;
  lineasVelocidad(t,at(18),x,y-200,'#FFFFFF',0.5);
  raro({x,y,s:0.95,t,expr:t>=at(28)?'orgullo':'asombro',piernas:'flota',brazos:'arriba',disfraz:p.despues?'astronauta':'playero',spin:p.spin,tilt:0.25,viento:1,sinSombra:true,wob:wobble(t,at(28))});
  nubePuf(t,sc.start+0.1,330,1000,1.1);
  letrero('8 MIN 20 S',540,400,popIn(t,at(20)),'panel',{tam:92,t,t0:at(20)});
  ondaChoque(t,at(28),930,1180,'#FFFFFF');
}
// S4 — cielo cerros: el Sol de allá arriba es una "foto" de hace 8 minutos (marco que aparece). Puf a playero.
function S4(t,sc){
  const SX=820, SY=700;
  sol(SX,SY,120,t,1);
  const k=popIn(t,at(38)); if(k>0){ ctx.save(); ctx.translate(SX,SY); ctx.rotate(-0.08+wobble(t,at(38),0.15)); ctx.scale(k,k); ctx.fillStyle='#FFFFFF'; rr(-210,-210,420,500,18); ctx.fill(); ctx.save(); rr(-180,-180,360,360,10); ctx.clip(); ctx.fillStyle='#AEE6FF'; ctx.fillRect(-200,-200,400,400); ctx.restore(); ctx.restore(); sol(SX,SY-14*k,110*k,t,1); label('FOTO',SX,SY+232*k,46*k,'#5A3A12'); }
  letrero('HACE 8 MIN',540,390,popIn(t,at(39)),'pergamino',{tam:80,t,t0:at(39)});
  const p=pufCambio(t,sc.start+0.04);
  raro({x:380,y:SUELO,s:1.3,t,expr:t>=at(34)?'asombro':'neutral',brazos:t>=at(39)?'senala':'idle',disfraz:p.despues?'playero':'astronauta',spin:p.spin,mira:{x:0.7,y:-0.8},sq:gelatina(t,at(34),0.4),wob:wobble(t,at(39))});
  nubePuf(t,sc.start+0.1,380,SUELO-160,1.2);
}
// S5 — espacio magenta: la gravedad = liga lima entre Sol y Tierra; Raro colgado de la liga; un pulso viaja.
function S5(t,sc){
  sol(150,760,160,t,1); tierra(930,820,120,t);
  const pu=prog(t,at(44),0.9);
  cuerda(250,770,820,820,t,t>=at(44)&&pu<1?pu:-1,1);
  const x=560, y=1180+Math.sin(t*3)*16;
  raro({x,y,s:0.95,t,expr:t>=at(45)?'asombro':'feliz',piernas:'flota',brazos:'carga',disfraz:'playero',sinSombra:true,tilt:Math.sin(t*2.5)*0.08,wob:wobble(t,at(44))});
  letrero('MISMA VELOCIDAD',540,400,popIn(t,at(45)),'panel',{tam:64,t,t0:at(45)});
  chispas(t,at(44)+0.85,820,820,1.2,RARO.lima);
}
// S6 — cielo turquesa: Raro cae (salto) sobre una Tierra gigante y camina encima mientras gira "como si nada".
function S6(t,sc){
  const r=640; tierra(540,SUELO+r-40,r,t,0.9+ (t>=at(54)?0.8:0));
  const c=caida(t,sc.start);
  if(t>=at(54)){ ctx.save(); ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=16; ctx.lineCap='round'; const a0=t*2.2; ctx.globalAlpha=popIn(t,at(54));
    for(const s of [0,Math.PI]){ ctx.beginPath(); ctx.arc(540,SUELO+r-40,r+90,-Math.PI/2-0.6+s*0.0+Math.sin(a0)*0.05,-Math.PI/2-0.15); ctx.stroke(); } ctx.restore(); }
  const nada=t>=at(57);
  raro({x:540,y:SUELO-40,s:1.2,t,expr:nada?'orgullo':'feliz',piernas:c.alto>0?'quieto':'camina',brazos:nada?'jarras':'idle',disfraz:'playero',alto:c.alto,sq:c.sq,wob:c.wob});
  ondaChoque(t,sc.start+0.34,540,SUELO-40);
  if(t>=at(51)) letrero('TIERRA',540,420,popIn(t,at(51)),'madera',{tam:70,t,t0:at(51)});
}
// S7 — interior mandarina: puf a piyama, Raro se toma su café con calma (reloj de pared corriendo).
function S7(t,sc){
  const p=pufCambio(t,sc.start+0.05);
  cronometro(t,sc.start,540,400,1,40);
  const sorbo=t>=at(62);
  const x=600, s=1.3;
  raro({x,y:SUELO,s,t,expr:t>=at(64)?'risa':(sorbo?'orgullo':'feliz'),brazos:'frente',disfraz:p.despues?'piyama':'playero',spin:p.spin,sq:gelatina(t,at(64),0.4)});
  taza(x+10,SUELO-150*s-(sorbo?60:0),1.05,t,sorbo?-0.5:0);
  nubePuf(t,sc.start+0.1,x,SUELO-160,1.2);
  chispas(t,at(64),x+80,SUELO-380,1);
}
// S8 — ciudad violeta: ¡clic! todo negro; solo se ven los ojos de Raro.
function S8(t,sc){
  const on=t<at(68)?1:0;
