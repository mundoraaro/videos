<script>
// hoyonegro-001 — ¿Qué pasaría si cayeras en un hoyo negro? Raro astronauta → (puf) playero en la Tierra → (puf) astronauta (loop).
// ---------------- objetos reutilizados ----------------
function sudor(x,y,t,s=1){ for(let i=0;i<3;i++){ const u=((t*1.6+i/3)%1); ctx.save(); ctx.globalAlpha=1-u; ctx.translate(x+(i-1)*60*s,y+u*120*s); ctx.scale(s,s); ctx.fillStyle='#8FE3FF';
  ctx.beginPath(); ctx.moveTo(0,-26); ctx.quadraticCurveTo(18,0,0,12); ctx.quadraticCurveTo(-18,0,0,-26); ctx.fill(); ctx.restore(); } }
function tumbona(x,y,s){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.strokeStyle='#C98A52'; ctx.lineWidth=14; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-200,0); ctx.lineTo(-150,-90); ctx.moveTo(200,0); ctx.lineTo(150,-90); ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.moveTo(-240,-90); ctx.lineTo(140,-90); ctx.lineTo(260,-330); ctx.lineTo(210,-350); ctx.lineTo(100,-130); ctx.lineTo(-240,-130); ctx.closePath(); ctx.clip();
  for(let i=0;i<10;i++){ ctx.fillStyle=i%2?'#FFFFFF':'#4CC9F0'; ctx.fillRect(-260+i*60,-400,60,400); } ctx.restore(); ctx.restore(); }
function reloj(x,y,r,k,ang,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.rotate(Math.sin(t*4)*0.05); ctx.fillStyle='#FF5FA2'; blob(0,0,r+16); ctx.fillStyle='#FFFFFF'; blob(0,0,r);
  ctx.fillStyle='#1E1A2E'; for(let i=0;i<12;i++){ const a=i/12*Math.PI*2; blob(Math.cos(a)*r*0.8,Math.sin(a)*r*0.8,i%3?4:8); }
  ctx.strokeStyle='#1E1A2E'; ctx.lineCap='round'; ctx.lineWidth=12; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.sin(ang/12)*r*0.45,-Math.cos(ang/12)*r*0.45); ctx.stroke();
  ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.sin(ang)*r*0.7,-Math.cos(ang)*r*0.7); ctx.stroke(); blob(0,0,10); ctx.restore(); ocupa(x-r*k,y-r*k,x+r*k,y+r*k,1.5); }
function destello(x,y,r,t,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.rotate(t*2); estrella4(0,0,r*(1+0.2*Math.sin(t*9)),'#FFFFFF'); ctx.fillStyle='#BFF3FF'; blob(0,0,r*0.3); ctx.restore(); }
function estrellas(t,n=14,a=1){ for(let i=0;i<n;i++) destello(60+rand(i)*960,220+rand(i+9)*700,10+rand(i+3)*12,t+i,a); }
function planetaCara(x,y,r,t,k,o){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.rotate(o.rot||0); // Mercurio / Venus / Tierra / Urano con carita
  ctx.save(); ctx.shadowColor=o.brillo||'#FFFFFF'; ctx.shadowBlur=40; ctx.fillStyle=o.c1; blob(0,0,r); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.clip();
  if(o.tipo==='crater'){ ctx.fillStyle=o.c2; for(let i=0;i<7;i++) blob(-r*0.7+rand(i+1)*r*1.4,-r*0.7+rand(i+4)*r*1.4,r*(0.08+rand(i)*0.1)); }
  if(o.tipo==='nubes'){ ctx.fillStyle=o.c2; for(let i=0;i<4;i++){ ctx.beginPath(); ctx.ellipse(Math.sin(t+i)*r*0.2,-r*0.6+i*r*0.4,r*1.1,r*0.12,0,0,Math.PI*2); ctx.fill(); } }
  if(o.tipo==='tierra'){ ctx.fillStyle='#6CD66C'; blob(-r*0.35,-r*0.2,r*0.35); blob(r*0.4,r*0.3,r*0.3); blob(r*0.1,-r*0.6,r*0.2); }
  ctx.fillStyle='rgba(0,0,30,0.18)'; ctx.beginPath(); ctx.arc(r*0.35,r*0.1,r,0,Math.PI*2); ctx.arc(r*1.6,0,r*2,0,Math.PI*2,true); ctx.fill(); ctx.restore();
  if(o.anillo){ ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=r*0.08; ctx.beginPath(); ctx.ellipse(0,0,r*0.35,r*1.5,0,0,Math.PI*2); ctx.stroke(); }
  if(o.expr){ const e=o.expr; ctx.fillStyle='#1E1A2E'; const bl=parpadeo(t,(o.seed||1));
    for(const s of [-1,1]){ ctx.beginPath(); if(e==='orgullo'){ ctx.lineWidth=r*0.06; ctx.strokeStyle='#1E1A2E'; ctx.arc(s*r*0.3,-r*0.02,r*0.11,Math.PI+0.3,-0.3); ctx.stroke(); } else { ctx.ellipse(s*r*0.3,-r*0.08,r*0.08,r*0.12*bl+0.5,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#FFFFFF'; blob(s*r*0.3+r*0.03,-r*0.13,r*0.03); ctx.fillStyle='#1E1A2E'; } }
    ctx.fillStyle='#FF7A9C'; ctx.globalAlpha=0.8; for(const s of [-1,1]) blob(s*r*0.5,r*0.16,r*0.1); ctx.globalAlpha=1;
    ctx.fillStyle='#1E1A2E'; ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=r*0.05; ctx.beginPath();
    if(e==='feliz'||e==='orgullo'){ ctx.arc(0,r*0.15,r*0.15,0.2,Math.PI-0.2); ctx.stroke(); }
    else if(e==='llanto'){ ctx.arc(0,r*0.32,r*0.15,Math.PI+0.3,-0.3); ctx.stroke(); ctx.fillStyle='#8FE3FF'; for(const s of [-1,1]){ const u=(t*2+(s>0?0.5:0))%1; blob(s*r*0.32,r*0.05+u*r*0.8,r*0.06); } }
    else if(e==='asombro'){ ctx.ellipse(0,r*0.25,r*0.08,r*0.11,0,0,Math.PI*2); ctx.fill(); }
    else if(e==='frio'){ for(let i=0;i<5;i++){ ctx.lineTo(-r*0.2+i*r*0.1,r*0.22+(i%2?r*0.05:0)); } ctx.stroke(); } }
  if(o.corona){ ctx.fillStyle='#FFD23F'; ctx.beginPath(); ctx.moveTo(-r*0.4,-r*0.85); ctx.lineTo(-r*0.4,-r*1.25); ctx.lineTo(-r*0.2,-r*1.05); ctx.lineTo(0,-r*1.35); ctx.lineTo(r*0.2,-r*1.05); ctx.lineTo(r*0.4,-r*1.25); ctx.lineTo(r*0.4,-r*0.85); ctx.fill(); }
  ctx.restore(); ocupa(x-r*k,y-r*k,x+r*k,y+r*k,1.6); }
const MERC={c1:'#C9C2DA',c2:'#9C95B3',tipo:'crater'}, VENUS={c1:'#FFD27A',c2:'#FFB347',tipo:'nubes',brillo:'#FFE36A'}, TIERRA={c1:'#3AB6FF',tipo:'tierra',brillo:'#BFF3FF'}, URANO={c1:'#8FF0FF',c2:'#5FD8E8',tipo:'nubes',anillo:true,brillo:'#BFF3FF'};
function noche(a=0.4){ ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=a; ctx.fillStyle='#1B1A5E'; ctx.fillRect(0,0,1080,1920); ctx.restore(); }
function telescopio(x,y,s,a,t){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.strokeStyle='#7A4A22'; ctx.lineWidth=14; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,-220); ctx.lineTo(-110,0); ctx.moveTo(0,-220); ctx.lineTo(110,0); ctx.moveTo(0,-220); ctx.lineTo(0,0); ctx.stroke();
  ctx.translate(0,-230); ctx.rotate(a); ctx.fillStyle='#C98A52'; rr(-160,-34,330,68,30); ctx.fill(); ctx.fillStyle='#FFD23F'; rr(140,-46,46,92,16); ctx.fill(); rr(-60,-40,24,80,8); ctx.fill(); ctx.restore(); }
// ---------------- objetos del hoyo negro ----------------
const DISCO=['#FF5FA2','#FF8A3D','#FFD23F','#FFF1A8'];
function disco(x,y,r,t,mitad,tilt=-0.18){ // anillo de gas de dulce; mitad: -1 = de atrás (arriba), 1 = de enfrente (abajo)
  ctx.save(); ctx.translate(x,y); ctx.rotate(tilt); ctx.beginPath(); if(mitad<0) ctx.rect(-r*3,-r*3,r*6,r*3); else ctx.rect(-r*3,0,r*6,r*3); ctx.clip();
  for(let i=0;i<4;i++){ ctx.strokeStyle=DISCO[i]; ctx.lineWidth=r*0.16; ctx.beginPath(); ctx.ellipse(0,0,r*(2.15-i*0.22),r*(0.5-i*0.05),0,0,Math.PI*2); ctx.stroke(); }
  ctx.strokeStyle='rgba(255,255,255,0.75)'; ctx.lineWidth=r*0.05; ctx.lineCap='round'; ctx.setLineDash([r*0.25,r*0.5]); ctx.lineDashOffset=-t*r*2.2;
  ctx.beginPath(); ctx.ellipse(0,0,r*1.85,r*0.42,0,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]); ctx.restore(); }
function hoyo(x,y,r,t,k=1,o={}){ if(k<=0.01) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k);
  const pul=1+0.03*Math.sin(t*5)+(o.late||0);
  ctx.save(); ctx.globalAlpha=0.35; ctx.fillStyle='#FFE36A'; blob(0,0,r*1.55*pul); ctx.restore();
  if(o.disco!==false) disco(0,0,r,t,-1,o.tilt);
  ctx.save(); ctx.shadowColor='#FFF1A8'; ctx.shadowBlur=r*0.5; ctx.strokeStyle='#FFF7C2'; ctx.lineWidth=r*0.12; ctx.beginPath(); ctx.arc(0,0,r*1.04*pul,0,Math.PI*2); ctx.stroke(); ctx.restore();
  ctx.fillStyle='#17112E'; blob(0,0,r*pul);
  if(o.expr){ const e=o.expr, bl=parpadeo(t,o.seed||4); ctx.fillStyle='#FFFFFF';
    for(const s of [-1,1]){ ctx.beginPath(); if(e==='sueno'){ ctx.lineWidth=r*0.07; ctx.strokeStyle='#FFFFFF'; ctx.arc(s*r*0.32,-r*0.12,r*0.14,0.2,Math.PI-0.2); ctx.stroke(); }
      else { ctx.ellipse(s*r*0.32,-r*0.12,r*0.13,r*0.18*bl+0.5,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#17112E'; blob(s*r*0.32+r*0.03,-r*0.1,r*0.06); ctx.fillStyle='#FFFFFF'; }
      if(e==='enojo'){ ctx.save(); ctx.strokeStyle='#FF5FA2'; ctx.lineWidth=r*0.09; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(s*r*0.55,-r*0.45); ctx.lineTo(s*r*0.14,-r*0.3); ctx.stroke(); ctx.restore(); } }
    ctx.strokeStyle='#FFFFFF'; ctx.fillStyle='#FF5FA2'; ctx.lineWidth=r*0.07; ctx.lineCap='round'; ctx.beginPath();
    if(e==='hambre'){ ctx.ellipse(0,r*0.35,r*0.28,r*0.2+Math.sin(t*10)*r*0.04,0,0,Math.PI*2); ctx.fill(); }
    else if(e==='enojo'){ ctx.arc(0,r*0.48,r*0.2,Math.PI+0.4,-0.4); ctx.stroke(); }
    else { ctx.arc(0,r*0.2,r*0.18,0.3,Math.PI-0.3); ctx.stroke(); } }
  if(o.disco!==false) disco(0,0,r,t,1,o.tilt);
  ctx.restore(); ocupa(x-r*2.1*k,y-r*1.1*k,x+r*2.1*k,y+r*1.1*k,1.4); }
function orilla(x,y,r,t,k=1,col='#D7FF3D'){ if(k<=0) return; ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=10; ctx.globalAlpha=0.9*k; ctx.setLineDash([26,22]); ctx.lineDashOffset=t*60;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]); ctx.restore(); }
function fideo(o,k,ang=0){ // Raro estirado como chicle (k 0..1.4) en dirección ang; siempre dibujado con raro()
  const s=o.s??1, cx=o.x, cy=o.y-(o.alto||0)-190*s; ctx.save(); ctx.translate(cx,cy); ctx.rotate(ang);
  const w=Math.sin(o.t*9)*0.04*k; ctx.scale(Math.max(0.3,1-0.5*k)+w,1+1.9*k-w); ctx.rotate(-ang); ctx.translate(-cx,-cy);
  raro({...o,sinSombra:true}); ctx.restore();
  if(k>0.15){ ctx.save(); ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=6; ctx.lineCap='round'; for(let i=0;i<5;i++){ const dx=(i-2)*70*s, L=(120+rand(i)*120)*k*s, ph=((o.t*2+rand(i+3))%1);
    ctx.globalAlpha=Math.sin(ph*Math.PI)*0.8; ctx.beginPath(); ctx.moveTo(cx+dx,cy-200*s*k-ph*80); ctx.lineTo(cx+dx,cy-200*s*k-ph*80-L); ctx.stroke(); } ctx.restore(); } }
function flecha(x,y,len,ang,col,k,grosor=26){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.scale(k,k); ctx.fillStyle=col; rr(0,-grosor/2,len,grosor,grosor/2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(len+grosor*1.6,0); ctx.lineTo(len-grosor*0.4,-grosor*1.3); ctx.lineTo(len-grosor*0.4,grosor*1.3); ctx.fill(); ctx.restore(); }
function espaguetis(x,y,k,t,s=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k*s,k*s); ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.ellipse(0,0,170,46,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#E9E4F5'; ctx.beginPath(); ctx.ellipse(0,-4,120,30,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#FFD23F'; ctx.lineWidth=12; ctx.lineCap='round'; for(let i=0;i<9;i++){ ctx.beginPath(); for(let j=0;j<=10;j++){ const xx=-110+j*22, yy=-20-Math.sin(j*0.9+i*1.7+t*3)*22-i*5; j?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);} ctx.stroke(); }
  ctx.fillStyle='#FF4D5E'; blob(-10,-62,46); blob(30,-50,30); ctx.fillStyle='#A0522D'; blob(-30,-70,24); blob(26,-74,22); ctx.fillStyle='#6CD66C'; blob(4,-98,12);
  ctx.restore(); ocupa(x-170*k*s,y-120*k*s,x+170*k*s,y+46*k*s,1.2); }
function quesillo(x,y,k,t,tira=0){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.rotate(Math.sin(t*2)*0.05);
  ctx.fillStyle='#FFF4DC'; blob(0,0,130); ctx.strokeStyle='#E8D9B8'; ctx.lineWidth=14; ctx.lineCap='round';
  for(let i=0;i<6;i++){ ctx.beginPath(); ctx.ellipse(0,0,120-i*6,40+i*12,i*0.55,0,Math.PI*2); ctx.stroke(); }
  ctx.fillStyle='#FFFFFF'; blob(-50,-60,24);
  if(tira>0){ ctx.strokeStyle='#FFF4DC'; ctx.lineWidth=22; ctx.beginPath(); ctx.moveTo(90,-60); ctx.quadraticCurveTo(160+tira*60,-140-tira*80+Math.sin(t*6)*20,200+tira*160,-260-tira*120); ctx.stroke(); }
  ctx.restore(); ocupa(x-130*k,y-130*k,x+130*k,y+130*k,1.3); }
function monitor(x,y,k,t,juega){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.fillStyle='#B8B2CC'; rr(-30,0,60,120,10); ctx.fill(); rr(-120,110,240,30,15); ctx.fill();
  ctx.fillStyle='#FFFFFF'; rr(-260,-330,520,340,40); ctx.fill(); ctx.fillStyle='#2A1F5C'; rr(-230,-300,460,280,24); ctx.fill();
  ctx.save(); ctx.beginPath(); rr(-230,-300,460,280,24); ctx.clip(); if(juega){ ctx.translate(0,-160); ctx.scale(1+0.3*Math.sin(t*2),1+0.3*Math.sin(t*2)); hoyo(0,0,48,t,1,{}); }
  else { ctx.fillStyle='#4CC9F0'; ctx.font=fuente(40); ctx.textAlign='center'; ctx.fillText('...',0,-150); } ctx.restore(); ctx.restore(); ocupa(x-260*k,y-330*k,x+260*k,y+140*k,1.2); }
function nave(x,y,s,t,dentro){ ctx.save(); ctx.translate(x,y+Math.sin(t*2.2)*14); ctx.scale(s,s); ctx.rotate(Math.sin(t*1.7)*0.05);
  ctx.fillStyle='#FF8A3D'; ctx.beginPath(); ctx.moveTo(-60,140); ctx.quadraticCurveTo(0,240+Math.sin(t*30)*20,60,140); ctx.fill();
  ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.ellipse(0,40,300,120,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#D9D4E8'; ctx.beginPath(); ctx.ellipse(0,80,300,70,0,0,Math.PI); ctx.fill();
  for(let i=0;i<5;i++){ ctx.fillStyle=i%2?'#FF5FA2':'#FFD23F'; blob(-200+i*100,100,16*(0.8+0.2*Math.sin(t*8+i))); }
  ctx.save(); ctx.beginPath(); ctx.arc(0,-20,170,Math.PI,0); ctx.closePath(); ctx.clip(); ctx.fillStyle='rgba(190,235,255,0.35)'; ctx.fillRect(-180,-200,360,190); if(dentro) dentro(); ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=12; ctx.beginPath(); ctx.arc(0,-20,170,Math.PI,0); ctx.stroke(); ctx.restore(); ocupa(x-300*s,y-200*s,x+300*s,y+160*s,1); }
function binoculares(x,y,s,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); ctx.fillStyle='#1E1A2E'; rr(-80,-36,70,72,24); ctx.fill(); rr(10,-36,70,72,24); ctx.fill(); ctx.fillRect(-14,-14,28,20);
  ctx.fillStyle='#4CC9F0'; blob(-45,0,22); blob(45,0,22); ctx.fillStyle='rgba(255,255,255,0.7)'; blob(-52,-8,7); blob(38,-8,7); ctx.restore(); }
function polaroid(x,y,w,h,k,t,dentro,ang=0){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(ang+Math.sin(t*2)*0.02); ctx.scale(k,k);
  ctx.fillStyle='rgba(0,0,0,0.18)'; rr(-w/2+10,-h/2+14,w,h+70,16); ctx.fill(); ctx.fillStyle='#FFFFFF'; rr(-w/2,-h/2,w,h+70,16); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.rect(-w/2+24,-h/2+24,w-48,h-48); ctx.clip(); dentro(); ctx.restore(); ctx.restore(); ocupa(x-w/2*k,y-h/2*k,x+w/2*k,y+(h/2+70)*k,1.5); }
function tinteRojo(x,y,r,a){ if(a<=0) return; ctx.save(); ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=a; ctx.fillStyle='#FF6A6A'; blob(x,y,r); ctx.restore(); }
function estrellasFijas(t,n=16){ for(let i=0;i<n;i++){ ctx.fillStyle='rgba(255,255,255,'+(0.5+0.5*Math.sin(t*3+i))+')'; blob(40+rand(i+20)*1000,240+rand(i+40)*1100,4+rand(i)*6); } }
function rayoLuz(x0,y0,cx,cy,u,t){ if(u<=0) return; ctx.save(); ctx.strokeStyle='#FFF7C2'; ctx.shadowColor='#FFF7C2'; ctx.shadowBlur=30; ctx.lineWidth=22; ctx.lineCap='round';
  const N=40, M=Math.floor(N*clamp(u)); ctx.beginPath(); for(let i=0;i<=M;i++){ const v=i/N; const px=lerp(x0,x0+520,v)-Math.pow(v,2)*(520+x0-cx)*1.9*v, py=lerp(y0,y0-420,v)+Math.pow(v,3)*(cy-y0+420)*1.4; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  ctx.stroke(); ctx.restore(); }

// ---------------- escenas ----------------
// Storyboard por escena en el comentario de cada S#: acción de Raro · fondo · toma · eventos por palabra.
function hookMundo(t){ estrellasFijas(t,18); hoyo(760,760,150,t,1,{expr:'hambre'}); }
function S1(t,sc){ // HOOK: Raro astronauta ya se está estirando como chicle hacia un hoyo negro hambriento; letrero HOYO NEGRO desde el cuadro 0 → ¡CHICLE! en 8 · violeta/espacio · push
  hookMundo(t);
  const k=0.35+0.15*Math.sin(t*3)+0.45*easeOut(prog(t,at(7),0.4));
  fideo({x:400,y:1480,s:0.9,t,expr:t>at(8)?'yavalio':'terror',disfraz:'astronauta',brazos:'arriba',piernas:'flota',tilt:0.35,viento:1,mira:{x:1,y:-1},sq:gelatina(t,at(4),0.2)},k,0.55);
  letrero(t>=at(8)?'¡CHICLE!':'HOYO NEGRO',540,400,t>=at(8)?popIn(t,at(8)):1,'panel',{tam:84,t,t0:t>=at(8)?at(8):at(4)});
}
function S2(t,sc){ // NO ES BROMA: Raro cae (boing) aún estirado y se encoge con gelatina; mira a cámara con sospecha (12); 14 científica gomita pop con pizarrón; 17 letrero ESPAGUETIFICACIÓN + plato de espaguetis · magenta/interior · push
  const c=caida(t,sc.start,1300,0.3), enc=1-easeOut(prog(t,sc.start+0.3,0.5));
  fideo({x:330,y:SUELO,s:0.95,t,expr:t>at(17)?'asombro':'sospecha',disfraz:'astronauta',brazos:t>at(17)?'arriba':'jarras',mira:t>at(14)?{x:1,y:-0.5}:{x:0,y:0},sq:c.sq+gelatina(t,at(12),0.25),alto:c.alto,wob:c.wob},0.6*enc,0);
  const kg=popIn(t,at(14)); if(kg>0) gomita({x:800,y:SUELO,s:0.8*kg,t,expr:'orgullo',brazos:'senala',espejo:true,disfraz:'cientifico',seed:1,sq:gelatina(t,at(14),0.3)});
  espaguetis(560,1180,popIn(t,at(17)+0.05),t,0.9);
