<script>
// tardigrado-001 — El animal que sobrevivió al espacio sin traje (fórmula: afirmación bizarra / animal insólito, en 2ª persona)
// Disfraces: piyama en el espacio (tú sin traje) → osito de agua (tardígrado) → piyama en el espacio (loop).
// Encuadre: Raro siempre completo dentro de x≈20–940; letreros en y 380–520 (helper L); verificador CHECK en coordenadas de pantalla.
const PI2=Math.PI*2;
window.HIDE_CAPTIONS_LAST=false;
window.CAPTION_POP_MIN=0.85;

// ---------- verificador de encuadre (cajas en pantalla) ----------
window.CHECK=[];
const _raro=raro;
raro=function(o){ const s=o.s??1, m=ctx.getTransform(), alto=o.alto||0; const der=(o.brazos==='senala'||o.brazos==='saluda')?320:215, izq=215;
  const ex=(o.disfraz==='tardigrado'&&!(o.bolita>0.5))?255:0; let x0=-Math.max(izq,ex)*s, x1=Math.max(der,ex)*s; if(o.espejo){ const a=-x1; x1=-x0; x0=a; }
  const pts=[[o.x+x0,o.y-alto-470*s],[o.x+x1,o.y-alto-470*s],[o.x+x0,o.y-alto],[o.x+x1,o.y-alto]].map(([x,y])=>[m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f]);
  CHECK.push([o.color?'npc':'raro',Math.min(...pts.map(p=>p[0])),Math.min(...pts.map(p=>p[1])),Math.max(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[1]))]);
  return _raro(o); };
const _osito=osito; osito=function(o){ const s=o.s||1, d=o.dir||1; const a=d>0?-170*s:-245*s, b=d>0?245*s:170*s; chk('npc',o.x+a,o.y-(o.alto||0)-190*s,o.x+b,o.y-(o.alto||0)); return _osito(o); };
function chk(tag,x0,y0,x1,y1){ const m=ctx.getTransform(); const P=[[x0,y0],[x1,y0],[x0,y1],[x1,y1]].map(([x,y])=>[m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f]);
  CHECK.push([tag,Math.min(...P.map(p=>p[0])),Math.min(...P.map(p=>p[1])),Math.max(...P.map(p=>p[0])),Math.max(...P.map(p=>p[1]))]); }

// ---------- utilería ----------
let CUR=1;
// Letrero en coordenadas de PANTALLA, compensando el zoom de la toma (soplar-001-v2).
function L(txt,x,y,k,tipo='madera',opts={}){ const TM=(window.TOMAS||{})[CUR]||{}, Z=Math.max(1,TM.z||1), F=TM.foco||[540,960];
  let tam=(opts.tam||72)/Z; ctx.font=fuente(tam); let w=ctx.measureText(txt).width+tam*1.2; const maxW=640/Z;
  if(w>maxW){ tam*=maxW/w; w=maxW; } const sw=w*Z; x=clamp(x,180+sw/2,900-sw/2); y=clamp(y,390,520);
  const X=F[0]+(x-540)/Z, Y=F[1]+(y-960)/Z;
  letrero(txt,X,Y,k,tipo,{sinPalo:!opts.palo,...opts,tam}); if(k>0.5) chk('letrero',X-w/2,Y-tam*0.85,X+w/2,Y+tam*0.85); }
function tierra(x,y,r,t){ ctx.save(); ctx.translate(x,y);
  const g=ctx.createRadialGradient(0,0,r*0.9,0,0,r*1.18); g.addColorStop(0,'rgba(140,220,255,0.6)'); g.addColorStop(1,'rgba(140,220,255,0)'); ctx.fillStyle=g; blob(0,0,r*1.18);
  ctx.fillStyle='#3AB6FF'; blob(0,0,r); ctx.save(); ctx.beginPath(); ctx.arc(0,0,r,0,PI2); ctx.clip(); ctx.rotate(t*0.05);
  ctx.fillStyle='#4CD98B'; for(const [a,b,c] of [[-0.4,-0.3,0.42],[0.35,0.15,0.34],[-0.2,0.5,0.28],[0.55,-0.5,0.22]]) blob(a*r,b*r,c*r);
  ctx.fillStyle='rgba(255,255,255,0.8)'; for(let i=0;i<5;i++){ ctx.beginPath(); ctx.ellipse((rand(i)-0.5)*1.6*r,(rand(i+3)-0.5)*1.6*r,r*0.3,r*0.06,0.3,0,PI2); ctx.fill(); }
  ctx.restore(); ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.ellipse(-r*0.4,-r*0.45,r*0.25,r*0.12,-0.6,0,PI2); ctx.fill(); ctx.restore(); }

  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,PI2); ctx.clip(); ctx.fillStyle='#46CF84'; blob(cx-420,1640,260); blob(cx+380,1700,320); blob(cx+40,1880,200);

  ctx.fillStyle=mix(P.claro,P.medio,0.35); ctx.fillRect(-300,G-20,1680,900);
  ctx.fillStyle=mix(P.medio,P.claro,0.3); for(const [x,y,r] of [[120,G+90,70],[640,G+60,46],[900,G+260,90],[330,G+330,60],[760,G+420,40]]){ ctx.beginPath(); ctx.ellipse(x+px(1),y,r*1.6,r*0.5,0,0,PI2); ctx.fill(); }
  ctx.fillStyle=mix(P.claro,'#FFFFFF',0.5); for(const [x,y,r] of [[120,G+82,70],[640,G+54,46],[900,G+250,90],[330,G+322,60],[760,G+414,40]]){ ctx.beginPath(); ctx.ellipse(x+px(1),y-r*0.25,r*1.6,r*0.18,0,Math.PI,0); ctx.fill(); } };

  ctx.fillStyle=P.oscuro; for(const y of [520,760]){ rr(40+px(0.5),y,360,24,10); ctx.fill(); }
  for(let i=0;i<6;i++){ const x=70+px(0.5)+(i%3)*110, y=(i<3?520:760); ctx.fillStyle=PASTELES[i%PASTELES.length]; rr(x,y-110,60,110,24); ctx.fill(); ctx.fillStyle='rgba(255,255,255,0.6)'; rr(x+10,y-96,12,60,6); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.7)'; const u=((t*0.8+i*0.3)%1); blob(x+30,y-120-u*60,8*(1-u)+2); }
  ctx.fillStyle=mix(P.oscuro,P.medio,0.3); ctx.fillRect(-300,G-20,1680,900); ctx.fillStyle=mix(P.oscuro,'#000000',0.12); ctx.fillRect(-300,G-20,1680,26); };
EXTRA_FONDOS.musgo=function(t,P,px){ const G=window.SUELO_Y||SUELO;
  const fronda=(x,h,c,d,ph)=>{ ctx.strokeStyle=c; ctx.lineCap='round'; ctx.lineWidth=26*d; ctx.beginPath(); ctx.moveTo(x+px(d),G+300); const pts=[];

  ctx.fillStyle='#C9C3E0'; rr(-26,-r-50,52,40,10); ctx.fill(); ctx.fillStyle='#FFFFFF'; blob(0,0,r+14); ctx.fillStyle=rojo?'#FF4D5E':'#3AB6FF'; blob(0,0,r); ctx.fillStyle='#FFFFFF'; blob(0,0,r-16);

  ctx.fillStyle='#8E8AA3'; for(const xx of [-60,60]){ rr(xx-10,-160,20,50,10); ctx.fill(); }
  const fl=((t-t0)*8)%1; if(t>t0 && t<t0+d){ ctx.save(); ctx.transform(1,0,0,1-fl,0,0); ctx.fillStyle='#F3EEFF'; rr(-110,-60,220,190,14); ctx.fill(); ctx.restore(); }
  ctx.fillStyle='#1E1A2E'; ctx.font=fuente(110); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(contador(t,t0,d,0,hasta),0,30);
  ctx.font=fuente(40); ctx.fillStyle='#FFFFFF'; ctx.fillText(txt,0,-104); ctx.restore(); }

function reglaMM(x0,x1,y,k,t){ if(k<=0) return; ctx.save(); ctx.globalAlpha=clamp(k); ctx.fillStyle='#FFD23F'; rr(x0,y-50,x1-x0,100,16); ctx.fill(); ctx.fillStyle='#E0A800'; rr(x0,y+30,x1-x0,20,8); ctx.fill();
  ctx.strokeStyle='#7A5A0A'; ctx.lineWidth=5; for(let i=0;i<=20;i++){ const xx=x0+30+i*(x1-x0-60)/20; ctx.beginPath(); ctx.moveTo(xx,y-50); ctx.lineTo(xx,y-50+(i%10===0?50:i%5===0?34:20)); ctx.stroke(); }
  ctx.fillStyle='#5A3A0A'; ctx.font=fuente(40); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('0',x0+30,y+16); ctx.fillText('0.5',(x0+x1)/2,y+16); ctx.fillText('1 mm',x1-60,y+16); ctx.restore(); chk('obj',x0,y-50,x1,y+50); }
function azucar(x,y,a,k,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(t*1.5)*0.05); ctx.scale(k,k); ocupa(-a,-a*1.1,a,a*0.2,1.1);
  ctx.fillStyle='#E9F7FF'; ctx.beginPath(); ctx.moveTo(-a,-a*0.2); ctx.lineTo(-a*0.3,-a*1.0); ctx.lineTo(a*0.8,-a*0.7); ctx.lineTo(a,a*0.1); ctx.lineTo(a*0.2,a*0.2); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#C8E8FA'; ctx.beginPath(); ctx.moveTo(a*0.2,a*0.2); ctx.lineTo(a,a*0.1); ctx.lineTo(a*0.8,-a*0.7); ctx.lineTo(a*0.1,-a*0.4); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#FFFFFF'; ctx.globalAlpha=0.9; for(let i=0;i<4;i++) estrella4(-a*0.4+i*a*0.35,-a*0.6+((i*37)%40),10+6*Math.abs(Math.sin(t*3+i)),'#FFFFFF'); ctx.restore(); chk('obj',x-a*k,y-a*k,x+a*k,y+a*0.2*k); }

  if(o.para){ ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=4; for(const xx of [-200,-80,80,200]){ ctx.beginPath(); ctx.moveTo(0,-200); ctx.lineTo(xx*1.4,-560); ctx.stroke(); }
    ctx.fillStyle='#FF8A3D'; ctx.beginPath(); ctx.ellipse(0,-570,320,150,0,Math.PI,0); ctx.fill(); ctx.fillStyle='#FFFFFF'; for(const xx of [-160,0,160]){ ctx.beginPath(); ctx.moveTo(xx-55,-570); ctx.quadraticCurveTo(xx,-700+Math.abs(xx)*0.4,xx+55,-570); ctx.fill(); } }
  ctx.fillStyle='#BFB8D8'; blob(0,0,200); ctx.fillStyle='#E3DDF2'; blob(-20,-20,180); ctx.fillStyle='#8E86B0'; for(let i=0;i<8;i++){ const a=i/8*PI2; blob(Math.cos(a)*150,Math.sin(a)*150,10); }
  ctx.fillStyle='#3AB6FF'; blob(0,-40,60); ctx.fillStyle='#AEE6FF'; blob(-16,-56,22);

function gotas(t,t0,x,y,n=12,dir=1){ if(t<t0) return; ctx.save(); for(let i=0;i<n;i++){ const u=((t-t0)*1.5+rand(i))%1, a=-Math.PI/2+(rand(i+2)-0.5)*2.4; const d=u*260;
  const xx=x+Math.cos(a)*d*dir, yy=y+Math.sin(a)*d+u*u*240; ctx.globalAlpha=1-u; ctx.fillStyle='#7FD8FF'; ctx.beginPath(); ctx.moveTo(xx,yy-16); ctx.quadraticCurveTo(xx+11,yy,xx,yy+8); ctx.quadraticCurveTo(xx-11,yy,xx,yy-16); ctx.fill(); } ctx.restore(); }
