<script>
// torre-001 — "Si nos apilamos todos, llegamos a la Luna… y nos sobra torre." Raro de ingeniero (gorra) dirige la torre humana y va hasta arriba.
const PI=Math.PI;
// ---------- helpers ----------
const PAST=['#FFB8D2','#B8E6FF','#FFE3A3','#C9F2B8','#D9C2FF','#FFC9A8'];
// torre de gomitas: n personas desde yBase hacia arriba; devuelve la punta [x,y] (pies del de hasta arriba)
function torre(x,yBase,n,s,t,o={}){ const h=376*s*0.84; let tx=x, ty=yBase;
  for(let i=0;i<n;i++){ const y=yBase-i*h, dx=Math.sin(t*1.6+(o.ph||0))*Math.pow(i,1.2)*(o.sway??1.4);
    if(y<-300){ ty=y; tx=x+dx; continue; } if(y>2200){ continue; }
    const col=o.cols? o.cols[i%o.cols.length] : PAST[(i*7+(o.seed||0))%6];
    gomita({x:x+dx,y,s,t,seed:i+(o.seed||0),color:col,expr:o.expr? o.expr(i):(i%3===0?'feliz':(i%3===1?'asombro':'yavalio')),brazos:'carga',npc_peso:0.15,sinSombra:i>0,sq:o.sq?o.sq(i):0});
    tx=x+dx; ty=y-h; }
  if(typeof ocupa==='function') ocupa(x-70*s*3,ty,x+70*s*3,yBase,0.6);
  return [tx,ty]; }
function luna(x,y,r,t){ ctx.save(); ctx.translate(x,y); ctx.rotate(t*0.05); const g=ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.1,0,0,r); g.addColorStop(0,'#FFFBEA'); g.addColorStop(1,'#E8DDB8');
  ctx.fillStyle='rgba(255,250,220,0.25)'; blob(0,0,r*1.25); ctx.fillStyle=g; blob(0,0,r);
  ctx.fillStyle='#D9CC9E'; for(const [a,b,c] of [[-0.35,-0.2,0.22],[0.3,0.25,0.16],[0.1,-0.45,0.1],[-0.2,0.4,0.12]]) blob(a*r,b*r,c*r); ctx.restore();
  if(typeof ocupa==='function') ocupa(x-r,y-r,x+r,y+r,1.5); }
function tierra(x,y,r,t){ ctx.save(); ctx.translate(x,y); ctx.fillStyle='rgba(120,200,255,0.3)'; blob(0,0,r*1.12); ctx.fillStyle='#3AB6FF'; blob(0,0,r);
  ctx.save(); ctx.beginPath(); ctx.arc(0,0,r,0,PI*2); ctx.clip(); ctx.fillStyle='#7FD34E'; const o=(t*20)%(r*4);
  for(const [a,b,c] of [[-0.5,-0.3,0.4],[0.4,0.2,0.35],[-0.1,0.55,0.25],[0.7,-0.5,0.2]]){ blob(a*r+o-r*2,b*r,c*r); blob(a*r+o+r*2,b*r,c*r); blob(a*r+o,b*r,c*r);} ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.ellipse(-r*0.4,-r*0.45,r*0.25,r*0.1,-0.5,0,PI*2); ctx.fill(); ctx.restore(); }
function plaza(t){ const P=PAL_ACTUAL; ctx.fillStyle=mix(P.oscuro,'#FFFFFF',0.15); ctx.beginPath(); ctx.ellipse(540,SUELO+10,520,60,0,0,PI*2); ctx.fill(); }
function multitud(t,lt,y,n=8,s=0.3){ for(let i=0;i<n;i++){ const x=i<n/2? 70+i*95 : 1010-(i-n/2)*95; const ph=((lt*1.6+rand(i)*0.9)%0.9);
  const alto=ph<0.45? Math.sin(ph/0.45*PI)*90 : 0; gomita({x,y:y+(i%2)*30,s,t,seed:i+20,color:PAST[i%6],expr:i%2?'feliz':'asombro',brazos:'arriba',alto,npc_peso:0.2}); } }
function rascacielos(x,yBase,h,t){ const P=PAL_ACTUAL; const w=170; ctx.fillStyle=mix(P.oscuro,'#1E1A2E',0.15);
  rr(x-w/2,yBase-h,w,h,16); ctx.fill(); rr(x-w/2+20,yBase-h-60,w-40,70,12); ctx.fill(); rr(x-w/2+44,yBase-h-110,w-88,60,10); ctx.fill();
  ctx.fillRect(x-4,yBase-h-260,8,160); ctx.fillStyle='#FF5FA2'; blob(x,yBase-h-262,10+3*Math.sin(t*6));
  ctx.fillStyle=mix(P.claro,'#FFFFFF',0.4); for(let yy=yBase-h+20; yy<yBase-20; yy+=34) for(let k=0;k<4;k++){ if(rand(yy*0.1+k)>0.25) { rr(x-w/2+18+k*36,yy,22,20,5); ctx.fill(); } }
  if(typeof ocupa==='function') ocupa(x-w/2,yBase-h-260,x+w/2,yBase,0.8); }
function avion(x,y,s,t,dir=-1){ ctx.save(); ctx.translate(x,y); ctx.scale(s*dir,s); ctx.rotate(Math.sin(t*3)*0.02);
  ctx.fillStyle='#FFFFFF'; rr(-260,-46,520,92,46); ctx.fill(); ctx.fillStyle='#E9E6F5'; ctx.beginPath(); ctx.moveTo(-40,10); ctx.lineTo(80,10); ctx.lineTo(-60,150); ctx.lineTo(-120,150); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-190,-30); ctx.lineTo(-250,-150); ctx.lineTo(-200,-150); ctx.lineTo(-140,-30); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#4CC9F0'; for(let i=0;i<7;i++) blob(-150+i*48,-10,13); ctx.fillStyle='#1E1A2E'; ctx.beginPath(); ctx.ellipse(225,-14,28,18,0,0,PI*2); ctx.fill();
  ctx.fillStyle='#FF5FA2'; ctx.fillRect(-260,14,520,10); ctx.restore(); }
function hielo(t,t0,x,y,s=1){ const k=easeOut(prog(t,t0,0.3)); if(k<=0) return; ctx.save(); ctx.globalAlpha=0.55*k; ctx.fillStyle='#BFF4FF'; ctx.beginPath(); ctx.ellipse(x,y,200*s,240*s,0,0,PI*2); ctx.fill();
  ctx.globalAlpha=0.9*k; ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=6; for(let i=0;i<6;i++){ const a=i/6*PI*2; const cx=x+Math.cos(a)*210*s, cy=y+Math.sin(a)*250*s; for(let j=0;j<3;j++){ const b=j/3*PI; ctx.beginPath(); ctx.moveTo(cx-Math.cos(b)*22,cy-Math.sin(b)*22); ctx.lineTo(cx+Math.cos(b)*22,cy+Math.sin(b)*22); ctx.stroke(); } } ctx.restore(); }
function estrellasFondo(t,n=40){ for(let i=0;i<n;i++){ ctx.globalAlpha=0.4+0.6*Math.abs(Math.sin(t*2+i)); estrella4(rand(i)*1080,rand(i+50)*1900,5+rand(i+9)*9,'#FFFFFF'); } ctx.globalAlpha=1; }
function cinta(x,y0,y1,k){ if(k<=0) return; const yy=lerp(y0,y1,k); ctx.fillStyle='#FFD23F'; rr(x-18,yy,36,y0-yy,8); ctx.fill(); ctx.fillStyle='#1E1A2E';
  for(let y=y0;y>yy;y-=24){ ctx.fillRect(x-18,y,(Math.round((y0-y)/24)%5===0)?24:12,4); } }
function sudor(t,x,y){ ctx.fillStyle='#7FD8FF'; for(let i=0;i<3;i++){ const u=((t*1.5+i/3)%1); ctx.globalAlpha=1-u; ctx.beginPath(); ctx.ellipse(x+(i-1)*40,y+u*80,8,12,0,0,PI*2); ctx.fill(); } ctx.globalAlpha=1; }

// ========== ESCENAS ==========
// S1 (0–2.9) GANCHO: plaza en la ciudad (cielo). Torre de gomitas que sube hasta Raro (ingeniero), que estira los brazos hacia la Luna; la multitud brinca para treparse.
// Letrero "¡TODOS ARRIBA!" desde el cuadro 0. Toma: sube.
function escenaTorre(t,lt){ plaza(t); multitud(t,lt,SUELO,8,0.3);
  const sw=Math.sin(t*1.6)*0.06; const tip=torre(540,SUELO,8,0.2,t,{sway:1.6});
  luna(830,720,105,t);
  raro({x:tip[0],y:tip[1]+6,s:0.72,t,expr:'asombro',brazos:'arriba',disfraz:'ingeniero',tilt:sw,manos:{d:[260,-420],i:[-150,-380]},wob:wobble(t,at(7),1)});
  return tip; }
function S1(t,sc){ escenaTorre(t,t-sc.start); letrero('¡TODOS ARRIBA!',540,410,1,'pergamino',{tam:76,t,t0:-1}); chispas(t,at(7),800,740,1.3); }
// S2 (2.9–4.0) "y nos sobra torre." Espacio violeta: la torre atraviesa junto a la Luna y sigue para arriba; Raro, asombrado, saluda desde más arriba.
function S2(t,sc){ luna(540,1250,260,t);
  const tip=torre(250,2000,17,0.22,t,{sway:0.6,seed:3}); raro({x:tip[0],y:tip[1]+6,s:0.6,t,expr:'risa',brazos:'saluda',disfraz:'ingeniero'});
  letrero('¡Y SOBRA TORRE!',540,420,popIn(t,at(10)),'panel',{tam:72,t,t0:at(10)}); lineasVelocidad(t,sc.start+0.05,540,1250,'#FFFFFF',0.35); }
// S3 (4–7.6) "Imagínate: 8,200 millones de personas," Liso limón: gomitas en cascada llenan la pantalla; contador 8,200,000,000. Raro señala.
function S3(t,sc){ ctx.fillStyle=mix(PAL_ACTUAL.medio,PAL_ACTUAL.oscuro,0.25); ctx.fillRect(-300,SUELO-10,1680,900);
  cascada(t,at(13),24,(x,y,k,i)=>gomita({x,y,s:0.26*k,t,seed:i,color:PAST[i%6],expr:i%2?'feliz':'asombro',brazos:i%3?'arriba':'saluda',npc_peso:0.1}),{x0:130,y0:830,cols:6,dx:165,dy:130,cada:0.04});
  raro({x:540,y:SUELO,s:0.95,t,expr:t>=at(16)?'asombro':'orgullo',brazos:'senala',disfraz:'ingeniero',sq:gelatina(t,at(13))});
  letrero(t>=at(13)? contador(t,at(13),1.2,0,8200000000):'IMAGÍNATE',540,420,popIn(t,sc.start+0.05),'panel',{tam:64,t,t0:t>=at(13)?at(13):sc.start}); }
// S4 (7.6–10.1) "de pie, una encima de otra." Cerros turquesa: gomitas caen una sobre otra con click; Raro las acomoda.
function S4(t,sc){ const n=Math.floor(clamp((t-sc.start)/0.32,0,7)); const h=376*0.32*0.84;
  for(let i=0;i<=n && i<7;i++){ const t0=sc.start+i*0.32; const c=caida(t,t0,900,0.25); gomita({x:620+Math.sin(t*2)*i*3,y:SUELO-i*h-c.alto,s:0.32,t,seed:i,color:PAST[i%6],expr:'feliz',brazos:'carga',sq:c.sq,sinSombra:i>0,npc_peso:0.3}); }
  raro({x:300,y:SUELO,s:0.95,t,expr:'feliz',brazos:'carga',disfraz:'ingeniero',alto:Math.abs(Math.sin(t*8))*20});
  letrero('UNA ENCIMA DE OTRA',540,420,popIn(t,at(19)),'pergamino',{tam:62,t,t0:at(19)}); }
// S5 (10.1–13.9) "Contando metro y medio por persona, porque también hay niños." Interior mandarina: Raro mide con una cinta amarilla a una gomita adulta; luego brinca una gomita niña.
function S5(t,sc){ const k=easeOut(prog(t,at(24),0.6));
  gomita({x:500,y:SUELO,s:0.95,t,seed:2,color:'#B8E6FF',expr:'orgullo',brazos:'jarras'});
  cinta(690,SUELO,SUELO-420,k);
  const b=brinco(t,at(32),0.45,180); if(t>=at(31)) gomita({x:860,y:SUELO,s:0.55*popIn(t,at(31)),t,seed:4,color:'#FFE3A3',expr:'risa',brazos:'arriba',alto:b.alto,sq:b.sq});
  raro({x:200,y:SUELO,s:0.8,t,expr:'sospecha',brazos:'senala',disfraz:'ingeniero',mira:{x:0.9,y:0}});
  letrero(t>=at(32)?'TAMBIÉN HAY NIÑOS':'1.5 M POR PERSONA',540,420,popIn(t,at(24)),'madera',{tam:62,t,t0:t>=at(32)?at(32):at(24)}); }
// S6 (13.9–17.9) "Con 130 personas ya pasas la Torre Latinoamericana." Ciudad cielo: torre de gomitas crece junto a un rascacielos con antena y lo rebasa; contador 130.
function S6(t,sc){ rascacielos(780,SUELO,560,t);
  const n=Math.round(lerp(4,12,easeInOut(prog(t,at(34),2.4))));
  const tip=torre(330,SUELO,n,0.17,t,{sway:0.9,seed:5}); raro({x:tip[0],y:tip[1]+5,s:0.45,t,expr:n>=11?'orgullo':'feliz',brazos:n>=11?'arriba':'carga',disfraz:'ingeniero'});
  letrero(contador(t,at(34),2.4,1,130)+' PERSONAS',540,420,popIn(t,at(34)),'panel',{tam:66,t,t0:at(34)});
  chispas(t,at(40),540,520,1.2); }
// S7 (17.9–20.2) "Con 6,000, la cima del Everest." Nieve violeta: Raro, en la punta de la torre, choca la mano con la bandera de la cima.
function S7(t,sc){ const P=PAL_ACTUAL; ctx.fillStyle='#E9F1FF'; ctx.beginPath(); ctx.moveTo(1180,SUELO); ctx.lineTo(820,800); ctx.lineTo(760,860); ctx.lineTo(500,SUELO); ctx.fill();
  ctx.fillStyle=mix(P.medio,'#FFFFFF',0.3); ctx.beginPath(); ctx.moveTo(820,800); ctx.lineTo(900,1000); ctx.lineTo(1180,SUELO); ctx.lineTo(1180,1000); ctx.fill();
  ctx.strokeStyle='#3E3A55'; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(820,800); ctx.lineTo(820,650); ctx.stroke(); ctx.fillStyle='#FF5FA2'; ctx.beginPath(); ctx.moveTo(820,650); for(let i=0;i<=6;i++) ctx.lineTo(820+i*18,662+Math.sin(t*8+i)*6); ctx.lineTo(928,710); ctx.lineTo(820,700); ctx.fill();
  const tip=torre(560,2440,26,0.2,t,{sway:0.5,seed:8}); raro({x:tip[0],y:tip[1]+6,s:0.55,t,expr:'risa',brazos:'saluda',disfraz:'ingeniero',manos:{d:[300,-260]},wob:wobble(t,at(44),1)});
  letrero('6,000 = EVEREST',540,420,popIn(t,at(42)),'panel',{tam:70,t,t0:at(42)}); chispas(t,at(46),820,700,1.2); }
// S8 (20.2–22.3) "Y los de en medio ya se están quejando." Liso magenta: acercamiento al medio de la torre; tres gomitas aplastadas con sudor y cara de "ya valió".
function S8(t,sc){ const h=376*0.75*0.84;
  for(let i=0;i<4;i++){ const y=1900-i*h; gomita({x:540+Math.sin(t*2+i)*14,y,s:0.75,t,seed:i+2,color:PAST[(i+2)%6],expr:['yavalio','asco','llanto','yavalio'][i],brazos:'carga',sq:0.18+0.05*Math.sin(t*9+i),sinSombra:true,npc_peso:0.4}); sudor(t,640,y-300); }
  letrero('LOS DE EN MEDIO',540,420,popIn(t,at(51)),'pergamino',{tam:66,t,t0:at(51)}); }
// S9 (22.3–25.4) "Con 7,500, te topas con los aviones." Cielo turquesa: pasa un avión rozando; Raro en la punta se agacha del susto.
function S9(t,sc){ const tip=torre(400,2460,24,0.22,t,{sway:0.5,seed:2});
  const ax=lerp(1500,-500,prog(t,at(61)-0.6,1.4)); avion(ax,820,0.9,t,-1);
  const su=susto(t,at(62)); raro({x:tip[0],y:tip[1]+6,s:0.6,t,expr:t>=at(62)?'terror':'feliz',brazos:t>=at(62)?'cara':'idle',disfraz:'ingeniero',alto:su.alto,sq:su.sq,wob:su.wob,viento:t>=at(62)?1:0});
  if(t>=at(61)) rachas(t,0.8,0.5,700,1000);
  letrero('7,500 = AVIONES',540,420,popIn(t,at(57)),'panel',{tam:68,t,t0:at(57)}); }
// S10 (25.4–28) "Saludas al piloto… él no te saluda." Liso mandarina: ventana gigante de la cabina con un piloto gomita que ni voltea; Raro saluda y luego se apena.
function S10(t,sc){ ctx.fillStyle='#FFFFFF'; rr(80,600,920,560,160); ctx.fill(); ctx.fillStyle='#BDEBFF'; rr(170,680,520,380,90); ctx.fill();
  gomita({x:430,y:1110,s:0.75,t,seed:1,color:'#D9C2FF',expr:t>=at(67)?'sospecha':'neutral',brazos:'frente',mira:{x:-0.8,y:0},disfraz:GORRA_PILOTO});
  ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.moveTo(220,700); ctx.lineTo(320,700); ctx.lineTo(220,860); ctx.fill();
  raro({x:860,y:SUELO,s:0.8,t,expr:t>=at(67)?'apenado':'feliz',brazos:t>=at(67)?'idle':'saluda',disfraz:'ingeniero',sq:gelatina(t,at(67))});
  letrero(t>=at(67)?'NO TE SALUDA':'¡HOLA, PILOTO!',540,420,popIn(t,at(63)),'madera',{tam:66,t,t0:t>=at(67)?at(67):at(63)}); }
const GORRA_PILOTO={ cabeza(o){ ctx.save(); ctx.translate(0,-350); ctx.fillStyle='#1E3A6E'; ctx.beginPath(); ctx.ellipse(0,0,140,40,0,PI,0); ctx.fill(); rr(-120,-60,240,60,20); ctx.fill();
  ctx.fillStyle='#1B2A4E'; ctx.beginPath(); ctx.ellipse(-70,6,90,18,0,0,PI*2); ctx.fill(); ctx.fillStyle='#FFD23F'; blob(0,-34,14); ctx.restore(); } };
// S11 (28–31.1) "¿Y el espacio? Empieza a 100 kilómetros." Espacio cielo: línea punteada "100 KM"; la torre sube hacia ella con Raro asombrado.
function S11(t,sc){ const ly=900; ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=8; ctx.setLineDash([30,20]); ctx.lineDashOffset=-t*60; ctx.beginPath(); ctx.moveTo(-200,ly); ctx.lineTo(1280,ly); ctx.stroke(); ctx.setLineDash([]);
  const sube=easeInOut(prog(t,at(73),1.6))*280; const tip=torre(540,2600-sube,22,0.22,t,{sway:0.5,seed:4});
  raro({x:tip[0],y:tip[1]+6,s:0.6,t,expr:'asombro',brazos:'arriba',disfraz:'ingeniero',wob:wobble(t,at(72),1)});
  letrero(t>=at(75)?'ESPACIO: 100 KM':'¿Y EL ESPACIO?',540,420,popIn(t,sc.start+0.05),'panel',{tam:66,t,t0:t>=at(75)?at(75):sc.start}); }
// S12 (31.1–34.9) "O sea, con 70,000 personas ya eres astronauta." Liso violeta con estrellas: Raro cruza la línea y posa orgulloso; contador 70,000.
function S12(t,sc){ estrellasFondo(t); ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=8; ctx.setLineDash([30,20]); ctx.beginPath(); ctx.moveTo(-200,1250); ctx.lineTo(1280,1250); ctx.stroke(); ctx.setLineDash([]);
  const tip=torre(540,2600,26,0.2,t,{sway:0.5,seed:6}); const b=brinco(t,at(84)-0.1,0.45,120);
  raro({x:tip[0],y:tip[1]+6,s:0.65,t,expr:t>=at(84)?'orgullo':'feliz',brazos:t>=at(84)?'jarras':'carga',disfraz:'ingeniero',alto:b.alto,sq:b.sq,wob:b.wob});
  letrero(t>=at(84)?'¡ASTRONAUTA!':contador(t,at(80),0.6,0,70000)+' PERSONAS',540,420,popIn(t,at(80)),'madera',{tam:66,t,t0:t>=at(84)?at(84):at(80)});
  chispas(t,at(84),540,900,1.3); }
// S13 (34.9–36.9) "Sin traje. Mala idea." Espacio turquesa: Raro se congela (hielo, cara de terror) y en "mala idea" ¡puf! se pone el traje de astronauta.
function S13(t,sc){ const p=pufCambio(t,at(87));
  raro({x:540,y:1350,s:1.15,t,expr:p.despues?'yavalio':'terror',brazos:p.despues?'jarras':'cara',piernas:'flota',disfraz:p.despues?'astronauta':'ingeniero',spin:p.spin,tilt:Math.sin(t*1.5)*0.1});
  if(!p.despues) hielo(t,at(85)+0.1,540,1130,1.1); nubePuf(t,at(87)+0.06,540,1200,1.3);
  letrero(t>=at(87)?'MALA IDEA':'SIN TRAJE',540,420,popIn(t,sc.start+0.05),'panel',{tam:72,t,t0:t>=at(87)?at(87):sc.start,color:'#BFF4FF'}); }
// S14 (36.9–40) "Con puros mexicanos, 130 millones," Liso magenta con estrellas: torre de gomitas verde, blanco y rojo pastel que sale de la Tierra; contador 130 millones.
function S14(t,sc){ estrellasFondo(t,30); tierra(540,2100,720,t);
  const tip=torre(540,1420,8,0.2,t,{sway:1.2,seed:1,cols:['#9FE3B0','#FFFFFF','#FF9FA8'],expr:()=> 'feliz'});
  raro({x:tip[0],y:tip[1]+6,s:0.55,t,expr:'orgullo',brazos:'arriba',disfraz:'astronauta',piernas:'flota'});
  letrero(contador(t,at(92),0.9,1,130)+' MILLONES',540,420,popIn(t,at(91)),'panel',{tam:68,t,t0:at(91)}); }
// S15 (40–42.6) "llegas a más de la mitad del camino a la Luna." Espacio violeta: mapa Tierra–Luna; la torre avanza por el camino y pasa la marca de la mitad.
function S15(t,sc){ const A=[230,1380], B=[830,600]; tierra(A[0],A[1],120,t); luna(B[0],B[1],90,t);
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=6; ctx.setLineDash([16,14]); ctx.beginPath(); ctx.moveTo(...A); ctx.lineTo(...B); ctx.stroke(); ctx.setLineDash([]);
