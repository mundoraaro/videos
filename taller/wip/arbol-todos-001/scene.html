<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine.js"></script>
<script src="../../raro.js"></script>
<script>
// arbol-todos-001 — ¿Qué pasaría si TODOS plantáramos un árbol el mismo día? (serie "¿Qué pasaría si TODOS…?", Parte 26)
// Disfraz: jardinero (overol, sombrero de paja, pala) → científico (estudio) → jardinero → anciano (tardan años) → jardinero.
// Encuadre: Raro y objetos dentro de x≈20–940, y 180–1500; letreros en y 390–520 (helper L / L2); verificador CHECK.
const PI2=Math.PI*2;
window.HIDE_CAPTIONS_LAST=false;
window.CAPTION_POP_MIN=0.85;

// ---------- captions en bloques de 2–3 palabras (igual que correr-todos-001) ----------
const _corta=w=>w.replace(/[¡!¿?.,:…"]/g,'').length<=3;
function buildChunks(){
  CH=[]; let cur=[];
  const len=c=>c.map(j=>W[j].t).join(' ').length;
  W.forEach((w,i)=>{ if(cur.length>=2 && (cur.map(j=>W[j].t).join(' ')+' '+w.t).length>17){ CH.push(cur); cur=[]; } cur.push(i); const fin=/[.,?!:…]$/.test(w.t);
    if(fin||cur.length>=3||len(cur)>16){
      if(!fin && cur.length>1 && _corta(w.t)){ cur.pop(); CH.push(cur); cur=[i]; }
      else { CH.push(cur); cur=[]; } } });
  if(cur.length) CH.push(cur);
  for(let c=0;c<CH.length;c++){ if(CH[c].length===1 && _corta(W[CH[c][0]].t)){
    if(c+1<CH.length && CH[c+1].length<=3){ CH[c+1]=CH[c].concat(CH[c+1]); CH.splice(c,1); c--; }
    else if(c>0 && CH[c-1].length<=3){ CH[c-1]=CH[c-1].concat(CH[c]); CH.splice(c,1); c--; } } }
}
function captions(t){
  let ci=-1; for(let c=0;c<CH.length;c++){ if(W[CH[c][0]].s-0.05<=t) ci=c; }
  if(ci<0) return; const ch=CH[ci]; const last=W[ch[ch.length-1]];
  if(t>last.e+0.6 && (ci+1>=CH.length || t<W[CH[ci+1][0]].s-0.05)) return;
  const KW=window.KEYWORDS||[];
  let size=window.CAPTION_SIZE||80; const words=ch.map(i=>W[i].t.toUpperCase());
  const big=i=>KW.includes(i)?1.22:1;
  const widths=()=>ch.map((i,n)=>{ctx.font=fuente(size*big(i));return ctx.measureText(words[n]).width;});
  ctx.font=fuente(size); let sp=ctx.measureText(' ').width, ws=widths(), total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);
  if(total>800){size=Math.floor(size*800/total); ctx.font=fuente(size); sp=ctx.measureText(' ').width; ws=widths(); total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);}
  if(CAPPOS[ci]==null) CAPPOS[ci]=(W[ch[0]].s<at(12)-0.1||W[ch[0]].s>=at(183)-0.1)?632:lugarCaption(total,size*1.25);
  const y=CAPPOS[ci]; let x=540-total/2; const s0=W[ch[0]].s-0.05;
  ctx.textBaseline='middle'; ctx.textAlign='center'; ctx.lineJoin='round';
  ch.forEach((i,n)=>{const w=words[n], wd=ws[n], kw=KW.includes(i); const ws_=n<2?Math.max(0,s0):W[i].s;
    const k=t<ws_?0:(kw?popIn(t,ws_,0.22):back((t-ws_)/0.16));
    if(k>0){ const sz=size*big(i); ctx.save(); ctx.translate(x+wd/2,y); const sc=lerp(window.CAPTION_POP_MIN??0.6,1,k); ctx.scale(sc,sc); if(kw) ctx.rotate(Math.sin(t*5+i)*0.03);
      ctx.font=fuente(sz); ctx.fillStyle='rgba(20,14,40,0.45)'; ctx.fillText(w,0,sz*0.09);
      ctx.lineWidth=sz*0.19; ctx.strokeStyle='#1E1A2E'; ctx.strokeText(w,0,0);
      ctx.fillStyle=kw?COL.lime:'#FFFFFF'; ctx.fillText(w,0,0); ctx.restore(); }
    x+=wd+sp*1.25;});
}

// ---------- verificador de encuadre ----------
window.CHECK=[];
const _raro=raro;
raro=function(o){ const s=o.s??1, m=ctx.getTransform(), alto=o.alto||0; const der=(o.brazos==='senala'||o.brazos==='saluda')?320:215, izq=215;
  let x0=-izq*s, x1=der*s; if(o.espejo){ const a=-x1; x1=-x0; x0=a; }
  const pts=[[o.x+x0,o.y-alto-470*s],[o.x+x1,o.y-alto-470*s],[o.x+x0,o.y-alto],[o.x+x1,o.y-alto]].map(([x,y])=>[m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f]);
  CHECK.push([o.color?'npc':'raro',Math.min(...pts.map(p=>p[0])),Math.min(...pts.map(p=>p[1])),Math.max(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[1]))]);
  return _raro(o); };
function chk(tag,x0,y0,x1,y1){ const m=ctx.getTransform(); const P=[[x0,y0],[x1,y0],[x0,y1],[x1,y1]].map(([x,y])=>[m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f]);
  CHECK.push([tag,Math.min(...P.map(p=>p[0])),Math.min(...P.map(p=>p[1])),Math.max(...P.map(p=>p[0])),Math.max(...P.map(p=>p[1]))]); }
let CUR=1;
const dur=sc=>sc.end-sc.start;
function L(txt,x,y,k,tipo='madera',opts={}){ let tam=opts.tam||72; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.font=fuente(tam); let w=ctx.measureText(txt).width+tam*1.2; const maxW=700;
  if(w>maxW){ tam*=maxW/w; w=maxW; } x=clamp(x,170+w/2,910-w/2); y=clamp(y,390,520);
  letrero(txt,x,y,k,tipo,{sinPalo:!opts.palo,...opts,tam}); if(k>0.5) chk('letrero',x-w/2,y-tam*0.85,x+w/2,y+tam*0.85); ctx.restore(); }
function L2(a,b,k,y=430,t=0,t0=-1,tipo='panel'){ if(k<=0) return; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.translate(540,y); const sw=wobble(t,t0,0.2); ctx.rotate(sw); ctx.scale(k,k);
  ctx.font=fuente(88); const w1=ctx.measureText(a).width; ctx.font=fuente(62); const w2=ctx.measureText(b).width; let w=Math.max(w1,w2)+90; let sc=1; if(w>740){ sc=740/w; w=740; }
  const h=200*sc; ctx.fillStyle='#1E1A2E'; rr(-w/2+8,-h/2+10,w,h,30); ctx.fill(); ctx.fillStyle=tipo==='panel'?'#2E2A60':'#B97A3E'; rr(-w/2,-h/2,w,h,30); ctx.fill();
  ctx.strokeStyle='#D7FF3D'; ctx.lineWidth=7; rr(-w/2+10,-h/2+10,w-20,h-20,24); ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font=fuente(88*sc); ctx.fillStyle='#FFFFFF'; ctx.fillText(a,0,-40*sc); ctx.font=fuente(62*sc); ctx.fillStyle='#D7FF3D'; ctx.fillText(b,0,48*sc);
  ocupa(-w/2,-h/2,w/2,h/2,3); chk('letrero',-w/2,-h/2,w/2,h/2); ctx.restore(); }
function sudor(x,y,s,t,n=3){ for(let i=0;i<n;i++){ const a=-2.5+i*0.6; ctx.fillStyle='#7FD8FF'; const xx=x+Math.cos(a)*170*s, yy=y-290*s+Math.sin(a)*150*s+((t*2+i*0.3)%1)*30; ctx.beginPath(); ctx.moveTo(xx,yy-28*s); ctx.quadraticCurveTo(xx+20*s,yy,xx,yy+12*s); ctx.quadraticCurveTo(xx-20*s,yy,xx,yy-28*s); ctx.fill(); } }
function arcoTierra(t,cy,R,vel=1){ const cx=540; ctx.save(); const g=ctx.createRadialGradient(cx,cy,R*0.98,cx,cy,R*1.08); g.addColorStop(0,'rgba(127,216,255,0.9)'); g.addColorStop(1,'rgba(127,216,255,0)'); ctx.fillStyle=g; blob(cx,cy,R*1.08);
  ctx.fillStyle='#3AB6FF'; blob(cx,cy,R); ctx.beginPath(); ctx.arc(cx,cy,R,0,PI2); ctx.clip(); const rot=-t*0.03*vel;
  for(let i=0;i<16;i++){ const a=rot+i*PI2/16+rand(i)*0.2; const x=cx+Math.sin(a)*R*0.93, y=cy-Math.cos(a)*R*0.93; ctx.fillStyle=i%3?'#5CD67A':'#43B866'; blob(x,y,R*(0.1+rand(i+4)*0.07)); blob(x+R*0.08,y+R*0.03,R*0.08); }
  ctx.fillStyle='rgba(30,26,80,0.22)'; ctx.beginPath(); ctx.arc(cx+R*0.25,cy+R*0.15,R,0,PI2); ctx.fill(); ctx.restore(); }
const yArco=(x,cy,R)=>cy-Math.cos(Math.asin(clamp((x-540)/R,-1,1)))*R;
const GC=['#B8E6FF','#FFB8D2','#C9F2B8','#FFE3A3','#D9C2FF','#FFC9A8'];
const backEase=u=>{ const c=1.7; u=clamp(u); return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2); };

// ====================== árboles ======================
// árbol redondo: k = crecimiento 0..1 (escala vertical con rebote), v = variante de color, muerto = 0..1 (se seca y se dobla)
function arbol(x,y,s,k,t,v=0,muerto=0){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(t*2+x*0.01)*0.03+muerto*0.35); ctx.scale(s,s*k);
  ctx.fillStyle='rgba(20,14,40,0.18)'; ctx.beginPath(); ctx.ellipse(10,0,110,22,0,0,PI2); ctx.fill();
  ctx.fillStyle=muerto>0.5?'#8A6A4A':'#8B5A2B'; rr(-18,-210,36,212,14); ctx.fill(); ctx.fillStyle='#6E4420'; rr(-18,-210,12,212,8); ctx.fill();
  const C=[['#43B866','#5CD67A'],['#2E9E62','#4CC97F'],['#7BC043','#A2DB5A'],['#8D4DFF','#CDA8FF']][v%4];
  const c1=muerto>0.5?'#B88A4A':C[0], c2=muerto>0.5?'#D9A85E':C[1];
  ctx.fillStyle=c1; blob(0,-270,115); blob(-85,-205,74); blob(85,-215,78); ctx.fillStyle=c2; blob(-32,-300,62); blob(42,-258,52); ctx.fillStyle='rgba(255,255,255,0.35)'; blob(-50,-330,20);
  ctx.restore(); chk('obj',x-165*s,y-390*s*k,x+165*s,y+10); ocupa(x-150*s,y-390*s*k,x+150*s,y,0.8); }
function pino(x,y,s,k,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(t*2+x)*0.03); ctx.scale(s,s*k); ctx.fillStyle='#8B5A2B'; rr(-14,-80,28,82,10); ctx.fill();
  for(let i=0;i<3;i++){ ctx.fillStyle=i%2?'#2E9E62':'#1F8A55'; ctx.beginPath(); ctx.moveTo(-120+i*22,-60-i*90); ctx.quadraticCurveTo(0,-70-i*90,120-i*22,-60-i*90); ctx.lineTo(0,-200-i*90); ctx.closePath(); ctx.fill(); } ctx.restore(); chk('obj',x-125*s,y-390*s*k,x+125*s,y); }
// brote: arbolito recién plantado con montoncito de tierra
function brote(x,y,s,k,t,seco=0){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle='#8B5A2B'; ctx.beginPath(); ctx.ellipse(0,0,60,20,0,Math.PI,0); ctx.fill();
  ctx.scale(1,k); ctx.rotate(Math.sin(t*3+x)*0.06+seco*0.9); ctx.strokeStyle=seco>0.5?'#9C7A4A':'#3E9B4F'; ctx.lineWidth=12; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(8,-60,0,-120); ctx.stroke();
  ctx.fillStyle=seco>0.5?'#C9A060':'#5CD67A'; for(const sd of [-1,1]){ ctx.save(); ctx.translate(0,-110); ctx.rotate(sd*(0.9+seco*0.6)); ctx.beginPath(); ctx.ellipse(0,-34,20,38,0,0,PI2); ctx.fill(); ctx.restore(); }
  ctx.fillStyle=seco>0.5?'#B88A4A':'#7BE38F'; ctx.beginPath(); ctx.ellipse(0,-150,16,30,0,0,PI2); ctx.fill(); ctx.restore(); chk('obj',x-65*s,y-190*s*k,x+65*s,y+5); }
function tocon(x,y,s,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); ctx.fillStyle='#6E4420'; rr(-50,-70,100,72,14); ctx.fill(); ctx.fillStyle='#E9BD5C'; ctx.beginPath(); ctx.ellipse(0,-70,50,16,0,0,PI2); ctx.fill();
  ctx.strokeStyle='#B8822A'; ctx.lineWidth=4; for(const r of [12,26,40]){ ctx.beginPath(); ctx.ellipse(0,-70,r,r*0.32,0,0,PI2); ctx.stroke(); } ctx.restore(); }
// árbol que cae (tumbado): ang 0..1 -> 0..90°
function arbolCae(x,y,s,u,t,v=0){ ctx.save(); ctx.translate(x,y); ctx.rotate(easeIn(clamp(u))*1.45); arbol(0,0,s,1,0,v); ctx.restore(); tocon(x,y+4,s*0.9,u>0.02?1:0); }
// hacha que tumba
function hacha(x,y,s,a){ ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.scale(s,s); ctx.fillStyle='#8B5A2B'; rr(-10,-160,20,200,10); ctx.fill(); ctx.fillStyle='#C9C3D6'; ctx.beginPath(); ctx.moveTo(8,-150); ctx.quadraticCurveTo(90,-160,80,-90); ctx.quadraticCurveTo(40,-100,8,-100); ctx.closePath(); ctx.fill(); ctx.restore(); }
// mini gomita de la multitud con su brote: plant = momento en que lo planta
function miniGom(x,y,s,col,t,seed,plant){ const b=Math.abs(Math.sin(t*6+seed*1.7))*6*s; const pl=t>=plant; ctx.save(); ctx.translate(x,y-b);
  ctx.fillStyle='rgba(20,14,40,0.22)'; ctx.beginPath(); ctx.ellipse(0,b,26*s,7*s,0,0,PI2); ctx.fill();
  ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(0,-50*s,30*s,50*s,0,0,PI2); ctx.fill(); ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.ellipse(-10*s,-80*s,8*s,12*s,-0.4,0,PI2); ctx.fill();
  ctx.fillStyle='#1E1A2E'; ctx.beginPath(); ctx.ellipse(-9*s,-70*s,4.5*s,6*s,0,0,PI2); ctx.ellipse(9*s,-70*s,4.5*s,6*s,0,0,PI2); ctx.fill(); ctx.restore();
  if(!pl) brote(x+4*s,y-b-104*s,0.3*s,1,t); else brote(x+30*s,y+2,0.42*s,Math.min(1.1,backEase(prog(t,plant,0.3))),t); }
function multitudHorizonte(t,cy,R,plant,frente){ const filas=[[0,0.62,30],[1,0.78,38],[2,0.98,48],[3,1.2,60]];
  filas.forEach(([r,s,dx])=>{ if(frente!==(r>=2)) return; const dy=[2,30,66,112][r]; for(let x=-20+(r%2)*dx/2;x<=1100;x+=dx){ const y=yArco(x,cy,R)+dy; if(y>1495) continue;
    const seed=Math.floor(x)+r*97; if(frente&&((r>=3&&x>250&&x<760)||(r===2&&x>300&&x<720))) continue; miniGom(x+Math.sin(seed)*6,y,s,GC[(seed%6+6)%6],t,seed,plant+clamp(x/1080)*0.25); } }); }
function burbuja(x,y,txt,k,t,tam=70,col='#FFFFFF'){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.rotate(Math.sin(t*4)*0.03); ctx.font=fuente(tam); const w=ctx.measureText(txt).width+tam*0.9, h=tam*1.6;
  ctx.fillStyle='#1E1A2E'; rr(-w/2+6,-h/2+8,w,h,h/2); ctx.fill(); ctx.beginPath(); ctx.moveTo(-30,h/2-6); ctx.lineTo(-70,h/2+50); ctx.lineTo(10,h/2-6); ctx.fill();
  ctx.fillStyle=col; rr(-w/2,-h/2,w,h,h/2); ctx.fill(); ctx.beginPath(); ctx.moveTo(-34,h/2-12); ctx.lineTo(-72,h/2+42); ctx.lineTo(6,h/2-12); ctx.fill();
  ctx.fillStyle='#1E1A2E'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,0,4); ocupa(-w/2,-h/2,w/2,h/2+40,2.5); chk('obj',-w/2,-h/2,w/2,h/2+50); ctx.restore(); }
function calendario(x,y,s,txt,k,t,tf=-1,cab='MES'){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); ctx.fillStyle='#1E1A2E'; rr(-142,-152,300,320,30); ctx.fill(); ctx.fillStyle='#FFFFFF'; rr(-150,-160,300,320,30); ctx.fill();
  ctx.fillStyle='#E23D5B'; rr(-150,-160,300,90,30); ctx.fill(); ctx.fillRect(-150,-100,300,30); ctx.fillStyle='#FFFFFF'; ctx.font=fuente(50); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(cab,0,-113);
  ctx.fillStyle='#1E1A2E'; ctx.font=fuente(String(txt).length>3?110:150); ctx.fillText(String(txt),0,60);
  if(tf>=0 && t>=tf && t<tf+0.25){ const u=(t-tf)/0.25; ctx.fillStyle='#F2EEF8'; ctx.save(); ctx.translate(0,-70); ctx.scale(1,1-u*2); rr(-150,0,300,230,20); ctx.fill(); ctx.restore(); }
  ctx.restore(); chk('obj',x-150*s*k,y-160*s*k,x+150*s*k,y+160*s*k); ocupa(x-150*s*k,y-160*s*k,x+150*s*k,y+160*s*k,1.5); }
// nube de CO2 gris
function humo(x,y,r,t,k=1,txt=''){ if(k<=0) return; ctx.save(); ctx.translate(x+Math.sin(t*2+x)*8,y); ctx.scale(k,k); ctx.fillStyle='#8E8AA3'; blob(0,0,r); blob(-r*0.8,r*0.2,r*0.7); blob(r*0.8,r*0.15,r*0.75); ctx.fillStyle='#A9A4BD'; blob(-r*0.2,-r*0.25,r*0.6);
  if(txt){ ctx.fillStyle='#FFFFFF'; ctx.font=fuente(r*0.55); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,0,r*0.05); } ctx.restore(); }
function fabrica(x,y,s,t){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle='#5B4B8A'; rr(-160,-160,320,160,12); ctx.fill(); ctx.fillStyle='#46396E'; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(-160+i*107,-160); ctx.lineTo(-160+i*107+53,-220); ctx.lineTo(-160+i*107+107,-160); ctx.fill(); }
  ctx.fillStyle='#46396E'; rr(90,-380,50,240,8); ctx.fill(); ctx.fillStyle='#E23D5B'; rr(90,-350,50,18,4); ctx.fill(); ctx.fillStyle='#FFD51A'; for(let i=0;i<3;i++){ rr(-130+i*80,-110,46,46,8); ctx.fill(); } ctx.restore();
  for(let i=0;i<4;i++){ const u=(t*0.5+i/4)%1; humo(x+115*s+u*60,y-400*s-u*260*s,(40+u*60)*s,t,1-u*0.3); } }
// metro naranja (adelanto de la Parte 27)
function metro(x,y,s,t){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle='rgba(20,14,40,0.25)'; ctx.beginPath(); ctx.ellipse(0,10,420,26,0,0,PI2); ctx.fill();
  ctx.fillStyle='#FF8A1F'; rr(-400,-430,800,420,60); ctx.fill(); ctx.fillStyle='#D25A08'; rr(-400,-120,800,40,10); ctx.fill(); ctx.fillStyle='#FFFFFF'; rr(-400,-170,800,26,8); ctx.fill();
  for(let i=0;i<3;i++){ ctx.fillStyle='#2E2A60'; rr(-360+i*250,-390,200,180,24); ctx.fill(); for(let j=0;j<4;j++){ const gx=-330+i*250+j*46, gy=-260+Math.abs(Math.sin(t*7+i*3+j))*8; ctx.fillStyle=GC[(i*4+j)%6]; ctx.beginPath(); ctx.ellipse(gx,gy,22,40,0,0,PI2); ctx.fill(); ctx.fillStyle='#1E1A2E'; blob(gx-7,gy-14,3.5); blob(gx+7,gy-14,3.5); } }
  ctx.fillStyle='#1E1A2E'; for(const wx of [-260,260]){ blob(wx,0,44); } ctx.restore(); chk('obj',x-400*s,y-430*s,x+400*s,y+10); ocupa(x-400*s,y-430*s,x+400*s,y,1.5); }
function mapaBosque(x,y,s,k,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle='#1E1A2E'; ctx.beginPath(); const P=[[-250,-170],[-60,-230],[120,-200],[260,-90],[230,80],[90,200],[-120,190],[-260,60]]; P.forEach(([a,b],i)=>i?ctx.lineTo(a+8,b+10):ctx.moveTo(a+8,b+10)); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#43B866'; ctx.beginPath(); P.forEach(([a,b],i)=>i?ctx.lineTo(a,b):ctx.moveTo(a,b)); ctx.closePath(); ctx.fill(); ctx.save(); ctx.clip();
  for(let i=0;i<70;i++){ const xx=-260+(i%10)*56+(Math.floor(i/10)%2)*28, yy=-220+Math.floor(i/10)*62; ctx.fillStyle=i%3?'#2E9E62':'#5CD67A'; blob(xx,yy+Math.sin(t*3+i)*2,24); } ctx.restore();
