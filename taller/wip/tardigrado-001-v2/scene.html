<script>
// tardigrado-001 — El animal que sobrevivió al espacio sin traje (fórmula: afirmación bizarra / animal insólito, en 2ª persona)
// Disfraces: piyama en el espacio (tú sin traje) → osito de agua (tardígrado) → piyama en el espacio (loop).
// Encuadre: Raro siempre completo dentro de x≈20–940; letreros en y 380–520 (helper L); verificador CHECK en coordenadas de pantalla.
const PI2=Math.PI*2;
window.HIDE_CAPTIONS_LAST=false;
window.CAPTION_POP_MIN=0.85;

// ---------- captions en bloques de 2–3 palabras (v2: nunca una palabra vacía sola en pantalla) ----------
const _corta=w=>w.replace(/[¡!¿?.,:…"]/g,'').length<=3;
function buildChunks(){
  CH=[]; let cur=[];
  const len=c=>c.map(j=>W[j].t).join(' ').length;
  W.forEach((w,i)=>{ cur.push(i); const fin=/[.,?!:…]$/.test(w.t);
    if(fin||cur.length>=3||len(cur)>16){
      // no cerrar un bloque con una palabra corta sin puntuación: pasa al siguiente
      if(!fin && cur.length>1 && _corta(w.t)){ cur.pop(); CH.push(cur); cur=[i]; }
      else { CH.push(cur); cur=[]; } } });
  if(cur.length) CH.push(cur);
  // un bloque de una sola palabra corta se une con el siguiente (o con el anterior)
  for(let c=0;c<CH.length;c++){ if(CH[c].length===1 && _corta(W[CH[c][0]].t)){
    if(c+1<CH.length && CH[c+1].length<=3){ CH[c+1]=CH[c].concat(CH[c+1]); CH.splice(c,1); c--; }
    else if(c>0 && CH[c-1].length<=3){ CH[c-1]=CH[c-1].concat(CH[c]); CH.splice(c,1); c--; } } }
}
// Igual que captions() del motor, pero las 2 primeras palabras de cada bloque aparecen juntas.
function captions(t){
  let ci=-1; for(let c=0;c<CH.length;c++){ if(W[CH[c][0]].s-0.05<=t) ci=c; }
  if(ci<0) return; const ch=CH[ci]; const last=W[ch[ch.length-1]];
  if(t>last.e+0.6 && (ci+1>=CH.length || t<W[CH[ci+1][0]].s-0.05)) return;
  const KW=window.KEYWORDS||[];
  let size=window.CAPTION_SIZE||80; const words=ch.map(i=>W[i].t.toUpperCase());
  const big=i=>KW.includes(i)?1.22:1;
  const widths=()=>ch.map((i,n)=>{ctx.font=fuente(size*big(i));return ctx.measureText(words[n]).width;});
  ctx.font=fuente(size); let sp=ctx.measureText(' ').width, ws=widths(), total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);
  if(total>800){size=Math.floor(size*800/total); ctx.font=fuente(size); sp=ctx.measureText(' ').width; ws=widths(); total=ws.reduce((a,b)=>a+b,0)+sp*1.25*(ch.length-1);}
  if(CAPPOS[ci]==null) CAPPOS[ci]=lugarCaption(total,size*1.25);
  const y=CAPPOS[ci]; let x=540-total/2; const s0=W[ch[0]].s-0.05;
  ctx.textBaseline='middle'; ctx.textAlign='center'; ctx.lineJoin='round';
  ch.forEach((i,n)=>{const w=words[n], wd=ws[n], kw=KW.includes(i); const ws_=n<2?Math.max(0,s0):W[i].s;
    const k=t<ws_?0:(kw?popIn(t,ws_,0.22):back((t-ws_)/0.16));
    if(k>0){ const sz=size*big(i); ctx.save(); ctx.translate(x+wd/2,y); const sc=lerp(window.CAPTION_POP_MIN??0.6,1,k); ctx.scale(sc,sc); if(kw) ctx.rotate(Math.sin(t*5+i)*0.03);
      ctx.font=fuente(sz); ctx.fillStyle='rgba(20,14,40,0.45)'; ctx.fillText(w,0,sz*0.09);
      ctx.lineWidth=sz*0.19; ctx.strokeStyle='#1E1A2E'; ctx.strokeText(w,0,0);
      ctx.fillStyle=kw?COL.lime:'#FFFFFF'; ctx.fillText(w,0,0); ctx.restore(); }
    x+=wd+sp*1.25;});
}

// ---------- verificador de encuadre (cajas en pantalla) ----------
window.CHECK=[];
const _raro=raro;
raro=function(o){ const s=o.s??1, m=ctx.getTransform(), alto=o.alto||0; const der=(o.brazos==='senala'||o.brazos==='saluda')?320:215, izq=215;
  const ex=(o.disfraz==='tardigrado'&&!(o.bolita>0.5))?255:0; let x0=-Math.max(izq,ex)*s, x1=Math.max(der,ex)*s; if(o.espejo){ const a=-x1; x1=-x0; x0=a; }
  const pts=[[o.x+x0,o.y-alto-470*s],[o.x+x1,o.y-alto-470*s],[o.x+x0,o.y-alto],[o.x+x1,o.y-alto]].map(([x,y])=>[m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f]);
  CHECK.push([o.color?'npc':'raro',Math.min(...pts.map(p=>p[0])),Math.min(...pts.map(p=>p[1])),Math.max(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[1]))]);
  return _raro(o); };
const _osito=osito; osito=function(o){ const s=o.s||1, d=o.dir||1; const a=d>0?-170*s:-245*s, b=d>0?245*s:170*s; chk('npc',o.x+a,o.y-(o.alto||0)-190*s,o.x+b,o.y-(o.alto||0)); return _osito(o); };
function chk(tag,x0,y0,x1,y1){ const m=ctx.getTransform(); const P=[[x0,y0],[x1,y0],[x0,y1],[x1,y1]].map(([x,y])=>[m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f]);
  CHECK.push([tag,Math.min(...P.map(p=>p[0])),Math.min(...P.map(p=>p[1])),Math.max(...P.map(p=>p[0])),Math.max(...P.map(p=>p[1]))]); }

// ---------- utilería ----------
let CUR=1;
// Letrero en coordenadas de PANTALLA, compensando el zoom de la toma (soplar-001-v2).
function L(txt,x,y,k,tipo='madera',opts={}){ const TM=(window.TOMAS||{})[CUR]||{}, Z=Math.max(1,TM.z||1), F=TM.foco||[540,960];
  let tam=(opts.tam||72)/Z; ctx.font=fuente(tam); let w=ctx.measureText(txt).width+tam*1.2; const maxW=640/Z;
  if(w>maxW){ tam*=maxW/w; w=maxW; } const sw=w*Z; x=clamp(x,180+sw/2,900-sw/2); y=clamp(y,390,520);
  const X=F[0]+(x-540)/Z, Y=F[1]+(y-960)/Z;
  letrero(txt,X,Y,k,tipo,{sinPalo:!opts.palo,...opts,tam}); if(k>0.5) chk('letrero',X-w/2,Y-tam*0.85,X+w/2,Y+tam*0.85); }
function tierra(x,y,r,t){ ctx.save(); ctx.translate(x,y);
  const g=ctx.createRadialGradient(0,0,r*0.9,0,0,r*1.18); g.addColorStop(0,'rgba(140,220,255,0.6)'); g.addColorStop(1,'rgba(140,220,255,0)'); ctx.fillStyle=g; blob(0,0,r*1.18);
  ctx.fillStyle='#3AB6FF'; blob(0,0,r); ctx.save(); ctx.beginPath(); ctx.arc(0,0,r,0,PI2); ctx.clip(); ctx.rotate(t*0.05);
  ctx.fillStyle='#4CD98B'; for(const [a,b,c] of [[-0.4,-0.3,0.42],[0.35,0.15,0.34],[-0.2,0.5,0.28],[0.55,-0.5,0.22]]) blob(a*r,b*r,c*r);
  ctx.fillStyle='rgba(255,255,255,0.8)'; for(let i=0;i<5;i++){ ctx.beginPath(); ctx.ellipse((rand(i)-0.5)*1.6*r,(rand(i+3)-0.5)*1.6*r,r*0.3,r*0.06,0.3,0,PI2); ctx.fill(); }
  ctx.restore(); ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.ellipse(-r*0.4,-r*0.45,r*0.25,r*0.12,-0.6,0,PI2); ctx.fill(); ctx.restore(); }
function estrellas(t,n=50){ for(let i=0;i<n;i++){ const x=rand(i)*1200-60, y=rand(i+9)*1700-40; ctx.globalAlpha=0.45+0.55*Math.abs(Math.sin(t*2+i)); estrella4(x,y,5+rand(i+3)*12,'#FFFFFF'); } ctx.globalAlpha=1; }
// fondos propios
EXTRA_FONDOS.orbita=function(t,P,px){ estrellas(t);
  ctx.fillStyle=mix(P.claro,'#FFFFFF',0.3); blob(170+px(0.2),300,46); ctx.fillStyle=mix(P.claro,P.medio,0.4); blob(158+px(0.2),288,14); blob(186+px(0.2),318,9);
  const cx=540+px(0.5), cy=2900, R=1380; ctx.fillStyle='rgba(170,235,255,0.35)'; blob(cx,cy,R+60); ctx.fillStyle='#2D9CF0'; blob(cx,cy,R);
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,PI2); ctx.clip(); ctx.fillStyle='#46CF84'; blob(cx-420,1640,260); blob(cx+380,1700,320); blob(cx+40,1880,200);
  ctx.fillStyle='rgba(255,255,255,0.85)'; for(let i=0;i<6;i++){ const x=((i*260+t*20)%1500)-200; ctx.beginPath(); ctx.ellipse(x,1580+(i%3)*90,150,22,0,0,PI2); ctx.fill(); } ctx.restore(); };
EXTRA_FONDOS.luna=function(t,P,px){ estrellas(t,40); if(!window.SIN_TIERRA) tierra(800+px(0.2),700,90,t);
  const G=window.SUELO_Y||SUELO; ctx.fillStyle=mix(P.claro,'#FFFFFF',0.25); blob(200+px(0.4),G+120,520); blob(900+px(0.4),G+160,560);
  ctx.fillStyle=mix(P.claro,P.medio,0.35); ctx.fillRect(-300,G-20,1680,900);
  ctx.fillStyle=mix(P.medio,P.claro,0.3); for(const [x,y,r] of [[120,G+90,70],[640,G+60,46],[900,G+260,90],[330,G+330,60],[760,G+420,40]]){ ctx.beginPath(); ctx.ellipse(x+px(1),y,r*1.6,r*0.5,0,0,PI2); ctx.fill(); }
  ctx.fillStyle=mix(P.claro,'#FFFFFF',0.5); for(const [x,y,r] of [[120,G+82,70],[640,G+54,46],[900,G+250,90],[330,G+322,60],[760,G+414,40]]){ ctx.beginPath(); ctx.ellipse(x+px(1),y-r*0.25,r*1.6,r*0.18,0,Math.PI,0); ctx.fill(); } };
EXTRA_FONDOS.luna2=function(t,P,px){ window.SIN_TIERRA=true; EXTRA_FONDOS.luna(t,P,px); window.SIN_TIERRA=false; };
EXTRA_FONDOS.lab=function(t,P,px){ const G=window.SUELO_Y||SUELO;
  ctx.fillStyle=mix(P.claro,'#FFFFFF',0.2); for(let r=0;r<9;r++) for(let i=0;i<8;i++){ rr(i*150-40+px(0.3)+(r%2)*75,240+r*120,140,110,14); ctx.fill(); }
  ctx.fillStyle=P.oscuro; for(const y of [520,760]){ rr(40+px(0.5),y,360,24,10); ctx.fill(); }
  for(let i=0;i<6;i++){ const x=70+px(0.5)+(i%3)*110, y=(i<3?520:760); ctx.fillStyle=PASTELES[i%PASTELES.length]; rr(x,y-110,60,110,24); ctx.fill(); ctx.fillStyle='rgba(255,255,255,0.6)'; rr(x+10,y-96,12,60,6); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.7)'; const u=((t*0.8+i*0.3)%1); blob(x+30,y-120-u*60,8*(1-u)+2); }
  ctx.fillStyle=mix(P.oscuro,P.medio,0.3); ctx.fillRect(-300,G-20,1680,900); ctx.fillStyle=mix(P.oscuro,'#000000',0.12); ctx.fillRect(-300,G-20,1680,26); };
EXTRA_FONDOS.musgo=function(t,P,px){ const G=window.SUELO_Y||SUELO;
  const fronda=(x,h,c,d,ph)=>{ ctx.strokeStyle=c; ctx.lineCap='round'; ctx.lineWidth=26*d; ctx.beginPath(); ctx.moveTo(x+px(d),G+300); const pts=[];
    for(let k=1;k<=10;k++){ const u=k/10; const xx=x+px(d)+Math.sin(u*2.4+t*0.9+ph)*40*u, yy=G+300-h*u; ctx.lineTo(xx,yy); pts.push([xx,yy,u]); } ctx.stroke();
    ctx.fillStyle=c; for(const [xx,yy,u] of pts){ if(u<0.2) continue; for(const s of [-1,1]){ ctx.save(); ctx.translate(xx,yy); ctx.rotate(s*(1.0-u*0.4)+Math.sin(t+ph)*0.05); ctx.beginPath(); ctx.ellipse(s*34*d,0,40*d*(1.1-u*0.5),14*d,0,0,PI2); ctx.fill(); ctx.restore(); } } };
  for(let i=0;i<6;i++) fronda(40+i*200,900+rand(i)*300,mix(P.claro,P.medio,0.3),0.6,i);
  ctx.fillStyle='rgba(255,255,255,0.55)'; for(let i=0;i<7;i++){ const x=rand(i+5)*1000+40+px(0.6), y=500+rand(i+7)*700+Math.sin(t+i)*10; blob(x,y,14+rand(i)*14); }
  for(let i=0;i<4;i++) fronda(-40+i*380,700+rand(i+3)*300,P.oscuro,1.0,i*2);
  ctx.fillStyle=mix(P.oscuro,'#000000',0.15); ctx.fillRect(-300,G-10,1680,900); };

function cronometro(x,y,r,k,v,rojo){ if(k<=0) return; ocupa(x-r,y-r*1.3,x+r,y+r,1.1); chk('obj',x-r-14,y-r-50,x+r+14,y+r+14); ctx.save(); ctx.translate(x,y); ctx.scale(k,k);
  ctx.fillStyle='#C9C3E0'; rr(-26,-r-50,52,40,10); ctx.fill(); ctx.fillStyle='#FFFFFF'; blob(0,0,r+14); ctx.fillStyle=rojo?'#FF4D5E':'#3AB6FF'; blob(0,0,r); ctx.fillStyle='#FFFFFF'; blob(0,0,r-16);
  const a=-Math.PI/2+PI2*(v/60); ctx.strokeStyle='#FF4D5E'; ctx.lineWidth=9; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*(r-34),Math.sin(a)*(r-34)); ctx.stroke();
  ctx.fillStyle='#1E1A2E'; blob(0,0,10); ctx.font=fuente(r*0.5); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(Math.floor(v)+' s',0,r*0.42); ctx.restore(); }
function calendario(x,y,s,k,t,t0,hasta,d,txt='DÍAS'){ if(k<=0) return; ocupa(x-120*s,y-150*s,x+120*s,y+140*s,1.1); chk('obj',x-120*s,y-160*s,x+120*s,y+140*s); ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  ctx.fillStyle='#FFFFFF'; rr(-120,-140,240,280,22); ctx.fill(); ctx.fillStyle='#FF4D5E'; rr(-120,-140,240,70,22); ctx.fill(); ctx.fillRect(-120,-100,240,30);
  ctx.fillStyle='#8E8AA3'; for(const xx of [-60,60]){ rr(xx-10,-160,20,50,10); ctx.fill(); }
  const fl=((t-t0)*8)%1; if(t>t0 && t<t0+d){ ctx.save(); ctx.transform(1,0,0,1-fl,0,0); ctx.fillStyle='#F3EEFF'; rr(-110,-60,220,190,14); ctx.fill(); ctx.restore(); }
  ctx.fillStyle='#1E1A2E'; ctx.font=fuente(110); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(contador(t,t0,d,0,hasta),0,30);
  ctx.font=fuente(40); ctx.fillStyle='#FFFFFF'; ctx.fillText(txt,0,-104); ctx.restore(); }
function huevo(x,y,s,k,t,i){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(t*5+i)*0.12); ctx.scale(s*k,s*k); ctx.fillStyle='#FFF4DC'; ctx.beginPath(); ctx.ellipse(0,-40,30,40,0,0,PI2); ctx.fill();
  ctx.fillStyle='#F2D9A8'; blob(-8,-50,6); blob(10,-30,5); ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.ellipse(-10,-58,7,12,-0.4,0,PI2); ctx.fill(); ctx.restore(); }
function reglaMM(x0,x1,y,k,t){ if(k<=0) return; ctx.save(); ctx.globalAlpha=clamp(k); ctx.fillStyle='#FFD23F'; rr(x0,y-50,x1-x0,100,16); ctx.fill(); ctx.fillStyle='#E0A800'; rr(x0,y+30,x1-x0,20,8); ctx.fill();
  ctx.strokeStyle='#7A5A0A'; ctx.lineWidth=5; for(let i=0;i<=20;i++){ const xx=x0+30+i*(x1-x0-60)/20; ctx.beginPath(); ctx.moveTo(xx,y-50); ctx.lineTo(xx,y-50+(i%10===0?50:i%5===0?34:20)); ctx.stroke(); }
  ctx.fillStyle='#5A3A0A'; ctx.font=fuente(40); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('0',x0+30,y+16); ctx.fillText('0.5',(x0+x1)/2,y+16); ctx.fillText('1 mm',x1-60,y+16); ctx.restore(); chk('obj',x0,y-50,x1,y+50); }
function azucar(x,y,a,k,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(t*1.5)*0.05); ctx.scale(k,k); ocupa(-a,-a*1.1,a,a*0.2,1.1);
  ctx.fillStyle='#E9F7FF'; ctx.beginPath(); ctx.moveTo(-a,-a*0.2); ctx.lineTo(-a*0.3,-a*1.0); ctx.lineTo(a*0.8,-a*0.7); ctx.lineTo(a,a*0.1); ctx.lineTo(a*0.2,a*0.2); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#C8E8FA'; ctx.beginPath(); ctx.moveTo(a*0.2,a*0.2); ctx.lineTo(a,a*0.1); ctx.lineTo(a*0.8,-a*0.7); ctx.lineTo(a*0.1,-a*0.4); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#FFFFFF'; ctx.globalAlpha=0.9; for(let i=0;i<4;i++) estrella4(-a*0.4+i*a*0.35,-a*0.6+((i*37)%40),10+6*Math.abs(Math.sin(t*3+i)),'#FFFFFF'); ctx.restore(); chk('obj',x-a*k,y-a*k,x+a*k,y+a*0.2*k); }
function cohete(x,y,s,t,fuego){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ocupa(-90,-520,90,0,1.1);
  if(fuego){ for(let i=0;i<6;i++){ const u=((t*6+i/6)%1); ctx.globalAlpha=1-u; ctx.fillStyle=i%2?'#FFD23F':'#FF8A3D'; blob(Math.sin(i*2)*20,20+u*200,40-u*20); } ctx.globalAlpha=1; }
  ctx.fillStyle='#FF5FA2'; ctx.beginPath(); ctx.moveTo(-70,-40); ctx.lineTo(-140,30); ctx.lineTo(-70,0); ctx.fill(); ctx.beginPath(); ctx.moveTo(70,-40); ctx.lineTo(140,30); ctx.lineTo(70,0); ctx.fill();
  ctx.fillStyle='#FFFFFF'; rr(-70,-420,140,420,60); ctx.fill(); ctx.fillStyle='#E3DDF2'; rr(20,-400,40,380,20); ctx.fill();
  ctx.fillStyle='#FF5FA2'; ctx.beginPath(); ctx.moveTo(-70,-380); ctx.quadraticCurveTo(0,-560,70,-380); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#3AB6FF'; blob(0,-300,36); ctx.fillStyle='#AEE6FF'; blob(-10,-310,14); ctx.restore(); }
function capsula(x,y,s,t,o={}){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.rotate(o.rot||0); ocupa(-200,-230,200,200,1.1);
  if(o.para){ ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=4; for(const xx of [-200,-80,80,200]){ ctx.beginPath(); ctx.moveTo(0,-200); ctx.lineTo(xx*1.4,-560); ctx.stroke(); }
    ctx.fillStyle='#FF8A3D'; ctx.beginPath(); ctx.ellipse(0,-570,320,150,0,Math.PI,0); ctx.fill(); ctx.fillStyle='#FFFFFF'; for(const xx of [-160,0,160]){ ctx.beginPath(); ctx.moveTo(xx-55,-570); ctx.quadraticCurveTo(xx,-700+Math.abs(xx)*0.4,xx+55,-570); ctx.fill(); } }
  ctx.fillStyle='#BFB8D8'; blob(0,0,200); ctx.fillStyle='#E3DDF2'; blob(-20,-20,180); ctx.fillStyle='#8E86B0'; for(let i=0;i<8;i++){ const a=i/8*PI2; blob(Math.cos(a)*150,Math.sin(a)*150,10); }
  ctx.fillStyle='#3AB6FF'; blob(0,-40,60); ctx.fillStyle='#AEE6FF'; blob(-16,-56,22);
  if(o.charola){ ctx.fillStyle='#FFD23F'; rr(140,-30,240,40,10); ctx.fill(); ctx.fillStyle='#E0A800'; ctx.fillRect(150,10,220,12); }
  if(o.tostado){ ctx.fillStyle='rgba(255,138,61,0.3)'; blob(0,0,200); } ctx.restore(); }
function secadora(x,y,s,k,t,on){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(-s*k,s*k); ocupa(-160,-90,140,220,1.1);
  ctx.fillStyle='#FF5FA2'; rr(-150,-80,240,140,60); ctx.fill(); rr(60,-50,90,80,20); ctx.fill(); ctx.fillStyle='#D93E86'; rr(-70,40,70,170,30); ctx.fill(); ctx.fillStyle='#FFFFFF'; blob(-40,-10,30);
  ctx.restore(); if(on){ ctx.save(); ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=8; ctx.lineCap='round'; for(let i=0;i<5;i++){ const u=((t*2.4+i/5)%1); const xx=x-110*s-u*300; ctx.globalAlpha=1-u; ctx.beginPath(); ctx.moveTo(xx,y-30+(i-2)*22); ctx.quadraticCurveTo(xx-30,y-50+(i-2)*22,xx-60,y-30+(i-2)*22); ctx.stroke(); } ctx.restore(); } }

}
