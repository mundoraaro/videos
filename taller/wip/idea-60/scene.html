<script>
// mar-001-v2 — "¡Si todos nos aventamos al mar, sube menos que un cabello!". Serie "¿Qué pasaría si TODOS…?" (sucesora de saltar-001).
// Raro salvavidas (DISFRACES.salvavidas) → buzo (escenas de agua) → playero (el viaje a la playa) → salvavidas (loop).
// ---------- utilería propia de este video ----------
const AGUA='#3AB6FF';
// agua al frente (tapa la parte baja de los que están "dentro" del mar)
function aguaFrente(t,y,c1='#2E9BEA',c2='#86D8FF',a=1){ ctx.save(); ctx.globalAlpha=a;
  ctx.fillStyle=c1; ctx.beginPath(); ctx.moveTo(-200,2200); for(let x=-200;x<=1280;x+=20) ctx.lineTo(x,y+Math.sin(x*0.016+t*3)*16+Math.sin(x*0.005-t*1.3)*10); ctx.lineTo(1280,2200); ctx.fill();
  ctx.fillStyle=c2; for(let x=-200;x<=1280;x+=90){ const yy=y+Math.sin(x*0.016+t*3)*16+Math.sin(x*0.005-t*1.3)*10; ctx.beginPath(); ctx.ellipse(x+30,yy+4,34,8,0,0,Math.PI*2); ctx.fill(); }
  ctx.restore(); }
function splashFx(t,t0,x,y,s=1){ const u=(t-t0)/0.5; if(u<0||u>1) return; ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.globalAlpha=1-u*0.8; ctx.fillStyle='#FFFFFF';
  for(let i=0;i<9;i++){ const a=-Math.PI*(0.1+0.8*i/8), d=easeOut(u)*(90+rand(i)*80); const yy=Math.sin(a)*d+u*u*160; blob(Math.cos(a)*d,yy,14*(1-u)+6); }
  ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=10*(1-u)+2; ctx.beginPath(); ctx.ellipse(0,0,60+u*140,(60+u*140)*0.25,0,0,Math.PI*2); ctx.stroke(); ctx.restore(); }
// medidor del nivel del mar (poste con regla); v = desplazamiento de la aguja en px
function medidor(x,y,t,v=0,txt='NIVEL: +0',k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k);
  ctx.fillStyle='#1E1A2E'; rr(-40,-560,80,600,26); ctx.fill(); ctx.fillStyle='#FFF8E6'; rr(-30,-550,60,580,20); ctx.fill();
  ctx.fillStyle='#1E1A2E'; for(let i=0;i<12;i++) ctx.fillRect(-30,-520+i*44,i%2?20:34,6);
  ctx.fillStyle='#E8323C'; ctx.beginPath(); const ny=-280-v; ctx.moveTo(-36,ny); ctx.lineTo(-80,ny-24); ctx.lineTo(-80,ny+24); ctx.closePath(); ctx.fill(); ctx.fillRect(-36,ny-4,72,8);
  ctx.restore(); ocupa(x-90*k,y-560*k,x+45*k,y+40*k,1.5);
  if(txt) letrero(txt,x-50,y-640*k,k,'panel',{tam:50,t,t0:-1}); }
function garrafon(x,y,s,k=1,t=0){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); ctx.rotate(Math.sin(t*2+x)*0.03);
  ctx.fillStyle='rgba(120,200,255,0.75)'; rr(-70,-230,140,230,40); ctx.fill(); ctx.fillStyle='rgba(60,160,240,0.85)'; rr(-62,-170+Math.sin(t*3+x)*4,124,162,34); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.55)'; rr(-50,-210,20,150,10); ctx.fill(); ctx.fillStyle='rgba(120,200,255,0.9)'; rr(-30,-280,60,60,14); ctx.fill();
  ctx.fillStyle='#2B6FD6'; rr(-36,-300,72,30,10); ctx.fill(); ctx.fillStyle='rgba(255,255,255,0.6)'; for(const yy of [-120,-60]) ctx.fillRect(-70,yy,140,6);
  ctx.restore(); ocupa(x-70*s*k,y-300*s*k,x+70*s*k,y,1.5); }
// cubo de gente (isométrico, con caritas de colores)
function cuboGente(x,y,L,k=1,t=0){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k);
  const h=L*0.5, cols=['#FF9EBB','#86F2E2','#FFE36B','#B9A8F5','#FFB27A','#9BE7A0'];
  const cara=(pts,c1)=>{ ctx.fillStyle=c1; ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.fill(); };
  const A=[0,-L-h], B=[L*0.87,-L-h*0], Cc=[0,-L+h], D=[-L*0.87,-L];
  cara([[0,-2*L+0],[L*0.87,-1.5*L],[0,-L],[-L*0.87,-1.5*L]],'#FFFFFF'); // tapa
  cara([[-L*0.87,-1.5*L],[0,-L],[0,0],[-L*0.87,-0.5*L]],'#E9E3F7');    // izquierda
  cara([[0,-L],[L*0.87,-1.5*L],[L*0.87,-0.5*L],[0,0]],'#D4CCEA');      // derecha
  // caritas (puntos de colores con ojitos) en las tres caras
  const n=7; for(let i=0;i<n;i++) for(let j=0;j<n;j++){ const u=(i+0.5)/n, v=(j+0.5)/n, c=cols[(i*3+j*5)%6], r=L*0.045;
    const P=[[ -L*0.87*(1-u), -1.5*L+(0.5*L)*u + L*v - 0.0 ],[ L*0.87*u, -L-0.5*L*u+L*v ],[ -L*0.87+L*0.87*u+L*0.87*v*0 , 0 ]];
    for(const [px,py] of [[-L*0.87+L*0.87*u, -1.5*L+0.5*L*u+L*v],[L*0.87*u, -L-0.5*L*u+L*v],[(u-v)*L*0.87, -1.5*L+(u+v)*0.5*L]]){
      ctx.fillStyle=c; blob(px,py,r); ctx.fillStyle='#1E1A2E'; blob(px-r*0.35,py-r*0.15,r*0.18); blob(px+r*0.35,py-r*0.15,r*0.18); } }
  ctx.restore(); ocupa(x-L*0.87*k,y-2*L*k,x+L*0.87*k,y,2); }
function alberca(t,y0){ // alberca olímpica en perspectiva con carriles
  ctx.save(); ctx.fillStyle='#FFF4DC'; ctx.beginPath(); ctx.moveTo(60,y0); ctx.lineTo(1020,y0); ctx.lineTo(1180,y0+620); ctx.lineTo(-100,y0+620); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#2EA8F0'; ctx.beginPath(); ctx.moveTo(110,y0+30); ctx.lineTo(970,y0+30); ctx.lineTo(1100,y0+600); ctx.lineTo(-20,y0+600); ctx.closePath(); ctx.fill();
  for(let i=1;i<8;i++){ const xa=110+i*(860/8), xb=-20+i*(1120/8); ctx.strokeStyle=i%2?'#FFD23F':'#FF5FA2'; ctx.lineWidth=8; ctx.setLineDash([22,16]); ctx.beginPath(); ctx.moveTo(xa,y0+30); ctx.lineTo(xb,y0+600); ctx.stroke(); }
  ctx.setLineDash([]); ctx.fillStyle='rgba(255,255,255,0.35)'; for(let i=0;i<8;i++){ const yy=y0+80+i*66; ctx.beginPath(); ctx.ellipse(540+Math.sin(t*2+i)*200,yy,120,8,0,0,Math.PI*2); ctx.fill(); }
  ctx.restore(); }
function gotero(x,y,s,t){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.rotate(0.15);
  ctx.fillStyle='#FF5FA2'; rr(-36,-260,72,90,30); ctx.fill(); ctx.fillStyle='rgba(230,248,255,0.85)'; rr(-24,-180,48,170,14); ctx.fill(); ctx.fillStyle=AGUA; rr(-18,-110,36,96,10); ctx.fill();
  ctx.fillStyle='rgba(230,248,255,0.85)'; ctx.beginPath(); ctx.moveTo(-14,-12); ctx.lineTo(14,-12); ctx.lineTo(3,40); ctx.lineTo(-3,40); ctx.fill(); ctx.restore(); }
function gotaF(x,y,r){ ctx.fillStyle=AGUA; ctx.beginPath(); ctx.moveTo(x,y-r*1.6); ctx.quadraticCurveTo(x+r,y-r*0.2,x,y+r); ctx.quadraticCurveTo(x-r,y-r*0.2,x,y-r*1.6); ctx.fill(); ctx.fillStyle='rgba(255,255,255,0.7)'; blob(x-r*0.3,y-r*0.2,r*0.25); }
function regla(x,y,w,t,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.fillStyle='#1E1A2E'; rr(-w/2-8,-8,w+16,156,24); ctx.fill(); ctx.fillStyle='#FFD23F'; rr(-w/2,0,w,140,18); ctx.fill();
  ctx.fillStyle='#1E1A2E'; for(let i=0;i<=10;i++){ const xx=-w/2+30+i*(w-60)/10; ctx.fillRect(xx-3,0,6,i%5?40:70); }
  ctx.font=fuente(34); ctx.textAlign='center'; ctx.fillText('0',-w/2+30,110); ctx.fillText('1 MM',w/2-30,110); ctx.restore(); ocupa(x-w/2*k,y,x+w/2*k,y+150*k,1.5); }
function lupa(x,y,r,a,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.scale(k,k);
  ctx.fillStyle='#7A3A12'; rr(-24,r,48,r*1.4,24); ctx.fill(); ctx.fillStyle='#1E1A2E'; blob(0,0,r+22); ctx.fillStyle='rgba(200,240,255,0.35)'; blob(0,0,r);
  ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.ellipse(-r*0.4,-r*0.4,r*0.25,r*0.1,-0.7,0,Math.PI*2); ctx.fill(); ctx.restore(); }
function reloj(x,y,r,t,vel,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k);
  ctx.fillStyle='#1E1A2E'; blob(6,8,r+14); ctx.fillStyle='#FFD23F'; blob(0,0,r+14); ctx.fillStyle='#FFF8E6'; blob(0,0,r);
  ctx.fillStyle='#1E1A2E'; for(let i=0;i<12;i++){ const a=i/12*Math.PI*2; blob(Math.cos(a)*r*0.82,Math.sin(a)*r*0.82,i%3?5:10); }
  ctx.strokeStyle='#1E1A2E'; ctx.lineCap='round'; ctx.lineWidth=12; const a=-Math.PI/2+t*vel; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*r*0.7,Math.sin(a)*r*0.7); ctx.stroke();
  ctx.lineWidth=16; const b=-Math.PI/2+t*vel/12; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(b)*r*0.45,Math.sin(b)*r*0.45); ctx.stroke(); blob(0,0,14);
  ctx.restore(); ocupa(x-r-14,y-r-14,x+r+14,y+r+14,2.5); }
function bocadillo(x,y,txt,k,tam=48,col='#FFFFFF',tinta='#1E1A2E',cola=null){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.font=fuente(tam);
  const w=ctx.measureText(txt).width+tam*1.1, h=tam*1.7;
  if(cola){ ctx.fillStyle=tinta; ctx.beginPath(); ctx.moveTo(cola[0]-28,h/2-6); ctx.lineTo(cola[0]+28,h/2-6); ctx.lineTo(cola[1],h/2+60); ctx.fill(); }
  ctx.fillStyle=tinta; rr(-w/2+5,-h/2+7,w,h,h/2); ctx.fill(); ctx.fillStyle=col; rr(-w/2,-h/2,w,h,h/2); ctx.fill();
  if(cola){ ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(cola[0]-18,h/2-10); ctx.lineTo(cola[0]+18,h/2-10); ctx.lineTo(cola[1]*0.92,h/2+44); ctx.fill(); }
  ctx.fillStyle=tinta; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,0,3); ctx.restore(); ocupa(x-w/2,y-h/2,x+w/2,y+h/2,2.5); }
function calendario(x,y,s,txt,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k); ctx.rotate(-0.06);
  ctx.fillStyle='#1E1A2E'; rr(-150,-170,300,330,30); ctx.fill(); ctx.fillStyle='#FFFFFF'; rr(-140,-160,280,310,24); ctx.fill(); ctx.fillStyle='#E23D5B'; rr(-140,-160,280,80,24); ctx.fill(); ctx.fillRect(-140,-110,280,30);
  ctx.fillStyle='#FFFFFF'; ctx.font=fuente(44); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('AÑO',0,-118); ctx.fillStyle='#1E1A2E'; ctx.font=fuente(96); ctx.fillText(txt,0,40);
  ctx.restore(); ocupa(x-150*s*k,y-170*s*k,x+150*s*k,y+160*s*k,2.5); }
function sombrilla(x,y,s,c1,c2,t){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.rotate(Math.sin(t*1.5+x)*0.04);
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(-6,-300,12,300); for(let i=0;i<6;i++){ ctx.fillStyle=i%2?c1:c2; ctx.beginPath(); ctx.moveTo(0,-300); ctx.arc(0,-300,170,Math.PI+i*Math.PI/6,Math.PI+(i+1)*Math.PI/6); ctx.closePath(); ctx.fill(); }
  ctx.restore(); }
function arena(t,y,c='#FFE3A3',c2='#F5CF7E'){ ctx.fillStyle=c; ctx.fillRect(-200,y,1480,900); ctx.fillStyle=c2; for(let i=0;i<12;i++) blob(((rand(i)*1400)%1400)-160,y+50+rand(i+3)*360,8+rand(i+5)*16); }
function tierra(x,y,r,t){ ctx.save(); ctx.translate(x,y); ctx.fillStyle='rgba(134,216,255,0.25)'; blob(0,0,r*1.12);
  ctx.fillStyle='#2E9BEA'; blob(0,0,r); ctx.save(); ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.clip(); ctx.fillStyle='#3FC46E';
  const sh=(t*40)%(r*4); for(const [cx,cy,cr] of [[-0.4,-0.3,0.35],[0.3,0.2,0.4],[-0.1,0.55,0.22],[0.55,-0.5,0.2]]) for(const o of [0,-r*4]){ blob(cx*r+sh+o-r*2+r*2,cy*r,cr*r); blob(cx*r+sh+o-r*2+r*2+r*0.25,cy*r+r*0.12,cr*r*0.8); }
  ctx.restore(); ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.ellipse(-r*0.4,-r*0.45,r*0.28,r*0.12,-0.6,0,Math.PI*2); ctx.fill(); ctx.restore(); ocupa(x-r,y-r,x+r,y+r,2); }
// multitud de gomitas que saltan al agua (fase propia cada una)
function multitudSalta(t,y,n,s,xs,seed=0){ for(let i=0;i<n;i++){ const ph=((t*1.3+rand(i+seed)*1.0)%1), x=xs[0]+(xs[1]-xs[0])*(i/(n-1))+Math.sin(i*7)*30;
  const alto=Math.sin(ph*Math.PI)*(160+rand(i+seed+3)*120); gomita({x,y,s,t,seed:i+seed,expr:ph<0.5?'feliz':'risa',brazos:'arriba',piernas:'flota',alto,tilt:Math.sin(i)*0.2,npc_peso:0.4,sinSombra:true});
  if(ph<0.08) splashFx(t,t-ph/1.3,x,y,0.6*s/0.4); } }
const PAST=['#FF9EBB','#86F2E2','#FFE36B','#B9A8F5','#FFB27A','#9BE7A0'];
function cabecita(x,y,r,t,i){ // cabeza de gomita asomando del agua
  const yy=y+Math.sin(t*3+i)*8; ctx.fillStyle=PAST[i%6]; blob(x,yy,r); ctx.fillStyle='rgba(255,255,255,0.5)'; blob(x-r*0.4,yy-r*0.45,r*0.18);
  ctx.fillStyle='#1E1A2E'; blob(x-r*0.32,yy-r*0.1,r*0.12); blob(x+r*0.32,yy-r*0.1,r*0.12); ctx.strokeStyle='#1E1A2E'; ctx.lineWidth=r*0.08; ctx.beginPath(); ctx.arc(x,yy+r*0.15,r*0.22,0.15*Math.PI,0.85*Math.PI); ctx.stroke(); }

// ---------- escenas ----------
// S1 · cuadro 0 = gancho: Raro salvavidas YA en el aire cayendo DE BOMBA al mar (hecho bolita) y detrás una lluvia de gomitas cayendo de bomba con splash;
//      letrero "¡TODOS AL MAR!" y el medidor marcando "+0.0015 MM" desde el cuadro 0, con la aguja quieta. En "cabello" Raro, flotando, voltea al medidor con cara de "¿neta?".
//      Fondo cielo olas. Toma: push.
const BOMBA_A=470, BOMBA_T=0.6;
function multitudBomba(t,n,xs,seed){ // gomitas que caen de bomba al agua del fondo y luego asoman la cabeza
  for(let i=0;i<n;i++){ const per=1.5+rand(i+seed)*0.5, off=rand(i+seed+7)*per, ph=((t+off)%per)/per, x=xs[0]+(xs[1]-xs[0])*(i/(n-1))+Math.sin(i*7)*25;
    const caeF=0.32; if(ph<caeF){ const u=ph/caeF; gomita({x,y:1300,s:0.34,t,seed:i+seed,expr:'risa',brazos:'frente',piernas:'flota',alto:BOMBA_A*0.8*(1-u*u),tilt:u*5,sq:0.2,npc_peso:0.3,sinSombra:true}); }
    else { cabecita(x,1290,24,t,i+seed); if(ph<caeF+0.1) splashFx(t,t-(ph-caeF)*per,x,1300,0.7); } } }
function raroBomba(t,alto,cayendo,mira,expr){
  raro({x:430,y:1500,s:1.25,t,expr:expr,mira:mira?{x:0.95,y:-0.25}:undefined,brazos:cayendo?'frente':'arriba',manos:cayendo?{i:[-70,-80],d:[70,-80]}:undefined,piernas:'flota',disfraz:'salvavidas',alto,tilt:cayendo?Math.sin(t*9)*0.25:Math.sin(t*3)*0.06,sq:cayendo?0.18:0}); }
function fondoHook(t){ multitudBomba(t,8,[60,780],0); aguaFrente(t,1300,'#5CC4FF','#B8E9FF',0.95); }
function frenteHook(t,sc){ aguaFrente(t,1440); medidor(830,1430,t,0,'+0.0015 MM');
  letrero('¡TODOS AL MAR!',440,400,1,'madera',{sinPalo:true,tam:84,t,t0:-1}); }
function S1(t,sc){
  fondoHook(t);
  const cay=t<BOMBA_T, u=Math.min(1,t/BOMBA_T), mira=t>=at(10);
  const alto=cay?BOMBA_A*(1-u*u):-70+Math.sin((t-BOMBA_T)*4)*18+Math.max(0,1-(t-BOMBA_T)*3)*-80;
  raroBomba(t,alto,cay,mira,mira?'sospecha':(cay?'risa':'feliz'));
  frenteHook(t,sc);
  splashFx(t,BOMBA_T,430,1440,2.2); if(t>BOMBA_T) ondaChoque(t,BOMBA_T,430,1440);
  chispas(t,at(10),830,800,1.2,'#FFFFFF');
}
// S2 · "¿Cómo que no? Somos 8,200 millones": Raro en la torre de salvavidas pita con el silbato; la playa se llena de gomitas en cascada y el panel cuenta hasta 8,200 MILLONES.
//      Fondo mandarina cerros. Toma: pull (para que se vea la multitud).
function S2(t,sc){
  cascada(t,sc.start+0.15,24,(x,y,k,i)=>gomita({x,y:y,s:0.3*k,t,seed:i,expr:'feliz',brazos:i%3?'arriba':'saluda',alto:Math.abs(Math.sin(t*6+i))*20,npc_peso:0.3}),{x0:120,y0:1150,cols:8,dx:120,dy:110,cada:0.045});
  // torre de salvavidas
  ctx.fillStyle='#B97A3E'; ctx.fillRect(700,1060,18,380); ctx.fillRect(900,1060,18,380); ctx.fillStyle='#9C6230'; rr(680,1040,260,40,14); ctx.fill();
  ctx.fillStyle='#E8323C'; rr(690,760,240,24,12); ctx.fill();
  const pita=t>=at(11)&&t<at(14);
  raro({x:810,y:1045,s:0.72,t,expr:pita?'sospecha':'asombro',mira:pita?{x:-0.2,y:0.1}:undefined,brazos:pita?'jarras':'arriba',disfraz:'salvavidas',silbato:pita,sq:gelatina(t,at(14)),wob:wobble(t,at(14))});
  ocupa(680,740,940,1080,2);
  const v=contador(t,sc.start+0.1,Math.max(0.3,at(16)-sc.start-0.1),0,8200,'');
  letrero(v+' MILLONES',540,420,popIn(t,sc.start+0.05),'panel',{tam:70,t,t0:at(15)});
  chispas(t,at(16),540,420,1.3,'#FFD23F');
}
// S3 · "Cada quien ocupa como tres garrafones de agua": Raro carga un garrafón sobre la cabeza y a su lado brincan otros dos al decir "tres". Letrero "TÚ ≈ 62 LITROS".
//      Fondo turquesa interior. Toma: paneo-izq.
function S3(t,sc){
  const k1=popIn(t,at(21)), k2=popIn(t,at(21)+0.14), k3=popIn(t,at(21)+0.28);
  garrafon(690,1440,1.15,k2,t); garrafon(880,1440,1.15,k3,t);
  const b=brinco(t,at(22),0.45,120);
  raro({x:350,y:1440,s:1.05,t,expr:t>=at(22)?'orgullo':'asombro',brazos:'carga',disfraz:'salvavidas',alto:b.alto,sq:b.sq,wob:b.wob});
  garrafon(350,1440-b.alto-420*1.05+40,0.9,Math.max(k1,t>=sc.start+0.1?1:0),t);
  letrero('TÚ ≈ 62 LITROS',540,420,popIn(t,sc.start+0.05),'madera',{sinPalo:true,tam:76,t,t0:sc.start});
  chispas(t,at(21),690,1100,1); chispas(t,at(21)+0.28,880,1100,1);
}
// S4 · "Juntos, como medio kilómetro cúbico de gente": las gomitas caen y se acomodan en un cubo gigante de caritas; Raro señala asombrado.
//      Fondo magenta cerros. Toma: push.
