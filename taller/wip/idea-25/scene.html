<body><canvas id="c" width="1080" height="1920"></canvas>

<script src="../../raro.js"></script>
<script>
// nutrias-001 — "Si fueras nutria, dormirías de la mano… o amanecerías solo." Raro con mameluco de nutria marina.
const PI=Math.PI;
window.SUELO_Y=1400; const Y0=1400;
const ac=o=>acostadoCfg({cabezaArriba:0.42,...o});
// ---------- helpers de la escena ----------
const bob=(t,f=1.6,a=14,ph=0)=>Math.sin(t*f+ph)*a;
function aguaFrente(t,y,a=0.88,amp=26){ const P=PAL_ACTUAL; ctx.save();
  ctx.globalAlpha=a; ctx.fillStyle=mix(P.medio,P.oscuro,0.25); ctx.beginPath(); ctx.moveTo(-300,2300);
  for(let x=-300;x<=1380;x+=20) ctx.lineTo(x,y+Math.sin(x*0.011+t*2.2)*amp+Math.sin(x*0.027-t*1.3)*amp*0.4); ctx.lineTo(1380,2300); ctx.fill();
  ctx.globalAlpha=Math.min(1,a+0.1); ctx.strokeStyle=mix(P.claro,'#FFFFFF',0.5); ctx.lineWidth=12; ctx.lineCap='round'; ctx.beginPath();
  for(let x=-300;x<=1380;x+=20){ const yy=y+Math.sin(x*0.011+t*2.2)*amp+Math.sin(x*0.027-t*1.3)*amp*0.4; x===-300?ctx.moveTo(x,yy):ctx.lineTo(x,yy); } ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.6)'; for(let i=0;i<7;i++){ const x=((rand(i)*1500+t*60)%1500)-200; ctx.beginPath(); ctx.ellipse(x,y+40+rand(i+2)*160,40+rand(i+4)*40,7,0,0,PI*2); ctx.fill(); }
  ctx.restore(); }
function zzz(t,x,y,t0=-9,s=1){ if(t<t0) return; ctx.save(); ctx.font=fuente(64*s); ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=0;i<3;i++){ const u=((t-t0)*0.6+i/3)%1; ctx.globalAlpha=Math.sin(u*PI); ctx.lineWidth=10*s; ctx.strokeStyle='#1E1A2E'; ctx.fillStyle='#FFFFFF';
    const xx=x+u*90*s+Math.sin(u*8)*14, yy=y-u*190*s, sz=0.6+u*0.7; ctx.save(); ctx.translate(xx,yy); ctx.scale(sz,sz); ctx.strokeText('Z',0,0); ctx.fillText('Z',0,0); ctx.restore(); }
  ctx.restore(); }
function horizonte(t,o={}){ const P=PAL_ACTUAL, y=o.y||1060;
  if(o.sol){ const sy=y-40-(o.sube?easeOut(prog(t,o.sube,1.4))*160:0); ctx.fillStyle=mix(P.claro,'#FFFFFF',0.55); blob(o.solX||760,sy,130); ctx.fillStyle='rgba(255,255,255,0.25)'; blob(o.solX||760,sy,190); }
  if(o.luna){ ctx.fillStyle='#FFF6D8'; blob(780,380,92); ctx.fillStyle=mix(P.medio,P.claro,0.2); blob(822,352,80); }
  if(o.estrellas){ for(let i=0;i<26;i++){ ctx.globalAlpha=0.5+0.5*Math.sin(t*3+i); estrella4(rand(i)*1080,170+rand(i+5)*700,6+rand(i+9)*10,'#FFFFFF'); } ctx.globalAlpha=1; }
  const capa=(yy,c,a,f,sp)=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(-300,2300); for(let x=-300;x<=1380;x+=24) ctx.lineTo(x,yy+Math.sin(x*f+t*sp)*a); ctx.lineTo(1380,2300); ctx.fill(); };
  capa(y,mix(P.claro,P.medio,0.35),8,0.02,1.2);
  ctx.fillStyle='rgba(255,255,255,0.35)'; for(let i=0;i<10;i++){ const x=((rand(i)*1400+t*30)%1400)-160; ctx.fillRect(x,y+30+rand(i+1)*90,60+rand(i+2)*90,6); }
  capa(y+170,P.medio,18,0.014,1.6);
  capa(y+420,mix(P.medio,P.oscuro,0.45),26,0.01,2);
}
function corriente(t,y0,y1,f=1,dir=1){ ctx.save(); ctx.lineCap='round'; ctx.strokeStyle='rgba(255,255,255,0.8)';
  for(let i=0;i<10;i++){ const L=120+rand(i)*200, y=y0+rand(i+3)*(y1-y0), sp=(500+rand(i+5)*500)*f; let x=((t*sp+rand(i+7)*2000)%1700)-300; if(dir<0) x=1080-x;
    ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+dir*L,y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+dir*L,y); ctx.lineTo(x+dir*(L-26),y-16); ctx.moveTo(x+dir*L,y); ctx.lineTo(x+dir*(L-26),y+16); ctx.stroke(); }
  ctx.restore(); }
// pareja tomada de la mano: G (gomita, atrás) y R (Raro, adelante). Devuelve la posición de las manos.
function pareja(t,R,G,opts={}){ const r=ac({cabezaArriba:0.62,...R}), g=ac({cabezaArriba:0.62,...G,derecha:true});   // cabeza con cabeza: G a la izquierda (cabeza a la derecha), Raro a la derecha
  const sr=aMundo(r,136,-172), sg=aMundo(g,-136,-172);
  const M=opts.M||[(sr[0]+sg[0])/2,Math.min(sr[1],sg[1])-110];
  r.manos={...(r.manos||{}),d:aLocal(r,M[0],M[1])}; g.manos={...(g.manos||{}),i:aLocal(g,M[0],M[1])};
  gomita({...g,disfraz:'nutria'}); raro({...r,disfraz:'nutria'});
  if(!opts.sinApriete){ ctx.save(); ctx.globalAlpha=0.9; ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=6; ctx.lineCap='round'; const pu=1+0.15*Math.sin(t*12);
    for(const a of [-2.4,-1.57,-0.7]){ ctx.beginPath(); ctx.moveTo(M[0]+Math.cos(a)*34*pu,M[1]+Math.sin(a)*34*pu); ctx.lineTo(M[0]+Math.cos(a)*56*pu,M[1]+Math.sin(a)*56*pu); ctx.stroke(); } ctx.restore(); }
  return M; }
function alga(x,y,h,t,c,gro=40,ph=0){ ctx.strokeStyle=c; ctx.lineCap='round'; ctx.lineWidth=gro; ctx.beginPath(); ctx.moveTo(x,y);
  for(let k=1;k<=12;k++){ const u=k/12; ctx.lineTo(x+Math.sin(u*3+t*1.5+ph)*50*u, y-h*u); } ctx.stroke();
  ctx.fillStyle=c; for(let k=2;k<=12;k+=2){ const u=k/12, px=x+Math.sin(u*3+t*1.5+ph)*50*u, py=y-h*u; hoja(px,py,70,-PI/2+(k%4?0.9:-0.9)+Math.sin(t*2+k)*0.1,c); } }
function ancla(x,y,k,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); ctx.rotate(Math.sin(t*2)*0.08);
  ctx.strokeStyle='#4A4560'; ctx.lineWidth=26; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(0,-120); ctx.lineTo(0,110); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,30,96,0.15*PI,0.85*PI); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-60,-70); ctx.lineTo(60,-70); ctx.stroke();
  ctx.lineWidth=18; ctx.beginPath(); ctx.arc(0,-150,30,0,PI*2); ctx.stroke(); ctx.restore(); }
function nutriaChica(x,y,s,t,seed,dormida=false){ // cabecita de nutria asomada en el agua (para balsas lejanas)
  const yy=y+bob(t,1.8,8,seed); ctx.save(); ctx.translate(x,yy); ctx.scale(s,s); ctx.rotate(Math.sin(t*1.5+seed)*0.1);
  ctx.fillStyle='#6E4A33'; ctx.beginPath(); ctx.ellipse(0,70,110,60,0,0,PI*2); ctx.fill();
  ctx.fillStyle='#4E3322'; for(const sx of [-1,1]) blob(sx*92,-60,22);
  ctx.fillStyle='#E6D7BE'; blob(0,0,100); ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.ellipse(-40,-50,26,12,-0.5,0,PI*2); ctx.fill();
  ctx.fillStyle='#1E1A2E'; if(dormida){ ctx.lineWidth=8; ctx.strokeStyle='#1E1A2E'; ctx.lineCap='round'; for(const sx of [-1,1]){ ctx.beginPath(); ctx.arc(sx*36,-6,14,0.2,PI-0.2); ctx.stroke(); } }
  else for(const sx of [-1,1]){ ctx.beginPath(); ctx.ellipse(sx*36,-10,12,16*parpadeo(t,seed),0,0,PI*2); ctx.fill(); }
  blob(0,18,14); ctx.strokeStyle='#5A4636'; ctx.lineWidth=4; for(const sx of [-1,1]) for(const k of [-1,1]){ ctx.beginPath(); ctx.moveTo(sx*24,26+k*6); ctx.lineTo(sx*80,22+k*14); ctx.stroke(); }
  ctx.fillStyle='#4E3322'; for(const sx of [-1,1]){ ctx.beginPath(); ctx.ellipse(sx*50,74,26,18,0,0,PI*2); ctx.fill(); }
  ctx.restore(); }
function taco(x,y,s,a=0){ ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.scale(s,s);
  ctx.fillStyle='#E9B04A'; ctx.beginPath(); ctx.arc(0,0,70,PI,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#7FD34E'; for(let i=-2;i<=2;i++) blob(i*24,-18-Math.abs(i)*2,16); ctx.fillStyle='#E2453C'; blob(-20,-30,10); blob(22,-26,9);
  ctx.fillStyle='#F7C66B'; ctx.beginPath(); ctx.arc(0,0,70,PI,0); ctx.lineTo(56,0); ctx.arc(0,0,56,0,PI,true); ctx.closePath(); ctx.fill(); ctx.restore(); }
function bascula(x,y,txt,k,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k);
  ctx.fillStyle='#3E3A55'; rr(-190,-40,380,70,30); ctx.fill(); ctx.fillStyle='#E9E6F5'; rr(-180,-56,360,50,22); ctx.fill();
  ctx.fillStyle='#1B1F3B'; rr(-90,-36,180,62,14); ctx.restore(); }
function estampilla(x,y,s,t,k=1){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.rotate(-0.08+Math.sin(t*2)*0.03); ctx.scale(s*k,s*k);
  ctx.fillStyle='#FFFFFF'; ctx.beginPath(); const W2=150,H2=180; ctx.rect(-W2,-H2,W2*2,H2*2); ctx.fill();
  ctx.fillStyle=PAL_ACTUAL.claro; for(let i=0;i<=12;i++){ for(const [px,py] of [[-W2+i*25,-H2],[-W2+i*25,H2],[-W2,-H2+i*30],[W2,-H2+i*30]]) blob(px,py,9); }
  ctx.fillStyle='#6E4A33'; rr(-122,-152,244,304,10); ctx.fill();
  ctx.strokeStyle='#8E6749'; ctx.lineWidth=3; for(let i=0;i<260;i++){ const px=-115+rand(i)*230, py=-145+rand(i+500)*290; ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+3,py+12); ctx.stroke(); }
  ctx.strokeStyle='#4E3322'; for(let i=0;i<160;i++){ const px=-115+rand(i+9)*230, py=-145+rand(i+900)*290; ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px-2,py+10); ctx.stroke(); }
  ctx.restore(); if(typeof ocupa==='function') ocupa(x-160*s*k,y-190*s*k,x+160*s*k,y+190*s*k,2); }
function envolver(r,k,t){ if(k<=0) return; ctx.save(); ctx.translate(r.x,r.y-(r.alto||0)); ctx.rotate(r.tilt); ctx.scale(r.s,r.s); ctx.lineCap='round';
  for(const [y,c] of [[-110,'#7E9420'],[-190,'#9DB52C'],[-60,'#9DB52C']]){ ctx.strokeStyle=c; ctx.lineWidth=34; ctx.beginPath(); const x0=-185, x1=lerp(x0,185,k);
    ctx.moveTo(x0,y+20); ctx.quadraticCurveTo((x0+x1)/2,y-30+Math.sin(t*3+y)*6,x1,y+10); ctx.stroke();
    ctx.fillStyle=c; if(k>0.9) hoja(x1,y+10,60,-0.4+Math.sin(t*3)*0.1,c); }
  ctx.restore(); }
function chorro(t,t0,x,y,s=1){ const u=(t-t0)/0.6; if(u<0||u>1) return; ctx.save(); ctx.fillStyle='rgba(255,255,255,0.9)';
  for(let i=0;i<14;i++){ const a=-PI/2+(rand(i)-0.5)*1.6, v=(260+rand(i+3)*260)*s; blob(x+Math.cos(a)*v*u, y+Math.sin(a)*v*u+500*u*u*s, (16+rand(i+5)*14)*(1-u*0.6)*s); }
  ctx.restore(); }
function burbujas(t,x,y,n=8,s=1){ ctx.save(); ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=5; for(let i=0;i<n;i++){ const u=((t*0.8+rand(i))%1); ctx.globalAlpha=1-u; ctx.beginPath(); ctx.arc(x+Math.sin(u*9+i)*30*s+(rand(i+2)-0.5)*120*s, y-u*300*s, (8+rand(i+4)*14)*s,0,PI*2); ctx.stroke(); } ctx.restore(); }
function corazon(x,y,k,t){ if(k<=0) return; ctx.save(); ctx.translate(x,y-Math.sin(t*3)*8); ctx.scale(k,k); heartPath(70); ctx.fillStyle='#FF5FA2'; ctx.fill(); ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.ellipse(-18,-12,8,12,-0.6,0,PI*2); ctx.fill(); ctx.restore(); }
function agarraderas(t,k){ if(k<=0) return; ctx.save(); ctx.globalAlpha=k; ctx.fillStyle='#C9CFDA'; ctx.fillRect(-200,560,1480,22);
  for(let i=0;i<7;i++){ const x=40+i*170, sw=Math.sin(t*3+i)*0.12; ctx.save(); ctx.translate(x,580); ctx.rotate(sw); ctx.strokeStyle='#C9CFDA'; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,110); ctx.stroke();
    ctx.strokeStyle='#FF8A1F'; ctx.lineWidth=14; ctx.beginPath(); ctx.arc(0,150,40,0,PI*2); ctx.stroke(); ctx.restore(); } ctx.restore(); }
function superficieDesdeAbajo(t,y){ const P=PAL_ACTUAL; ctx.save(); ctx.fillStyle=mix(P.claro,'#FFFFFF',0.45); ctx.beginPath(); ctx.moveTo(-300,-300);
  ctx.lineTo(-300,y); for(let x=-300;x<=1380;x+=20) ctx.lineTo(x,y+Math.sin(x*0.012+t*2)*18); ctx.lineTo(1380,-300); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=10; ctx.beginPath(); for(let x=-300;x<=1380;x+=20){ const yy=y+Math.sin(x*0.012+t*2)*18; x===-300?ctx.moveTo(x,yy):ctx.lineTo(x,yy);} ctx.stroke(); ctx.restore(); }

// ========== ESCENAS ==========
// S1 (0–3.1 s) GANCHO. Mar de noche violeta (olas). Raro nutria flota boca arriba tomado de la mano de una nutria gomita; la corriente
// la jala hacia la derecha y el brazo de goma de Raro se estira. Letrero "¡NO TE SUELTES!" desde el cuadro 0. Toma: push, cerrado medio.
function parejaCorriente(t,t0,fin=false){ const lt=t-t0;
  const tir= fin? 30+60*easeInOut(prog(t,at(194),1.0)) : 90+70*Math.sin(lt*2.4)**2;   // cuánto la jala la corriente
  const Rx=830, Ry=1350+bob(t,1.7,12), Gx=270-tir*0.7, Gy=1330+bob(t,1.7,12,1.3);
  corriente(t,1200,1520,1.3,-1);
  const exprR= fin? (t>=at(195)&&t<TL.duration-0.45?'feliz':'terror') : (t<0.9?'terror':'apenado');
  pareja(t,{x:Rx,y:Ry,s:0.95,t,expr:exprR,viento:0.6,wob:Math.sin(t*9)*0.2},{x:Gx,y:Gy,s:0.85,t,expr:'risa',seed:2,color:'#FFB8D2'});
  aguaFrente(t,1375,0.86);
  return {Rx,Ry,Gx,Gy}; }
function S1(t,sc){
  parejaCorriente(t,0);
  zzz(t,330,1000,-1,0.9);
  letrero('¡NO TE SUELTES!',540,410,1,'madera',{tam:76,t,t0:-1});
  chispas(t,at(6),620,1060,1.2);
}
// S2 (3.1–4.6) "o amanecerías solo." Amanecer en el horizonte (liso, cielo). Se suelta: la gomita sale disparada a la derecha y se hace chiquita;
// Raro se queda solo, llora. Toma: push a su cara.
function S2(t,sc){
  horizonte(t,{sol:true,sube:sc.start,solX:300,y:1080});
  const u=easeIn(prog(t,at(8)-0.1,0.7)), gx=640+u*700, gs=0.9-u*0.55;
  nutriaChicaV(gx,1330-u*120,gs,t);
  const r={...ac({x:640,y:1400+bob(t,1.6,10),s:1.15,t,expr:t>=at(9)?'llanto':'asombro',brazos:'frente',manos:{d:[260+120*(1-u),-260],i:[-150,-60]},wob:wobble(t,at(8),1)})};
  raro({...r,disfraz:'nutria'});
  aguaFrente(t,1410,0.86);
  if(t>=at(9)) letrero('SOLITO',540,420,popIn(t,at(9)),'pergamino',{tam:70,t,t0:at(9)});
}
function nutriaChicaV(x,y,s,t){ gomita({...ac({x,y:y+bob(t,1.8,8,2),s,t,seed:2,expr:'risa',brazos:'frente'}),disfraz:'nutria',color:'#FFB8D2',npc_peso:0.4}); }
// S3 (4.6–6.5) "Porque tu cama sería el mar." Olas turquesa. Raro acostado con almohada y cobija sobre el agua, se acomoda feliz.
// Letrero "TU CAMA: EL MAR". Toma: pull (abre).
function S3(t,sc){
  const y=1340+bob(t,1.5,16), x=760;
  const r=ac({x,y,s:1.1,t,expr:'feliz',brazos:'frente',manos:{d:[60,-300],i:[-60,-300]},sq:gelatina(t,sc.start+0.05)});
  const al=aMundo(r,0,-330); ctx.fillStyle='#FFFFFF'; rr(al[0]-150,al[1]-50,140,110,40); ctx.fill(); ctx.fillStyle='#E9E6F5'; rr(al[0]-140,al[1]+10,120,40,20); ctx.fill();
  raro({...r,disfraz:'nutria'});
  // cobija a cuadros encima
  const k=popIn(t,at(12)); if(k>0){ ctx.save(); const c=aMundo(r,0,-110); ctx.translate(c[0],c[1]); ctx.rotate(0.02); ctx.scale(k,k); ctx.fillStyle='#FF5FA2'; rr(-150,-40,320,170,40); ctx.fill();
    ctx.fillStyle='#FFB8D2'; for(let i=0;i<4;i++) ctx.fillRect(-140+i*80,-40,30,170); ctx.restore(); }
  aguaFrente(t,1390,0.82);
  letrero('TU CAMA: EL MAR',540,420,popIn(t,at(12)),'madera',{tam:72,t,t0:at(12)});
  chorro(t,at(15),900,1300,1); chispas(t,at(15),560,1060,1.1);
}
// S4 (6.5–8.6) "Te duermes flotando boca arriba," Atardecer mandarina (liso). Cerrado a la cara de Raro dormido, de lado se voltea panza arriba.
function S4(t,sc){
  horizonte(t,{sol:true,solX:820,y:1040});
  const flip=easeOut(prog(t,at(19),0.3));
  const r=ac({x:780,y:1370+bob(t,1.4,14),s:1.25,t,expr:'risa',brazos:'frente',cabezaArriba:lerp(0.7,0.12,flip),wob:wobble(t,at(19)+0.3,1),sq:gelatina(t,at(19)+0.3,0.3)});
  raro({...r,disfraz:'nutria'});
  zzz(t,330,980,sc.start,1.1);
  aguaFrente(t,1420,0.85);
  if(t>=at(19)) letrero('BOCA ARRIBA',540,420,popIn(t,at(19)),'pergamino',{tam:68,t,t0:at(19)});
}
// S5 (8.6–10) "y la corriente te jala." Olas magenta, flechas de corriente; Raro dormido es arrastrado a toda velocidad y despierta en "jala".
function S5(t,sc){
  corriente(t,1050,1500,2.2,1); rachas(t,1.1,0.5,900,1500);
  const u=prog(t,sc.start,sc.end-sc.start), x=lerp(420,980,easeIn(u));
  const r=ac({x,y:1370+bob(t,4,10),s:1.1,t,expr:t>=at(25)?'terror':'risa',brazos:t>=at(25)?'arriba':'frente',viento:1,wob:wobble(t,at(25),1.4)});
  raro({...r,disfraz:'nutria'});
  aguaFrente(t,1400,0.85);
  if(t<at(25)) zzz(t,x-420,1000,sc.start,0.9);
  letrero('¡CORRIENTE!',540,420,popIn(t,at(23)),'panel',{tam:70,t,t0:at(23)});
}
// S6 (10–12.4) "Así que agarras la pata de otra nutria…" Horizonte de día limón. Pasa una nutria gomita y Raro estira el brazo de goma y la atrapa.
function S6(t,sc){
  horizonte(t,{sol:true,solX:880,y:1000});
  const g=prog(t,at(28),0.35);
  const Gx=lerp(-120,250,easeOut(clamp((t-sc.start)/(at(28)-sc.start)))), Gy=1330+bob(t,1.6,10,1);
  const R={x:830,y:1350+bob(t,1.6,10),s:0.95,t,expr:t>=at(28)?'orgullo':'sospecha',wob:wobble(t,at(28),1)};
  if(t<at(28)){ gomita({...ac({cabezaArriba:0.62,x:Gx,y:Gy,s:0.85,t,seed:4,expr:'feliz',color:'#B8E6FF',derecha:true}),disfraz:'nutria'});
    const r=ac({cabezaArriba:0.62,...R}); const tgt=aMundo(ac({cabezaArriba:0.62,x:Gx,y:Gy,s:0.85,t,derecha:true}),-136,-172); const M=[lerp(700,tgt[0]+60,easeOut(prog(t,sc.start,at(28)-sc.start))),tgt[1]-110];
    r.manos={d:aLocal(r,M[0],M[1])}; raro({...r,disfraz:'nutria'}); }
  else pareja(t,R,{x:Gx,y:Gy,s:0.85,t,seed:4,expr:'feliz',color:'#B8E6FF'});
  aguaFrente(t,1400,0.85);
  chispas(t,at(28),500,1000,1.3); corazon(520,760,popIn(t,at(33)),t);
}
// S7 (12.4–15.4) "o te enredas en algas, como cobija con ancla." Bajo el agua (mar turquesa) viendo hacia arriba: Raro flota en la superficie
// y unas algas lo envuelven como cobija; abajo cae un ancla hasta la arena.
function S7(t,sc){
