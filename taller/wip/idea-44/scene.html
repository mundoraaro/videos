function S1(t,sc){ // HOOK: Raro rana YA congelado como paleta de hielo (con palo), temblando; nieve. Eventos: 3 rana tiembla, 5 grietas brillan, 7 PALETA (letrero)

  raro({x:540,y:SUELO+40,s:1.0,t,expr:t>at(178)?'orgullo':'terror',brazos:p.despues?'carga':'idle',disfraz:'rana',banda:p.despues,spin:p.spin,sq:gelatina(t,sc.start+0.4)+(p.despues?-0.08*lift:0),wob:wobble(t,sc.start+0.4)});
  if(p.despues){ mancuerna(540,SUELO+40-440-lift*40,1.0,t); ocupa(340,SUELO-500,740,SUELO-330,2); }
  nubePuf(t,sc.start+0.12,540,SUELO-180,1.5);
  if(t>at(178)) { hielo(540,SUELO+40,1.0,prog(t,at(178),0.4)*0.6,t); }
  cartel('GYM DE HIELO',540,340,popIn(t,at(177)),'madera',{tam:70,t,t0:at(177)});
}
function S25(t,sc){ // Primavera: sale el sol (181), flores brotan, el hielo se derrite (185) en gotas
  sol2(840,620,90,t,popIn(t,at(181)));
  for(let i=0;i<6;i++) flor(110+i*175,SUELO+90+(i%2)*40,popIn(t,at(181)+i*0.08),t,DULCES[i%DULCES.length],i);
  const mel=prog(t,at(183),0.9);
  raro({x:480,y:SUELO,s:1.1,t,expr:mel>0.6?'asombro':'yavalio',brazos:'idle',disfraz:'rana',mira:{x:0,y:-20}});
  hielo(480,SUELO,1.1,1-mel,t);
  if(mel>0) for(let i=0;i<6;i++){ const u=((t*1.3+i/6)%1); gota(330+i*60,SUELO-420+u*420,10,false); }
  cartel('PRIMAVERA',540,340,popIn(t,at(181)),'madera',{tam:76,t,t0:at(181)});
}

function S27(t,sc){ // Al charco (195 brinca y salpica) a buscar novia (197 puf a galán con moño y flor; 198 aparece la novia)
  charco(560,SUELO+120,330,t);
  const b=brinco(t,at(193),0.5,260), p=pufCambio(t,at(197));
  raro({x:440,y:SUELO+90,s:0.95,t,expr:t>at(198)?'apenado':'feliz',brazos:p.despues?'frente':'arriba',disfraz:'rana',galan:p.despues,spin:p.spin,sq:b.sq,alto:b.alto,wob:b.wob,rubor:t>at(198)?1:0});

  nubePuf(t,at(197)+0.08,440,SUELO-90,1.2);

}
function S28(t,sc){ // ¿Tú qué estación te saltarías? Raro mira a cámara; 4 estaciones giran; 206 brinca por encima del copo
  const est=[['sol',0],['hoja',1],['copo',2],['flor',3]];
  for(const [n,i] of est){ const a=i/4*Math.PI*2+(t-sc.start)*1.4; const x=540+Math.cos(a)*360, y=820+Math.sin(a)*180; const k=popIn(t,sc.start+i*0.08);
    if(n==='sol') sol2(x,y,50,t,k); else if(n==='hoja') { ctx.save(); ctx.translate(x,y); ctx.scale(k,k); hoja(-60,0,120,-0.3,'#FF8A3D'); ctx.restore(); } else if(n==='copo') { if(k>0) copo(x,y,60*k,t); } else flor(x,y+60,k,t,'#FF5FA2',i); }
  ocupa(160,620,920,1020,1);
  const b=brinco(t,at(206),0.5,300);
  raro({x:540,y:SUELO,s:1.15,t,expr:t>at(206)?'risa':'sospecha',brazos:'jarras',disfraz:'rana',mira:{x:0,y:0},sq:b.sq+gelatina(t,sc.start,0.3),alto:b.alto,wob:b.wob});
}
function S29(t,sc){ // LOOP: "Porque si fueras esta rana…" → se vuelve a congelar como paleta y queda igual que el cuadro 0
  const y=SUELO-190, s=1.0, k=easeOut(prog(t,at(207),at(211)-at(207)+0.3));
  palo(540,y+30*s,1.0*popIn(t,sc.start));
  raro({x:540,y,s,t,expr:k>0.5?'terror':'asombro',brazos:k>0.3?'arriba':'idle',disfraz:'rana',sinSombra:true,mira:{x:0,y:0},sq:gelatina(t,sc.start,0.4)});
  hielo(540,y,s,k,t);
  nevada(t,18);
  cartel('PALETA DE RANA',540,340,popIn(t,at(210)),'madera',{tam:64,t,t0:at(210)});
}
