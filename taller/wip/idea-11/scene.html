<script>
// wombat-001 — "Este animal hace popó en cubitos". Raro de wómbat (mameluco), de científico y de ingeniero.
// ---------- utilidades del video ----------
const POPO={c:'#7A4A2A',top:'#A06E44',lado:'#55311A'};
const HIELO={c:'#BDF0FF',top:'#E6FBFF',lado:'#8FD6F2'};
function cubo(x,y,s=1,rot=0,k=1,opts={}){ if(k<=0.001) return; const P=opts.pal||POPO;
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s*k,s*k);
  ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(6,44,52,10,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=P.top; ctx.beginPath(); ctx.moveTo(-40,-38); ctx.lineTo(-22,-58); ctx.lineTo(58,-58); ctx.lineTo(40,-38); ctx.closePath(); ctx.fill();
  ctx.fillStyle=P.lado; ctx.beginPath(); ctx.moveTo(38,-40); ctx.lineTo(58,-58); ctx.lineTo(58,20); ctx.lineTo(38,40); ctx.closePath(); ctx.fill();
  ctx.fillStyle=P.c; rr(-42,-40,84,82,16); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.32)'; ctx.beginPath(); ctx.ellipse(-20,-22,14,7,-0.5,0,Math.PI*2); ctx.fill();
  if(opts.dado){ ctx.fillStyle='#FFF4DC'; for(const [a,b] of [[-20,-18],[20,22],[0,2]]){ ctx.globalAlpha=opts.dado; ctx.beginPath(); ctx.arc(a,b,9,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1; }
  ctx.restore(); }
function pila(t,x,y,n,s=0.62){ // pila de cubitos (de abajo hacia arriba)
  let i=0; for(let r=0;r<5&&i<n;r++){ const per=5-r; for(let c=0;c<per&&i<n;c++,i++){ cubo(x+(c-(per-1)/2)*58*s/0.62+(r%2)*6, y-r*52*s/0.62, s, Math.sin(i*1.7)*0.06, 1); } }
}
function tripa(pts,gros,color,t,ond=10){ // intestino: manguera rosa con brillo
  const path=()=>{ ctx.beginPath(); pts.forEach(([x,y],i)=>{ const yy=y+Math.sin(t*3+i*0.9)*ond; i?ctx.lineTo(x,yy):ctx.moveTo(x,yy); }); };
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  path(); ctx.strokeStyle=mix(color,'#5B2A4A',0.3); ctx.lineWidth=gros+12; ctx.stroke();
  path(); ctx.strokeStyle=color; ctx.lineWidth=gros; ctx.stroke();
  path(); ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=gros*0.22; ctx.translate(0,-gros*0.22); ctx.stroke();
  ctx.restore(); }
function serpentina(x0,x1,y0,filas,dy,n=60,u=1){ const pts=[]; const N=Math.max(2,Math.round(n*u));
  for(let i=0;i<=N;i++){ const v=i/n*filas; const f=Math.floor(v), fr=v-f; const dirx=f%2? -1:1; const xa=dirx>0?x0:x1, xb=dirx>0?x1:x0;
    pts.push([lerp(xa,xb,fr), y0+f*dy+Math.sin(fr*Math.PI)*12]); } return pts; }
function interrogacion(t,t0,x,y,s=1){ const k=popIn(t,t0); if(k<=0) return; ctx.save(); ctx.translate(x,y+Math.sin(t*4+x)*8); ctx.rotate(Math.sin(t*3+x)*0.15); ctx.scale(k*s,k*s);
  ctx.fillStyle='#FFFFFF'; blob(0,0,56); ctx.font=fuente(80); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#1E1A2E'; ctx.fillText('?',0,6); ctx.restore(); }
function olor(t,x,y){ ctx.save(); ctx.strokeStyle='rgba(170,230,90,0.85)'; ctx.lineWidth=12; ctx.lineCap='round';
  for(let i=0;i<3;i++){ const ph=(t*0.9+i/3)%1; ctx.globalAlpha=Math.sin(ph*Math.PI); ctx.beginPath(); for(let k=0;k<=10;k++){ const u=k/10; ctx.lineTo(x+(i-1)*60+Math.sin(u*7+t*6+i)*16, y-ph*120-u*120); } ctx.stroke(); } ctx.restore(); }
function piedra(x,y,w,h,c){ ctx.fillStyle=mix(c,'#000000',0.18); ctx.beginPath(); ctx.ellipse(x+8,y+8,w,h,0,Math.PI,0); ctx.fill(); ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(x,y,w,h,0,Math.PI,0); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.ellipse(x-w*0.35,y-h*0.6,w*0.25,h*0.12,-0.3,0,Math.PI*2); ctx.fill(); }
function tronco(x,y,w,r){ ctx.fillStyle='#8A5A34'; rr(x-w/2,y-2*r,w,2*r,r); ctx.fill(); ctx.fillStyle='#C99A6E'; ctx.beginPath(); ctx.ellipse(x+w/2-r*0.4,y-r,r*0.5,r,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#9A6B45'; ctx.lineWidth=5; ctx.beginPath(); ctx.ellipse(x+w/2-r*0.4,y-r,r*0.25,r*0.5,0,0,Math.PI*2); ctx.stroke(); }
const ZORRO={ // depredador: gomita durazno con orejas de punta y cola esponjada (personaje genérico, sin bufanda)
  atras(o){ ctx.fillStyle='#FF9F6B'; ctx.save(); ctx.translate(-150,-110); ctx.rotate(-0.6+Math.sin(o.t*10)*0.25); ctx.beginPath(); ctx.ellipse(-60,0,90,40,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.ellipse(-120,0,34,26,0,0,Math.PI*2); ctx.fill(); ctx.restore();
    for(const s of [-1,1]){ ctx.fillStyle='#FF9F6B'; ctx.beginPath(); ctx.moveTo(s*60,-350); ctx.lineTo(s*130,-470); ctx.lineTo(s*140,-320); ctx.closePath(); ctx.fill(); ctx.fillStyle='#FFE0CF'; ctx.beginPath(); ctx.moveTo(s*85,-350); ctx.lineTo(s*128,-430); ctx.lineTo(s*128,-340); ctx.closePath(); ctx.fill(); } },
  frente(o){ ctx.fillStyle='#1E1A2E'; ctx.beginPath(); ctx.ellipse(0,-258,16,11,0,0,Math.PI*2); ctx.fill(); }
};
function madriguera(x,y,s,c){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle=mix(c,'#000000',0.12); ctx.beginPath(); ctx.ellipse(0,0,330,200,0,Math.PI,0); ctx.fill();
  ctx.fillStyle=mix(c,'#FFFFFF',0.15); ctx.beginPath(); ctx.ellipse(-90,-140,90,26,-0.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2A1830'; ctx.beginPath(); ctx.ellipse(0,0,150,120,0,Math.PI,0); ctx.fill(); ctx.restore(); }
function pompas(x,y,s,t,w=0){ // trasero del mameluco de wómbat tapando la entrada: placas duras y colita
  ctx.save(); ctx.translate(x,y); ctx.scale(s*(1+w*0.06),s*(1-w*0.06));
  ctx.fillStyle='#7E5434'; ctx.beginPath(); ctx.ellipse(0,0,150,122,0,Math.PI,0); ctx.fill();
  ctx.fillStyle='#9A6B45'; ctx.beginPath(); ctx.ellipse(-8,-6,136,110,0,Math.PI,0); ctx.fill();
  ctx.strokeStyle='#6B4428'; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(0,-110); ctx.lineTo(0,-4); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.beginPath(); ctx.ellipse(-70,-80,30,14,-0.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#C99A6E'; blob(0,-100,22); ctx.restore(); }
function wombatLado(x,y,s,t,k=1){ // esquema de perfil: la bolsa abre hacia atrás
  if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(s*k,s*k);
  const b=Math.sin(t*3)*4;
  ctx.fillStyle='#7E5434'; for(const lx of [-150,-70,90,160]) { rr(lx-26,40,52,70,22); ctx.fill(); }
  ctx.fillStyle='#9A6B45'; ctx.beginPath(); ctx.ellipse(0,b,250,130,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(220,-40+b,110,95,0.1,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#7E5434'; ctx.beginPath(); ctx.ellipse(190,-128+b,30,36,-0.3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#5A3A22'; ctx.beginPath(); ctx.ellipse(318,-30+b,36,30,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1E1A2E'; ctx.beginPath(); ctx.arc(262,-62+b,12,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.arc(266,-66+b,4,0,Math.PI*2); ctx.fill();
  // bolsa: abertura hacia atrás (izquierda) con la cría asomándose
  ctx.fillStyle='#C99A6E'; ctx.beginPath(); ctx.ellipse(-30,60+b,130,62,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#4A2A16'; ctx.beginPath(); ctx.ellipse(-140,50+b,24,40,0.3,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.translate(-150,40+b+Math.sin(t*5)*6); ctx.scale(0.22,0.22); gomita({x:0,y:0,s:1,t,expr:'feliz',color:'#E7B9A0',seed:4,sinSombra:true}); ctx.restore();
  ctx.restore(); }
function flecha(x,y,dir,k,c='#D7FF3D'){ if(k<=0) return; ctx.save(); ctx.translate(x,y); ctx.scale(dir*k,k); ctx.fillStyle='#1E1A2E'; ctx.beginPath(); ctx.moveTo(-6,-36); ctx.lineTo(-106,-36); ctx.lineTo(-106,-70); ctx.lineTo(-176,4); ctx.lineTo(-106,78); ctx.lineTo(-106,44); ctx.lineTo(-6,44); ctx.closePath(); ctx.fill();
  ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(-100,-30); ctx.lineTo(-100,-60); ctx.lineTo(-166,0); ctx.lineTo(-100,60); ctx.lineTo(-100,30); ctx.lineTo(0,30); ctx.closePath(); ctx.fill(); ctx.restore(); }
function tierra(t,t0,x,y,dir=1){ if(t<t0) return; ctx.save(); for(let i=0;i<14;i++){ const ph=((t-t0)*1.8+i/14)%1; const vx=dir*(240+rand(i)*260), vy=-(500+rand(i+3)*400);
  const px=x+vx*ph, py=y+vy*ph+900*ph*ph; ctx.globalAlpha=1-ph*0.6; ctx.fillStyle=i%2?'#B5763C':'#8A5A2E'; blob(px,py,14+rand(i+5)*16); } ctx.restore(); }
function laboratorio(t,P){ // fondo propio: pared lejana, repisas con frascos, mesa (3 capas)
  ctx.fillStyle=mix(P.claro,'#FFFFFF',0.25); ctx.fillRect(-300,-300,1680,1400);
  ctx.fillStyle=P.medio; for(const y of [520,760]){ rr(80,y,920,26,13); ctx.fill(); }
  const fr=[['#FF5FA2',140],['#D7FF3D',300],['#FFD23F',470],['#B388FF',640],['#4CC9F0',820]];
  for(const [c,x] of fr) for(const y of [520,760]){ ctx.fillStyle=c; ctx.globalAlpha=0.85; rr(x-30+((y/10)%3)*14,y-110,60,110,24); ctx.fill(); ctx.fillStyle='#FFFFFF'; ctx.globalAlpha=0.6; rr(x-14,y-150,28,44,8); ctx.fill(); ctx.globalAlpha=1;
    ctx.fillStyle='rgba(255,255,255,0.7)'; blob(x-10+((y/10)%3)*14,y-80-((t*40+x)%60),6); }
  ctx.fillStyle=P.oscuro; ctx.fillRect(-300,1100,1680,1000);
  ctx.fillStyle=mix(P.oscuro,P.medio,0.4); rr(-100,1080,1280,60,30); ctx.fill(); }
function fondoPropio(t,P,layers){ // liso con 3 capas de círculos para profundidad
  ctx.fillStyle=mix(P.claro,P.medio,0.3); for(let i=0;i<5;i++) blob(100+i*230+Math.sin(t*0.5+i)*20, 520+rand(i)*500, 120+rand(i+2)*90);
  ctx.fillStyle=mix(P.medio,P.oscuro,0.3); for(let i=0;i<3;i++) blob(-60+i*600, 1700, 420);
}

// ---------- escenas ----------
// S1 (cuadro 0 = gancho): Raro de wómbat orgulloso junto a su pila de cubitos; caen más con click. Fondo mandarina desierto.
function S1(t,sc){ escenaLoop(t,sc,false); }
function escenaLoop(t,sc,fin){
  pila(t,280,SUELO-40,15,0.8);
  const n=Math.floor((t-sc.start)/0.45);
  for(let j=0;j<3;j++){ const t0=sc.start+0.1+j*0.5; if(t<t0) continue; const u=clamp((t-t0)/0.3); cubo(470-u*60, lerp(SUELO-500,SUELO-330,easeIn(u)), 0.62, u*2, 1); }
  const kw=fin? at(213) : at(5); const vuelve=fin&&t>=W[215].e+0.15;
  const w=wobble(t,kw,1.1);
  const sorpresa=t>=kw&&!vuelve;
  raro({x:700,y:SUELO,s:1.32,t,expr:sorpresa?'asombro':'orgullo',brazos:sorpresa?'arriba':'jarras',disfraz:'wombat',sq:gelatina(t,kw,0.4),wob:w,tilt:-0.05});
  letrero('POPÓ EN CUBITOS',540,420,fin?1:Math.max(popIn(t,-1),1),'madera',{tam:70,t,t0:sc.start});
  chispas(t,kw,300,SUELO-300,1.4);
  ocupa(60,SUELO-360,500,SUELO,2);
}
// S2: "Se llama wómbat, vive en Australia": salta de alegría, letrero de Australia. turquesa selva
function S2(t,sc){
  const b=brinco(t,at(8),0.5,220), sal=saleArriba(t,sc.end);
  raro({x:420,y:SUELO,s:1.3,t,expr:'feliz',brazos:t>at(9)?'saluda':'idle',disfraz:'wombat',alto:b.alto+sal.alto,sq:b.sq+sal.sq,wob:b.wob});
  letrero('WÓMBAT',540,380,popIn(t,at(8)),'madera',{tam:84,t,t0:at(8)});
  letrero('AUSTRALIA',800,560,popIn(t,at(11)),'pergamino',{tam:58,t,t0:at(11)});
  chispas(t,at(8),540,380,1.2);
}
// S3: noche, cae y suelta cubitos: contador hasta 100. violeta cerros con luna
function S3(t,sc){
  ctx.fillStyle='#FFF3B0'; blob(840,330,90); ctx.fillStyle='rgba(255,243,176,0.25)'; blob(840,330,140);
  const c=caida(t,sc.start);
  const n=Math.floor(clamp((t-at(16))/1.2)*24);
  pila(t,300,SUELO-40,n);
  raro({x:740,y:SUELO,s:1.25,t,expr:t>at(17)?'asombro':'neutral',brazos:t>at(17)?'cara':'idle',disfraz:'wombat',alto:c.alto,sq:c.sq,wob:c.wob});
  letrero(t<at(16)?'CADA NOCHE':contador(t,at(16),1.0,0,100)+' CUBITOS',540,460,popIn(t,at(13)),'panel',{tam:66,t,t0:at(13)});
  ocupa(130,SUELO-300,480,SUELO,2);
}
// S4: "2 cm, como dados": cubito enorme con regla; se vuelve dado. Raro mira a cámara (sospecha). limon cielo
function S4(t,sc){
  const k=popIn(t,sc.start+0.05);
  cubo(380,980,2.6,Math.sin(t*2)*0.05,k,{dado:clamp((t-at(23))/0.2)});
  ctx.fillStyle='#FFD23F'; rr(220,1170,330,46,10); ctx.fill(); ctx.fillStyle='#1E1A2E'; for(let i=0;i<=10;i++) ctx.fillRect(228+i*31,1170,4,i%5?16:28);
  letrero('2 CM',380,700,popIn(t,at(21)),'panel',{tam:80,t,t0:at(21)});
  raro({x:810,y:SUELO,s:1.0,t,expr:t>at(22)?'sospecha':'asombro',mira:t>at(22)?{x:0,y:0}:undefined,brazos:'jarras',disfraz:'wombat',sq:gelatina(t,at(23),0.3),wob:wobble(t,at(23))});
  chispas(t,at(23),380,980,1.5);
  ocupa(220,760,560,1220,2.5);
}
// S5: "¿cómo le salen cuadrados si su colita es redonda?": cubo vs bolita con ? entre ellos. magenta cerros
function S5(t,sc){
  const k1=popIn(t,at(28)), k2=popIn(t,at(31));
  cubo(260,640,1.5,Math.sin(t*3)*0.1,k1);
  if(k2>0){ ctx.save(); ctx.translate(820,640+Math.sin(t*4)*10); ctx.scale(k2,k2); ctx.fillStyle='#9A6B45'; blob(0,0,80); ctx.fillStyle='rgba(255,255,255,0.3)'; blob(-26,-26,20); ctx.restore(); }
  interrogacion(t,at(29),540,640,1.1);
  ocupa(150,520,950,760,2.5);
  raro({x:540,y:SUELO,s:1.3,t,expr:'sospecha',brazos:t>at(31)?'senala':'jarras',disfraz:'wombat',tilt:Math.sin(t*2)*0.06,wob:wobble(t,at(28),0.6)});
  // la colita redonda del mameluco asoma de lado
  ctx.fillStyle='#C99A6E'; blob(540-200+Math.sin(t*6)*6,SUELO-70,30);
}
// S6: puf -> científico; dos colegas gomita con signos de pregunta. Laboratorio cielo
function S6(t,sc){
  laboratorio(t,PAL_ACTUAL);
  const p=pufCambio(t,sc.start+0.12);
  gomita({x:190,y:1120,s:0.85,t,expr:'sospecha',disfraz:'cientifico',color:'#FFB8D2',seed:1,brazos:'cara'});
  gomita({x:890,y:1120,s:0.85,t,expr:'asombro',disfraz:'cientifico',color:'#C9F2B8',seed:2,brazos:'jarras'});
  interrogacion(t,at(37),190,720,0.8); interrogacion(t,at(37)+0.2,890,720,0.8);
  raro({x:540,y:SUELO,s:1.3,t,expr:p.despues?'sospecha':'asombro',brazos:'frente',disfraz:p.despues?'cientifico':'wombat',spin:p.spin,lupa:true,sq:gelatina(t,sc.start+0.46),wob:wobble(t,sc.start+0.46)});
  nubePuf(t,sc.start+0.2,540,SUELO-160,1.5);

// S7: abren el intestino: tripa sobre la mesa; Raro con lupa se acerca. turquesa liso (laboratorio propio)
function S7(t,sc){
  laboratorio(t,PAL_ACTUAL);
  const u=easeOut(prog(t,at(41),0.8));
  tripa(serpentina(180,900,1180,3,90,60,0.25+0.75*u),56,'#FF8FB0',t,6);

  letrero('INTESTINO',380,480,popIn(t,at(43)),'pergamino',{tam:70,t,t0:at(43)});

// S8: "Alguien tuvo que hacer ese trabajo": primer plano, Raro con asco y olor. mandarina interior
function S8(t,sc){
  raro({x:540,y:SUELO,s:1.35,t,expr:t>at(52)?'yavalio':'asco',brazos:'cara',disfraz:'cientifico',wob:wobble(t,at(53),0.6),tilt:Math.sin(t*1.5)*0.05});
  olor(t,880,1300); olor(t,200,1320);

// S9: tripa de 10 m vs la tuya (~7 m): Raro jala la punta corriendo. violeta cerros
function S9(t,sc){
  const u=easeOut(prog(t,at(55),1.1));
  const pts=serpentina(110,970,580,3,110,90,0.12+0.88*u);
  tripa(pts,44,'#FF8FB0',t,5);
  const tip=pts[pts.length-1];
  letrero(contador(t,at(57),0.7,0,10)+' METROS',540,400,popIn(t,at(57)),'madera',{tam:70,t,t0:at(57)});
  ocupa(90,530,990,830,1.5);
  const k=popIn(t,at(60));
  if(k>0){ const v=easeOut(prog(t,at(60),0.6)); tripa(serpentina(110,970,1030,3,110,90,(0.05+0.95*v)*0.7),34,'#7FD8FF',t,3);
    letrero('TÚ: ~7 M',540,1310,k,'panel',{tam:50,t,t0:at(60)}); ocupa(90,990,990,1280,1.5); }
  raro({x:lerp(200,880,u),y:SUELO+80,s:0.7,t,expr:t>at(60)?'sospecha':'terror',piernas:u<1?'corre':'quieto',brazos:u<1?'frente':'jarras',disfraz:'cientifico',tilt:u<1?0.1:0,alto:u<1?Math.abs(Math.sin(t*14))*10:0});
}
// S10: dos semanas y media: calendario que avanza y la comida que se seca. cielo liso
function S10(t,sc){
  fondoPropio(t,PAL_ACTUAL);
  const d=Math.round(lerp(1,17,easeInOut(prog(t,at(66),1.4))));
  const k=popIn(t,sc.start+0.05);
  ctx.save(); ctx.translate(330,760); ctx.scale(k,k); ctx.rotate(Math.sin(t*2)*0.03);
  ctx.fillStyle='#FFFFFF'; rr(-170,-170,340,330,30); ctx.fill(); ctx.fillStyle='#FF4D6D'; rr(-170,-170,340,90,30); ctx.fill(); ctx.fillRect(-170,-110,340,30);
  ctx.fillStyle='#1E1A2E'; for(const s of [-1,1]) rr(s*90-10,-200,20,60,10), ctx.fill();
  ctx.font=fuente(170); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(d),0,50);
  ctx.font=fuente(40); ctx.fillStyle='#FFFFFF'; ctx.fillText('DÍA',0,-125); ctx.restore();
  ocupa(160,590,500,930,2.5);
  letrero('2 ½ SEMANAS',540,400,popIn(t,at(69)),'panel',{tam:64,t,t0:at(69)});
