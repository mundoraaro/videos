<script>
// cleopatra-001 — "Las pirámides ya eran viejas para Cleopatra" (historia, voz Carito)
// ================= piezas del mundo =================
const PIEDRA={claro:'#FBE3A8', medio:'#F2C878', oscuro:'#D49A4A', linea:'#C08236'};
// pirámide: base en (x,y), ancho w; k = avance de construcción (0..1); vieja = grietas y telarañas (0..1)
function piramide(x,y,w,t,{k=1,vieja=0,brillo=0,tapa=1}={}){
  const h=w*0.64; if(typeof ocupa==='function') ocupa(x-w/2,y-h*k,x+w/2,y,1.2);
  ctx.save(); ctx.translate(x,y);
  ctx.save(); ctx.beginPath(); ctx.rect(-w,-h*k-2,w*2,h*k+4); ctx.clip();
  ctx.fillStyle=PIEDRA.medio; ctx.beginPath(); ctx.moveTo(-w/2,0); ctx.lineTo(0,-h); ctx.lineTo(w*0.12,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle=PIEDRA.oscuro; ctx.beginPath(); ctx.moveTo(w*0.12,0); ctx.lineTo(0,-h); ctx.lineTo(w/2,0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=PIEDRA.linea; ctx.lineWidth=4; ctx.globalAlpha=0.55;
  for(let i=1;i<9;i++){ const yy=-h*i/9, hw=w/2*(1-i/9); ctx.beginPath(); ctx.moveTo(-hw,yy); ctx.lineTo(hw,yy); ctx.stroke();
    for(let j=-4;j<=4;j++){ const xx=j*hw/4.5+((i%2)*hw/9); if(Math.abs(xx)<hw-10){ ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx,yy+h/9); ctx.stroke(); } } }
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.moveTo(-w/2+30,-6); ctx.lineTo(-6,-h+30); ctx.lineTo(-30,-h+70); ctx.lineTo(-w/2+90,-6); ctx.closePath(); ctx.fill();
  ctx.restore();
  if(k>=1 && tapa>0){ ctx.save(); ctx.translate(0,-h); ctx.scale(tapa,tapa); ctx.fillStyle='#FFD23F'; ctx.beginPath(); ctx.moveTo(-w*0.07,h*0.11); ctx.lineTo(0,0); ctx.lineTo(w*0.07,h*0.11); ctx.closePath(); ctx.fill(); ctx.restore(); }
  if(brillo>0){ ctx.save(); ctx.globalAlpha=brillo; estrella4(0,-h-20,60,'#FFFFFF'); ctx.restore(); }
  if(vieja>0){ ctx.save(); ctx.globalAlpha=vieja;
    ctx.strokeStyle='#8A5A22'; ctx.lineWidth=7; ctx.lineCap='round';
    for(const [px,py,l,a] of [[-0.18,-0.25,0.16,0.9],[0.15,-0.45,0.14,2.2],[0.05,-0.12,0.12,1.4]]){ ctx.beginPath(); let cx=px*w, cy=py*h; ctx.moveTo(cx,cy);
      for(let s=0;s<4;s++){ cx+=Math.cos(a+(s%2?0.6:-0.6))*l*w/4; cy+=Math.sin(a+(s%2?0.6:-0.6))*l*w/4; ctx.lineTo(cx,cy);} ctx.stroke(); }
    // telarañas en las esquinas de la base
    ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=3;
    for(const sd of [-1,1]){ const ox=sd*w*0.33, oy=-h*0.3; for(let r=20;r<=80;r+=20){ ctx.beginPath(); for(let a=0;a<=6;a++){ const an=-Math.PI/2+sd*(a/6)*Math.PI/2; ctx.lineTo(ox+Math.cos(an)*r, oy+Math.sin(an)*r);} ctx.stroke(); }
      for(let a=0;a<=6;a++){ const an=-Math.PI/2+sd*(a/6)*Math.PI/2; ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox+Math.cos(an)*90,oy+Math.sin(an)*90); ctx.stroke(); } }
    ctx.restore(); }
  ctx.restore();
}
function bloque(x,y,s=1,rot=0){ ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s,s);
  ctx.fillStyle=PIEDRA.oscuro; rr(-70,-50,146,96,16); ctx.fill(); ctx.fillStyle=PIEDRA.claro; rr(-74,-56,140,92,16); ctx.fill();
  ctx.fillStyle=PIEDRA.medio; rr(-60,-12,112,40,10); ctx.fill(); ctx.restore(); }
function luna(x,y,r,t){ ctx.save(); ctx.translate(x,y); ctx.fillStyle='#FFF7D6'; ctx.shadowColor='#FFFFFF'; ctx.shadowBlur=40; blob(0,0,r); ctx.shadowBlur=0;
  ctx.fillStyle='#EDE0B0'; for(const [a,b,c] of [[-0.3,-0.2,0.22],[0.35,0.15,0.16],[-0.1,0.4,0.12],[0.2,-0.45,0.1]]) blob(a*r,b*r,c*r);
  ctx.restore(); if(typeof ocupa==='function') ocupa(x-r,y-r,x+r,y+r,2); }
function corona(x,y,s,t){ // diadema dorada con cobra: el "icono" de Cleopatra (no se dibuja a la persona)
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.rotate(Math.sin(t*3)*0.05);
  ctx.fillStyle='#E0A82E'; ctx.beginPath(); ctx.ellipse(0,10,90,34,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFD23F'; ctx.beginPath(); ctx.ellipse(0,0,90,30,0,Math.PI,0); ctx.lineTo(90,8); ctx.ellipse(0,8,90,30,0,0,Math.PI); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#2E5BBA'; for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.arc(i*34,10,9,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle='#FFD23F'; ctx.beginPath(); ctx.ellipse(0,-50,22,36,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#FF4D6D'; ctx.beginPath(); ctx.ellipse(0,-52,9,14,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1E1A2E'; ctx.beginPath(); ctx.arc(-7,-70,3.5,0,Math.PI*2); ctx.arc(7,-70,3.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.ellipse(-40,-8,22,7,-0.2,0,Math.PI*2); ctx.fill();
  ctx.restore(); if(typeof ocupa==='function') ocupa(x-95*s,y-95*s,x+95*s,y+45*s,2); }
// regla de tiempo (línea del tiempo) con marcas
function regla(x0,x1,y,P,k=1){ if(k<=0) return; const x=lerp(x0,x0+(x1-x0),k);
  ctx.fillStyle=mix(P.oscuro,'#000000',0.2); rr(x0-10,y+8,x-x0+20,46,23); ctx.fill();
  ctx.fillStyle='#FFF4DC'; rr(x0-10,y,x-x0+20,46,23); ctx.fill();
  ctx.fillStyle=P.oscuro; for(let xx=x0;xx<=x;xx+=40){ ctx.fillRect(xx-2,y+4,4,(Math.round((xx-x0)/40)%4?14:26)); } }
// cinta de medir entre dos puntos (k = cuánto se ha estirado)
function cinta(x0,x1,y,k,color='#FFD23F'){ if(k<=0) return; const x=lerp(x0,x1,k);
  ctx.fillStyle=mix(color,'#000000',0.25); rr(Math.min(x0,x)-4,y-18+6,Math.abs(x-x0)+8,40,14); ctx.fill();
  ctx.fillStyle=color; rr(Math.min(x0,x)-4,y-18,Math.abs(x-x0)+8,40,14); ctx.fill();
  ctx.fillStyle='rgba(30,26,46,0.6)'; const d=Math.sign(x1-x0)||1; for(let xx=x0; d>0? xx<=x : xx>=x; xx+=d*24) ctx.fillRect(xx-1.5,y-18,3,(Math.round(Math.abs(xx-x0)/24)%5?12:22));
  ctx.fillStyle='#C9CFDA'; rr(x0-34,y-34,68,68,16); ctx.fill(); ctx.fillStyle='#FF4D6D'; blob(x0,y,14); }
// barra comparativa
function barra(x,y,w,k,color,txt,t,t0){ if(k<=0) return; ctx.save(); ctx.fillStyle=mix(color,'#000000',0.25); rr(x,y+8,w*k,90,45); ctx.fill(); ctx.fillStyle=color; rr(x,y,w*k,90,45); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.35)'; rr(x+20,y+12,Math.max(0,w*k-40),18,9); ctx.fill();
  if(k>0.6){ ctx.font=fuente(54); ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.lineWidth=10; ctx.strokeStyle='#1E1A2E'; ctx.lineJoin='round'; ctx.strokeText(txt,x+34,y+48); ctx.fillStyle='#FFFFFF'; ctx.fillText(txt,x+34,y+48); }
  ctx.restore(); if(typeof ocupa==='function') ocupa(x,y,x+w,y+90,2.5); }
// otros personajes (gomitas en pastel)
const MAMUT={ atras(o){ ctx.fillStyle=mix(o.color,'#5B3A22',0.35); for(const s of [-1,1]){ ctx.save(); ctx.translate(s*150,-280); ctx.rotate(s*(0.2+Math.sin(o.t*4+s)*0.12)); ctx.beginPath(); ctx.ellipse(s*30,0,70,100,0,0,Math.PI*2); ctx.fill(); ctx.restore(); } },
  cuerpo(o){ ctx.fillStyle=mix(o.color,'#5B3A22',0.3); for(let i=0;i<22;i++){ const x=-170+(i%11)*34, y=-150+Math.floor(i/11)*70; ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x+16+Math.sin(o.t*5+i)*6,y+60,x+30,y); ctx.fill(); } },
  cabeza(o){ ctx.fillStyle=mix(o.color,'#5B3A22',0.4); for(let i=0;i<6;i++){ ctx.save(); ctx.translate(-50+i*20,-370); ctx.rotate((i-2.5)*0.25+Math.sin(o.t*6+i)*0.1); ctx.beginPath(); ctx.moveTo(-10,6); ctx.quadraticCurveTo(0,-70,10,6); ctx.fill(); ctx.restore(); } },
  frente(o){ const lev=o.trompa||0; // colmillos y trompa
    ctx.lineCap='round'; ctx.strokeStyle='#FFF8EC'; ctx.lineWidth=24; for(const s of [-1,1]){ ctx.beginPath(); ctx.moveTo(s*44,-200); ctx.quadraticCurveTo(s*150,-40,s*70,-10); ctx.stroke(); }
    ctx.strokeStyle=mix(o.color,'#5B3A22',0.15); ctx.lineWidth=46; ctx.beginPath(); ctx.moveTo(0,-235);
    const ex=lerp(10,150,lev), ey=lerp(-40,-430,lev); ctx.quadraticCurveTo(lerp(-40,60,lev)+Math.sin(o.t*4)*20,lerp(-120,-200,lev),ex,ey); ctx.stroke();
    ctx.strokeStyle=mix(o.color,'#5B3A22',0.3); ctx.lineWidth=5; for(let i=1;i<6;i++){ const u=i/6; const px=lerp(0,ex,u), py=lerp(-235,ey,u); ctx.beginPath(); ctx.moveTo(px-18,py); ctx.lineTo(px+18,py); ctx.stroke(); } } };
const TREX={ atras(o){ ctx.fillStyle=mix(o.color,'#2E6B3A',0.25); ctx.save(); ctx.translate(-120,-90); ctx.rotate(Math.sin(o.t*5)*0.15); ctx.beginPath(); ctx.moveTo(0,-50); ctx.quadraticCurveTo(-220,-40,-300,20); ctx.quadraticCurveTo(-200,40,0,50); ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.fillStyle=mix(o.color,'#2E6B3A',0.35); for(let i=0;i<5;i++){ ctx.beginPath(); ctx.moveTo(-60+i*40,-372+Math.abs(i-2)*14); ctx.lineTo(-40+i*40,-420+Math.abs(i-2)*14); ctx.lineTo(-20+i*40,-372+Math.abs(i-2)*14); ctx.fill(); } },
  frente(o){ const ab=o.ruge||0; // hocico con dientes y bracitos
    ctx.fillStyle=mix(o.color,'#2E6B3A',0.12); rr(-110,-262+ab*-10,220,70,34); ctx.fill();
    ctx.fillStyle='#3A1430'; rr(-96,-200,192,10+ab*60,12); ctx.fill();
    ctx.fillStyle='#FFFFFF'; for(let i=0;i<7;i++){ const x=-84+i*28; ctx.beginPath(); ctx.moveTo(x,-196); ctx.lineTo(x+10,-178); ctx.lineTo(x+20,-196); ctx.fill(); }
    ctx.fillStyle=mix(o.color,'#2E6B3A',0.12); rr(-100,-192+ab*60,200,40,20); ctx.fill();
    ctx.fillStyle='#1E1A2E'; for(const s of [-1,1]){ ctx.beginPath(); ctx.arc(s*40,-246+ab*-10,6,0,Math.PI*2); ctx.fill(); }
    ctx.strokeStyle=mix(o.color,'#2E6B3A',0.2); ctx.lineWidth=18; ctx.lineCap='round'; for(const s of [-1,1]){ ctx.beginPath(); ctx.moveTo(s*80,-130); ctx.lineTo(s*110,-100+Math.sin(o.t*10+s)*10); ctx.stroke(); } } };
const ESTEGO={ atras(o){ for(let i=0;i<5;i++){ const a=-1.1+i*0.55; ctx.save(); ctx.translate(Math.cos(a-Math.PI/2)*175,-208+Math.sin(a-Math.PI/2)*175); ctx.rotate(a+Math.sin(o.t*3+i)*0.04);
      ctx.fillStyle=i%2?'#FF8A3D':'#FF5FA2'; ctx.beginPath(); ctx.moveTo(-36,30); ctx.lineTo(0,-70); ctx.lineTo(36,30); ctx.closePath(); ctx.fill(); ctx.restore(); }
    ctx.save(); ctx.translate(130,-60); ctx.rotate(-0.3+Math.sin(o.t*4)*0.2); ctx.fillStyle=mix(o.color,'#7A5A10',0.2); rr(0,-20,170,40,20); ctx.fill();
    ctx.fillStyle='#FFFFFF'; for(const x of [120,160]){ ctx.beginPath(); ctx.moveTo(x,-16); ctx.lineTo(x+8,-70); ctx.lineTo(x+18,-16); ctx.fill(); } ctx.restore(); } };
function celular(x,y,s,t,{roto=0,bateria=1}={}){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.rotate(Math.sin(t*2)*0.04);
  ctx.fillStyle='#22223B'; rr(-90,-170,180,340,32); ctx.fill(); ctx.fillStyle='#4CC9F0'; rr(-74,-150,148,300,20); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.moveTo(-74,-60); ctx.lineTo(20,-150); ctx.lineTo(60,-150); ctx.lineTo(-74,-10); ctx.fill();
  // batería
  const parp=bateria<0.1? (Math.sin(t*14)>0?1:0.2):1; ctx.globalAlpha=parp; ctx.fillStyle='#FFFFFF'; rr(-40,-30,72,46,8); ctx.fill(); ctx.fillRect(32,-16,10,18);
  ctx.fillStyle=bateria<0.25?'#FF4D6D':'#6CFFB5'; rr(-34,-24,60*Math.max(0.06,bateria),34,5); ctx.fill(); ctx.globalAlpha=1;
  if(roto>0){ ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=4; ctx.globalAlpha=roto; const cx=30,cy=80; for(let i=0;i<8;i++){ const a=i/8*Math.PI*2; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*(50+rand(i)*60),cy+Math.sin(a)*(50+rand(i)*60)); ctx.stroke(); } ctx.globalAlpha=1; }
  ctx.restore(); if(typeof ocupa==='function') ocupa(x-90*s,y-170*s,x+90*s,y+170*s,2); }
function sombraSuelo(x,y,w){ ctx.save(); ctx.globalAlpha=0.2; ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(x,y+4,w,22,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
// reserva el lugar de un letrero desde el inicio de la escena (los subtítulos nunca se enciman)
function reserva(x,y,w,h){ ocupa(x-w/2-20,y-h/2-20,x+w/2+20,y+h/2+20,8); }
function polvo(t,t0,x,y,s=1){ const u=(t-t0)/0.6; if(u<0||u>1) return; ctx.save(); ctx.fillStyle='rgba(255,246,220,0.85)';
  for(let i=0;i<9;i++){ const a=Math.PI+i/8*Math.PI; ctx.globalAlpha=0.9*(1-u); blob(x+Math.cos(a)*(40+160*easeOut(u))*s, y+Math.sin(a)*(20+60*easeOut(u))*s, (26+rand(i)*20)*(1-u*0.4)*s); } ctx.restore(); }
function numerito(txt,x,y,t,t0,c='#FFFFFF'){ const k=popIn(t,t0); if(k<=0) return; ctx.save(); ctx.translate(x,y-30*prog(t,t0,1.2)); ctx.scale(k,k); ctx.rotate(Math.sin(t*4+x)*0.1);
  ctx.font=fuente(90); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineWidth=16; ctx.lineJoin='round'; ctx.strokeStyle='#1E1A2E'; ctx.strokeText(txt,0,0); ctx.fillStyle=c; ctx.fillText(txt,0,0); ctx.restore(); }

// ================= escenas =================
// S1 (gancho, cuadro 0): Raro faraón junto a una pirámide gigante y vieja (letrero "2560 a.C." ya visible). Fondo mandarina/desierto. Toma: push lento.
// Eventos: 0 todo en pantalla · w1 la pirámide tiembla · w4 "viejas" grietas+telarañas+polvo · w6 "Cleopatra" Raro brinca con chispas.
function escenaVieja(t,sc,base){
  const w=base.w0, t1=at(w+1), tv=at(w+4), tc=at(w+6);
  reserva(540,400,640,130);
  const tb=wobble(t,t1,0.04);
  ctx.save(); ctx.translate(360,SUELO); ctx.rotate(tb); ctx.translate(-360,-SUELO); piramide(360,SUELO,700,t,{vieja:base.ini?Math.max(base.v0,clamp(prog(t,tv,0.3))):clamp(prog(t,tv,0.3))}); ctx.restore();
  polvo(t,tv,360,SUELO-60,1.4); polvo(t,t1,360,SUELO-20,1);
  const b=brinco(t,tc,0.5,220), p=base.puf? pufCambio(t,sc.start+0.02):{spin:0};
  raro({x:800,y:SUELO,s:1.15,t,expr:t<tv?'asombro':(t<tc?'asco':'risa'),brazos:t<tc?'senala':'arriba',espejo:true,disfraz:'faraon',cetro:false,spin:p.spin,
        sq:b.sq+(base.puf?gelatina(t,sc.start+0.36):0),alto:b.alto,wob:b.wob+(base.puf?wobble(t,sc.start+0.36):0)});
  if(base.puf) nubePuf(t,sc.start+0.06,800,SUELO-160,1.2);
  chispas(t,tc+0.4,800,SUELO-500,1.3);
  letrero('2560 a.C.',540,400,base.ini?1:popIn(t,sc.start+0.1),'piedra',{tam:90,t,t0:base.ini?-5:sc.start+0.1});
}
function S1(t,sc){ escenaVieja(t,sc,{w0:0,ini:true,v0:0.35}); }

// S2: línea del tiempo (violeta). Pirámide a la izquierda, corona de Cleopatra a la derecha; Raro faraón camina por la regla. Toma: paneo-der.
// Eventos: start regla+pirámide · w10 "ella" corona pop + letrero · w12 Raro camina · w13 "cerca" Raro brinca junto a la corona.
const XP=170, XC=600, XL=920, YR=1260;   // escala proporcional: -2560 → 150, -69 → 600, 1969 → 950
function lineaTiempo(t,sc,P,{luna:lk=0,corona:ck=1,pir=1}={}){
  regla(80,1010,YR,P,1);
  if(pir>0){ ctx.save(); ctx.translate(XP,YR); ctx.scale(pir,pir); piramide(0,0,250,t,{}); ctx.restore(); }
  if(ck>0) corona(XC,YR-80,1.15*ck,t);
  if(lk>0) luna(XL,YR-120,110*lk,t);
}
function S2(t,sc){
  const P=PAL_ACTUAL; reserva(540,400,620,130);
  lineaTiempo(t,sc,P,{corona:popIn(t,at(10)),pir:popIn(t,sc.start)});
  chispas(t,at(10),XC,YR-120,1.2);
  const xr=t<at(12)?360:lerp(360,760,easeInOut(prog(t,at(12),0.9)));
  const b=brinco(t,at(13)+0.2,0.45,140);
  raro({x:xr,y:YR,s:0.9,t,expr:t<at(13)?'sospecha':'asombro',piernas:t>=at(12)&&t<at(12)+0.9?'camina':'quieto',brazos:'idle',disfraz:'faraon',sq:b.sq,alto:b.alto,wob:b.wob});
  letrero('CLEOPATRA',540,400,popIn(t,at(10)),'pergamino',{tam:76,t,t0:at(10)});
}
// S3: la regla se pinta del otro lado (cielo). "Luna" pop a la derecha y puf a astronauta; flechas: larga (roja) pirámide→Cleopatra, corta (lima) Cleopatra→Luna.
// Eventos: start · w17 cinta corta · w19 "Luna" luna pop + puf · w21-23 cinta larga hacia la pirámide.
function S3(t,sc){
  const P=PAL_ACTUAL; reserva(540,400,640,130);
  lineaTiempo(t,sc,P,{luna:popIn(t,at(19))});
  cinta(XC,XL-100,YR-260,easeOut(prog(t,at(16),0.6)),'#D7FF3D');
  cinta(XC,XP+60,YR-340,easeOut(prog(t,at(21),0.7)),'#FF5FA2');
  const p=pufCambio(t,at(19));
  raro({x:770,y:YR,s:0.9,t,expr:p.despues?'feliz':'asombro',piernas:'flota',brazos:p.despues?'arriba':'idle',disfraz:p.despues?'astronauta':'faraon',spin:p.spin,sq:gelatina(t,at(19)+0.34),wob:wobble(t,at(19)+0.34),alto:p.despues?40+Math.sin(t*3)*20:0});
  nubePuf(t,at(19)+0.06,780,YR-100,0.7);
  chispas(t,at(23),XP+60,YR-340,1.1);
  letrero(t<at(21)?'MÁS CERCA':'MÁS LEJOS',540,400,popIn(t,at(16)),'pergamino',{tam:76,t,t0:t<at(21)?at(16):at(21)});
}
// S4: pattern interrupt. Primer plano de Raro astronauta mirando a cámara ("¿cómo?") y sacando cuentas con números que brotan. Magenta/cerros. Toma: push z1.35.
function S4(t,sc){
  const sal=saleArriba(t,sc.end);
  raro({x:540,y:SUELO,s:1.1,t,expr:t<at(25)?'sospecha':'orgullo',brazos:t<at(25)?'jarras':'cara',disfraz:'astronauta',sq:gelatina(t,sc.start+0.05)+sal.sq,alto:sal.alto,wob:wobble(t,sc.start)});
  numerito('+',230,1000,t,at(25),'#D7FF3D'); numerito('−',850,960,t,at(25)+0.25,'#FFD23F'); numerito('=',200,1250,t,at(26),'#4CC9F0'); numerito('?',880,1220,t,at(26)+0.2,'#FF9EBB');
}
// S5: Raro campesino empuja un bloque; la pirámide crece, le ponen la punta dorada; letrero 2560 a.C. Limón/desierto. Toma: paneo-izq.
// Eventos: start caída+puf · w28 crece una hilera · w31 "terminó" punta con click · w35 letrero · w38 Raro se limpia el sudor.
